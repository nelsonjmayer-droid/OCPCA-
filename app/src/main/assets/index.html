500/9.800 = 7,50 Kz. A conta Fabricação é creditada por 9.750 x 7,50 = 73.125 Kz de produção acabada e por 50 x 7,50 = 375 Kz de perda anormal levada a resultados acidentais.", "fonte": "Sessão 4 CPE - Questões Produção conjunta e defeituosos (2"}, {"n": 539, "enunciado": "Uma determinada empresa produz e vende o produto Alfa ao preço de 30,0 Kz por hectolitro (hl). O custo de produção variável médio é de 15,0Kz/hl e os custos fixos somam 1.200.000,0Kz. Atualmente as vendas são de 100.000 hl e a pressão da concorrência impõe que se admita a possibilidade de baixar o preço em 10%. Se a empresa quiser manter o atual nível de lucros tem que produzir e vender:", "opcoes": {"A": "120.000 hl.", "B": "135.000 hl.", "C": "125.000 hl.", "D": "140.000hl."}, "correcta": "C", "explicacao": "Lucro actual = 100.000 × (30 − 15) − 1.200.000 = 300.000 Kz; com o preço a baixar 10% (27 Kz) a mc passa a 27 − 15 = 12 Kz/hl, logo Q = (1.200.000 + 300.000)/12 = 125.000 hl.", "fonte": "Sessão 6,7,8 - Questões análise CVR -alavancagem-Desvios ("}, {"n": 540, "enunciado": "A Sociedade Industrial do Norte, SA, produziu em certo período 10.000 toneladas do produto X a um custo variável unitário de 150Kz/tonelada, tendo vendido no mesmo período 6.000 toneladas a 275Kz/tonelada. No mesmo período a empresa teve custos fabris e custos não fabris, ambos de natureza fixa, nos montantes de 335.500Kz e 445.250Kz, respetivamente. Os stocks no início do período eram nulos. Para a empresa obter um resultado antes de impostos de 10% do resultado bruto das vendas terá de vender:", "opcoes": {"A": "6.940 toneladas.", "B": "7.020 toneladas.", "C": "6.860 toneladas.", "D": "6.960 toneladas."}, "correcta": "A", "explicacao": "Margem de contribuição unitária = 275 − 150 = 125 Kz/t e custos fixos totais = 335.500 + 445.250 = 780.750 Kz; impondo resultado = 10% do resultado bruto das vendas: 125Q − 780.750 = 0,10 × 125Q, ou seja 112,5Q = 780.750 e Q = 6.940 toneladas.", "fonte": "Sessão 6,7,8 - Questões análise CVR -alavancagem-Desvios ("}, {"n": 541, "enunciado": "A empresa Beta adota o sistema de custeio variável e dispõe de uma estrutura fabril com capacidade para produzir 20.000 unidades de X que vende a 64 Kz cada, com um custo de produção variável unitário de 32 Kz. A quantidade produzida/vendida que permite um resultado antes de Impostos de 10% do montante das vendas, após consideração dos custos fixos fabris de 90.000 Kz, dos custos comerciais variáveis de 4 Kz/unidade e custos comerciais fixos de 45.000 Kz, respetivamente, e dos custos administrativos de 91.800 Kz é de:", "opcoes": {"A": "9.500 unidades.", "B": "10.500 unidades.", "C": "11.500 unidades.", "D": "12.500 unidades."}, "correcta": "B", "explicacao": "mc unitária = 64 − 32 − 4 = 28 Kz e custos fixos = 90.000 + 45.000 + 91.800 = 226.800 Kz; com resultado igual a 10% das vendas: 28Q − 226.800 = 0,10 × 64Q → 21,6Q = 226.800 → Q = 10.500 unidades.", "fonte": "Sessão 6,7,8 - Questões análise CVR -alavancagem-Desvios ("}, {"n": 542, "enunciado": "A empresa Alfa adota o sistema de custeio variável. Em certo período produziu 8.000 unidades do produto X a um custo unitário de 50Kz, tendo vendido no mesmo período 6.000 unidades a 150Kz. Nesse período a empresa teve custos fabris de natureza fixa no montante de 320.000Kz e custos de distribuição, administrativos e de financiamento de 335.000Kz, também de natureza fixa. Os inventários do início do período eram nulos. O ponto crítico das vendas da Sociedade Industrial Alfa é de:", "opcoes": {"A": "655,5 milhares de Kuanzas.", "B": "327,5 milhares de Kuanzas.", "C": "982,5 milhares de Kuanzas.", "D": "Nenhuma das anteriores."}, "correcta": "C", "explicacao": "mc unitária = 150 − 50 = 100 Kz, logo a razão de contribuição = 100/150 = 66,67%; com custos fixos totais de 320.000 + 335.000 = 655.000 Kz, o ponto crítico das vendas = 655.000 / 0,6667 = 982.500 Kz, isto é, 982,5 milhares de Kz.", "fonte": "Sessão 6,7,8 - Questões análise CVR -alavancagem-Desvios ("}, {"n": 543, "enunciado": "Um outro bolo muito apreciado pelos clientes da PASTELARIAS REUNIDAS é o emblemático bolo de amêndoa. Os últimos cálculos disponíveis sobre margens de comercialização deste bolo reportam-se a Setembro de 2018. Nesse mês, a margem de contribuição sobre o preço de venda obtido pela PASTELARIAS REUNIDAS no bolo de amêndoa atingiu 50 por cento e o preço de custo de cada bolo de amêndoa ascendeu a 60Kz. Em Setembro de 2018, a PASTELARIA REUNIDAS comercializou os bolos de amêndoa a um preço unitário de:", "opcoes": {"A": "80Kz.", "B": "100Kz.", "C": "120Kz.", "D": "Nenhum dos anteriores."}, "correcta": "C", "explicacao": "Se a margem de contribuição sobre o preço de venda é de 50%, o custo variável representa os outros 50% do preço; sendo o custo de 60 Kz, o preço de venda = 60 / 0,50 = 120 Kz.", "fonte": "Sessão 6,7,8 - Questões análise CVR -alavancagem-Desvios ("}, {"n": 544, "enunciado": "Certa empresa do ramo químico ao definir para o período N o custo padrão por unidade do produto Beta considerou a seguinte informação: - Matéria M: 0,4 kg. a 12Kz cada; - Mão-de-obra direta: 0,03 h de operário a 8Kz cada; - custos gerais fabrico variáveis: 2Kz por unidade fabricada. Durante o mês de setembro de N foram produzidas 8.000 unidades de Beta, tendo sido recolhidas os seguintes dados pela contabilidade de custos: - Matéria M: 3.800 kg. por 44.000Kz; - Mão-de-obra direta: 250 h por 2.200Kz; - custos gerais fabrico variáveis: 8.300Kz. O desvio total do mês de setembro foi de:", "opcoes": {"A": "1.780Kz desfavorável.", "B": "1.820Kz favorável.", "C": "1.850Kz favorável.", "D": "1.840Kz desfavorável."}, "correcta": "B", "explicacao": "Custo padrão unitário = 0,4 × 12 + 0,03 × 8 + 2 = 7,04 Kz, logo para 8.000 unidades = 56.320 Kz; o custo real = 44.000 + 2.200 + 8.300 = 54.500 Kz, pelo que o desvio total = 56.320 − 54.500 = 1.820 Kz favorável.", "fonte": "Sessão 6,7,8 - Questões análise CVR -alavancagem-Desvios ("}, {"n": 545, "enunciado": "Certa empresa do ramo químico ao definir para o período N o custo padrão de mão-de-obra direta para o fabrico de uma tonelada do produto Alfa considerou 8 horas de mão-de-obra direta ao preço padrão de 18Kz. No mês de março do ano N foram produzidas 400 toneladas de Alfa e foi contratado pessoal direto que custou 59.500Kz, tendo-se aplicado 3.400 HH na produção do produto Alfa. Os desvios de preço e de quantidade de mão-de-obra direta do mês foram, respetivamente:", "opcoes": {"A": "1.700Kz desfavorável e 3.500Kz favorável.", "B": "1.800Kz favorável e 3.600Kz desfavorável.", "C": "1.800Kz desfavorável e 3.500Kz favorável.", "D": "1.700Kz favorável e 3.600Kz desfavorável."}, "correcta": "D", "explicacao": "Taxa real = 59.500/3.400 = 17,50 Kz/h, logo o desvio de preço = 3.400 × (18 − 17,50) = 1.700 Kz favorável; a quantidade padrão = 400 t × 8 h = 3.200 HH, pelo que o desvio de eficiência = 18 × (3.200 − 3.400) = 3.600 Kz desfavorável.", "fonte": "Sessão 6,7,8 - Questões análise CVR -alavancagem-Desvios ("}, {"n": 546, "enunciado": "A empresa Panisul, Lda., tem um departamento que se dedica à produção de farinha Super em embalagens de 200 g destinadas às pastelarias, para fabrico de bolos. No cálculo dos custos de produção segue o sistema de custeio padrão. De acordo com as normas técnicas de fabrico definidas pelo departamento, para o fabrico de uma tonelada de farinha empacotada são necessárias 8,5 horas da secção de Produção, 350 kg de trigo tipo A, 680 kg de trigo tipo B e 5 040 embalagens de celofane, para além da adição de 20 kg de aditivos a 8 Kz cada. Prevê-se adquirir cada kg de trigo tipo A e de trigo tipo B a 7 e 6 Kz, respetivamente. Cada embalagem de celofane prevê-se custar 0,02Kz. O custo unitário estimado de cada hora da secção de Produção é de 120 Kz. O custo padrão de cada embalagem de farinha Super é de:", "opcoes": {"A": "1,65Kz.", "B": "1,56Kz.", "C": "1,60Kz.", "D": "Nenhuma das anteriores."}, "correcta": "B", "explicacao": "Custo padrão por tonelada = 8,5 × 120 + 350 × 7 + 680 × 6 + 5.040 × 0,02 + 20 × 8 = 1.020 + 2.450 + 4.080 + 100,8 + 160 = 7.810,8 Kz; como 1 tonelada dá 5.000 embalagens de 200 g, o custo padrão por embalagem = 7.810,8/5.000 = 1,56 Kz.", "fonte": "Sessão 6,7,8 - Questões análise CVR -alavancagem-Desvios ("}, {"n": 547, "enunciado": "Considera-se a seguinte ficha de custo padrão do produto Beta: Quantidade Custo Matéria-prima M (Kg) 4.0 12 Kz/Kg Mão-de-obra direta (horas) 2.0 15 Kz/hora custos gerais de fabrico Hora operário 12 Kz No período N a produção foi de 1.800 unidades de Beta, tendo-se verificado os seguintes custos: Quantidade total Custo total Matéria-prima M (kg) 7.250 Kgs 88.000 Kz Mão-de-obra direta (horas) 3.550 horas 54.250 Kz custos gerais de fabrico 45.200 Kz Com base nos elementos indicados diga qual é o desvio total no período N.", "opcoes": {"A": "3.850 Kz desfavorável.", "B": "3.580 Kz favorável.", "C": "3.950 Kz desfavorável.", "D": "Nenhuma das anteriores."}, "correcta": "A", "explicacao": "Custo padrão unitário = 4 × 12 + 2 × 15 + 2 × 12 = 102 Kz, logo para 1.800 unidades = 183.600 Kz; o custo real = 88.000 + 54.250 + 45.200 = 187.450 Kz, pelo que o desvio total = 187.450 − 183.600 = 3.850 Kz desfavorável.", "fonte": "Sessão 6,7,8 - Questões análise CVR -alavancagem-Desvios ("}, {"n": 548, "enunciado": "No fabrico de secretárias durante 2018, a empresa ALFA consumiu diversos materiais, entre os quais madeira. Terminado o mês de Fevereiro, verificou-se terem sido consumidos nesse mês 8 m3 de madeira de nogueira, menos 1 m3 cúbico do que fora previsto. Observou-se também que o preço por m3 foi 2.750Kz, ou seja, 10% acima do preço previsto. Ao apurar o desvio total de matérias relativo à madeira utilizada na produção de secretárias em Fevereiro de 2018, a empresa ALFA calculou:", "opcoes": {"A": "Um desvio total favorável: 500Kz.", "B": "Um desvio total desfavorável: 250Kz.", "C": "Um desvio total desfavorável: 500Kz.", "D": "Um desvio total favorável: 250Kz."}, "correcta": "A", "explicacao": "Preço padrão = 2.750/1,10 = 2.500 Kz/m3 e quantidade padrão = 8 + 1 = 9 m3; desvio total = custo real − custo padrão = 8 × 2.750 − 9 × 2.500 = 22.000 − 22.500 = 500 Kz favorável.", "fonte": "Sessão 6,7,8 - Questões análise CVR -alavancagem-Desvios ("}, {"n": 549, "enunciado": "Na obra de remodelação das instalações da sede da empresa DELTA foram consumidos diversos materiais, entre os quais cimento e azulejos. Terminada a obra, verificou-se terem sido consumidas 5.200 sacas de cimento (de 25Kg cada), 200 mais do que fora previsto. Observou-se também que o preço por saca foi 5Kz, ou seja, 25% acima do preço previsto. Ao apurar o desvio de matérias relativas ao cimento, verificou-se:", "opcoes": {"A": "Um desvio total desfavorável: 6.000Kz.", "B": "Um desvio total favorável: 6.000Kz.", "C": "Um desvio total desfavorável: 5.200Kz.", "D": "Um desvio total desfavorável: 800Kz."}, "correcta": "A", "explicacao": "Preço padrão = 5/1,25 = 4 Kz/saca e quantidade padrão = 5.200 − 200 = 5.000 sacas; desvio total = 5.200 × 5 − 5.000 × 4 = 26.000 − 20.000 = 6.000 Kz desfavorável.", "fonte": "Sessão 6,7,8 - Questões análise CVR -alavancagem-Desvios ("}, {"n": 550, "enunciado": "A empresa ALFA ao definir o custo padrão para a produção da sua principal Brita, considerou 0,1 Horas Homem (HH) de MOD a 12Kz cada, por tonelada de Brita produzida. No mês de Junho foram produzidas 40 000 toneladas daquela brita tendo-se aplicado nessa produção 3 800 HH, cujo custo ascendeu a 47 500 Kz. O desvio de preço de mão-de-obra direta no mês de Junho é de:", "opcoes": {"A": "Nulo.", "B": "1 900 Kz desfavorável.", "C": "1 900 Kz favorável.", "D": "Nenhuma das anteriores."}, "correcta": "B", "explicacao": "Taxa real = 47.500/3.800 = 12,50 Kz/HH; o desvio de preço = quantidade real × (taxa padrão − taxa real) = 3.800 × (12 − 12,50) = 1.900 Kz desfavorável (a poupança de horas face às 4.000 HH padrão é desvio de eficiência, não de preço).", "fonte": "Sessão 6,7,8 - Questões análise CVR -alavancagem-Desvios ("}, {"n": 551, "enunciado": "A Empresa de Moagem de Benguela tem a contabilidade de gestão organizada num sistema de custeio padrão. As normas técnicas de produção para 1 Ton de farinha tipo X consideram que são utilizados 700 kg de cereal A, 400 kg de cereal B e 20 kg de aditivos cujos preços padrão são respetivamente de 4.000 Kz/Ton para o cereal A, de 7.000 Kz/Ton para o cereal B e 45.000 Kz/Ton. para o aditivo. Em determinado período produziram-se 450 toneladas de farinha X, tendo-se consumido 320 toneladas de cereal A, 178 toneladas do cereal B e 9,2 toneladas de aditivos, pelo que o desvio de matérias do período é de:", "opcoes": {"A": "Favorável de 10.000Kz.", "B": "Desfavorável de 15.000Kz.", "C": "Favorável de 15.000Kz.", "D": "Desfavorável de 20.000Kz."}, "correcta": "B", "explicacao": "Custo padrão por tonelada de farinha = 0,7 × 4.000 + 0,4 × 7.000 + 0,02 × 45.000 = 6.500 Kz, logo para 450 t = 2.925.000 Kz; o consumo real valorizado a preços padrão = 320 × 4.000 + 178 × 7.000 + 9,2 × 45.000 = 2.940.000 Kz, pelo que o desvio de matérias = 15.000 Kz desfavorável.", "fonte": "Sessão 6,7,8 - Questões análise CVR -alavancagem-Desvios ("}, {"n": 552, "enunciado": "Uma empresa teve ao serviço, no quarto trimestre de 2018, 120 empregados, que se qualificam como operários fabris. O cálculo dos custos da mão de obra direta do quarto trimestre de 2018 da empresa considera apenas:", "opcoes": {"A": "As remunerações ilíquidas mensais e os encargos da entidade patronal correspondentes.", "B": "As remunerações ilíquidas mensais mais os encargos da entidade patronal e dos encargos anuais com férias e o subsídio de natal.", "C": "As remunerações líquidas mensais acrescidas dos encargos da entidade patronal e dos encargos anuais com as férias e o subsídio de natal.", "D": "Nenhuma das anteriores."}, "correcta": "B", "explicacao": "O custo da MOD corresponde ao custo total suportado pela empresa com os 120 operários: remunerações ilíquidas mensais, encargos da entidade patronal e periodificação dos encargos anuais com férias e subsídio de Natal; usar remunerações líquidas omitiria as retenções, que também integram o custo da empresa.", "fonte": "2.1 CPE - Questões Sistemas de custos.pdf"}, {"n": 554, "enunciado": "Admita uma empresa que produz 400 unidades, que utiliza o custeio variável e que tem a seguinte estrutura de custos: Custos Fixos Custos variáveis Custos Industriais 60.000 Kz 600 Kz/Unidade Custos de distribuição e venda ------ 300 Kz/Unidade Considerando os dados acima, indique qual seria a diferença de valor que provocaria no custo de produção unitário (CIPA unitário) se utilizasse o custeio total em vez do custeio variável:", "opcoes": {"A": "O custo de produção unitário seria superior em 150.", "B": "O custo de produção unitário seria superior em 600.", "C": "O custo de produção unitário seria inferior em 150.", "D": "O custo de produção unitário seria inferior em 600."}, "correcta": "A", "explicacao": "CIPA unitário no custeio total = 600 + 60.000/400 = 750 Kz contra 600 Kz no custeio variável, logo o custo de produção unitário seria superior em 150 Kz (os custos de distribuição e venda não integram o CIPA).", "fonte": "COMPILAÇÃO EXAMES C_G -  2019 - 2020.pdf"}, {"n": 555, "enunciado": "Em determinado período uma empresa do ramo do mobiliário lançou em fabrico as ordens de fabrico 003, 004 e 005 e a primeira não foi terminada no período. Do período anterior haviam transitado as ordens de fabrico 001 e 002, com os custos incorporados de 120.000 Kz e 50.000 Kz, respectivamente, tendo a última sido terminada no período. Durante o período foram incorporados a estas duas encomendas custos de produção de 200.000 Kz e 140.000 Kz, respectivamente. Sabendo que os custos de produção das encomendas 003, 004 e 005 foram de 200.000 Kz, 100.000 Kz e 170.000 Kz, respectivamente, e que a facturação é feita com base no custo de produção acrescido de 20%, sendo a factura emitida imediatamente após o terminus da encomenda:", "opcoes": {"A": "O custo da produção vendida totaliza 552.000 Kz.", "B": "O custo da produção em vias de fabrico final é 520.000 Kz.", "C": "A margem bruta das vendas é de 100.000 Kz.", "D": "O custo da produção em vias de fabrico é de 520.000 Kz, o custo da produção vendida é de 552.000 Kz e a margem bruta das vendas é de 92.000 Kz."}, "correcta": "B", "explicacao": "As OF 001 (120.000 + 200.000 = 320.000 Kz) e 003 (200.000 Kz) não foram terminadas, pelo que a produção em vias de fabrico final = 520.000 Kz; a produção vendida (002, 004 e 005) custou 190.000 + 100.000 + 170.000 = 460.000 Kz, dando vendas de 552.000 Kz e margem bruta de 92.000 Kz — a opção D acerta na PVF e na margem mas troca o custo da produção vendida pelo valor facturado.", "fonte": "COMPILAÇÃO EXAMES C_G -  2019 - 2020.pdf · resposta a confirmar"}, {"n": 556, "enunciado": "Em relação ao comportamento “normal” dos custos variáveis, diga qual das frases lhe parece a mais correcta:", "opcoes": {"A": "Com o aumento da produção o custo variável unitário tende para infinito.", "B": "Com o aumento da produção o custo variável total tende para zero.", "C": "Com o aumento da produção o custo variável total mantém-se constante.", "D": "Com o aumento da produção o custo variável unitário mantém-se constante."}, "correcta": "D", "explicacao": "O custo variável é, por definição, proporcional ao volume: o total cresce com a produção enquanto o custo variável unitário se mantém constante.", "fonte": "COMPILAÇÃO EXAMES C_G -  2019 - 2020.pdf"}, {"n": 557, "enunciado": "Uma determinada empresa produz e vende o produto BETA ao preço de 100 Kzs por Kg. O custo de produção variável médio é de 30 Kzs/Kg e os custos fixos somam 1.200.000 Kzs. Atualmente as vendas são de 20.000 Kgs e a pressão da concorrência impõe que se admita a possibilidade de baixar o preço em 20%. Se a empresa quiser manter o atual nível de lucros tem que produzir e vender:", "opcoes": {"A": "10.000 Kgs.", "B": "20.000 Kgs.", "C": "18.000 Kgs.", "D": "28.000 Kgs."}, "correcta": "D", "explicacao": "Lucro actual = 20.000 × (100 − 30) − 1.200.000 = 200.000 Kz; baixando o preço 20% (80 Kz) a mc passa a 80 − 30 = 50 Kz/Kg, logo Q = (1.200.000 + 200.000)/50 = 28.000 Kgs.", "fonte": "COMPILAÇÃO EXAMES C_G -  2019 - 2020.pdf"}, {"n": 558, "enunciado": "A empresa Alfa determinou os custos de produção de um produto e que se compõe de 100.000 Kz de matérias-primas consumidas, de 60.000 Kz de mão-de-obra directa e 90.000 Kz de gastos gerais de fabrico. Sabendo que a produção entrada em armazém de produtos acabados foi valorizada e que ficaram nas máquinas produtos em vias de fabrico a que se atribuíram custos no montante de 10.000 Kz, os lançamentos na classe 9 – (Contabilidade analítica) caracterizam-se por:", "opcoes": {"A": "Se debitar a conta de Fabricação por 250.000 Kz e se creditarem as sub-contas da classe 9 relativas aos componentes do custo.", "B": "Se debitar a conta de Produtos Acabados por 250.000 Kz.", "C": "O saldo da conta Fabricação apresenta-se credor e corresponde aos montantes incorporados na produção em vias de fabrico.", "D": "Todas as opções são verdadeiras."}, "correcta": "A", "explicacao": "Os custos incorporados (100.000 + 60.000 + 90.000 = 250.000 Kz) são debitados na conta Fabricação por contrapartida das sub-contas da classe 9; Produtos Acabados é debitada apenas por 240.000 Kz (250.000 − 10.000 de PVF) e o saldo de Fabricação fica devedor, o que invalida B, C e D.", "fonte": "COMPILAÇÃO EXAMES C_G -  2019 - 2020.pdf"}, {"n": 559, "enunciado": "A Empresa X adopta o sistema de custeio racional na mensuração do custo de produção do produto Alfa, dispondo de instalações fabris para produzir 75.000 unidades de Alfa por período. No período N a Empresa produziu 60.000 unidades de Alfa, tendo vendido 50.000 unidades a 50 Kzs/unidade. No mesmo período utilizou matérias-primas no montante de 800.000 Kzs e custos de conversão variáveis de 500.000Kzs. Sabendo que a variação da produção em vias de fabrico foi nula e que os GGF/custos indirectos de produção (fixos) somaram 610.000 Kzs, os custos de distribuição somaram 418.000 Kzs e que os custos administrativos totalizaram 193.200 Kzs, o resultado do período antes de Imposto Industrial é de:", "opcoes": {"A": "175.133 Kzs", "B": "276.800 Kzs", "C": "2.500.000 Kzs", "D": "Nenhum dos anteriores"}, "correcta": "B", "explicacao": "Custeio racional: grau de actividade = 60.000/75.000 = 80%, imputando-se 610.000 × 0,8 = 488.000 Kz de GGF fixos, pelo que o custo industrial = 800.000 + 500.000 + 488.000 = 1.788.000 Kz (29,80 Kz/un); resultado = 50.000 × 50 − 50.000 × 29,80 − 122.000 (custo de subactividade) − 418.000 − 193.200 = 276.800 Kz.", "fonte": "COMPILAÇÃO EXAMES C_G -  2019 - 2020.pdf"}, {"n": 560, "enunciado": "Para fabricar o produto X, certa empresa industrial transforma as matérias e os materiais diretos no Departamento Alfa antes de serem concluídas e darem origem ao produto X. Em certo período deram entrada em armazém, vindos do Departamento Alfa, 90 toneladas do produto X e no final do período havia 10 toneladas desse produto X a que faltava apenas incorporar 50 por cento dos custos de conversão. No período o Departamento Alfa consumiu matérias e materiais diretos no montante de 200.000 Kzs e teve custos de conversão de 100.000 Kzs. O saldo no final do período de Produtos e trabalhos em curso é de:", "opcoes": {"A": "24.750 Kzs.", "B": "25.000 Kzs.", "C": "270.000 Kzs.", "D": "Nenhuma das anteriores."}, "correcta": "D", "explicacao": "Produção equivalente: 100 t para matérias (200.000/100 = 2.000 Kz/t) e 90 + 5 = 95 t para custos de conversão (100.000/95 = 1.052,63 Kz/t); o saldo final de produtos e trabalhos em curso = 10 × 2.000 + 5 × 1.052,63 = 25.263,16 Kz, que não coincide com nenhuma das opções.", "fonte": "COMPILAÇÃO EXAMES C_G -  2019 - 2020.pdf · resposta a confirmar"}, {"n": 561, "enunciado": "Os custos de produção conjunta:", "opcoes": {"A": "São os custos acumulados à saída do ponto de separação", "B": "A sua repartição faz-se por critérios muito objectivos", "C": "Os subprodutos obtidos nunca suportam qualquer custo", "D": "Todas as respostas anteriores são verdadeiras."}, "correcta": "A", "explicacao": "Os custos conjuntos são os acumulados até ao ponto de separação (e aí existentes); a sua repartição assenta em critérios convencionais e subjectivos e os subprodutos podem suportar custos consoante o critério adoptado, pelo que B, C e D são falsas.", "fonte": "COMPILAÇÃO EXAMES C_G -  2019 - 2020.pdf"}, {"n": 562, "enunciado": "Os subprodutos obtidos numa produção conjunta podem ser valorizados pelo critério do lucro nulo e do custo nulo. No primeiro critério e no caso de haver gastos específicos de transporte e para efeitos de calcular o custo dos produtos principais:", "opcoes": {"A": "Deve-se deduzir o respectivo custo de transporte ao valor de venda no mercado e só depois subtrair ao custo da produção", "B": "Não se deve entrar em linha de conta com o transporte", "C": "O valor do transporte só deve ser considerado na demonstração de resultados", "D": "Todas as anteriores são falsas."}, "correcta": "A", "explicacao": "No critério do lucro nulo o subproduto é valorizado pelo valor realizável líquido: deduzem-se ao valor de venda de mercado os gastos específicos (transporte) e só esse líquido é subtraído ao custo conjunto para apurar o custo dos produtos principais.", "fonte": "COMPILAÇÃO EXAMES C_G -  2019 - 2020.pdf"}]}, {"num": 4, "rotulo": "Módulo 4", "nome": "Organização de Empresas e Controlo Interno", "sessoes": [{"n": 1, "titulo": "Gestão de Empresas — Conceitos Fundamentais", "norma": "Fundamentos de Gestão — funções da gestão, liderança e estrutura organizacional", "objectivo": "Compreender os conceitos base de gestão de empresas: as funções da gestão, a distinção entre gestão e liderança, e os principais tipos de estrutura organizacional.", "pontos": ["As funções clássicas da gestão são: Planeamento, Organização, Direcção e Controlo (às vezes referidas como PODC) — todas as opções de exame que acrescentem funções estranhas a este núcleo (ex.: 'recrutar e vender') estão incorrectas.", "Liderança e gestão são processos distintos mas complementares: o gestor foca-se em planear, organizar e controlar recursos; o líder foca-se em desenvolver uma visão inspiradora e motivar/empenhar os colaboradores — um bom líder não reduz o empenho dos colaboradores, aumenta-o.", "Estrutura organizacional é a combinação entre departamentalização (divisão por sectores) e hierarquia (relações de autoridade) — não é sinónimo de nenhum dos dois isoladamente. Pode ser formal (planeada, representada no organograma) ou informal (relações interpessoais espontâneas, não oficiais).", "Tipos de estrutura organizacional: linear (hierarquia única e centralizada, típica de pequenas empresas); funcional (autoridade baseada na especialização, cada colaborador pode reportar a várias chefias); linha-staff (combina estrutura linear com órgãos de consultoria especializada, sem poder de comando); matricial (hierarquia dupla — departamental e por projecto).", "Estruturas organizacionais horizontais/achatadas têm poucos níveis hierárquicos, maior delegação de poder e autonomia, e maior orientação para resultados; estruturas verticais têm mais níveis hierárquicos e decisões mais centralizadas no topo.", "Delegação é o processo de atribuir responsabilidades e a correspondente autoridade a um colaborador (não é apenas 'o direito de decidir' nem apenas 'a obrigação de cumprir', mas o processo de atribuição de ambos em conjunto).", "O desempenho de uma organização mede-se por eficácia (grau em que os objectivos são atingidos) e eficiência (grau em que os recursos são bem utilizados para atingir esses objectivos) — não são sinónimos."], "formulas": [], "erros": ["Não trocar eficácia com eficiência: eficácia mede resultados atingidos; eficiência mede o uso dos recursos para os atingir. É uma troca clássica em perguntas de exame.", "'Controlo' em gestão significa a comparação entre os objectivos propostos e as acções já desenvolvidas — não é apenas 'comparar objectivos entre si' nem 'comparar acções entre si'."]}, {"n": 2, "titulo": "Gestão de Empresas — Estratégia, Integração e Estruturas de Mercado", "norma": "Fundamentos de estratégia empresarial", "objectivo": "Compreender os conceitos de estratégia de diferenciação e liderança de custos, as formas de integração empresarial (vertical e horizontal), e os factores que determinam a estrutura de um mercado.", "pontos": ["A estratégia de diferenciação procura distinguir os produtos/serviços da empresa dos concorrentes do mesmo sector (através de qualidade, marca, inovação); contrapõe-se à estratégia de liderança de custos (competir através do preço mais baixo, com estrutura de custos mais eficiente).", "Integração vertical é a agregação de elos de uma cadeia de valor pela mesma empresa (ex.: uma empresa de distribuição passa a produzir o que vende — integração a montante; ou um produtor passa a distribuir directamente — integração a jusante).", "Integração horizontal é a fusão/aquisição entre empresas do mesmo sector e nível de produção equivalente, geralmente visando crescimento e maior competitividade (parte do processo de M&A — mergers and acquisitions).", "As estruturas de mercado são condicionadas essencialmente por três variáveis: o número de empresas no mercado, o grau de diferenciação do produto, e a existência (ou não) de barreiras à entrada de novas empresas.", "A visão estratégica de uma organização (ex.: 'estar entre as 10 melhores do sector') distingue-se dos objectivos tácticos e operacionais por ser uma declaração de aspiração de longo prazo, não uma meta mensurável de curto prazo."], "formulas": [], "erros": ["Não confundir integração vertical (elos diferentes da mesma cadeia de valor) com integração horizontal (empresas do mesmo nível/sector) — é uma distinção testada com frequência através de exemplos práticos (ex.: uma cadeia de hambúrgueres que passa a criar o próprio gado pratica integração vertical a montante)."]}, {"n": 3, "titulo": "Sistema de Controlo Interno — Conceito, Objectivos e Componentes (COSO)", "norma": "COSO — Internal Control Integrated Framework (1992) · Conceitos do IFAC/Instituto de Auditores Internos", "objectivo": "Compreender as principais definições de controlo interno (COSO, IFAC, Instituto de Auditores Internos), os seus objectivos, e as cinco componentes do modelo COSO.", "pontos": ["O COSO define controlo interno como um PROCESSO levado a cabo pelo Conselho de Administração, Direcção e demais colaboradores da entidade, destinado a proporcionar um grau de confiança RAZOÁVEL (nunca absoluta) quanto à consecução de objectivos nas categorias: eficácia e eficiência das operações; fiabilidade do relato financeiro; e cumprimento das leis e regulamentos aplicáveis.", "Conceitos fundamentais da definição COSO: (1) é um PROCESSO, meio para um fim, não um fim em si mesmo; (2) é levado a cabo por PESSOAS, em todos os níveis da entidade, não apenas um manual de políticas; (3) proporciona apenas confiança RAZOÁVEL, nunca elimina a totalidade dos riscos; (4) está orientado para a CONCRETIZAÇÃO DE OBJECTIVOS gerais e específicos da entidade.", "As cinco componentes do COSO são: (1) Ambiente de Controlo; (2) Processo de Avaliação de Risco da entidade; (3) Sistema de Informação e Comunicação relevante para o relato financeiro; (4) Actividades de Controlo; (5) Monitorização dos controlos. 'Segregação de funções' NÃO é uma das cinco componentes — é um elemento/actividade de controlo que se integra dentro delas.", "O Ambiente de Controlo inclui as funções de governação e gestão, atitudes e acções dos responsáveis quanto à importância do controlo interno — nele incluem-se a integridade e valores éticos, a filosofia de direcção e estilo de gestão, e a atribuição de autoridade e responsabilidade. A eficácia dos controlos NUNCA se sobrepõe à integridade e valores éticos das pessoas que os concebem e administram — é o contrário: a integridade das pessoas é a base sobre a qual assenta a eficácia de qualquer sistema de controlo."], "formulas": [], "erros": ["'Segregação de funções' é um erro comum de resposta quando perguntado pelas 5 componentes COSO — não é uma componente autónoma, mas sim uma prática integrada nas Actividades de Controlo.", "Nunca afirmar que o controlo interno proporciona segurança 'absoluta' — a definição COSO é sempre 'razoável', mesmo quando o sistema está bem concebido."]}, {"n": 4, "titulo": "Sistema de Controlo Interno — Tipos, Métodos e Limitações", "norma": "Tipologia e limitações do Sistema de Controlo Interno (SCI)", "objectivo": "Identificar os diferentes tipos e métodos de controlo interno, e reconhecer as limitações inerentes a qualquer sistema de controlo interno, por mais bem concebido que seja.", "pontos": ["Tipos de controlo: Controlo da Organização (organograma, definição de responsabilidades, segregação de funções); Controlo dos Procedimentos (incluindo o controlo contabilístico, que garante a fiabilidade dos registos e a salvaguarda de activos); Controlo dos Sistemas de Informação (dispositivos de produção e fornecimento de informação à gestão).", "Cinco métodos de controlo interno: controlos administrativos (autoridade, estrutura orgânica, descrição de tarefas); controlos operacionais (planeamento, orçamento, contabilização, documentação, autorização); controlos de gestão de recursos humanos (recrutamento, formação, supervisão); controlos de revisão e análise (avaliação de desempenho, revisões internas/externas); controlo das instalações e equipamentos (inspecções físicas).", "Limitações inerentes a qualquer SCI: a segregação de funções dificulta mas não impede o conluio entre colaboradores; a competência/integridade do pessoal pode deteriorar-se ao longo do tempo; os poderes de autorização podem ser usados de forma abusiva; o controlo interno foca-se nas operações CORRENTES, estando menos preparado para transacções pouco usuais; a própria gestão de topo pode contornar os controlos que ela mesma implementou (override de gestão).", "Em entidades PEQUENAS geridas pelo próprio sócio-gerente: há menos empregados, o que limita a extensão possível da segregação de funções; a supervisão directa do sócio-gerente pode compensar parcialmente essa limitação (não a elimina); mas o sócio-gerente também está em melhor posição para contornar/derrogar os controlos, precisamente por o SCI ser menos estruturado."], "formulas": [], "erros": ["Não afirmar que a supervisão do sócio-gerente numa pequena entidade 'não pode' compensar as limitações da segregação de funções — a afirmação correcta é que PODE compensar parcialmente, embora não elimine o risco.", "Distinguir sempre a AVALIAÇÃO DA CONCEÇÃO de um controlo (se, em teoria, é capaz de prevenir/detectar distorções) da AVALIAÇÃO DA IMPLEMENTAÇÃO (se o controlo existe de facto e está a ser utilizado) — são duas avaliações distintas e sequenciais, nunca uma substitui a outra."]}, {"n": 5, "titulo": "Identificação e Avaliação dos Riscos de Distorção Material (ISA 315)", "norma": "Norma Internacional de Auditoria (ISA) 315 (Revista) — Identificação e Avaliação dos Riscos de Distorção Material através da Compreensão da Entidade e do seu Ambiente", "objectivo": "Compreender o processo de identificação e avaliação dos riscos de distorção material ao nível das demonstrações financeiras e das asserções, através da compreensão da entidade, do seu ambiente e do seu sistema de controlo interno.", "pontos": ["O auditor/perito contabilista deve obter uma compreensão da entidade e do seu ambiente, incluindo o seu controlo interno, suficiente para identificar e avaliar os riscos de distorção material, quer devidos a fraude quer a erro.", "A consideração do controlo interno pelo contabilista/auditor é geralmente limitada aos controlos RELEVANTES PARA A FIABILIDADE DO RELATO FINANCEIRO — não é necessário nem esperado avaliar todos os controlos operacionais da entidade, mesmo que existam controlos de salvaguarda de activos com objectivos puramente operacionais.", "Exemplos típicos de riscos de distorção material na rubrica de Custos com o Pessoal: processamento salarial que não se baseia em folhas de presença/assiduidade aprovadas; processamento de 'trabalhadores fantasma' já não ao serviço da empresa; custos processados que não correspondem aos termos contratuais.", "Exemplos típicos de riscos de distorção material na rubrica de Receita/Vendas: vendas contabilizadas que não ocorreram efectivamente (ex.: devoluções substanciais subsequentes por não aceitação dos termos); vendas não integradas na contabilidade por falhas operacionais (interrupções de sistemas/energia em pontos de venda); vendas sobreavaliadas/fictícias motivadas por incentivos de remuneração variável da gestão ligados ao crescimento das vendas.", "A segregação de funções reduz simultaneamente o risco de erros humanos E o risco de acções indesejadas/fraudulentas — não se limita a um dos dois tipos de risco.", "A avaliação de um controlo específico passa sempre por dois passos distintos: apreciar a CONCEPÇÃO do controlo (se, isolado ou combinado com outros, é capaz de evitar ou detectar e corrigir distorções materiais) e avaliar a sua IMPLEMENTAÇÃO (confirmar que o controlo existe e está efectivamente a ser utilizado pela entidade) — um controlo bem concebido mas não implementado, ou implementado mas mal concebido, não fornece a mitigação de risco pretendida."], "formulas": [], "erros": ["Nas perguntas 'quais dos seguintes são riscos de distorção material', a opção 'todas as anteriores' é frequentemente a correcta quando o enunciado apresenta vários riscos plausíveis e coerentes com a rubrica em análise — mas deve confirmar-se sempre que cada risco individual faz, de facto, sentido para a rubrica em causa.", "Segregação de funções mitiga tanto erros involuntários como acções fraudulentas deliberadas — não escolher uma opção que restrinja o benefício a apenas um dos dois tipos de risco."]}], "intro_temas": "As provas passadas de Gestão de Empresas & Controlo Interno (GE&CI) mostram um padrão muito consistente: perguntas de definição e de identificação de excepções ('qual das opções NÃO é...', 'qual afirmação é incorrecta'), fortemente ancoradas nas definições exactas do COSO e da ISA 315. Este módulo é mais teórico/conceptual do que os módulos de contabilidade, pelo que memorizar as definições-chave com precisão compensa muito no exame.", "temas": [{"tema": "As 5 componentes do modelo COSO de Controlo Interno", "freq": "Muito alta", "pedido": "Identificar correctamente as 5 componentes (Ambiente de Controlo, Avaliação de Risco, Sistema de Informação e Comunicação, Actividades de Controlo, Monitorização) e reconhecer que 'segregação de funções' não é uma delas por si só."}, {"tema": "Definição COSO de controlo interno e os seus conceitos fundamentais", "freq": "Muito alta", "pedido": "Reconhecer os 4 conceitos fundamentais (processo, pessoas, confiança razoável, concretização de objectivos) e nunca confundir 'razoável' com 'absoluta'."}, {"tema": "Limitações inerentes ao Sistema de Controlo Interno", "freq": "Alta", "pedido": "Identificar as limitações clássicas: conluio, deterioração de competência/integridade, abuso de autorização, foco em operações correntes, override da gestão."}, {"tema": "Segregação de funções em pequenas entidades geridas pelo sócio-gerente", "freq": "Alta", "pedido": "Compreender o equilíbrio entre a limitação da segregação de funções e a supervisão directa do sócio-gerente, e o risco acrescido de este contornar os controlos."}, {"tema": "Riscos de distorção material em rubricas específicas (Custos com Pessoal, Receita)", "freq": "Muito alta", "pedido": "Reconhecer exemplos concretos e plausíveis de riscos de fraude ou erro em rubricas típicas do exame (folhas de presença, trabalhadores fantasma, vendas fictícias, falhas de sistemas)."}, {"tema": "Avaliação da conceção vs. implementação de um controlo", "freq": "Média-Alta", "pedido": "Distinguir os dois passos sequenciais e independentes da avaliação de qualquer controlo interno específico."}, {"tema": "Funções da gestão (Planeamento, Organização, Direcção, Controlo)", "freq": "Alta", "pedido": "Identificar correctamente as 4 funções clássicas da gestão e rejeitar opções que acrescentem ou substituam funções estranhas ao núcleo PODC."}, {"tema": "Tipos de estrutura organizacional (linear, funcional, linha-staff, matricial)", "freq": "Alta", "pedido": "Distinguir as características de cada tipo de estrutura e identificar exemplos práticos correspondentes."}, {"tema": "Distinção entre eficácia e eficiência", "freq": "Média-Alta", "pedido": "Não trocar os dois conceitos: eficácia mede resultados atingidos, eficiência mede o uso dos recursos."}, {"tema": "Integração vertical vs. horizontal e estratégias de diferenciação/liderança de custos", "freq": "Média", "pedido": "Identificar o tipo de estratégia/integração a partir de um exemplo prático descrito no enunciado."}, {"tema": "Liderança vs. gestão", "freq": "Média", "pedido": "Reconhecer que a liderança eficaz aumenta o empenho dos colaboradores, nunca o diminui."}], "perguntas": [{"n": 1, "enunciado": "Qual das seguintes opções NÃO corresponde a uma das cinco componentes do controlo interno definidas no modelo COSO?", "opcoes": {"A": "O ambiente de controlo", "B": "A segregação de funções", "C": "As actividades de controlo", "D": "A monitorização dos controlos"}, "correcta": "B", "explicacao": "As cinco componentes COSO são: Ambiente de Controlo, Processo de Avaliação de Risco, Sistema de Informação e Comunicação, Actividades de Controlo, e Monitorização. A segregação de funções é uma prática integrada nas Actividades de Controlo, não uma componente autónoma.", "fonte": "Teste prático do resumo do Módulo 4"}, {"n": 2, "enunciado": "Segundo o modelo COSO, por mais eficaz que seja concebido e implementado, um Sistema de Controlo Interno consegue proporcionar à gestão uma segurança:", "opcoes": {"A": "Absoluta", "B": "Razoável", "C": "Total, desde que auditado externamente", "D": "Apenas sobre o cumprimento de leis e regulamentos"}, "correcta": "B", "explicacao": "Um SCI, mesmo bem concebido, nunca elimina a totalidade dos riscos — proporciona apenas um grau de confiança razoável, nunca absoluto.", "fonte": "Teste prático do resumo do Módulo 4"}, {"n": 3, "enunciado": "Numa pequena entidade gerida pelo próprio sócio-gerente, relativamente à segregação de funções, é correcto afirmar que:", "opcoes": {"A": "A dimensão reduzida da entidade não tem qualquer impacto na extensão possível da segregação de funções", "B": "A supervisão directa exercida pelo sócio-gerente pode compensar, ainda que parcialmente, as oportunidades mais limitadas de segregação de funções", "C": "O sócio-gerente nunca está em posição de contornar os controlos internos, por conhecer bem a operação", "D": "A segregação de funções é sempre mais eficaz numa pequena entidade do que numa grande entidade"}, "correcta": "B", "explicacao": "Pequenas entidades têm frequentemente menos empregados, o que limita a segregação de funções possível; a supervisão directa do sócio-gerente pode compensar parcialmente essa limitação — mas, simultaneamente, o sócio-gerente está em melhor posição para derrogar os controlos, por o SCI ser tipicamente menos estruturado.", "fonte": "Teste prático do resumo do Módulo 4"}, {"n": 4, "enunciado": "Relativamente aos riscos de distorção material na rubrica de Receita, qual das seguintes situações NÃO constitui um exemplo plausível de tal risco?", "opcoes": {"A": "Vendas contabilizadas que não ocorreram efectivamente, com devoluções substanciais em período subsequente", "B": "Vendas não registadas devido a interrupções de sistemas informáticos em pontos de venda", "C": "Vendas sobreavaliadas através de registos fictícios, motivadas por remuneração variável da gestão associada ao crescimento das vendas", "D": "Depreciação de um activo fixo tangível calculada com uma vida útil incorrecta"}, "correcta": "D", "explicacao": "A depreciação incorrecta de um activo fixo tangível é um risco relacionado com a rubrica de Activos Fixos Tangíveis, não com a Receita — as outras três opções são exemplos clássicos de riscos de distorção material específicos da rubrica de vendas/receita.", "fonte": "Teste prático do resumo do Módulo 4"}, {"n": 5, "enunciado": "A avaliação de um controlo interno específico no âmbito de uma auditoria/revisão deve incluir, de forma sequencial e distinta:", "opcoes": {"A": "Apenas a avaliação da sua implementação, pois a concepção é sempre presumida adequada", "B": "A apreciação da sua concepção (capacidade teórica de evitar ou detectar e corrigir distorções) e, separadamente, a avaliação da sua implementação (se existe e está a ser utilizado)", "C": "Apenas a apreciação da sua concepção, sendo a implementação irrelevante se o desenho for adequado", "D": "A avaliação conjunta e indissociável de concepção e implementação, nunca em separado"}, "correcta": "B", "explicacao": "São duas avaliações distintas e sequenciais: primeiro aprecia-se se o controlo, tal como concebido, é capaz de mitigar o risco; depois avalia-se separadamente se esse controlo está de facto implementado e a ser utilizado.", "fonte": "Teste prático do resumo do Módulo 4"}, {"n": 6, "enunciado": "A estrutura organizacional em que, além da linha hierárquica única, existem órgãos de consultoria especializada que aconselham mas não comandam os escalões inferiores, denomina-se:", "opcoes": {"A": "Estrutura linear", "B": "Estrutura funcional", "C": "Estrutura linha-staff", "D": "Estrutura matricial"}, "correcta": "C", "explicacao": "A estrutura linha-staff combina o esquema da estrutura linear (unidade de comando) com órgãos de staff/consultoria especializada, que recomendam mas não comandam.", "fonte": "Teste prático do resumo do Módulo 4"}, {"n": 7, "enunciado": "Uma empresa de distribuição de electrodomésticos decide passar a fabricar também os produtos que anteriormente apenas distribuía, adquirindo uma fábrica. Este movimento estratégico corresponde a:", "opcoes": {"A": "Integração horizontal", "B": "Integração vertical a montante", "C": "Diferenciação de produto", "D": "Diversificação não relacionada"}, "correcta": "B", "explicacao": "Ao passar a controlar uma fase anterior da sua cadeia de valor (a produção, que antecede a distribuição), a empresa está a realizar uma integração vertical a montante.", "fonte": "Teste prático do resumo do Módulo 4"}, {"n": 8, "enunciado": "O desempenho de uma organização mede-se, entre outros indicadores, por eficácia e eficiência. Estes dois conceitos correspondem, respectivamente, a:", "opcoes": {"A": "Grau em que os objectivos são realizados; e grau em que se utilizam os recursos para realizar esses objectivos", "B": "Grau em que se utilizam os recursos; e grau em que os objectivos são realizados", "C": "Ambos medem exclusivamente o uso de recursos financeiros", "D": "São sinónimos e podem ser usados indistintamente"}, "correcta": "A", "explicacao": "Eficácia mede o grau de realização dos objectivos (fazer a coisa certa); eficiência mede o grau de boa utilização dos recursos para os atingir (fazer bem a coisa).", "fonte": "Teste prático do resumo do Módulo 4"}, {"n": 100, "enunciado": "Num sistema de controlo interno (selecione a mais correcta):", "opcoes": {"A": "segregação de funções elimina totalmente a possibilidade de conluio/cumplicidade", "B": "Gestão de Topo nunca tem a possibilidade de contornar as normas e procedimentos estabelecidos", "C": "O controlo interno está particularmente desenhado para endereçar transacções pouco usuais", "D": "Nenhuma das anteriores"}, "correcta": "D", "explicacao": "", "fonte": "Exemplos-Questões.docx"}, {"n": 101, "enunciado": "No contexto da literatura que se foca no COSO; os objectivos do controlo interno:", "opcoes": {"A": "Visam atingir objectivos operacionais promovendo uma utilização eficaz e eficiente dos recursos.", "B": "Visam atingir objectivos de conformidade com as regras em vigor na empresa e com as leis e regulamentos aplicáveis na geografia", "C": "Visam atingir um relato financeiro adequado, assegurando que todas as transacções e outros acontecimentos são prontamente registados pelo valor correcto, na rubrica e no período certo, e que regularmente são efectuadas comparações entre os registos e a realidade existente.", "D": "todas as anteriores"}, "correcta": "D", "explicacao": "", "fonte": "Exemplos-Questões.docx"}, {"n": 500, "enunciado": "Os objectivos do controlo interno:", "opcoes": {"A": "São um fim em si, pelo que uma Organização deve sempre avaliar o custo-benefício na implementação de um sistema de controlo interno.", "B": "Visam assegurar, entre outros aspectos, a confiança e integridade da informação a que também acresce a conformidade com as politicas, planos, procedimentos e leis e regulamentos", "C": "Não dependem da utilização de pessoas, pois apoiam-se em manuais de politicas e procedimentos e outros documentos", "D": "Nenhuma das anteriores"}, "correcta": "B", "explicacao": "Corresponde aos objectivos do controlo interno tal como enunciados pelo Instituto de Auditores Internos: confiança e integridade da informação, conformidade com políticas, planos, procedimentos, leis e regulamentos, salvaguarda dos activos e uso eficiente dos recursos. A alínea A erra ao dizer que os objectivos são um fim em si (o controlo interno é um processo, um meio para um fim) e a C erra porque o controlo interno é levado a cabo por pessoas, não apenas por manuais.", "fonte": "Exame: Exemplos-Questões.pdf"}, {"n": 501, "enunciado": "No sistema de controlo interno, a componente de “Avaliação de Risco”:", "opcoes": {"A": "Permite apenas a identificação dos riscos relevantes para atingir os objectivos da Empresa", "B": "Resulta de uma análise formal do risco (“o que pode correr mal”) que serve de ponto de partida para determinar ou modificar as actividades de controlo necessárias para mitigar os riscos", "C": "Pode ser efectuada de forma independente, não tendo influência nas actividades de controlo que forem implementadas por uma empresa", "D": "Nenhuma das anteriores"}, "correcta": "B", "explicacao": "A avaliação de risco é a análise formal do «o que pode correr mal» e serve de ponto de partida para determinar ou modificar as actividades de controlo que mitigam esses riscos; a alínea A é redutora (não se limita a identificar) e a C é falsa porque a avaliação de risco condiciona directamente as actividades de controlo.", "fonte": "Exame: Exemplos-Questões.pdf"}, {"n": 502, "enunciado": "Integridade e valores éticos:", "opcoes": {"A": "São um dos parâmetros a considerar nas componentes “Ambiente de Controlo” e “Monitorização”", "B": "Fazem parte das actividades de controlo que resultam da Avaliação de Risco", "C": "Conjuntamente com a Filosofia de Direcção e Estilo de Gestão, mas não só, estão incorporados na componente de “Ambiente de Controlo”.", "D": "Constituem parâmetros de difícil avaliação e altamente subjectivos pelo que a sua avaliação e documentação numa perspectiva do Perito Contabilista é desnecessária."}, "correcta": "C", "explicacao": "A integridade e os valores éticos, a par da filosofia de direcção e estilo de gestão, da estrutura organizacional e da atribuição de autoridade, são elementos integrantes da componente «Ambiente de Controlo» do COSO, e não actividades de controlo nem matéria dispensável de avaliação.", "fonte": "Exame: Exemplos-Questões.pdf"}, {"n": 503, "enunciado": "O exercício de autoridade, a definição de uma estrutura orgânica, o poder de decisão e a descrição de tarefas:", "opcoes": {"A": "Definem-se como tipos de controlos", "B": "Definem-se como métodos de controlo operacionais", "C": "Definem-se como tipos de controlo da organização", "D": "Enquadram-se no conceito de métodos de controlo interno, na categoria de controlos administrativos,"}, "correcta": "D", "explicacao": "O exercício de autoridade, a estrutura orgânica, o poder de decisão e a descrição de tarefas são precisamente os elementos que integram os controlos administrativos, um dos cinco métodos de controlo interno (a par dos operacionais, de recursos humanos, de revisão e análise e das instalações e equipamentos).", "fonte": "Exame: Exemplos-Questões.pdf"}, {"n": 504, "enunciado": "Os chamados controlos de revisão e análise compreendem:", "opcoes": {"A": "planeamento, orçamento, contabilização e sistemas de informação, documentação, autorização, políticas e procedimentos, e métodos", "B": "a realização de inspecções físicas às imobilizações e inventários, por exemplo", "C": "entre outros, a avaliação do desempenho, análise interna das operações e programas, revisões externas", "D": "nenhum dos anteriores."}, "correcta": "C", "explicacao": "Os controlos de revisão e análise abrangem a avaliação do desempenho, a análise interna das operações e programas e as revisões externas; a alínea A descreve os controlos operacionais e a B o controlo das instalações e equipamentos.", "fonte": "Exame: Exemplos-Questões.pdf"}, {"n": 505, "enunciado": "De acordo com a ISA 330, o risco de auditoria:", "opcoes": {"A": "Consiste na impossibilidade do perito contabilista dar uma opinião de auditoria sobre as demonstrações financeiras", "B": "Consiste no risco residual que permanece após consideração do risco inerente, risco do controlo interno e após a realização dos testes de auditoria substantivos", "C": "O levantamento efectuado pelo Perito Contabilista das componentes do controlo interno, determina o risco de auditoria", "D": "Nenhum dos anteriores"}, "correcta": "B", "explicacao": "O risco de auditoria é o risco residual de o auditor emitir uma opinião inapropriada, subsistindo depois de considerados o risco inerente e o risco de controlo e de executados os procedimentos substantivos; a alínea C confunde-o com o risco de controlo, que é o que resulta do levantamento das componentes do controlo interno.", "fonte": "Exame: Exemplos-Questões.pdf · resposta a confirmar"}, {"n": 506, "enunciado": "A natureza dos controlos pode ser:", "opcoes": {"A": "Preventiva, quando os controlos almejam corrigir erros e anomalias que já aconteceram", "B": "Detectiva, quando os controlos almejam evitar erros e anomalias", "C": "Ambos – de natureza preventiva e detectiva", "D": "Nenhum dos anteriores."}, "correcta": "D", "explicacao": "As definições das alíneas A e B estão trocadas — os controlos preventivos visam evitar que erros e anomalias ocorram e os detectivos visam identificá-los depois de ocorridos — pelo que a alínea C, que valida ambas, também não pode ser aceite.", "fonte": "Exame: Exemplos-Questões.pdf · resposta a confirmar"}, {"n": 507, "enunciado": "As declarações dos Orgãos de Gestão incorporadas nos saldos e divulgações constantes das demonstrações financeiras e notas anexas:", "opcoes": {"A": "Correspondem a asserções", "B": "Correspondem a Riscos de negócio", "C": "Procuram dar resposta ao normativo contabilistico aplicável", "D": "Nenhum dos anteriores."}, "correcta": "A", "explicacao": "As declarações, explícitas ou implícitas, dos órgãos de gestão incorporadas nos saldos e divulgações das demonstrações financeiras designam-se por asserções (existência, integralidade, valorização, direitos e obrigações, apresentação e divulgação), sendo ao nível delas que o auditor identifica os riscos de distorção material.", "fonte": "Exame: Exemplos-Questões.pdf"}, {"n": 508, "enunciado": "As asserções relacionadas com as rubricas de inventários e imobilizações apresentadas na face do balanço de uma empresa podem ser encaradas como uma declaração dos Orgãos de Gestão de que as mesmas:", "opcoes": {"A": "Existem fisicamente e encontram-se correctamente valorizadas com base no normativo contabilistico aplicável", "B": "Existem, contudo, poderão existir abates e quebras por reconhecer resultantes de inventários efectuados", "C": "Existem mas não se encontram correctamente valorizados pelo facto de ter havido uma quebra no seu valor decorrente da queda abrupta pela sua procura, o que irá exigir preços abaixo do custo para escoar o produto", "D": "Nenhum dos anteriores."}, "correcta": "A", "explicacao": "Ao apresentar inventários e imobilizações no balanço, a gestão está a declarar que esses activos existem fisicamente e que estão valorizados de acordo com o normativo contabilístico aplicável; as alíneas B e C descrevem justamente situações de distorção, ou seja, asserções que não estariam a ser cumpridas.", "fonte": "Exame: Exemplos-Questões.pdf"}, {"n": 509, "enunciado": "Os riscos de distorção material que poderão materializar-se na rubrica de “Contas a receber – Clientes correntes”, são por exemplo (indique todas as que considera correctas):", "opcoes": {"A": "Risco da rubrica se encontrar sobreavaliada pelo facto dos clientes apresentarem dificuldades no pagamento das facturas, apresentando as mesmas elevada antiguidade", "B": "Risco das facturas registadas não corresponderem a serviços e bens efectivamente prestados/fornecidos, estando a empresa a empolar a receita através da realização de operações com entidades relacionadas para demonstrar taxas de crescimento mais interessantes aos seus stakeholders", "C": "Risco das quantidades fornecidas constantes nas facturas em aberto, não coincidirem com as guias de remessa de despacho das mercadorias reconhecidas pelos clientes", "D": "Todas as opções acima"}, "correcta": "D", "explicacao": "Todos os exemplos são riscos plausíveis e coerentes com a rubrica de clientes: sobreavaliação por incobrabilidade (valorização), facturação sem substância económica com partes relacionadas (ocorrência) e divergência entre quantidades facturadas e guias de remessa (exactidão/rigor).", "fonte": "Exame: Exemplos-Questões.pdf"}, {"n": 510, "enunciado": "No contexto das ISAs, os procedimentos de avaliação de risco:", "opcoes": {"A": "São procedimentos efectuados pela Empresa com o objectivo de se obter um entendimento da entidade e do seu meio envolvente, incluindo o ambiente de controlo interno, constituindo a base para a identificação e avaliação dos riscos de distorção material", "B": "Constituem procedimentos da fase de conclusão de uma auditoria, sendo executados em data próxima da data de emissão do relatório de auditoria", "C": "São procedimentos efectuados pelo Auditor com o objectivo de se obter um entendimento da entidade e do seu meio envolvente, incluindo o ambiente de controlo interno, constituindo a base para a identificação e avaliação dos riscos de distorção material", "D": "Nenhuma das anteriores"}, "correcta": "C", "explicacao": "Nos termos da ISA 315, os procedimentos de avaliação do risco são executados pelo auditor (não pela empresa) para obter a compreensão da entidade, do seu meio envolvente e do controlo interno, servindo de base à identificação e avaliação dos riscos de distorção material, e realizam-se na fase de planeamento e não na de conclusão.", "fonte": "Exame: Exemplos-Questões.pdf"}, {"n": 511, "enunciado": "A estrutura organizacional clássica e mais simples inspirada em estruturas militares ou eclesiásticas:", "opcoes": {"A": "Baseia-se em linhas de comunicação bastante formalizadas e centros de decisão centralizados sendo denominada por estrutura matricial", "B": "Baseia-se numa lógica de hierarquia por projecto, não deixando de existir a hierarquia da organização como um todo, sendo denominada por estrutura linha-staff", "C": "Baseia-se numa combinação dos modelos linear e funcional", "D": "Nenhuma das anteriores."}, "correcta": "D", "explicacao": "A estrutura clássica e mais simples inspirada nos modelos militar e eclesiástico é a estrutura linear (hierarquia única e centralizada), que nenhuma das alíneas identifica: A descreve-a mas chama-lhe matricial, B descreve a matricial chamando-lhe linha-staff e C descreve a linha-staff.", "fonte": "Exame: Exemplos-Questões.pdf"}, {"n": 512, "enunciado": "A expressão veiculada no site de internet da Sonangol “Contribuir para a sustentabilidade e o crescimento da indústria petrolífera nacional, de forma a garantir maior retorno para o Estado Angolano, dando suporte à participação das empresas e dos quadros nacionais nas actividades do sector para o desenvolvimento socioeconómico de Angola.”:", "opcoes": {"A": "Refere-se intrinsecamente à sua visão relativamente à forma de estar e actuar perante os seus stakeholders", "B": "Corporiza a missão da empresa", "C": "Caso a expressão fosse “Tornar-se numa empresa de referência do sector petrolífero no continente Africano, comprometida com a sustentabilidade” então estaria a referir-se à sua missão", "D": "Nenhuma das anteriores."}, "correcta": "B", "explicacao": "A frase descreve a razão de ser e o contributo actual da empresa, ou seja, a sua missão; a alínea C está invertida, porque «tornar-se numa empresa de referência do sector» é uma aspiração de longo prazo e corresponde à visão.", "fonte": "Exame: Exemplos-Questões.pdf"}, {"n": 513, "enunciado": "A___________________ é a forma como uma organização está dividida e hierarquizada. Ela define como é feita a gestão das suas atividades e a comunicação entre seus setores, visando atingir os seus objetivos estratégicos. Complete com a frase mais adequada às circunstâncias:", "opcoes": {"A": "departamentalização", "B": "visão", "C": "estrutura organizacional", "D": "estrutura informal"}, "correcta": "C", "explicacao": "A estrutura organizacional é precisamente a combinação da departamentalização (divisão por sectores) com a hierarquia, definindo a gestão das actividades e a comunicação entre sectores; a departamentalização é apenas uma das suas dimensões e a estrutura informal resulta de relações espontâneas não planeadas.", "fonte": "Exame: Exemplos-Questões.pdf"}, {"n": 514, "enunciado": "As actividades de controlo mais usuais e geralmente aceites:", "opcoes": {"A": "São a autorização de transacções, a segregação de funções, a utilização de documentos e registos adequados, a salvaguarda adequada ao acesso aos registos e activos, a supervisão independente do trabalho efectuado e valorização dos registos, sendo as mesmas definidas pelo Auditor", "B": "São a autorização de transacções, a segregação de funções, a utilização de documentos e registos adequados, a salvaguarda adequada ao acesso aos registos e activos, a supervisão independente do trabalho efectuado e valorização dos registos, sendo as mesmas definidas e implementadas pelos serviços da Empresa", "C": "Resultam da componente de controlo interno relativa à “Avaliação de Risco” efecuada pela Empresa e podem materializar-se na autorização de transacções, a segregação de funções, a utilização de documentos e registos adequados, a salvaguarda adequada ao acesso aos registos e activos, a supervisão independente do trabalho efectuado e valorização dos registos, sendo as mesmas definidas e implementadas pelos serviços da Empresa", "D": "Nenhuma das anteriores"}, "correcta": "C", "explicacao": "A chave C mantém-se: as actividades de controlo decorrem da componente «Avaliação de Risco» da própria entidade e são definidas e implementadas pelos serviços da Empresa (nunca pelo Auditor, que apenas as avalia), materializando-se na autorização de transacções, segregação de funções, documentos e registos adequados, salvaguarda do acesso a registos e activos e supervisão independente. Atenção: a alínea B afirma exactamente o mesmo, apenas sem referir a origem na avaliação de risco, pelo que é também verdadeira — a pergunta tem duas alíneas correctas e só se resolve pelo critério da «mais completa». Acrescentar ao enunciado «seleccione a mais completa» ou confirmar a chave oficial do exame.", "fonte": "Exame: Exemplos-Questões.pdf · resposta a confirmar"}, {"n": 515, "enunciado": "A compreensão de uma entidade e do seu ambiente é vital para o planeamento de uma auditoria ao abrigo das ISAs. Os requisitos de entendimento de uma entidade e seu ambiente compreendem:", "opcoes": {"A": "Factores internos relacionados com a actividade especifica da Empresa", "B": "Factores sectoriais, reguladores e outros factores externos, a natureza da entidade, incluindo a selecção e aplicação de políticas contabilísticas, objectivos e estratégias e respectivos Riscos de Negócio, Mensuração e revisão do desempenho financeiro", "C": "Os requisitos de entendimento encontram-se previstos na ISA 330", "D": "Nenhuma das anteriores."}, "correcta": "B", "explicacao": "A ISA 315 exige a compreensão dos factores sectoriais, reguladores e outros factores externos, da natureza da entidade e das suas políticas contabilísticas, dos objectivos, estratégias e riscos de negócio associados, e da mensuração e revisão do desempenho financeiro; a alínea C erra a norma, pois a ISA 330 trata das respostas do auditor aos riscos avaliados.", "fonte": "Exame: Exemplos-Questões.pdf"}]}, {"num": 5, "rotulo": "Módulo 5", "nome": "Finanças Empresariais / Gestão Financeira", "sessoes": [{"n": 1, "titulo": "Fundamentos da Gestão Financeira e da Análise Económico-Financeira", "norma": "Fundamentos de Gestão Financeira — domínios, ópticas de análise e agentes económicos", "objectivo": "Compreender o âmbito e os domínios da Gestão Financeira, as três ópticas de análise da actividade empresarial, os agentes económicos envolvidos e os documentos base da análise económico-financeira.", "pontos": ["A Gestão Financeira centra-se em quatro domínios essenciais: Gestão de Tesouraria, Política Financeira, Estratégia Financeira e Gestão de Riscos Financeiros — qualquer opção de exame que limite a Gestão Financeira a apenas dois destes domínios (ex.: 'só política financeira e gestão de tesouraria') está incompleta.", "A Gestão Financeira gere as tarefas que integram a função financeira e abrange um conjunto de técnicas orientadas para a melhoria de uma variedade de decisões financeiras — aplica racionalmente os recursos financeiros (escassos), nunca de forma arbitrária.", "A actividade da empresa pode ser analisada segundo três ópticas complementares: Óptica Económica (proveitos e custos, geração de resultado), Óptica Financeira (origens e aplicações de fundos, equilíbrio estrutural) e Óptica de Tesouraria/Monetária (recebimentos e pagamentos, equilíbrio de curto prazo).", "Por definição, uma empresa é uma actividade económica organizada com a finalidade de circular ou produzir bens ou serviços — nunca 'dinheiro e moeda' nem 'inertes', que são distractores clássicos nesta pergunta.", "Os agentes económicos que interagem no circuito económico são cinco: Famílias, Administração Pública, Empresas, Exterior e Instituições Financeiras — as opções que substituem 'Administração Pública' por 'Banco Central' isoladamente, ou que incluem 'BRICs' ou 'Fábricas/Indústrias' como categoria de agente, estão incorrectas.", "Os dois documentos financeiros centrais para a análise económica e financeira de uma empresa são o Balanço e a Demonstração de Resultados — é a partir destes dois documentos que se constroem todos os rácios económico-financeiros, nunca a partir do balancete ou de mapas de salários/inventário isoladamente.", "A partir da Demonstração de Resultados é possível calcular, entre outros indicadores: a margem bruta das vendas, o Excedente Bruto de Exploração, o Valor Acrescentado Bruto (VAB) e indicadores de rendibilidade — os rácios de liquidez, autonomia financeira e solvabilidade dependem antes do Balanço."], "formulas": [], "erros": ["Não reduzir os domínios da Gestão Financeira a apenas dois — são sempre quatro: Tesouraria, Política Financeira, Estratégia Financeira e Gestão de Riscos Financeiros.", "Não confundir os cinco agentes económicos (Famílias, Administração Pública, Empresas, Exterior, Instituições Financeiras) com variantes incompletas ou incorrectas como 'Banco Central' ou 'BRICs'."]}, {"n": 2, "titulo": "Análise de Rácios: Limitações, Liquidez e Autonomia Financeira", "norma": "Análise económico-financeira por rácios — construção, limitações e sinais de alerta", "objectivo": "Conhecer as limitações inerentes à análise por rácios e saber calcular e interpretar os principais rácios de liquidez e o rácio de autonomia financeira a partir do Balanço.", "pontos": ["Os rácios económico-financeiros apresentam três limitações fundamentais: (1) relacionam apenas dados quantitativos, ignorando factores qualitativos; (2) não existe uma normalização universal — o mesmo rácio pode ser calculado de formas ligeiramente diferentes consoante o autor/norma; (3) são influenciados pela sazonalidade da actividade, pelo que uma leitura pontual pode distorcer a real situação da empresa.", "Rácio de Liquidez Geral = Activo Circulante / Passivo Circulante — mede a capacidade de a empresa fazer face aos compromissos de curto prazo com a totalidade do activo circulante.", "Rácio de Liquidez Reduzida = (Activo Circulante − Existências) / Passivo Circulante — exclui as existências por serem o activo circulante menos líquido (mais difícil e demorado de converter em meios monetários).", "Rácio de Liquidez Imediata = Disponibilidades (Depósitos e Caixa) / Passivo Circulante — mede a capacidade de pagamento imediata, apenas com meios monetários já disponíveis, sem depender de cobranças ou vendas de existências.", "Rácio de Autonomia Financeira = Capital Próprio / Activo Total — mede o peso do financiamento próprio no total dos capitais que financiam a empresa; quanto maior o rácio, menor a dependência de capitais alheios.", "Um rácio de liquidez geral superior a 1 indica, em princípio, que o activo circulante cobre o passivo circulante — mas deve sempre confirmar-se se essa cobertura não depende excessivamente de existências de rotação lenta."], "formulas": ["Rácio de Liquidez Geral = Activo Circulante ÷ Passivo Circulante", "Rácio de Liquidez Reduzida = (Activo Circulante − Existências) ÷ Passivo Circulante", "Rácio de Liquidez Imediata = Disponibilidades ÷ Passivo Circulante", "Rácio de Autonomia Financeira = Capital Próprio ÷ Activo Total"], "erros": ["Não esquecer de subtrair as Existências (e só as Existências) no numerador da Liquidez Reduzida — os Créditos a Curto Prazo mantêm-se no cálculo.", "Na Liquidez Imediata, usar apenas Disponibilidades (Depósitos e Caixa) no numerador — nunca incluir Créditos a Curto Prazo ou Existências."]}, {"n": 3, "titulo": "Equilíbrio Financeiro, Fundo de Maneio e Ciclo de Exploração", "norma": "Análise patrimonial e funcional — Fundo de Maneio, Necessidades em Fundo de Maneio e Tesouraria Líquida", "objectivo": "Compreender o conceito de equilíbrio financeiro, calcular o Fundo de Maneio, a Necessidade em Fundo de Maneio e a Tesouraria Líquida, e dominar os prazos médios do ciclo de exploração.", "pontos": ["A análise do equilíbrio financeiro é particularmente importante para determinar o nível de capital próprio e a estrutura de financiamento da empresa — permite avaliar se as fontes de financiamento utilizadas são adequadas à natureza (curto ou longo prazo) das aplicações que financiam.", "A análise patrimonial (análise do Balanço) tem por objectivo, entre outros, detectar a capacidade que a empresa tem em satisfazer as suas obrigações de pagamento nas datas exigíveis registadas no Balanço — é uma abordagem tradicional, sobretudo de óptica jurídica.", "O Fundo de Maneio (FM) é a diferença entre os Capitais Permanentes e o Activo Não Corrente — equivale também, na óptica funcional, à diferença entre o Activo Corrente e o Passivo Corrente. Um FM positivo significa que parte do activo corrente está financiada por capitais de médio/longo prazo, reforçando a margem de segurança financeira.", "Os Capitais Permanentes correspondem às origens de capital com maior estabilidade temporal: Capitais Próprios e Dívidas a Pagar a Médio/Longo Prazo.", "Os Activos Fixos Não Correntes correspondem às aplicações duradouras que se presume serem utilizadas para além do ciclo de exploração normal da empresa — distinguem-se dos Activos Cíclicos (que rodam dentro do ciclo de exploração).", "A situação financeira da empresa avalia-se através de três instrumentos complementares: Fundo de Maneio Líquido (FML), Necessidades em Fundo de Maneio ou Fundo de Maneio Necessário (NFM) e Tesouraria Líquida (TRL).", "A Tesouraria traduz a situação de equilíbrio ou desequilíbrio financeiro: T = FM − NFM. Indica também o grau de adequação do Fundo de Maneio às Necessidades em Fundo de Maneio — uma tesouraria negativa persistente é um sinal de alerta de desequilíbrio financeiro de curto prazo.", "O ciclo de cash flow (ou ciclo de caixa) traduz-se pela soma do Período Médio de Existências com o Prazo Médio de Recebimento, deduzido do Prazo Médio de Pagamento: Ciclo de Caixa = PME + PMR − PMP.", "Prazo Médio de Recebimento (PMR) = Clientes × 365 / Vendas e Prestações de Serviços. Prazo Médio de Pagamento (PMP) = Fornecedores × 365 / Compras. Em termos de Balanço, os capitais alheios de que a empresa dispõe reflectem-se nas rubricas do passivo, configuradas em fontes de financiamento por capitais alheios de curto prazo e de médio/longo prazo."], "formulas": ["Fundo de Maneio (FM) = Capitais Permanentes − Activo Não Corrente  (=  Activo Corrente − Passivo Corrente)", "Tesouraria Líquida (T) = Fundo de Maneio (FM) − Necessidade em Fundo de Maneio (NFM)", "Prazo Médio de Recebimento (PMR) = (Clientes × 365) ÷ Vendas e Prestações de Serviços", "Prazo Médio de Pagamento (PMP) = (Fornecedores × 365) ÷ Compras", "Ciclo de Caixa = Período Médio de Existências + PMR − PMP"], "erros": ["O Fundo de Maneio é a diferença entre Capitais Permanentes e Activo NÃO Corrente — nunca 'capitais permanentes menos passivo não corrente', que é uma troca comum entre distractores de exame.", "Não confundir PMR (usa Clientes e Vendas) com PMP (usa Fornecedores e Compras) — trocar estas duas variáveis é o erro mais frequente neste tipo de exercício."]}, {"n": 4, "titulo": "Risco, Rendibilidade e Alavancagem Operacional", "norma": "Análise de sensibilidade, risco e rendibilidade — risco específico, risco sistemático e alavancagem operacional", "objectivo": "Distinguir os tipos de risco financeiro, compreender o conceito de risco de mercado e calcular o Grau de Alavancagem Operacional.", "pontos": ["A análise de risco é uma das temáticas mais importantes da análise financeira da empresa e uma componente central do processo de criação de valor.", "Os dois principais tipos de risco existentes são o Risco Específico (próprio de cada empresa/negócio, diversificável através de uma carteira de investimentos) e o Risco Sistemático (risco de mercado, comum a todas as empresas, não eliminável por diversificação).", "O Risco de Mercado está relacionado com as oscilações que um determinado activo/produto pode sofrer ao longo do tempo: quanto maior for a variação (volatilidade) observada, maior será o risco associado.", "Na teoria financeira, o risco caracteriza-se como a provável variação dos fluxos monetários futuros de um projecto ou negócio — quanto maior a incerteza na previsão desses fluxos, maior o risco.", "O risco tende a ser mais elevado quando as vendas efectivas se situam próximo do ponto crítico (ponto morto) das vendas — uma pequena quebra de vendas pode empurrar a empresa para resultados negativos.", "O Grau de Alavancagem Operacional (GAO) mede-se pelo rácio entre a Margem de Contribuição e o Resultado Operacional — quanto maior o GAO, maior a sensibilidade do resultado operacional a variações no volume de vendas, e portanto maior o risco operacional do negócio."], "formulas": ["Grau de Alavancagem Operacional (GAO) = Margem de Contribuição ÷ Resultado Operacional"], "erros": ["Não trocar Risco Específico (diversificável) com Risco Sistemático (de mercado, não diversificável) — é a distinção mais testada nesta sessão.", "No GAO, o denominador é sempre o Resultado Operacional, nunca o Resultado Líquido nem as Vendas isoladamente."]}, {"n": 5, "titulo": "Critérios de Avaliação de Investimentos e Fontes de Financiamento", "norma": "Avaliação de projectos de investimento — Payback, VAL, TIR — e estrutura de financiamento a médio/longo prazo", "objectivo": "Dominar os três critérios clássicos de avaliação de projectos de investimento (Payback, VAL, TIR), os factores que condicionam o custo de capital, e as principais fontes de financiamento a médio/longo prazo.", "pontos": ["Para avaliar a rentabilidade e viabilidade de um projecto de investimento, os critérios de análise mais utilizados são: o Payback (Período de Recuperação), o Valor Actual Líquido (VAL) e a Taxa Interna de Rentabilidade (TIR).", "O Payback é o critério mais simples: atende apenas ao período de tempo que o projecto leva a recuperar o capital investido — o período de tempo necessário para as receitas recuperarem as despesas de investimento designa-se Período de Recuperação.", "O Valor Actual Líquido (VAL) é a soma dos cash flows/fluxos de caixa gerados durante a vida útil de um projecto, actualizada (descontada) ao momento presente a uma determinada taxa — um VAL positivo indica que o projecto cria valor para a empresa.", "A Taxa Interna de Rentabilidade (TIR) pode ser definida como a taxa de desconto que faz com que o Valor Actual Líquido (VAL) de um projecto seja igual a zero — é a taxa de rentabilidade intrínseca do próprio projecto.", "Os factores que condicionam a Taxa de Custo de Capital de uma empresa são o Custo de Oportunidade de Investimento dos Accionistas e o Custo do Financiamento Externo — não a taxa de inflação nem a taxa de IRT isoladamente.", "Em termos de Balanço, os capitais alheios a que a empresa recorre reflectem-se nas rubricas do Passivo, tanto Corrente como Não Corrente, configurando fontes de financiamento de curto prazo e de médio/longo prazo.", "As fontes de financiamento por capitais alheios de médio/longo prazo mais utilizadas são: Empréstimos Bancários, Leasing, Empréstimos Obrigacionistas e Capital de Risco — distintas das fontes de curto prazo (descoberto bancário, conta corrente caucionada, crédito de fornecedores).", "A Gestão Financeira e o Planeamento Estratégico não são conceitos opostos nem independentes — são descritos como 'duas faces da mesma moeda', devendo o gestor financeiro integrar as decisões financeiras no planeamento estratégico global da empresa."], "formulas": ["VAL = Σ [ Cash Flow do período t ÷ (1+k)^t ] − Investimento Inicial, onde k é a taxa de actualização", "TIR = taxa de desconto k para a qual VAL = 0", "Payback = período de tempo necessário para os cash flows acumulados igualarem o investimento inicial"], "erros": ["Não confundir os três instrumentos de avaliação da situação financeira (FM/NFM/TRL) com os três critérios de avaliação de investimentos (Payback/VAL/TIR) — são conjuntos de conceitos distintos, por vezes testados na mesma prova.", "A TIR iguala o VAL a ZERO, nunca a um valor negativo nem superior a zero — este é o distractor mais comum nesta definição."]}], "intro_temas": "As provas de Gestão Financeira analisadas (exames-tipo, questionários de Novembro/2021 e exercícios de avaliação profissional) mostram um padrão muito consistente: perguntas de definição/completar espaço sobre os conceitos-base (ópticas, agentes económicos, Fundo de Maneio, Tesouraria) alternam com exercícios numéricos directos de rácios e prazos médios (PMR, PMP, liquidez, autonomia financeira), sempre com fórmulas simples aplicadas a dados de balanço fornecidos no enunciado. Dominar as fórmulas de memória e praticar a sua aplicação directa a números é o que mais rende nesta prova.", "temas": [{"tema": "Fundo de Maneio (FM), Necessidade em Fundo de Maneio (NFM) e Tesouraria Líquida (T = FM − NFM)", "freq": "Muito alta", "pedido": "Definir e calcular os três instrumentos de avaliação da situação financeira, e interpretar o sinal da Tesouraria Líquida."}, {"tema": "Rácios de Liquidez (Geral, Reduzida, Imediata)", "freq": "Muito alta", "pedido": "Calcular os três rácios a partir de dados de Activo/Passivo Corrente fornecidos no enunciado, com atenção às Existências e Disponibilidades."}, {"tema": "Prazo Médio de Recebimento (PMR) e Prazo Médio de Pagamento (PMP)", "freq": "Muito alta", "pedido": "Aplicar correctamente as fórmulas (Clientes×365/Vendas; Fornecedores×365/Compras) sem trocar as variáveis."}, {"tema": "Rácio de Autonomia Financeira", "freq": "Alta", "pedido": "Calcular Capital Próprio/Activo a partir de um balanço completo fornecido no enunciado."}, {"tema": "As três ópticas da actividade da empresa (económica, financeira, tesouraria)", "freq": "Alta", "pedido": "Identificar e distinguir as três ópticas de análise da actividade empresarial."}, {"tema": "Agentes económicos e documentos base da análise económico-financeira", "freq": "Média-Alta", "pedido": "Identificar os cinco agentes económicos e os dois documentos (Balanço e Demonstração de Resultados) que fundamentam a análise."}, {"tema": "Limitações dos rácios económico-financeiros", "freq": "Alta", "pedido": "Reconhecer as três limitações clássicas: dados apenas quantitativos, falta de normalização, sazonalidade."}, {"tema": "Risco específico vs. risco sistemático e risco de mercado", "freq": "Alta", "pedido": "Distinguir os dois tipos de risco e relacionar a variação/volatilidade com o nível de risco."}, {"tema": "Grau de Alavancagem Operacional (GAO)", "freq": "Média", "pedido": "Aplicar a fórmula Margem de Contribuição/Resultado Operacional e interpretar o seu significado."}, {"tema": "Critérios de avaliação de investimentos: VAL, TIR e Payback", "freq": "Muito alta", "pedido": "Dominar as definições exactas de cada critério, sobretudo a definição da TIR como a taxa que iguala o VAL a zero."}, {"tema": "Fontes de financiamento a médio/longo prazo", "freq": "Média-Alta", "pedido": "Identificar Empréstimos Bancários, Leasing, Empréstimos Obrigacionistas e Capital de Risco como as fontes MLP mais utilizadas."}, {"tema": "Factores que condicionam a Taxa de Custo de Capital", "freq": "Média", "pedido": "Reconhecer o Custo de Oportunidade dos Accionistas e o Custo do Financiamento Exter
