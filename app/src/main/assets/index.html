no como os dois factores determinantes."}, {"tema": "Análise patrimonial vs. análise funcional do Balanço", "freq": "Média", "pedido": "Distinguir a abordagem tradicional/jurídica (análise patrimonial) da abordagem moderna/funcional do equilíbrio financeiro."}], "perguntas": [{"n": 1, "enunciado": "A Gestão Financeira, por definição, centra-se nos seguintes domínios:", "opcoes": {"A": "Política Financeira e Gestão de Risco Financeiro, apenas", "B": "Elaboração de Orçamentos e Gestão de Risco Financeiro, apenas", "C": "Gestão de Tesouraria, Política Financeira, Estratégia Financeira e Gestão de Riscos Financeiros", "D": "Política Financeira e Gestão de Tesouraria, apenas"}, "correcta": "C", "explicacao": "A Gestão Financeira abrange quatro domínios: Gestão de Tesouraria, Política Financeira, Estratégia Financeira e Gestão de Riscos Financeiros. As restantes opções reduzem indevidamente o âmbito a apenas dois domínios.", "fonte": "Teste prático do resumo do Módulo 5"}, {"n": 2, "enunciado": "As três ópticas segundo as quais se pode analisar a actividade de uma empresa são:", "opcoes": {"A": "Óptica Económica, Óptica Financeira e Óptica de Tesouraria/Monetária", "B": "Óptica Económica, Óptica de Recebimento e Óptica de Tesouraria/Monetária", "C": "Óptica de Pagamento, Óptica Financeira e Óptica de Tesouraria/Monetária", "D": "Óptica Financeira, Óptica de Pagamento e Óptica de Tesouraria/Monetária"}, "correcta": "A", "explicacao": "As três ópticas clássicas de análise da actividade empresarial são a económica, a financeira e a de tesouraria/monetária.", "fonte": "Teste prático do resumo do Módulo 5"}, {"n": 3, "enunciado": "Os agentes económicos que compõem o circuito económico são:", "opcoes": {"A": "Particulares, Banco Central, Empresas, Exterior e Instituições Financeiras", "B": "Famílias, Administração Pública, Empresas, Exterior e Instituições Financeiras", "C": "Famílias, Fábricas, Indústrias, Exterior e Instituições Financeiras", "D": "Famílias, Administração Pública, BRICs e Instituições Financeiras"}, "correcta": "B", "explicacao": "Os cinco agentes económicos são: Famílias, Administração Pública, Empresas, Exterior e Instituições Financeiras.", "fonte": "Teste prático do resumo do Módulo 5"}, {"n": 4, "enunciado": "O Fundo de Maneio (FM) de uma empresa define-se como:", "opcoes": {"A": "A diferença entre os Capitais Permanentes e o Activo Não Corrente", "B": "A diferença entre o Passivo Permanente e o Activo Não Corrente", "C": "A diferença entre os Capitais Permanentes e o Passivo Não Corrente", "D": "A soma dos Capitais Permanentes com o Activo Não Corrente"}, "correcta": "A", "explicacao": "FM = Capitais Permanentes − Activo Não Corrente, o que equivale, na óptica funcional, a Activo Corrente − Passivo Corrente.", "fonte": "Teste prático do resumo do Módulo 5"}, {"n": 5, "enunciado": "A Tesouraria (T) de uma empresa traduz a situação de equilíbrio ou desequilíbrio financeiro e calcula-se por:", "opcoes": {"A": "T = Activo Corrente + Passivo Corrente", "B": "T = Fundo de Maneio − Necessidade em Fundo de Maneio", "C": "T = Necessidade em Fundo de Maneio − Fundo de Maneio", "D": "T = Capital Próprio ÷ Activo"}, "correcta": "B", "explicacao": "T = FM − NFM. A Tesouraria indica o grau de adequação do Fundo de Maneio às Necessidades em Fundo de Maneio da empresa.", "fonte": "Teste prático do resumo do Módulo 5"}, {"n": 6, "enunciado": "A empresa Kianda, Lda apresentou em 2024 um Saldo Médio de Fornecedores de 90.000 Kz e Compras com IVA no montante de 730.000 Kz. Qual o Prazo Médio de Pagamento (PMP), considerando o ano com 365 dias?", "opcoes": {"A": "30 dias", "B": "45 dias", "C": "60 dias", "D": "90 dias"}, "correcta": "B", "explicacao": "PMP = (Fornecedores × 365) ÷ Compras = (90.000 × 365) ÷ 730.000 = 32.850.000 ÷ 730.000 = 45 dias.", "fonte": "Teste prático do resumo do Módulo 5"}, {"n": 7, "enunciado": "A empresa Kianda, Lda apresentou em 2024 um Saldo Médio de Clientes de 60.000 Kz e Vendas no montante de 730.000 Kz. Qual o Prazo Médio de Recebimento (PMR), considerando o ano com 365 dias?", "opcoes": {"A": "15 dias", "B": "22 dias", "C": "30 dias", "D": "36 dias"}, "correcta": "C", "explicacao": "PMR = (Clientes × 365) ÷ Vendas = (60.000 × 365) ÷ 730.000 = 21.900.000 ÷ 730.000 = 30 dias.", "fonte": "Teste prático do resumo do Módulo 5"}, {"n": 8, "enunciado": "A empresa Tembo, Lda apresenta um Activo Circulante de 15.000 Kz (dos quais 3.000 Kz são Existências e 2.000 Kz são Disponibilidades) e um Passivo Circulante de 10.000 Kz. Qual o Rácio de Liquidez Reduzida?", "opcoes": {"A": "1,50", "B": "1,20", "C": "0,90", "D": "0,20"}, "correcta": "B", "explicacao": "Rácio de Liquidez Reduzida = (Activo Circulante − Existências) ÷ Passivo Circulante = (15.000 − 3.000) ÷ 10.000 = 12.000 ÷ 10.000 = 1,20.", "fonte": "Teste prático do resumo do Módulo 5"}, {"n": 9, "enunciado": "Com os mesmos dados da empresa Tembo, Lda (Activo Circulante 15.000 Kz, Existências 3.000 Kz, Disponibilidades 2.000 Kz, Passivo Circulante 10.000 Kz), qual o Rácio de Liquidez Imediata?", "opcoes": {"A": "1,50", "B": "1,20", "C": "0,30", "D": "0,20"}, "correcta": "D", "explicacao": "Rácio de Liquidez Imediata = Disponibilidades ÷ Passivo Circulante = 2.000 ÷ 10.000 = 0,20.", "fonte": "Teste prático do resumo do Módulo 5"}, {"n": 10, "enunciado": "Os dois principais tipos de risco financeiro existentes são:", "opcoes": {"A": "Risco específico e risco sistemático", "B": "Risco específico e risco diversificável, apenas", "C": "Risco sistemático e risco de câmbio", "D": "Risco do preço e risco de mercado"}, "correcta": "A", "explicacao": "Os dois tipos principais de risco são o risco específico (próprio de cada empresa, diversificável) e o risco sistemático (risco de mercado, não diversificável).", "fonte": "Teste prático do resumo do Módulo 5"}, {"n": 11, "enunciado": "A Taxa Interna de Rentabilidade (TIR) de um projecto de investimento pode ser definida como a taxa de desconto que faz com que:", "opcoes": {"A": "O Valor Actual Líquido (VAL) do projecto seja igual a zero", "B": "O Valor Actual Líquido (VAL) do projecto seja negativo", "C": "O Valor Actual Líquido (VAL) do projecto seja superior a zero", "D": "O Payback do projecto seja igual a zero"}, "correcta": "A", "explicacao": "A TIR é, por definição, a taxa de desconto que iguala o VAL a zero — é a rentabilidade intrínseca do próprio projecto.", "fonte": "Teste prático do resumo do Módulo 5"}, {"n": 12, "enunciado": "As fontes de financiamento por capitais alheios de Médio/Longo Prazo mais utilizadas pelas empresas incluem:", "opcoes": {"A": "Empréstimos Bancários, Leasing, Empréstimos Obrigacionistas e Capital de Risco", "B": "Cartão de Crédito, Descoberto Bancário e Crédito a Fornecedor", "C": "Cheques, Descoberto de Livrança e Conta Corrente Caucionada", "D": "Acções, Crédito a Fornecedores e Factoring, apenas"}, "correcta": "A", "explicacao": "As fontes de financiamento a médio/longo prazo mais utilizadas são os Empréstimos Bancários, o Leasing, os Empréstimos Obrigacionistas e o Capital de Risco; as restantes opções listam maioritariamente fontes de curto prazo.", "fonte": "Teste prático do resumo do Módulo 5"}, {"n": 500, "enunciado": "A Gestão Financeira centra-se nos seguintes domínios:", "opcoes": {"A": "Política financeira e Gestão de risco financeiro", "B": "Elaboração de orçamentos e Gestão de risco financeiros", "C": "Gestão de tesourara, Política financeira, Estratégia Financeira e Gestão de riscos financeiros .", "D": "Política financeira e Gestão de tesourara."}, "correcta": "C", "explicacao": "A Gestão Financeira assenta em quatro domínios: Gestão de Tesouraria, Política Financeira, Estratégia Financeira e Gestão de Riscos Financeiros; as restantes opções reduzem-na a apenas dois desses domínios, ficando incompletas.", "fonte": "Exame: Exame Tipo de Avaliação Profissional Modulo 5 - Vers"}, {"n": 501, "enunciado": "A Gestão de Tesouraria está relacionada com:", "opcoes": {"A": "As Politicas de financiamento que garantam o equilíbrio financeiro a curto prazo e o equilíbrio a médio e longo prazo (equilíbrio financeiro estrutural)", "B": "A previsão das necessidades ou excedentes de tesouraria e seu financiamento ou aplicação das melhores condições", "C": "As afirmações das alinhas A e B são verdadeiras ", "D": "As afirmações das alinhas A e B são falsas."}, "correcta": "B", "explicacao": "A resposta correcta é B. Cada um dos quatro domínios da Gestão Financeira tem conteúdo próprio: a Gestão de Tesouraria é a previsão das necessidades ou excedentes de tesouraria e o seu financiamento ou aplicação nas melhores condições — exactamente a alínea B. A alínea A (políticas de financiamento que garantam o equilíbrio financeiro a curto prazo e o equilíbrio a médio e longo prazo, ou equilíbrio financeiro estrutural) é a definição de Política Financeira, que é um domínio distinto: o equilíbrio estrutural é, por natureza, matéria de médio/longo prazo, ao passo que a tesouraria é gestão de curto prazo. Como a alínea A não pertence à Gestão de Tesouraria, a alínea C («ambas verdadeiras») não pode ser aceite.", "fonte": "Exame: Exame Tipo de Avaliação Profissional Modulo 5 - Vers · resposta revista"}, {"n": 502, "enunciado": "O Prazo médio de recebimento é igual a:", "opcoes": {"A": "Clientes x 365/vendas e prestações de serviços ", "B": "Clientes x 365/Existências", "C": "Clientes x 365/Caixa", "D": "Clientes x Existências/365."}, "correcta": "A", "explicacao": "PMR = (Clientes × 365) ÷ Vendas e Prestações de Serviços; o denominador é sempre o volume de vendas/serviços e nunca as existências ou a caixa (o erro clássico é trocar com o PMP, que usa Fornecedores e Compras).", "fonte": "Exame: Exame Tipo de Avaliação Profissional Modulo 5 - Vers"}, {"n": 503, "enunciado": "Demonstração de Fluxos de caixa:", "opcoes": {"A": "Engloba as actividades operacionais, de investimento e de financiamento", "B": "É um documento financeiro que contribui para completar as informações apresentadas no Balanço e na Demonstração de resultados", "C": "As afirmações das alinhas A e B são verdadeiras ", "D": "As afirmações das alinhas A e B são falsas."}, "correcta": "C", "explicacao": "A Demonstração de Fluxos de Caixa engloba os fluxos das actividades operacionais, de investimento e de financiamento e é um documento financeiro que completa a informação do Balanço e da Demonstração de Resultados, pelo que ambas as afirmações são verdadeiras.", "fonte": "Exame: Exame Tipo de Avaliação Profissional Modulo 5 - Vers"}, {"n": 504, "enunciado": "A análise da realidade económico-financeira da empresa aborda:", "opcoes": {"A": "O ciclo de actividade, o equilíbrio financeiro, a rendibilidade, a liquidez, a solvabilidade e o risco ", "B": "O ciclo de actividade, a rendibilidade, a liquidez e a solvabilidade; 1", "C": "O cálculo do custo do produto e o custo de mercado.", "D": "A rendibilidade, a liquidez e a solvabilidade"}, "correcta": "A", "explicacao": "A análise económico-financeira é abrangente e cobre o ciclo de actividade, o equilíbrio financeiro, a rendibilidade, a liquidez, a solvabilidade e o risco; as restantes opções omitem dimensões (equilíbrio financeiro e risco) ou referem-se a matéria de contabilidade analítica.", "fonte": "Exame: Exame Tipo de Avaliação Profissional Modulo 5 - Vers"}, {"n": 505, "enunciado": "A partir da Demonstração dos resultados podemos calcular:", "opcoes": {"A": "A margem bruta das vendas, o excedente bruto de exploração, o VAB e a rendibilidade ", "B": "O rácio de liquidez geral e a solvabilidade", "C": "O rácio de liquidez imediata e a autonomia financeira", "D": "O PER, autonomia financeira e o GAO."}, "correcta": "A", "explicacao": "Da Demonstração de Resultados retiram-se a margem bruta das vendas, o Excedente Bruto de Exploração, o VAB e os indicadores de rendibilidade; a liquidez, a autonomia financeira e a solvabilidade dependem do Balanço, não da DR.", "fonte": "Exame: Exame Tipo de Avaliação Profissional Modulo 5 - Vers"}, {"n": 507, "enunciado": "O ciclo de cash flow ou de caixa traduz a:", "opcoes": {"A": "Período médio da existência + PMR – PMP ", "B": "Rácio de liquidez", "C": "Tesouraria liquida.", "D": "Rácio financeiro. 2"}, "correcta": "A", "explicacao": "O ciclo de caixa (cash flow) é dado por Ciclo de Caixa = Período Médio de Existências + PMR − PMP; trata-se de um prazo em dias e não de um rácio de liquidez ou financeiro.", "fonte": "Exame: Exame Tipo de Avaliação Profissional Modulo 5 - Vers"}, {"n": 508, "enunciado": "Balanço da Empresa AngoKwa, Lda apresenta, em 31 de Dezembro de 2018. Entidade.................................................................. AngoKwa,Lda Balanço em............................................................. 31 de Dezembro d e 2V0a1l8ores expressos em..... AKZ Designação Notas 2018 2017 Activos não correntes: Imobilizações corpóreas.................................... 4 0,00 0,00 Imobilizações incorpóreas................................. 5 104 750 000,00 Investimentos em subsidiárias e associadas.. 6 0,00 0,00 Outros activos financeiros.................................... 7 0,00 0,00 Outros activos não correntes............................... 9 1 020 000,00 0,00 105 770 000,00 0,00 Activos correntes: Existências........................................................... 8 11 600 000,00 0,00 Contas a receber................................................. 9 20 004 000,00 0,00 Disponibilidades.................................................... 10 7 863 000,00 Outros activos correntes.......................................... 11 1 290 000,00 0,00 40 757 000,00 0,00 Total do activo.............. 146 527 000,00 0,00 C A P I T A L P R Ó P R I O E P A S S I V O Capital próprio: Capital................................................................... 12 43 000 000,00 Reservas............................................................. 13 17 910 000,00 0,00 Resultados transitados............................................... 14 Resultados do exercício....................................... 10 333 373,00 71 243 373,00 0,00 Passivo não corrente: Empréstimos de médio e longo prazos ................ 15 30 000 000,00 Impostos diferidos................................................ 16 0,00 0,00 Provisões para pensões........................................ 17 0,00 0,00 Provisões para outros riscos e encargos................ 18 0,00 0,00 Outros passivos não correntes........................... 19 4 835 000,00 0,00 34 835 000,00 0,00 Passivo corrente: Contas a pagar.......................................................... 19 28 938 625,00 0,00 Empréstimos de curto prazo................................. 20 0,00 0,00 Parte cor. dos emp. a médio e longos prazos........... 15 10 000 000,00 0,00 Outros passivos correntes.................................. 21 1 510 000,00 0,00 40 448 625,00 0,00 Total do capital próprio e passivo.............. 146 526 998,00 0,00", "opcoes": {"A": "Rácio de Autonomia Financeira (AF) = 49% ", "B": "Rácio de Autonomia Financeira (AF) = 106%", "C": "Rácio de Autonomia Financeira (AF) = 95%", "D": "Rácio de Autonomia Financeira (AF) = 91%"}, "correcta": "A", "explicacao": "A chave A está confirmada por cálculo: Capital Próprio = 43.000.000 + 17.910.000 + 10.333.373 = 71.243.373 Kz; Activo Total = 105.770.000 + 40.757.000 = 146.527.000 Kz; Autonomia Financeira = 71.243.373 ÷ 146.527.000 = 48,6%, ou seja ≈ 49%. O distractor de 95% é a Solvabilidade (Capital Próprio ÷ Passivo = 71.243.373 ÷ 75.283.625 = 94,6%) — é a troca clássica nesta pergunta. O problema é de forma e não de resposta: o enunciado é um bloco bruto de OCR do balanço, sem a pergunta explícita. Reformatar o balanço em tabela e acrescentar a frase «Qual o Rácio de Autonomia Financeira em 2018?» antes de publicar na app.", "fonte": "Exame: Exame Tipo de Avaliação Profissional Modulo 5 - Vers · resposta a confirmar"}]}, {"num": 6, "rotulo": "Módulo 6", "nome": "Direito das Sociedades e do Trabalho", "sessoes": [{"n": 1, "titulo": "Tipos de Empresas e de Sociedades Comerciais", "norma": "Lei n.º 1/04, de 13 de Fevereiro — Lei das Sociedades Comerciais (LSC)", "objectivo": "Distinguir os diferentes tipos de empresas (privadas, públicas, com participação pública minoritária, cooperativas) e os tipos de sociedades comerciais reguladas pela LSC.", "pontos": ["A LSC (Lei 1/04, de 13 de Fevereiro) aplica-se a qualquer tipo de empresa em Angola, sendo o diploma central deste módulo — os contabilistas devem conhecê-la bem, pois desempenham funções em todos os tipos de empresa.", "As empresas privadas constituem-se sob a forma de sociedades comerciais. O tecido empresarial angolano é hoje constituído, desde a independência, exclusivamente por sociedades de responsabilidade limitada: Sociedades por Quotas (SQ) — em número muito superior — e Sociedades Anónimas (SA), sendo estas últimas mais utilizadas por Bancos, Seguradoras e futuras Sociedades Abertas.", "São tipos de sociedades comerciais reguladas pela LSC as Sociedades por Quotas e as Sociedades Anónimas (entre outros tipos previstos no Art. 2.º da LSC) — as Cooperativas e as Empresas Públicas NÃO são 'sociedades comerciais' para efeitos da LSC, sendo reguladas por diplomas próprios (Lei das Cooperativas e LBSEP, respectivamente).", "As Sociedades Unipessoais (por Quotas ou Anónimas), reguladas pela Lei n.º 19/12, de 11 de Junho, são constituídas por um único sócio (pessoa singular ou colectiva), titular da totalidade do capital social, com responsabilidade limitada perante os credores. Não podem constituir-se em SU as instituições financeiras bancárias, seguradoras, resseguradoras e sociedades gestoras de fundos de pensões; uma SU não pode constituir outra SU nem adquirir participações sociais noutras sociedades (não pode ter 'sociedades filhas').", "As Empresas Públicas são pessoas colectivas dotadas de personalidade jurídica e autonomia administrativa, financeira e patrimonial, reguladas pela LBSEP (Lei de Bases do Sector Empresarial Público) — têm Conselho de Administração (mandato de 5 anos) ou, em alternativa, Conselho de Coordenação e Orientação Estratégica + Comissão Executiva, e Conselho Fiscal (3 membros) ou Fiscal Único.", "As Empresas com Participação Pública Minoritária associam capitais públicos e privados, sem que a entidade pública detenha a maioria do capital/votos nem o direito de designar a maioria dos órgãos — regem-se pela LSC, mas a participação pública segue as regras da LBSEP.", "As Cooperativas são pessoas colectivas autónomas de capital e composição variáveis e de controlo democrático (art. 3.º da Lei das Cooperativas), com órgão deliberativo assente no princípio '1 homem, 1 voto' — não se confundem com sociedades comerciais."], "formulas": [], "erros": ["Cooperativas e Empresas Públicas são frequentemente colocadas como distractores na pergunta 'quais são tipos de sociedades comerciais' — a resposta correcta restringe-se, entre as opções típicas de exame, às Sociedades por Quotas (e demais tipos do Art. 2.º da LSC), nunca às cooperativas ou empresas públicas.", "Não confundir Sociedade Unipessoal (um único sócio, regulada por lei própria) com Sociedade por Quotas ou Anónima pluripessoal — a SU pode transformar-se numa ou noutra e vice-versa."]}, {"n": 2, "titulo": "Constituição, Capital Social, Entradas e Reserva Legal (SQ vs. SA)", "norma": "Lei n.º 1/04 (LSC) — Capítulos relativos a capital social, entradas e reservas", "objectivo": "Dominar as regras de capital social mínimo, tipos de entradas, prazos de realização e constituição da reserva legal, comparando sempre Sociedades por Quotas e Sociedades Anónimas.", "pontos": ["Capital social mínimo: as Sociedades por Quotas já não têm capital social mínimo obrigatório (Art. 221.º da LSC, na redacção da Lei de Simplificação do Processo de Constituição de Sociedades Comerciais) — o capital é de fixação livre pelos sócios. As Sociedades Anónimas mantêm um capital social mínimo equivalente, em Kwanzas, a USD 20.000 (Art. 305.º, n.º 3 da LSC).", "Tipos de entradas: nas SQ e nas SA só são permitidas entradas em dinheiro e em espécie (Art. 222.º, n.º 1 e Art. 306.º, n.º 3 da LSC) — a entrada em indústria (trabalho/serviços) não é admitida como entrada de capital, mas os sócios podem contribuir com a sua indústria através de prestações acessórias (Art. 230.º da LSC, nas SQ) ou prestações acessórias de trabalho/serviços (Art. 319.º, n.º 1, nas SA). Um suprimento de sócio à sociedade pode ser convertido em entrada em dinheiro no âmbito de um aumento de capital — nunca em entrada em espécie nem em indústria.", "As entradas em espécie devem ser obrigatoriamente apreciadas por um perito contabilista sem qualquer relação com a sociedade (Art. 30.º, n.º 2 da LSC) — nunca por um perito que já preste serviços regulares à sociedade, nem por advogado.", "O valor nominal da quota ou da acção do sócio nunca pode ser superior ao valor da sua entrada (Art. 27.º, n.º 1 da LSC) — pode ser inferior, mas nunca superior.", "As Sociedades Anónimas não podem constituir-se sem a realização de, pelo menos, 30% do capital social no acto de constituição (Art. 306.º, n.º 1 da LSC) — o remanescente pode ser diferido, respeitado o capital mínimo já realizado.", "Reserva legal: nas Sociedades por Quotas, a reserva legal nunca pode ser inferior a 30% do capital social (Art. 240.º, n.º 1 da LSC), preenchida alocando anualmente 5% dos lucros de exercício. Nas Sociedades Anónimas, a reserva legal corresponde a 20% do capital social (Art. 327.º da LSC), preenchida também com 5% dos lucros anuais — é um erro comum trocar as duas percentagens (30% SQ vs. 20% SA).", "A reserva legal só pode ser utilizada para cobertura de prejuízos transitados de exercícios anteriores (Art. 328.º, n.º 1, alínea b) da LSC) — nunca para distribuir aos sócios, expandir o negócio ou abrir outras empresas.", "As Sociedades Anónimas só podem adquirir acções próprias, a título oneroso, até 5% das acções do seu capital social (Art. 339.º, n.º 2 da LSC), e só podem manter acções próprias adquiridas de forma ilícita durante um período máximo de 3 anos (Art. 345.º, n.º 1 da LSC)."], "formulas": ["Reserva Legal mínima — Sociedade por Quotas = 30% do Capital Social (dotação anual mínima: 5% do lucro de exercício)", "Reserva Legal — Sociedade Anónima = 20% do Capital Social (dotação anual mínima: 5% do lucro de exercício)", "Capital mínimo a realizar na constituição de uma SA = 30% do Capital Social"], "erros": ["Não trocar as percentagens de reserva legal: 30% do capital social nas SQ vs. 20% do capital social nas SA — ambas dotadas anualmente com 5% dos lucros.", "As entradas em espécie são sempre apreciadas por perito contabilista SEM relação com a sociedade — nunca pelo perito que já faz auditoria regular à mesma."]}, {"n": 3, "titulo": "Órgãos Sociais, Deliberações e Distribuição de Lucros", "norma": "Lei n.º 1/04 (LSC) — órgãos sociais, maiorias deliberativas e regime de lucros", "objectivo": "Conhecer os órgãos sociais (assembleia geral, gerência/administração, fiscalização), as maiorias exigidas para as principais deliberações, e o regime de distribuição, adiantamento e retenção de lucros.", "pontos": ["O órgão de fiscalização é facultativo nas Sociedades por Quotas (só existe se o contrato de sociedade o instituir — Art. 292.º da LSC) e obrigatório nas Sociedades Anónimas, que devem ter Conselho Fiscal (3 a 5 membros efectivos + 2 suplentes, ou sociedade de peritos contabilistas) ou, quando o capital social não exceda USD 50.000, Fiscal Único.", "Não podem ser membros do Conselho Fiscal os administradores da sociedade nem os menores não emancipados, entre outras incompatibilidades previstas no Art. 434.º da LSC — o Conselho Fiscal deve reunir, segundo a lei, pelo menos trimestralmente.", "O período do mandato dos gerentes nas Sociedades por Quotas é definido no contrato de sociedade ou por deliberação social (Art. 289.º da LSC) — não existe um prazo fixo legal (não são 4, 6 ou 2 anos). A gerência/administração é pessoal e intransmissível.", "Nas Sociedades Anónimas, o Conselho de Administração tem gestão autónoma e representação da sociedade, só se subordinando às deliberações da Assembleia Geral nos casos em que a lei ou o contrato de sociedade o imponham (Art. 425.º, n.º 1, alínea b) da LSC) — não nos casos em que os sócios ou o Conselho Fiscal simplesmente o desejem.", "As maiorias deliberativas classificam-se em: maioria simples (maioria dos votos emitidos, independentemente do capital representado — regra geral em SQ e SA, ex.: aprovação de contas, eleição de administradores); maioria absoluta (50% do capital social + 1 voto — ex.: destituição de gerentes sem justa causa nas SQ); e maioria qualificada (tipicamente 75% dos votos correspondentes ao capital social — ex.: alterações ao contrato de sociedade, fusão, cisão, transformação, dissolução discricionária, e não distribuição de mais de metade dos lucros distribuíveis).", "A maioria exigível para alterar o contrato de uma Sociedade por Quotas é de 75% (Art. 295.º, n.º 1 da LSC). A não distribuição de mais de 50% do lucro de exercício distribuível também exige 75% dos votos correspondentes ao capital social (Art. 239.º, n.º 1 da LSC), tanto nas SQ como, por remissão, nas SA (Art. 326.º, n.º 1).", "O adiantamento de lucros de exercício depende de autorização no contrato de sociedade (Art. 329.º, n.º 1, alínea a) da LSC) — não da vontade discricionária dos administradores, dos accionistas ou do contabilista.", "Nas Sociedades Anónimas, os sócios não respondem pelas dívidas sociais — perante os credores da sociedade, só o património social responde (Art. 301.º da LSC), tal como nas Sociedades por Quotas (Art. 217.º, n.º 3), salvo estipulação em contrário no contrato de sociedade (Art. 218.º, n.º 1).", "Quem assina as actas de assembleia geral: nas SQ, assinam todos os sócios presentes na reunião; nas SA, assinam o Presidente da Mesa da Assembleia Geral e o respectivo Secretário."], "formulas": [], "erros": ["Não confundir a assinatura das actas: SQ = todos os sócios presentes; SA = Presidente da Mesa + Secretário, apenas.", "'Distribuir aos sócios' e 'expandir o negócio' são distractores clássicos para a pergunta sobre o adiantamento de lucros — a resposta correcta é sempre a autorização prevista no contrato de sociedade."]}, {"n": 4, "titulo": "Direito do Trabalho — Constituição da Relação Laboral", "norma": "Lei n.º 12/23, de 27 de Dezembro — Nova Lei Geral do Trabalho (LGT), em vigor desde 26/03/2024 (revogou a Lei n.º 7/15)", "objectivo": "Compreender os elementos do contrato de trabalho, as suas modalidades, a forma exigida e o regime do período experimental à luz da Lei Geral do Trabalho actualmente em vigor.", "pontos": ["ATENÇÃO: a Lei Geral do Trabalho em vigor é actualmente a Lei n.º 12/23, de 27 de Dezembro (entrada em vigor a 26/03/2024), que revogou a antiga Lei n.º 7/15. Muitos exames-tipo mais antigos citam a Lei 7/15 — os valores fundamentais mantiveram-se estáveis (44h semanais/8h diárias, 22 dias de férias, gratificações de 50% do salário-base), mas a numeração dos artigos mudou e alguns institutos foram desenvolvidos com mais detalhe (nomeadamente o período experimental).", "O contrato de trabalho é o acordo pelo qual uma pessoa singular se obriga a colocar a sua capacidade manual ou intelectual à disposição de outrem, sob a direcção e autoridade deste, mediante remuneração (Art. 3.º, alínea c) da LGT). Os elementos caracterizadores são: prestação de uma actividade, subordinação jurídica (dever de obediência do trabalhador e poder de direcção do empregador) e remuneração.", "Os sujeitos da relação jurídico-laboral são sempre o Empregador e o Trabalhador — nunca o administrador executivo isoladamente, nem o INSS, nem um prestador de serviços sem vínculo de subordinação (consultores como advogados e contabilistas ficam excluídos da LGT por não terem vínculo de subordinação).", "Modalidades do contrato: por Tempo Indeterminado (Art. 14.º, n.º 1) e por Tempo Determinado (Arts. 14.º a 16.º) — os contratos por tempo indeterminado valem enquanto se mantiver a relação entre o empregador e o trabalhador.", "A forma do contrato de trabalho por tempo indeterminado é livre (Art. 12.º, n.º 1), embora o trabalhador tenha o direito de exigir a sua redução a escrito (Art. 12.º, n.º 5); o contrato por tempo determinado deve conter as menções do Art. 13.º, incluindo os motivos da contratação e o prazo — a violação destes requisitos converte-o automaticamente em contrato por tempo indeterminado.", "Período experimental (Art. 18.º da LGT): nos contratos por tempo indeterminado corresponde, em regra, aos primeiros 60 dias de trabalho, podendo ser aumentado por acordo escrito até 120 dias (funções comuns) ou até 180 dias (funções de direcção e chefia); nos contratos por tempo determinado corresponde aos primeiros 30 dias, podendo ser reduzido ou suprimido, mas nunca aumentado.", "O qualificador ocupacional é obrigatório para cada um dos postos de trabalho existentes na estrutura da empresa, independentemente do número de trabalhadores da empresa — é um dos elementos que o empregador deve apresentar às entidades laborais, juntamente com o quadro de pessoal e outros mapas obrigatórios."], "formulas": [], "erros": ["Não aplicar automaticamente valores da Lei 7/15 (revogada) sem confirmar se coincidem com a Lei 12/23 actualmente em vigor — os fundamentos coincidem na maioria dos casos, mas o período experimental é hoje regulado com mais detalhe (60/120/180 dias nos contratos indeterminados; 30 dias nos determinados).", "O qualificador ocupacional é obrigatório para TODAS as empresas, independentemente da sua dimensão — não apenas para grandes empresas ou empresas com 100+ trabalhadores."]}, {"n": 5, "titulo": "Direito do Trabalho — Remuneração, Descontos e Segurança Social", "norma": "Lei n.º 12/23 (LGT) — regime da remuneração; Lei n.º 7/04, de 15 de Outubro — Lei de Bases da Protecção Social; Decreto Presidencial 227/18", "objectivo": "Dominar o conceito e modalidades de remuneração, os descontos obrigatórios e facultativos sobre o salário, e as regras de inscrição e contribuição para a Segurança Social.", "pontos": ["A remuneração compreende o salário-base e todas as demais prestações e complementos pagos directa ou indirectamente, em dinheiro ou em espécie (Art. 235.º, n.os 1 e 2 da LGT) — é o elemento que torna o contrato de trabalho um negócio jurídico oneroso. O salário pode ser certo/ao tempo, variável/ao rendimento, ou misto (Art. 236.º).", "O salário mínimo nacional está actualmente fixado em AOA 70.000,00 (Decreto Presidencial n.º 152/24, de 17 de Julho). O pagamento em espécie só é permitido por acordo das partes e não pode exceder 50% do valor total do salário (Art. 242.º e 244.º).", "Gratificações anuais obrigatórias: todos os trabalhadores têm direito, por cada ano de serviço efectivo, a um mínimo de 50% do salário-base a título de gratificação de férias e a um mínimo de 50% do salário-base a título de subsídio de Natal (Art. 238.º, n.º 1, alíneas a) e b) da LGT) — nunca 35% do salário líquido nem 100% da remuneração. O trabalhador com menos de um ano de serviço efectivo recebe estas gratificações proporcionalmente aos meses completos trabalhados.", "Descontos obrigatórios sobre a remuneração (Art. 248.º, n.º 2): descontos a favor do Estado (IRT), da Segurança Social, de outras entidades determinadas por lei, por decisão judicial transitada em julgado, e por acordo homologado judicialmente — cumulativamente. O pagamento de despesas escolares de filhos menores NÃO é um desconto obrigatório.", "A responsabilidade pelo pagamento do Imposto sobre os Rendimentos do Trabalho (IRT) compete à entidade patronal. Não constituem matéria colectável em sede de IRT, entre outras, as contribuições para o sistema de Segurança Social — mas as gratificações de férias e o subsídio de Natal SÃO matéria colectável em IRT, independentemente do seu valor.", "Descontos facultativos, solicitados pelo trabalhador, incluem a quotização sindical, valores de bens/serviços fornecidos a crédito, amortizações de empréstimos concedidos pelo empregador, e adiantamentos (até 3 salários-base) — o conjunto destes descontos facultativos não pode exceder 25% do salário líquido. É absolutamente proibido ao empregador compensar créditos próprios no salário do trabalhador fora dos casos legalmente previstos (decisão judicial transitada em julgado ou acordo homologado judicialmente).", "A taxa de contribuição para a Protecção Social Obrigatória está fixada em 3% para o trabalhador e 8% para a entidade empregadora (Lei n.º 7/04, de Bases da Protecção Social). A inscrição dos trabalhadores e seus dependentes na Segurança Social deve ser feita pelo empregador no prazo de 30 dias contado da data de início do vínculo jurídico-laboral (Art. 7.º, n.º 2 do Decreto Presidencial 227/18)."], "formulas": ["Gratificação de férias (mínimo anual) = 50% do salário-base", "Subsídio de Natal (mínimo anual) = 50% do salário-base", "Contribuição Segurança Social = 3% (trabalhador) + 8% (empregador), sobre a remuneração", "Limite dos descontos facultativos (conjunto) ≤ 25% do salário líquido"], "erros": ["Não trocar o prazo de inscrição na Segurança Social: são sempre 30 dias contados do INÍCIO do vínculo laboral — nunca da cessação, nem 6 meses, nem 1 ano.", "As gratificações de férias e de Natal SÃO matéria colectável em IRT — um erro comum é assumir que estão isentas tal como as contribuições para a Segurança Social."]}, {"n": 6, "titulo": "Direito do Trabalho — Horário, Faltas, Cessação do Contrato e Resolução de Conflitos", "norma": "Lei n.º 12/23 (LGT) — organização do tempo de trabalho, faltas, cessação do contrato e Código do Processo do Trabalho", "objectivo": "Conhecer as regras de duração e organização do tempo de trabalho, o regime das faltas, as formas de cessação do contrato de trabalho e as modalidades de resolução de conflitos laborais.", "pontos": ["O período normal de trabalho não pode exceder 44 horas semanais e 8 horas diárias (Art. 148.º, n.º 1 da LGT) — valor que se manteve inalterado desde a lei anterior. Compete ao empregador estabelecer o horário de trabalho.", "O trabalho extraordinário (prestado fora do horário normal) só pode ocorrer em situações taxativas (acidentes/calamidades, reparação urgente de equipamentos, volume anormal e temporário de trabalho, substituição de trabalhadores, entre outras) e está sujeito aos limites de 2 horas por dia normal de trabalho, 40 horas por mês e 200 horas por ano (Art. 185.º) — é remunerado com um adicional de 50% até 30 horas/mês e de 75% acima desse limite.", "As faltas classificam-se em justificadas (situações do Art. 222.º, mediante solicitação com antecedência mínima de 1 semana, salvo imprevistos) e não justificadas (ausência não autorizada). As faltas injustificadas implicam perda de remuneração e podem constituir infracção disciplinar quando excedam 3 dias no mês ou 12 dias no ano — mas não dão lugar a desconto nas férias do trabalhador.", "O trabalhador tem direito a 22 dias úteis de férias em cada ano, sendo estas sempre remuneradas — independentemente do cargo exercido (incluindo cargos de direcção e chefia).", "Os conflitos laborais podem ser individuais (entre um Trabalhador e o Empregador) ou colectivos (no âmbito de convenção/acordo colectivo de trabalho). As modalidades de resolução extrajudicial são a mediação (a cargo da Inspecção Geral do Trabalho), a conciliação (a cargo do Ministério Público) e a arbitragem (1 ou 3 árbitros, com decisão equivalente a sentença judicial); existe ainda a via judicial, com competência dos tribunais comuns.", "Prazos de caducidade do direito de acção: 120 dias para impugnar um despedimento; 45 dias para reagir a medidas disciplinares que não sejam despedimento; 2 anos para direitos pecuniários (nunca além de 1 ano após a cessação do contrato); 1 ano para direitos não pecuniários. Todos os créditos e obrigações emergentes do contrato de trabalho prescrevem no prazo de 1 ano a contar do dia seguinte à cessação do contrato (Art. 312.º da LGT).", "A cessação do contrato de trabalho pode ocorrer por decisão unilateral da entidade empregadora (com ou sem justa causa), por causas objectivas alheias à vontade das partes, por mútuo acordo, ou por decisão unilateral de qualquer das partes oponível à outra — nunca por acordo meramente verbal nem por procedimento disciplinar instaurado por um simples consultor da entidade empregadora (que não tem essa competência)."], "formulas": ["Limites do trabalho extraordinário: 2 horas/dia; 40 horas/mês; 200 horas/ano", "Remuneração do trabalho extraordinário: +50% até 30h/mês; +75% acima de 30h/mês"], "erros": ["As faltas injustificadas geram perda de remuneração e, acima de certos limiares, infracção disciplinar — mas nunca desconto automático nas férias do trabalhador.", "Não confundir os prazos de caducidade (120 dias para despedimento; 45 dias para outras medidas disciplinares; 1-2 anos para direitos pecuniários/não pecuniários) com o prazo geral de prescrição de créditos laborais, que é sempre de 1 ano a contar da cessação do contrato."]}], "intro_temas": "O módulo de Direito das Sociedades e do Trabalho combina duas áreas com um padrão de exame muito estável: perguntas directas de completar/identificar sobre artigos concretos da Lei das Sociedades Comerciais (capital social, reservas, maiorias, órgãos) e da Lei Geral do Trabalho (contratos, remuneração, descontos, férias). Os exames-tipo analisados (2019-2020) e a correcção oficial de Agosto de 2020 mostram que os mesmos temas se repetem exame após exame, por vezes com as mesmas perguntas reformuladas — pelo que memorizar os números exactos (percentagens, prazos, maiorias) é o que mais rende neste módulo. É essencial ter presente que a Lei Geral do Trabalho mudou entretanto (Lei 12/23 substituiu a Lei 7/15 em 2024): os valores fundamentais mantiveram-se, mas convém confirmar sempre a lei em vigor.", "temas": [{"tema": "Capital social mínimo (SQ sem mínimo; SA = USD 20.000) e percentagem mínima realizada na constituição da SA (30%)", "freq": "Muito alta", "pedido": "Pergunta recorrente em quase todos os exames-tipo analisados, por vezes com distractores de USD 30.000/40.000."}, {"tema": "Reserva legal: 30% do capital nas SQ vs. 20% nas SA, dotação anual de 5% dos lucros", "freq": "Muito alta", "pedido": "Testar se o candidato troca as duas percentagens consoante o tipo societário."}, {"tema": "Utilização da reserva legal (só para cobertura de prejuízos)", "freq": "Alta", "pedido": "Distractores clássicos: distribuir lucros, expandir negócio, abrir outras empresas."}, {"tema": "Maiorias deliberativas: simples, absoluta e qualificada (75%)", "freq": "Muito alta", "pedido": "Identificar que maioria se aplica a cada tipo de deliberação (alteração do contrato, não distribuição de lucros, destituição de gerentes)."}, {"tema": "Órgão de fiscalização: facultativo nas SQ, obrigatório nas SA", "freq": "Alta", "pedido": "Confirmar sempre o tipo societário perguntado antes de responder."}, {"tema": "Responsabilidade dos sócios pelas dívidas sociais (SQ e SA — só o património social responde)", "freq": "Alta", "pedido": "Distinguir da responsabilidade pessoal dos sócios/gerentes noutras figuras (sociedades em nome colectivo, SU)."}, {"tema": "Entradas em espécie e avaliação por perito contabilista independente", "freq": "Média-Alta", "pedido": "O perito não pode ter qualquer relação com a sociedade avaliada."}, {"tema": "Período do mandato dos gerentes (contrato/deliberação) e adiantamento de lucros (autorização no contrato)", "freq": "Alta", "pedido": "Ambos dependem do que ficar estipulado no contrato de sociedade, não de decisões discricionárias dos órgãos sociais."}, {"tema": "Sujeitos da relação laboral e elementos do contrato de trabalho", "freq": "Alta", "pedido": "Empregador e trabalhador; subordinação jurídica como elemento essencial."}, {"tema": "Período normal de trabalho (44h/semana, 8h/dia) e período experimental", "freq": "Muito alta", "pedido": "Atenção à actualização do período experimental na Lei 12/23 (60/120/180 dias indeterminados; 30 dias determinados)."}, {"tema": "Férias (22 dias úteis, remuneradas) e gratificações anuais (50% do salário-base cada)", "freq": "Muito alta", "pedido": "Nunca confundir a percentagem com o salário líquido nem com a remuneração total."}, {"tema": "Descontos obrigatórios e facultativos sobre a remuneração e matéria colectável do IRT", "freq": "Alta", "pedido": "Gratificações de férias/Natal são matéria colectável; contribuições para a Segurança Social não são."}, {"tema": "Inscrição na Segurança Social (30 dias) e taxas de contribuição (3% trabalhador / 8% empregador)", "freq": "Alta", "pedido": "Prazo contado sempre do início do vínculo laboral."}, {"tema": "Cessação do contrato de trabalho e prazos de caducidade/prescrição", "freq": "Média-Alta", "pedido": "120 dias para despedimento, 45 dias para outras medidas disciplinares, 1 ano de prescrição geral pós-cessação."}], "perguntas": [{"n": 1, "enunciado": "Segundo a Lei das Sociedades Comerciais, qual é actualmente o capital social mínimo exigido para a constituição de uma Sociedade Anónima em Angola?", "opcoes": {"A": "Não há exigência de capital mínimo", "B": "O equivalente em Kwanzas a USD 20.000", "C": "O equivalente em Kwanzas a USD 30.000", "D": "Kz 5.000.000,00, independentemente da taxa de câmbio"}, "correcta": "B", "explicacao": "A resposta B (equivalente em Kwanzas a USD 20.000) corresponde ao Art.º 305.º, n.º 3 da Lei n.º 1/04 (LSC) e é a chave usada nos exames de 2019-2020. ATENÇÃO: o enunciado pergunta pelo capital mínimo «actualmente» e este é um valor indexado ao dólar que já foi objecto de sucessivas alterações legislativas (Lei de Simplificação do Processo de Constituição de Sociedades Comerciais e diplomas posteriores). Nenhuma das fontes disponíveis contém o texto da LSC, pelo que o valor não pôde ser confirmado na lei; confirmar a redacção em vigor do Art.º 305.º antes de dar a pergunta por assente, ou retirar a palavra «actualmente» do enunciado e datar a pergunta («à data do exame»). Nota: esta pergunta está praticamente duplicada em M6.500.", "fonte": "Teste prático do resumo do Módulo 6 · resposta a confirmar"}, {"n": 2, "enunciado": "Nas Sociedades por Quotas e nas Sociedades Anónimas, a reserva legal deve corresponder, respectivamente, a uma percentagem mínima do capital social de:", "opcoes": {"A": "20% (SQ) e 30% (SA)", "B": "30% (SQ) e 20% (SA)", "C": "25% (SQ) e 25% (SA)", "D": "15% (SQ) e 10% (SA)"}, "correcta": "B", "explicacao": "A resposta B (30% do capital social nas Sociedades por Quotas e 20% nas Sociedades Anónimas) reproduz o resumo do Módulo 6, mas não foi possível confirmá-la em texto legal: nenhuma das fontes contém a LSC. A regra comum nos ordenamentos lusófonos é uma reserva legal de 1/5 (20%) do capital social para AMBOS os tipos societários, dotada anualmente com 5% dos lucros, pelo que os 30% atribuídos às SQ merecem verificação directa nos Art.º 240.º e 327.º da Lei n.º 1/04. Como toda a app ensina o par 30%/20% (M6.2 e o resumo do módulo), um erro aqui propaga-se: confirmar antes de manter.", "fonte": "Teste prático do resumo do Módulo 6 · resposta a confirmar"}, {"n": 3, "enunciado": "Os valores acumulados na reserva legal de uma sociedade comercial só podem ser utilizados para:", "opcoes": {"A": "Distribuir aos sócios em exercícios com lucro", "B": "Expandir o negócio da sociedade", "C": "Cobertura de prejuízos transitados de exercícios anteriores", "D": "Pagar a remuneração dos administradores"}, "correcta": "C", "explicacao": "A reserva legal destina-se exclusivamente à cobertura de prejuízos transitados de exercícios anteriores (Art. 328.º, n.º 1, alínea b) da LSC).", "fonte": "Teste prático do resumo do Módulo 6"}, {"n": 4, "enunciado": "O órgão de fiscalização (Conselho Fiscal ou Fiscal Único) é, segundo a Lei das Sociedades Comerciais:", "opcoes": {"A": "Facultativo nas Sociedades por Quotas e obrigatório nas Sociedades Anónimas", "B": "Obrigatório em todos os tipos de sociedades comerciais", "C": "Facultativo em todos os tipos de sociedades comerciais", "D": "Obrigatório apenas nas Sociedades por Quotas com mais de 10 sócios"}, "correcta": "A", "explicacao": "Nas Sociedades por Quotas, o órgão de fiscalização só existe se o contrato de sociedade o instituir (Art. 292.º da LSC); nas Sociedades Anónimas, é sempre obrigatório.", "fonte": "Teste prático do resumo do Módulo 6"}, {"n": 5, "enunciado": "A maioria exigível para alterar o contrato de uma Sociedade por Quotas é de:", "opcoes": {"A": "50% dos votos correspondentes ao capital social", "B": "60%", "C": "75% dos votos correspondentes ao capital social", "D": "100%"}, "correcta": "C", "explicacao": "A alteração do contrato de sociedade por quotas exige uma maioria qualificada de 75% dos votos correspondentes ao capital social (Art. 295.º, n.º 1 da LSC).", "fonte": "Teste prático do resumo do Módulo 6"}, {"n": 6, "enunciado": "Nas Sociedades Anónimas, os sócios (accionistas), perante os credores da sociedade:", "opcoes": {"A": "Respondem pelas dívidas sociais até ao montante definido no contrato de sociedade", "B": "Respondem pelas dívidas sociais até 10% da sua participação social", "C": "Não respondem pelas dívidas sociais", "D": "Respondem solidária e ilimitadamente pelas dívidas sociais"}, "correcta": "C", "explicacao": "Perante os credores da sociedade, só o património social responde (Art. 301.º da LSC) — os accionistas não respondem pessoalmente pelas dívidas sociais.", "fonte": "Teste prático do resumo do Módulo 6"}, {"n": 7, "enunciado": "As entradas em espécie realizadas por um sócio numa sociedade comercial devem ser obrigatoriamente apreciadas por:", "opcoes": {"A": "Um perito contabilista que faça auditoria regular à sociedade", "B": "Um perito contabilista sem qualquer relação com a sociedade", "C": "Um advogado da sociedade", "D": "Qualquer administrador da sociedade com formação contabilística"}, "correcta": "B", "explicacao": "As entradas em espécie devem ser apreciadas por um perito contabilista sem qualquer relação com a sociedade que as recebe (Art. 30.º, n.º 2 da LSC).", "fonte": "Teste prático do resumo do Módulo 6"}, {"n": 8, "enunciado": "O período do mandato dos gerentes nas Sociedades por Quotas é:", "opcoes": {"A": "Sempre de 4 anos civis", "B": "Sempre de 2 anos", "C": "Definido no contrato de sociedade ou por deliberação social", "D": "Sempre de 6 anos, renovável uma vez"}, "correcta": "C", "explicacao": "Não existe um prazo legal fixo — o período do mandato dos gerentes é definido no contrato de sociedade ou por deliberação social (Art. 289.º da LSC).", "fonte": "Teste prático do resumo do Módulo 6"}, {"n": 9, "enunciado": "Os sujeitos da relação jurídico-laboral, segundo a Lei Geral do Trabalho, são:", "opcoes": {"A": "O administrador executivo e o trabalhador", "B": "O trabalhador e o INSS", "C": "O empregador e o trabalhador", "D": "O empregador e o prestador de serviços independente"}, "correcta": "C", "explicacao": "Os sujeitos da relação jurídico-laboral são sempre o Empregador e o Trabalhador — um prestador de serviços sem vínculo de subordinação (ex.: consultor) fica fora do âmbito da LGT.", "fonte": "Teste prático do resumo do Módulo 6"}, {"n": 10, "enunciado": "O período normal de trabalho, segundo a Lei Geral do Trabalho, não pode exceder:", "opcoes": {"A": "40 horas semanais, sem limite diário", "B": "44 horas semanais e 8 horas diárias", "C": "12 horas diárias e 44 horas semanais", "D": "200 horas por mês"}, "correcta": "B", "explicacao": "O período normal de trabalho não pode exceder 44 horas semanais e 8 horas diárias — valor que se mantém estável entre a antiga e a actual Lei Geral do Trabalho.", "fonte": "Teste prático do resumo do Módulo 6"}, {"n": 11, "enunciado": "As gratificações anuais de férias e de Natal devidas aos trabalhadores correspondem, cada uma, a um mínimo de:", "opcoes": {"A": "35% do salário líquido", "B": "100% da remuneração mensal", "C": "50% do salário-base", "D": "Um salário mínimo nacional, independentemente do salário-base"}, "correcta": "C", "explicacao": "Cada uma destas gratificações corresponde a um mínimo de 50% do salário-base, por cada ano de serviço efectivo — proporcionalmente, se o trabalhador ainda não completou um ano de serviço.", "fonte": "Teste prático do resumo do Módulo 6"}, {"n": 12, "enunciado": "A inscrição dos trabalhadores e seus dependentes na Segurança Social deve ser feita pelo empregador:", "opcoes": {"A": "No prazo de 6 meses contado da data de início do vínculo jurídico-laboral", "B": "No prazo de 1 ano contado da cessação do vínculo jurídico-laboral", "C": "No prazo de 30 dias contado da data de início do vínculo jurídico-laboral", "D": "Apenas no final do primeiro ano civil completo de trabalho"}, "correcta": "C", "explicacao": "A inscrição deve ser feita pelo empregador no prazo de 30 dias contado da data de início do vínculo jurídico-laboral (Art. 7.º, n.º 2 do Decreto Presidencial 227/18).", "fonte": "Teste prático do resumo do Módulo 6"}, {"n": 500, "enunciado": "QUAL É Actualmente O Capital Social Mínimo DE UMA Sociedade Anónima?", "opcoes": {"A": "2.000.000 Kwanzas", "B": "O equivalente em Kwanzas a USD 20.000", "C": "O equivalente em Kwanzas a USD 30.000", "D": "O equivalente em Kwanzas a USD 40.000"}, "correcta": "B", "explicacao": "Mesma dúvida da M6.1: a resposta B (equivalente em Kwanzas a USD 20.000, Art.º 305.º, n.º 3 da LSC) é a chave dos exames de 2019-2020, mas o enunciado usa «actualmente» e o valor não pôde ser confirmado em texto legal — o capital social mínimo é a matéria da LSC mais vezes alterada. Além disso esta pergunta é uma duplicação quase literal de M6.1 (só muda o distractor A): conservar apenas uma das duas, ou diferenciá-las.", "fonte": "Exame: Exame tipo Mod 6 DrST_Janeiro 2020.pdf · resposta a confirmar"}, {"n": 501, "enunciado": "NAS Sociedades POR Quotas, A ACTA DA Assembleia Geral Ordinária QUE Aprova AS Contas DE Exercício, DEVE SER Assinada Por:", "opcoes": {"A": "Todos os sócios", "B": "Presidente da Mesa e o Secretário", "C": "Todos os sócios, o Presidente da Mesa e o Secretário", "D": "Todas as pessoas que tenham estado presentes na reunião"}, "correcta": "A", "explicacao": "Art.º 64.º da LSC: nas sociedades por quotas a acta da assembleia geral é assinada por todos os sócios que nela participaram (ao contrário das SA, em que assinam apenas o Presidente da Mesa e o Secretário); a opção D é errada por alargar a assinatura a todos os presentes, incluindo não sócios.", "fonte": "Exame: Exame tipo Mod 6 DrST_Janeiro 2020.pdf"}, {"n": 502, "enunciado": "A Remuneração DOS Administradores COM Funções Executivas", "opcoes": {"A": "É sempre fixa", "B": "Tem uma componente fixa, à qual pode acrescer uma componente variável", "C": "Tem sempre uma componente fixa e uma componente variável", "D": "Tem sempre uma componente fixa, uma componente variável e subsídios de alojamento, transporte e comunicações"}, "correcta": "B", "explicacao": "A remuneração dos administradores é fixada pela assembleia geral ou por comissão de vencimentos e pode consistir, em parte, numa participação nos lucros (Art.º 419.º da LSC), pelo que tem sempre uma componente fixa à qual pode — mas não tem de — acrescer uma componente variável.", "fonte": "Exame: Exame tipo Mod 6 DrST_Janeiro 2020.pdf · resposta a confirmar"}, {"n": 503, "enunciado": "NO Âmbito DE UM Processo DE Fusão DE Empresas, É Necessário:", "opcoes": {"A": "Um parecer do conselho fiscal de cada uma das empresas intervenientes", "B": "Um parecer do conselho fiscal de cada uma das empresas intervenientes e um parecer de um perito contabilista independente", "C": "Um parecer de um perito contabilista independente indicado em conjunto por todas as empresas intervenientes na fusão", "D": "Que as empresas intervenientes tenham as contas auditadas, não sendo necessário nenhum outro parecer"}, "correcta": "B", "explicacao": "A resposta B pressupõe que a lei exige CUMULATIVAMENTE o parecer do órgão de fiscalização de cada sociedade participante E o exame por perito contabilista independente. Nos ordenamentos que a LSC segue de perto, a norma correspondente à fiscalização do projecto de fusão admite a designação de UM ÚNICO perito independente por acordo de todas as sociedades participantes (o que é exactamente a opção C) e, nas sociedades sem órgão de fiscalização, dispensa o parecer deste. Sem o texto do Art.º 100.º da LSC não é possível decidir entre B e C — confirmar a redacção antes de manter a resposta.", "fonte": "Exame: Exame tipo Mod 6 DrST_Janeiro 2020.pdf · resposta a confirmar"}, {"n": 504, "enunciado": "EM CASO DE Aumento DO Capital Social POR Incorporação DE Reservas, É Necessário:", "opcoes": {"A": "Aprovar sempre, no mês anterior, um balanço especial para o efeito", "B": "Que o conselho fiscal emita um parecer favorável, indicando que aquele aumento de capital é oportuno", "C": "Que as contas de exercício tenham sido aprovadas há menos de 6 meses, sob pena de ter de se preparar um balanço especial para o efeito", "D": "Que o conselho fiscal confirme que as contas de exercício foram aprovadas há menos de 6 meses"}, "correcta": "C", "explicacao": "No aumento de capital por incorporação de reservas só podem ser incorporados valores constantes do último balanço aprovado, desde que aprovado há menos de 6 meses; caso contrário é obrigatório elaborar um balanço especial reportado a data recente (Art.º 96.º da LSC).", "fonte": "Exame: Exame tipo Mod 6 DrST_Janeiro 2020.pdf"}, {"n": 505, "enunciado": "OS Valores QUE SE Encontram NA Reserva Legal Podem SER Utilizados Para:", "opcoes": {"A": "Distribuir aos sócios, no final de um exercício em que tenha havido lucro", "B": "Serem transferidos para reservas livres/de investimento", "C": "Expandir o negócio da sociedade, a título de investimento dos sócios", "D": "Cobrir os prejuízos transitados de exercícios anteriores"}, "correcta": "D", "explicacao": "Art.º 328.º, n.º 1, alínea b) da LSC: a reserva legal só pode ser utilizada para cobertura de prejuízos transitados de exercícios anteriores (e para incorporação no capital), nunca para distribuição aos sócios, transferência para reservas livres ou investimento.", "fonte": "Exame: Exame tipo Mod 6 DrST_Janeiro 2020.pdf"}, {"n": 506, "enunciado": "Segundo A Lei, O Conselho Fiscal DEVE Reunir PELO Menos:", "opcoes": {"A": "Todos os meses", "B": "Trimestralmente", "C": "Quadrienalmente", "D": "Uma vez por ano"}, "correcta": "B", "explicacao": "O conselho fiscal deve reunir, por imposição legal, pelo menos trimestralmente (Art.º 439.º da LSC), sem prejuízo de reuniões extraordinárias sempre que convocado pelo presidente.", "fonte": "Exame: Exame tipo Mod 6 DrST_Janeiro 2020.pdf"}, {"n": 507, "enunciado": "OS Membros DO Conselho Fiscal Podem SER Destituídos:", "opcoes": {"A": "Sempre que não emitam o parecer de aprovação das contas do exercício atempadamente", "B": "Apenas quando existir justa causa para a destituição", "C": "Sempre que algum dos sócios esteja insatisfeito com o seu trabalho", "D": "Quando se verificarem divergências entre o conselho fiscal e a auditoria externa"}, "correcta": "B", "explicacao": "Ao contrário dos administradores, os membros do conselho fiscal só podem ser destituídos pela assembleia geral quando exista justa causa (Art.º 437.º da LSC), garantia essencial da independência do órgão de fiscalização.", "fonte": "Exame: QUESTÕES DE DIREITO SOCIETÁRIO OCPCA 02.01.2020-1.pd"}, {"n": 508, "enunciado": "NAS Instituições Financeiras, OS Auditores Externos Devem SER Contratados:", "opcoes": {"A": "Pela assembleia geral", "B": "Para um período de 4 anos, findo o qual deverão aguardar 4 anos até poderem voltar a ser contratados", "C": "Para um período de 4 anos, renovável por mais 4 anos", "D": "De entre pessoas singulares ou empresas constantes de uma lista validada pelo Banco Nacional de Angola"}, "correcta": "D", "explicacao": "A resposta D (auditores externos escolhidos de lista validada pelo BNA) é plausível, mas concorre com a opção B: o regime das instituições financeiras angolanas prevê rotação obrigatória do auditor externo, tipicamente por períodos de 4 anos com intervalo até nova contratação — que é precisamente o que a opção B descreve. As duas afirmações podem até ser simultaneamente verdadeiras, o que torna a pergunta ambígua. Confirmar na Lei das Instituições Financeiras (Lei n.º 12/15, hoje substituída pelo Regime Geral das Instituições Financeiras, Lei n.º 14/21) e nos Avisos do BNA sobre auditoria externa; se ambas forem verdadeiras, reformular a pergunta.", "fonte": "Exame: QUESTÕES DE DIREITO SOCIETÁRIO OCPCA 02.01.2020-1.pd · resposta a confirmar"}, {"n": 509, "enunciado": "A Sociedade QUE Adquirir 10% DO SEU Capital EM Acções Próprias:", "opcoes": {"A": "Só as pode manter em carteira até ao período máximo de 1 ano", "B": "Só as pode manter em carteira até um período máximo de 3 anos e deve constituir uma reserva de indisponibilidade correspondente ao valor contabilístico dessas acções", "C": "Continua a ter direito a receber os lucros correspondentes a essas acções", "D": "Deve vender essas acções no prazo de 2 anos, sob pena de elas serem extintas"}, "correcta": "B", "explicacao": "A aquisição onerosa de acções próprias está limitada a 5% do capital (Art.º 339.º, n.º 2 da LSC), pelo que uma participação de 10% é excedentária e só pode ser mantida em carteira por um máximo de 3 anos (Art.º 345.º, n.º 1), devendo constituir-se reserva indisponível de montante igual ao valor contabilístico dessas acções; os direitos inerentes, incluindo o dividendo, ficam suspensos.", "fonte": "Exame: QUESTÕES DE DIREITO SOCIETÁRIO OCPCA 02.01.2020-1.pd"}, {"n": 510, "enunciado": "NAS Instituições Financeiras É Necessário Levar Anualmente A Reserva Legal:", "opcoes": {"A": "5% do lucro de exercício, até que a reserva seja equivalente a 20% do capital social", "B": "10% do lucro de exercício, até que a reserva seja equivalente ao valor do capital social", "C": "10% do lucro de exercício, até que a reserva seja equivalente a 20% do capital social", "D": "5% do lucro de exercício, até que a reserva seja equivalente ao valor do capital social"}, "correcta": "B", "explicacao": "Regime especial das instituições financeiras (Art.º 87.º da Lei das Instituições Financeiras): a dotação anual do fundo de reserva legal não pode ser inferior a 10% dos lucros líquidos do exercício, até que a reserva iguale o valor do capital social — regra mais exigente do que a das sociedades comerciais em geral (5%).", "fonte": "Exame: QUESTÕES DE DIREITO SOCIETÁRIO OCPCA 02.01.2020-1.pd"}, {"n": 511, "enunciado": "QUAL É Actualmente O Capital Social Mínimo DE UMA Sociedade POR Quotas?", "opcoes": {"A": "2 Kwanzas", "B": "100.000 Kwanzas", "C": "O equivalente em Kwanzas a USD 1.000", "D": "O equivalente em Kwanzas a USD 20.000"}, "correcta": "A", "explicacao": "A resposta A (2 Kwanzas) assenta na leitura de que, depois da Lei de Simplificação do Processo de Constituição de Sociedades Comerciais, o Art.º 221.º da LSC deixou de fixar capital mínimo às sociedades por quotas, ficando apenas o valor nominal mínimo de 1 Kwanza por quota (2 sócios = 2 Kz). É a chave habitual do exame, mas depende de uma norma que não foi possível confirmar em nenhuma das fontes e que é matéria repetidamente alterada. Além disso, uma sociedade unipessoal por quotas teria mínimo de 1 Kz, o que fragiliza o enunciado. Confirmar o Art.º 221.º na redacção em vigor antes de manter.", "fonte": "Exame: QUESTÕES DE DIREITO SOCIETÁRIO OCPCA 24.05.2019.pdf · resposta a confirmar"}, {"n": 512, "enunciado": "O Capital Social QUE OS Sócios Indicaram NOS Estatutos DA Sociedade DEVE SER Integralmente Realizado Até:", "opcoes": {"A": "AO Final DO Exercício EM QUE A Sociedade FOI Constituída", "B": "NO Prazo DE UM ANO A Contar DA DATA DE Constituição DA Sociedade", "C": "NO Prazo DE 2 ANOS A Contar DA DATA DE Constituição DA Sociedade", "D": "NO Prazo QUE OS Sócios Acordarem NOS Estatutos DA Sociedade"}, "correcta": "A", "explicacao": "A resposta A (realização integral até ao final do exercício em que a sociedade foi constituída) corresponde à regra do diferimento das entradas em dinheiro introduzida pela Lei de Simplificação do Processo de Constituição de Sociedades Comerciais e afasta a opção D, porque o prazo é legal e não disponível pelos sócios. Não foi porém possível confirmar o Art.º 26.º da LSC em nenhuma das fontes, e o regime das entradas diferidas nas sociedades por quotas admite noutros ordenamentos prazos plurianuais fixados no contrato (opção D). Confirmar antes de dar por assente.", "fonte": "Exame: QUESTÕES DE DIREITO SOCIETÁRIO OCPCA 24.05.2019.pdf · resposta a confirmar"}, {"n": 513, "enunciado": "NAS Sociedades Anónimas, A ACTA DA Assembleia Geral Ordinária QUE Aprova AS Contas DE Exercício, DEVE SER Assinada Por:", "opcoes": {"A": "O Presidente da Mesa e o Secretário", "B": "Todos os sócios", "C": "Todos os sócios, o Presidente da Mesa e o Secretário", "D": "Todas as pessoas que tenham estado presentes na reunião"}, "correcta": "A", "explicacao": "Art.º 64.º da LSC: nas sociedades anónimas a acta da assembleia geral é assinada apenas pelo Presidente da Mesa da Assembleia Geral e pelo respectivo Secretário — a assinatura por todos os sócios é a regra das sociedades por quotas.", "fonte": "Exame: QUESTÕES DE DIREITO SOCIETÁRIO OCPCA 24.05.2019.pdf"}, {"n": 514, "enunciado": "EM CASO DE Aumento DE Capital, UM Suprimento DE UM Sócio À Sociedade PODE SER Convertido EM", "opcoes": {"A": "Entrada em espécie", "B": "Entrada em dinheiro", "C": "Entrada em indústria", "D": "Não pode ser utilizado para aumento de capital, porque não pode ser convertido"}, "correcta": "B", "explicacao": "O suprimento é um crédito em dinheiro do sócio sobre a sociedade, pelo que, num aumento de capital, é convertido por compensação de créditos numa entrada em dinheiro — nunca em entrada em espécie (que exigiria avaliação por perito) nem em indústria (não admitida nas SQ e SA).", "fonte": "Exame: QUESTÕES DE DIREITO SOCIETÁRIO OCPCA 24.05.2019.pdf"}, {"n": 515, "enunciado": "AS Contas DE Exercício Devem SER Aprovadas PELA Assembleia Geral Até:", "opcoes": {"A": "31 DE MARÇO", "B": "15 DE ABRIL", "C": "31 DE ABRIL", "D": "31 DE MAIO"}, "correcta": "A", "explicacao": "A assembleia geral ordinária de apreciação e aprovação das contas de exercício deve realizar-se nos três meses seguintes ao encerramento do exercício, ou seja, até 31 de Março (Art.º 62.º da LSC); as datas de Abril e Maio correspondem a obrigações declarativas fiscais, não societárias.", "fonte": "Exame: QUESTÕES DE DIREITO SOCIETÁRIO OCPCA 24.05.2019.pdf"}, {"n": 516, "enunciado": "Depois DE Avaliar UMA Entrada EM Espécie, O Perito Contabilista FICA Impedido DE Prestar Serviços À Sociedade QUE Recebeu ESSA Entrada Durante:", "opcoes": {"A": "2 ANOS", "B": "1 ANO", "C": "6 MESES", "D": "3 MESES"}, "correcta": "A", "explicacao": "A resposta A (2 anos) é a chave habitual, mas o período de impedimento do perito contabilista que avaliou uma entrada em espécie não pôde ser confirmado: nenhuma das fontes contém o Art.º 30.º da LSC. Trata-se exactamente do tipo de prazo que os distractores da pergunta (1 ano, 6 meses, 3 meses) exploram, pelo que convém verificar o texto legal antes de o dar como assente.", "fonte": "Exame: QUESTÕES DE DIREITO SOCIETÁRIO OCPCA 24.05.2019.pdf · resposta a confirmar"}, {"n": 517, "enunciado": "O Perito Contabilista QUE Integra O Conselho Fiscal DE UMA Sociedade NÃO Pode:", "opcoes": {"A": "Ser sócio dessa sociedade", "B": "SER Administrador DE Outra Sociedade", "C": "SER Colega DE Profissão DE Outro Membro DO Conselho Fiscal", "D": "SER Membro DO Conselho Fiscal DE Outra Sociedade"}, "correcta": "A", "explicacao": "A independência exigida ao perito contabilista que integra o conselho fiscal (Art.º 434.º da LSC e regras deontológicas da OCPCA) impede-o de ser sócio da sociedade fiscalizada; nada obsta a que seja administrador de outra sociedade, membro do conselho fiscal de outras sociedades ou colega de profissão dos demais membros.", "fonte": "Exame: QUESTÕES DE DIREITO SOCIETÁRIO OCPCA 24.05.2019.pdf"}, {"n": 518, "enunciado": "AS Prestações Suplementares:", "opcoes": {"A": "Podem SER Feitas NAS Sociedades POR Quotas E Anónimas", "B": "VENCEM JUROS", "C": "SÓ Podem SER Reembolsadas Decorrido O Prazo Mínimo DE 1 ANO", "D": "SÓ Podem SER Feitas NAS Sociedades POR Quotas"}, "correcta": "D", "explicacao": "As prestações suplementares são uma figura exclusiva das sociedades por quotas (Art.º 232.º e ss. da LSC), têm sempre dinheiro por objecto e não vencem juros — nas sociedades anónimas apenas se admitem prestações acessórias.", "fonte": "Exame: QUESTÕES DE DIREITO SOCIETÁRIO OCPCA 24.05.2019.pdf"}, {"n": 519, "enunciado": "NO Final DO Exercício, SE OS Sócios NÃO Quiserem Distribuir MAIS DE Metade DOS Lucros DE Exercício Distribuíveis, Devem Tomar ESTA Decisão Por:", "opcoes": {"A": "60% DOS Votos Correspondentes AO Capital Social", "B": "50% DOS Votos Correspondentes AO Capital Social + 1 VOTO", "C": "75% DOS Votos Correspondentes AO Capital Social", "D": "Maioria DOS Votos Emitidos NA Reunião (independentemente DO Capital Social NELA Representado)"}, "correcta": "C", "explicacao": "Art.º 239.º, n.º 1 da LSC (aplicável às SA por remissão do Art.º 326.º, n.º 1): a deliberação de não distribuir mais de metade do lucro de exercício distribuível exige maioria qualificada de 75% dos votos correspondentes ao capital social.", "fonte": "Exame: QUESTÕES DE DIREITO SOCIETÁRIO OCPCA 24.05.2019.pdf"}, {"n": 520, "enunciado": "OS Montantes DE Lucro DE Exercício NÃO Distribuídos, QUE Foram Levados A Reserva Livre/de Investimento, Podem SER Movimentados:", "opcoes": {"A": "POR Decisão DOS Sócios EM Assembleia Geral, MAS SÓ NO Final DO Exercício", "B": "POR Decisão DA Administração, A Qualquer Momento", "C": "POR Decisão DA Administração, MAS SÓ NO Final DO Exercício", "D": "POR Decisão DOS Sócios EM Assembleia Geral, A Qualquer Momento"}, "correcta": "D", "explicacao": "As reservas livres/de investimento ficam na disponibilidade da assembleia geral, que pode deliberar a sua aplicação ou distribuição em qualquer momento do exercício, mediante convocação de assembleia — a administração não tem competência para as movimentar.", "fonte": "Exame: QUESTÕES DE DIREITO SOCIETÁRIO OCPCA 24.05.2019.pdf"}, {"n": 521, "enunciado": "A Lei Geral do Trabalho regula, exclusivamente:", "opcoes": {"A": "As relações jurídico-laborais no âmbito da função pública", "B": "As relações jurídico-laborais estabelecidas entre uma entidade empregadora angolana e cidadãos estrangeiros não-residentes em Angola", "C": "As relações jurídico-laborais privadas, remuneradas, estabelecidas em Angola, entre um Trabalhador e um Empregador, incluindo as de carácter especial, ", "D": "As relações jurídico-laborais no contexto do trabalho doméstico."}, "correcta": "C", "explicacao": "Art.º 1.º da Lei Geral do Trabalho: a LGT regula as relações jurídico-laborais privadas, remuneradas e prestadas em Angola entre trabalhador e empregador, incluindo, com as devidas especificidades, as relações de carácter especial; a função pública rege-se por diploma próprio.", "fonte": "Exame: Questões Exame Nacional  Trabalho OCPCA (Maio 2019)."}, {"n": 522, "enunciado": "Quem são os sujeitos da relação jurídico-laboral?", "opcoes": {"A": "O Trabalhador e seu cônjuge", "B": "O Trabalhador e a entidade pública a quem estiver vinculado", "C": "O Trabalhador e o Empregador", "D": "O Trabalhador doméstico e o Empregador."}, "correcta": "C", "explicacao": "Os sujeitos da relação jurídico-laboral são sempre e apenas o Trabalhador e o Empregador (Art.º 3.º da LGT), unidos pelos elementos prestação de actividade, subordinação jurídica e remuneração.", "fonte": "Exame: Questões Exame Nacional  Trabalho OCPCA (Maio 2019)."}, {"n": 524, "enunciado": "Os contratos de trabalho por tempo determinado têm duração máxima de:", "opcoes": {"A": "35 anos", "B": "2 anos para as grandes empresas e 5 anos para as micro, pequenas e médias empresas", "C": "5 anos para as grandes empresas e 10 anos para as micro, pequenas e médias empresas", "D": "3 anos."}, "correcta": "C", "explicacao": "A resposta C (5 anos nas grandes empresas e 10 anos nas micro, pequenas e médias empresas) corresponde ao regime da Lei n.º 7/15, em vigor à data do exame (Maio de 2019). ESSA LEI FOI REVOGADA: a Lei Geral do Trabalho actualmente em vigor é a Lei n.º 12/23, de 27 de Dezembro (desde 26/03/2024), que reformulou a duração e as renovações do contrato por tempo determinado. A pergunta, tal como está redigida, ensina um prazo que pode já não ser o vigente — datar expressamente o enunciado («segundo a Lei n.º 7/15») ou actualizar a resposta à Lei n.º 12/23 depois de confirmar o novo limite.", "fonte": "Exame: Questões Exame Nacional  Trabalho OCPCA (Maio 2019). · resposta a confirmar"}, {"n": 525, "enunciado": "O qualificador ocupacional é obrigatório:", "opcoes": {"A": "Para as empresas com 100 ou mais trabalhadores", "B": "Para as empresas qualificadas como grandes empresas", "C": "Para todas as empresas, independentemente do número de trabalhadores", "D": "Para as empresas com mais de 10 postos de trabalho com funções distintas."}, "correcta": "C", "explicacao": "O qualificador ocupacional é obrigatório para cada posto de trabalho existente na estrutura da empresa, independentemente do número de trabalhadores ou da dimensão da empresa, integrando os mapas obrigatórios a apresentar às entidades laborais.", "fonte": "Exame: Questões Exame Nacional  Trabalho OCPCA (Maio 2019)."}, {"n": 526, "enunciado": "Quais dos pontos abaixo correspondem, cumulativamente, a descontos obrigatórios sobre a remuneração dos trabalhadores?", "opcoes": {"A": "O pagamento de despesas escolares de filhos menores", "B": "Os descontos de IRT e de reembolso de empréstimos efectuados pela entidade empregadora", "C": "O pagamento do IRT, das contribuições para a segurança social e os que resultem de decisão judicial transitada em julgado ou de acordo homologado judicialmente", "D": "O pagamento do IRT e as contribuições para a segurança social e para o sindicato onde o trabalhador esteja filiado."}, "correcta": "C", "explicacao": "Art.º 248.º, n.º 2 da LGT: são descontos obrigatórios e cumulativos o IRT, as contribuições para a segurança social e os que resultem de lei, de decisão judicial transitada em julgado ou de acordo homologado judicialmente; a quotização sindical e as amortizações de empréstimos são descontos facultativos, dependentes de pedido do trabalhador.", "fonte": "Exame: Questões Exame Nacional  Trabalho OCPCA (Maio 2019)."}, {"n": 527, "enunciado": "Identifique o que não constitui matéria colectável em sede de IRT:", "opcoes": {"A": "O valor correspondente ao salário em espécie", "B": "As remunerações pagas aos gerentes e administradores", "C": "As contribuições para o sistema de segurança social", "D": "As gratificações de férias e o subsídio de Natal, independentemente do seu valor."}, "correcta": "C", "explicacao": "As contribuições do trabalhador para o sistema de segurança social são deduzidas ao rendimento e não integram a matéria colectável do IRT (Código do IRT); já o salário em espécie, as remunerações de gerentes e administradores e as gratificações de férias e de Natal são tributados.", "fonte": "Exame: Questões Exame Nacional  Trabalho OCPCA (Maio 2019)."}, {"n": 528, "enunciado": "O contrato de trabalho pode cessar, validamente, em que situações?", "opcoes": {"A": "Por decisão unilateral da entidade empregadora, com ou sem justa causa", "B": "Por acordo verbal entre as partes", "C": "Por causas objectivas, alheias à vontade das partes, por mútuo acordo e por decisão unilateral de qualquer das partes, oponível à outra", "D": "Em resultado de procedimento disciplinar, instaurado por consultor da entidade empregadora."}, "correcta": "C", "explicacao": "A LGT admite a cessação do contrato por causas objectivas alheias à vontade das partes, por mútuo acordo (que exige forma escrita) e por decisão unilateral de qualquer das partes oponível à outra; não é válida a cessação por mero acordo verbal nem por procedimento disciplinar instaurado por um consultor externo, que não detém poder disciplinar.", "fonte": "Exame: Questões Exame Nacional  Trabalho OCPCA (Maio 2019)."}]}, {"num": 7, "rotulo": "Módulo 7", "nome": "Ética e Deontologia / Estatutos OCPCA", "sessoes": [{"n": 1, "titulo": "Estatuto da OCPCA — Estrutura, Órgãos e Membros", "norma": "Estatuto da OCPCA (Decreto Presidencial n.º 232/10, revisto pelo Decreto Presidencial n.º 318/14)", "objectivo": "Conhecer a estrutura do Estatuto da OCPCA, os seus órgãos sociais e competências, e o regime geral de membros singulares e colectivos.", "pontos": ["O Estatuto da OCPCA está organizado em 7 capítulos: (1) Disposições Gerais; (2) Órgãos da Ordem; (3) Membros Singulares da Ordem; (4) Membros Colectivos da Ordem; (5) Honorários; (6) Disciplina; (7) Disposições Finais e Transitórias.", "Os órgãos da Ordem (Capítulo 2) são: Assembleia Geral, Conselho Directivo, Conselho Fiscal, Conselho de Inscrição, Conselho Disciplinar, Conselho Técnico de Contabilidade e Conselho Técnico de Auditoria — cada um com secção, composição e competências próprias no Estatuto.", "A Assembleia Geral é convocada por comunicação escrita e publicação num jornal de referência, com um mínimo de 30 dias de antecedência. A ordem de trabalhos só pode ser alterada até 10 dias antes da Assembleia, quando solicitado por, pelo menos, 1/10 dos membros da Ordem — só podem ser deliberadas matérias nela inscritas.", "O Conselho Disciplinar tem competência para instruir processos disciplinares e propor sanções, dar parecer sobre reclamações, fiscalizar a actividade dos membros (garantindo os princípios técnicos e deontológicos) e elaborar o projecto de regulamento de controlo de qualidade.", "As funções dos Contabilistas (Art. 41.º) incluem efectuar o processamento contabilístico, zelar pela regularidade fiscal da forma e registo das transacções, assegurar o apuramento do imposto de rendimento a pagar, preparar as demonstrações financeiras de acordo com os princípios contabilísticos geralmente aceites, e exercer as demais funções legalmente atribuídas — uma pergunta típica de exame testa se o candidato reconhece que TODAS estas funções, em conjunto, competem ao contabilista.", "Podem ser membros efectivos da Ordem as pessoas singulares e colectivas a quem tenha sido deferido o pedido de inscrição — não basta ser pessoa singular ou colectiva com os requisitos; é necessária a decisão de deferimento do pedido.", "A idade mínima para inscrição como Perito Contabilista é de 25 anos (Art. 76.º do Estatuto)."], "formulas": [], "erros": ["Não confundir os prazos: convocação da Assembleia Geral = mínimo de 30 dias de antecedência; alteração da ordem de trabalhos = até 10 dias antes, com o apoio de 1/10 dos membros.", "A qualidade de membro efectivo depende sempre do deferimento do pedido de inscrição — nunca é automática apenas por reunir os requisitos formais."]}, {"n": 2, "titulo": "Código de Ética e Deontologia — Princípios Fundamentais, Ameaças e Salvaguardas", "norma": "Código de Ética e Deontologia Profissional da OCPCA", "objectivo": "Dominar os princípios fundamentais da actividade do contabilista, a estrutura do Código de Ética, e o quadro conceptual de ameaças e salvaguardas ao cumprimento desses princípios.", "pontos": ["O Código de Ética e Deontologia Profissional está dividido em 3 partes: Parte A (aplicável a todos os profissionais), Parte B (aplicável aos Peritos Contabilistas em regime de profissão liberal e prática pública) e Parte C (aplicável aos Contabilistas em regime de profissão liberal e prática pública) — acompanhadas de 3 Anexos: Anexo I (Ameaças — exemplos de circunstâncias), Anexo II (Salvaguardas — exemplos que ajudam a gerir as ameaças) e Anexo III (Glossário).", "Os cinco princípios fundamentais que todo o profissional deve cumprir são: Integridade, Objectividade, Competência e Zelo Profissional, Confidencialidade e Comportamento Profissional — uma pergunta de exame que omita algum destes ou introduza princípios inventados (ex.: 'pontualidade', 'organização') deve ser rejeitada.", "As ameaças ao cumprimento dos princípios fundamentais são um conjunto variado de circunstâncias, acontecimentos e relacionamentos que possam comprometer esse cumprimento no exercício da actividade profissional — enquadram-se em cinco categorias: ameaça de interesse pessoal, ameaça de auto-revisão, ameaça de representação (advocacia), ameaça de familiaridade e ameaça de intimidação.", "A ameaça de auto-revisão ocorre quando o contabilista não avalia adequadamente os resultados de um julgamento ou de um serviço anteriormente efectuado por si próprio ou por outra pessoa da sua organização. A ameaça de representação ocorre quando o contabilista defende a posição de um cliente ou entidade empregadora ao ponto de a sua objectividade ficar comprometida.", "As salvaguardas criadas pela profissão, legislação ou regulamentação incluem: requisitos de formação, educação e experiência para a entrada na profissão; regulação sobre governação corporativa; e normas profissionais — todas estas categorias em conjunto, não isoladamente.", "No processo formal ou informal de resolução de um conflito ético, o Contabilista/Perito Contabilista deve considerar, isolada ou conjuntamente: os factos relevantes, os aspectos éticos envolvidos, os princípios fundamentais relacionados com a matéria em questão, os procedimentos internos estabelecidos e as medidas alternativas disponíveis — devendo determinar as acções apropriadas e consistentes com os princípios identificados, ponderando as consequências de cada acção; se subsistirem questões por resolver, o contabilista PODE (e deve, quando necessário) consultar outras entidades internas para o ajudar na resolução."], "formulas": [], "erros": ["Os 5 princípios fundamentais são sempre: Integridade, Objectividade, Competência e Zelo Profissional, Confidencialidade, Comportamento Profissional — nunca inventar princípios como 'pontualidade' ou 'organização'.", "Distinguir sempre a ameaça de auto-revisão (avaliar o próprio trabalho anterior) da ameaça de representação (defender excessivamente a posição de um cliente) — são as duas categorias mais testadas em exame."]}, {"n": 3, "titulo": "Direitos, Deveres e Incompatibilidades dos Contabilistas", "norma": "Estatuto da OCPCA, Capítulo 3 (Membros Singulares) e Código de Ética, Parte C", "objectivo": "Conhecer os principais direitos e deveres do contabilista, os seus deveres específicos perante a administração fiscal e perante a Ordem, e o regime de sigilo profissional.", "pontos": ["Entre os direitos do contabilista (Art. 63.º do Estatuto) conta-se o direito de exigir a confirmação, por escrito, de qualquer instrução que considere necessária para o correcto exercício da sua actividade.", "O Contabilista deve manter segredo profissional sobre todos os factos e documentos de que tome conhecimento no exercício da profissão, só podendo dele ser dispensado pelas entidades para as quais preste serviço ou por decisão judicial — nunca apenas por decisão da direcção da OCPCA. O dever de sigilo não se aplica em caso de crime público, autorização do cliente ou imposição da lei.", "O dever do contabilista para com a administração fiscal inclui abster-se da prática de quaisquer actos que, directa ou indirectamente, conduzam à ocultação, destruição, inutilização, falsificação ou viciação de documentos — não se limita a entregar a informação fiscal legalmente estabelecida (Modelo 1, etc.), sendo este um dever adicional, não o único.", "As opiniões dos consultores não se sobrepõem às opiniões dos contabilistas — consequentemente, os contabilistas podem ser responsabilizados pelas soluções adoptadas, ainda que tenham s
