<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prova da Ordem OCPCA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  html,body{margin:0;padding:0}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
</head>
<body>
<style>
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --surface-2:#E7ECEB; --raise:0 1px 2px rgba(18,38,43,.06),0 8px 24px rgba(18,38,43,.05);
  --ink:#12262B; --ink-2:#33484D; --muted:#5F7478; --line:#D3DCDB; --line-2:#BECAC9;
  --accent:#B0601A; --accent-ink:#8A4A12; --accent-soft:#F6E7D6;
  --good:#2C6B4F; --good-soft:#DDEEE4; --bad:#A2312A; --bad-soft:#F7E0DD;
  --shell:#12262B; --shell-ink:#D9E6E4; --shell-muted:#8AA3A5; --shell-line:#28434A;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1618; --surface:#132528; --surface-2:#1B3338; --raise:0 1px 2px rgba(0,0,0,.4);
    --ink:#E7EFED; --ink-2:#C2D2D1; --muted:#90A6A8; --line:#254046; --line-2:#31555C;
    --accent:#DE9245; --accent-ink:#EBAF6D; --accent-soft:#39281A;
    --good:#79BE97; --good-soft:#1C3A2C; --bad:#E38A80; --bad-soft:#3B211E;
    --shell:#0A1214; --shell-ink:#D9E6E4; --shell-muted:#7E9698; --shell-line:#223C42;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1618; --surface:#132528; --surface-2:#1B3338; --raise:0 1px 2px rgba(0,0,0,.4);
  --ink:#E7EFED; --ink-2:#C2D2D1; --muted:#90A6A8; --line:#254046; --line-2:#31555C;
  --accent:#DE9245; --accent-ink:#EBAF6D; --accent-soft:#39281A;
  --good:#79BE97; --good-soft:#1C3A2C; --bad:#E38A80; --bad-soft:#3B211E;
  --shell:#0A1214; --shell-ink:#D9E6E4; --shell-muted:#7E9698; --shell-line:#223C42;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:"Newsreader",Georgia,serif;font-weight:600;margin:0;text-wrap:balance;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* ---- shell ---- */
.app{display:grid;grid-template-columns:264px 1fr;min-height:100vh}
.side{background:var(--shell);color:var(--shell-ink);display:flex;flex-direction:column;gap:2px;
  padding:20px 0 24px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:0 20px 18px;border-bottom:1px solid var(--shell-line);margin-bottom:14px}
.brand h1{font-size:21px;color:#fff;letter-spacing:-.01em}
.brand .sub{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--shell-muted);margin-top:6px}
.navsec{padding:14px 20px 6px;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--shell-muted)}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;text-align:left;
  padding:9px 20px;color:var(--shell-ink);border-left:3px solid transparent;font-size:14.5px}
.navbtn:hover{background:rgba(255,255,255,.05)}
.navbtn[aria-current="true"]{background:rgba(255,255,255,.08);border-left-color:var(--accent);color:#fff;font-weight:600}
.navbtn .num{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--shell-muted);width:14px;flex:none}
.navbtn[aria-current="true"] .num{color:var(--accent)}
.navbtn .pct{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--shell-muted)}
.main{min-width:0;padding:0 0 80px}
.wrap{max-width:860px;margin:0 auto;padding:0 28px}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line);
  background:var(--surface);position:sticky;top:0;z-index:5}
.topbar .crumb{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:13px;color:var(--ink-2)}
.iconbtn:hover{border-color:var(--line-2)}

/* ---- generic ---- */
.stack{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px}
.hairline{border:0;border-top:1px solid var(--line);margin:0}
.lede{font-size:17px;color:var(--ink-2);max-width:62ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:11px;
  letter-spacing:.06em;padding:3px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted)}
.pill.good{color:var(--good);border-color:var(--good);background:var(--good-soft)}
.pill.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.pill.acc{color:var(--accent-ink);border-color:var(--accent);background:var(--accent-soft)}

/* ---- home ---- */
.hero{padding:38px 0 26px}
.hero h2{font-size:38px;letter-spacing:-.015em}
.hero .kicker{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:10px}
.progressline{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.progressline > i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .4s ease}
.modlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.modrow{display:grid;grid-template-columns:34px 1fr 100px 104px;align-items:center;gap:14px;
  padding:14px 18px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.modrow:last-child{border-bottom:0}
.modrow:hover{background:var(--surface-2)}
.modrow .mn{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted)}
.modrow .mt{font-weight:600;font-size:15.5px}
.modrow .ms{font-size:12.5px;color:var(--muted)}
.modrow .score{font-family:"IBM Plex Mono",monospace;font-size:12.5px;text-align:right;white-space:nowrap}
.periodo{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:9px 0;border-bottom:1px dotted var(--line)}
.periodo:last-child{border-bottom:0}
.periodo b{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.06em;color:var(--accent-ink);text-transform:uppercase}

/* ---- module ---- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:22px 0 20px;overflow-x:auto}
.tab{background:none;border:0;padding:9px 14px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
details.sess{border:1px solid var(--line);border-radius:9px;background:var(--surface);overflow:hidden}
details.sess + details.sess{margin-top:10px}
details.sess > summary{list-style:none;cursor:pointer;padding:14px 18px;display:grid;grid-template-columns:26px 1fr 16px;gap:12px;align-items:baseline}
details.sess > summary::-webkit-details-marker{display:none}
details.sess > summary .sn{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--accent-ink)}
details.sess > summary .st{font-family:"Newsreader",serif;font-size:19px;font-weight:600}
details.sess > summary .sr{font-size:12.5px;color:var(--muted);display:block;margin-top:3px}
details.sess > summary .chev{color:var(--muted);font-size:12px;transition:transform .2s}
details.sess[open] > summary .chev{transform:rotate(90deg)}
details.sess[open] > summary{border-bottom:1px solid var(--line)}
.sbody{padding:16px 18px 20px;display:flex;flex-direction:column;gap:16px}
.blk h4{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:8px}
.blk ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px}
.blk li{color:var(--ink-2)}
.blk li.add{list-style:none;position:relative}
.blk li.add::before{content:"";position:absolute;left:-13px;top:.55em;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.formula.add{border-left-color:var(--good)}
.selo{display:inline-flex;align-items:center;gap:5px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin-left:8px}
.selo::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent)}
.formula{font-family:"IBM Plex Mono",monospace;font-size:13px;background:var(--surface-2);border-left:2px solid var(--accent);
  padding:9px 12px;border-radius:0 5px 5px 0;overflow-x:auto;white-space:pre-wrap}
.blk.warn ul li{color:var(--ink-2)}
.blk.warn{border-left:2px solid var(--bad);padding-left:14px}
table.temas{width:100%;border-collapse:collapse;font-size:14px}
table.temas th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);font-weight:500;padding:0 10px 8px 0;border-bottom:1px solid var(--line)}
table.temas td{padding:11px 10px 11px 0;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink-2)}
table.temas td:first-child{color:var(--ink);font-weight:600;width:32%}
table.temas td:nth-child(2){width:96px}
.freq{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.04em;padding:2px 7px;border-radius:999px;white-space:nowrap}
.f3{background:var(--bad-soft);color:var(--bad)} .f2{background:var(--accent-soft);color:var(--accent-ink)} .f1{background:var(--surface-2);color:var(--muted)}
.tablescroll{overflow-x:auto}

/* ---- quiz ---- */
.quizhead{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.qcount{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:24px 26px;box-shadow:var(--raise)}
.qtext{font-size:17.5px;line-height:1.5;margin:0 0 20px;color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:start;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:13px 15px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.opt .lt{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--muted);border:1px solid var(--line-2);
  border-radius:4px;width:22px;height:22px;display:grid;place-items:center;flex:none}
.opt.is-right{border-color:var(--good);background:var(--good-soft)}
.opt.is-right .lt{border-color:var(--good);color:var(--good)}
.opt.is-wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.is-wrong .lt{border-color:var(--bad);color:var(--bad)}
.expl{margin-top:18px;border-left:3px solid var(--accent);background:var(--surface-2);padding:14px 16px;border-radius:0 7px 7px 0}
.expl .src{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);margin-top:9px;padding-top:8px;border-top:1px solid var(--line)}
.expl .eh{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.qfoot{display:flex;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:7px;padding:9px 18px;font-weight:600;font-size:14.5px}
.btn:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--line-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.ghost.on{color:var(--accent-ink);border-color:var(--accent);background:var(--accent-soft)}
.result{text-align:center;padding:34px 26px}
.result .grade{font-family:"IBM Plex Mono",monospace;font-size:58px;font-weight:600;line-height:1;letter-spacing:-.02em}
.result .of{font-family:"IBM Plex Mono",monospace;font-size:15px;color:var(--muted)}
.review{display:flex;flex-direction:column;gap:10px;margin-top:20px;text-align:left}
.revrow{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.revrow .rn{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--bad);white-space:nowrap;padding-top:2px}
.revrow .rq{font-size:14.5px;color:var(--ink)}
.revrow .ra{font-size:13.5px;color:var(--muted);margin-top:5px}
.empty{text-align:center;color:var(--muted);padding:40px 20px;border:1px dashed var(--line-2);border-radius:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink-2)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.footnote{font-size:12.5px;color:var(--muted);max-width:62ch}
/* ---- plano ---- */
.daygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.day{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:12px 13px;display:flex;flex-direction:column;gap:7px;position:relative}
.day.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.day.past{opacity:.55}
.day.done{background:var(--good-soft);border-color:var(--good)}
.day .dh{display:flex;align-items:baseline;gap:7px}
.day .dd{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.day .dn{font-family:"IBM Plex Mono",monospace;font-size:16px;font-weight:600}
.day ul{margin:0;padding-left:15px;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.day .dtag{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink)}
.day .dchk{margin-top:auto;background:none;border:1px solid var(--line-2);border-radius:6px;padding:4px 8px;font-size:12px;color:var(--muted);align-self:flex-start}
.day.done .dchk{border-color:var(--good);color:var(--good)}
.today-card{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
@media (max-width:620px){.today-card{grid-template-columns:1fr}}
.datefield{font:inherit;font-family:"IBM Plex Mono",monospace;font-size:13px;background:var(--surface);color:var(--ink);
  border:1px solid var(--line-2);border-radius:6px;padding:6px 9px}
.periodcard{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);
  border-radius:9px;background:var(--surface);width:100%;text-align:left}
.periodcard:hover{border-color:var(--accent);background:var(--accent-soft)}
.periodcard .pnum{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink)}
.periodcard .pt{font-weight:600;font-size:15px}
.periodcard .ps{font-size:12.5px;color:var(--muted)}
.timer{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.timer.warn{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;padding:16px 0}
  .side .navsec{padding-top:10px}
  .wrap{padding:0 18px}
  .topbar{padding:12px 18px}
  .modrow{grid-template-columns:26px 1fr 88px;gap:10px}
  .modrow .progressline{display:none}
  .modrow .ms{display:none}
  .hero h2{font-size:29px}
}
</style>

<div class="app">
  <nav class="side">
    <div class="brand">
      <h1>Prova da Ordem</h1>
      <div class="sub">8.º Exame · OCPCA · Contabilista</div>
    </div>
    <div class="navsec">Geral</div>
    <button class="navbtn" data-go="home"><span class="num">◆</span> Início</button>
    <button class="navbtn" data-go="plano"><span class="num">▤</span> Plano de estudo</button>
    <button class="navbtn" data-go="prova"><span class="num">⏱</span> Modo prova</button>
    <button class="navbtn" data-go="simulado"><span class="num">∑</span> Simulado geral</button>
    <button class="navbtn" data-go="formulario"><span class="num">ƒ</span> Formulário</button>
    <button class="navbtn" data-go="duvidas"><span class="num">!</span> As minhas dúvidas</button>
    <div class="navsec">Módulos</div>
    <div id="navmods"></div>
  </nav>
  <div class="main">
    <div class="topbar">
      <span class="crumb" id="crumb">Início</span>
      <span style="flex:1"></span>
      <button class="iconbtn" id="themebtn" title="Alternar tema">◐ Tema</button>
      <button class="iconbtn" id="resetbtn" title="Apagar progresso">Reiniciar progresso</button>
    </div>
    <div class="wrap" id="view"></div>
  </div>
</div>

<script>
const MODS = [{"num": 1, "rotulo": "Módulo 1", "nome": "Contabilidade Financeira", "sessoes": [{"n": 1, "titulo": "Activos Fixos Tangíveis / Imobilizado Corpóreo", "norma": "IAS 16 — Activos Fixos Tangíveis", "objectivo": "Definir o tratamento contabilístico do imobilizado corpóreo: quando um activo deve ser reconhecido, como determinar a sua quantia escriturada (custo) e como tratar as depreciações e as perdas por imparidade a reconhecer com referência a esse activo.", "pontos": ["Reconhecimento: só quando (a) for provável que os benefícios económicos futuros associados ao item fluam para a entidade e (b) o custo do item possa ser mensurado com fiabilidade.", "Custo inicial = preço de compra (incl. direitos de importação, líquido de descontos) + todos os custos directamente atribuíveis para colocar o activo no local e nas condições de funcionamento (transporte, instalação, montagem, honorários) + estimativa inicial dos custos de desmantelamento, quando aplicável.", "Mensuração subsequente: modelo do custo (custo − depreciação acumulada − imparidade) ou modelo de revalorização (justo valor à data da revalorização).", "Depreciação: repartição sistemática da quantia depreciável (custo − valor residual) ao longo da vida útil; deve reflectir o padrão de consumo dos benefícios económicos.", "Grandes reparações/inspecções que geram novos benefícios económicos futuros devem ser capitalizadas e depreciadas autonomamente pelo período até à próxima intervenção.", "No abate/alienação: ganho ou perda = valor de realização − quantia escriturada líquida à data (custo − depreciação acumulada até à data da venda, incluindo a componente da grande reparação, se existir)."], "formulas": ["Depreciação anual (quotas constantes) = (Custo − Valor residual) / Vida útil", "Depreciação em duodécimos = Depreciação anual ÷ 12 × nº de meses de utilização no período", "Quantia escriturada = Custo − Depreciação acumulada − Perdas por imparidade acumuladas", "Resultado da alienação = Valor de venda − Quantia escriturada na data da venda"], "erros": ["Quando há uma grande reparação com vida útil própria, calcular a depreciação do activo original e da reparação SEPARADAMENTE, cada uma com a sua vida útil residual, antes de apurar o ganho/perda na venda.", "Não confundir activo corrente com activo fixo: activos fixos destinam-se a ser usados por mais de um período, não a ser vendidos no decurso normal do negócio.", "A imparidade de activos fixos deve ser testada sempre que exista indício, e não apenas por decisão discricionária da gestão."]}, {"n": 2, "titulo": "Activos Intangíveis / Imobilizado Incorpóreo", "norma": "IAS 38 — Activos Intangíveis", "objectivo": "Estabelecer os critérios de reconhecimento e mensuração de activos intangíveis (sem substância física, identificáveis) não tratados especificamente noutra norma.", "pontos": ["Um activo intangível só é reconhecido se cumprir a definição de activo intangível (identificável, controlado pela entidade, gerador de benefícios económicos futuros) E os critérios gerais de reconhecimento (probabilidade de benefícios futuros + custo fiável).", "Identificável = é separável (pode ser vendido, transferido, licenciado) OU resulta de direitos contratuais/legais.", "Dispêndios de investigação (fase de pesquisa) são sempre reconhecidos como gasto do período; só os dispêndios da fase de desenvolvimento podem ser capitalizados, e apenas se cumpridos critérios cumulativos rigorosos (viabilidade técnica, intenção e capacidade de concluir e usar/vender, mercado ou utilidade interna, recursos disponíveis, mensuração fiável dos dispêndios).", "Mensuração inicial: ao custo (ou justo valor à data de aquisição, se adquirido numa concentração de actividades empresariais).", "Mensuração subsequente ao custo menos amortização acumulada e perdas por imparidade; raramente há dispêndios subsequentes capitalizáveis num intangível já reconhecido.", "Marcas, cabeçalhos, listas de clientes e itens semelhantes gerados internamente NUNCA são reconhecidos como activos intangíveis (não são distinguíveis do custo de desenvolver o negócio como um todo)."], "formulas": ["Amortização = (Custo − Valor residual, normalmente zero) / Vida útil (definida ou indefinida — se indefinida, não se amortiza, mas testa-se a imparidade anualmente)"], "erros": ["Goodwill gerado internamente nunca é reconhecido como activo — só o goodwill adquirido numa concentração de actividades empresariais.", "Distinguir claramente gastos de investigação (sempre gasto) de gastos de desenvolvimento (capitalizáveis só se cumpridos todos os critérios)."]}, {"n": 3, "titulo": "Inventários, Agricultura e Custos de Empréstimos Obtidos", "norma": "IAS 2 — Inventários · IAS 41 — Agricultura · IAS 23 — Custos de Empréstimos Obtidos", "objectivo": "Prescrever o tratamento contabilístico dos inventários (mensuração ao mais baixo do custo e do valor realizável líquido), dos activos biológicos e produtos agrícolas (mensuração ao justo valor menos custos de vender) e a capitalização de custos de financiamento directamente atribuíveis à construção de activos que se qualificam.", "pontos": ["Inventários mensuram-se ao mais baixo de entre o custo e o valor realizável líquido (VRL); o custo inclui compra, conversão e outros custos incorridos para colocar os inventários no local e condição actuais."], "formulas": ["Um activo biológico é mensurado ao justo valor menos custos de vender, tanto no reconhecimento inicial como em cada data de relato (ganhos/perdas de justo valor vão a resultados).", "O produto agrícola colhido de um activo biológico é mensurado ao justo valor menos custos de vender NO PONTO DE COLHEITA — esse valor passa a ser o custo para efeitos de IAS 2 a partir daí.", "Custos de empréstimos directamente atribuíveis à aquisição, construção ou produção de um activo que se qualifica (exige um período de tempo substancial para ficar pronto) devem ser capitalizados como parte do custo desse activo.", "A capitalização suspende-se durante períodos prolongados em que o desenvolvimento activo é interrompido, mas NÃO se suspende durante interrupções temporárias normais do processo (ex.: atrasos técnicos ou administrativos esperados, ou quando um nível de água elevado — condição sazonal habitual na região — impede temporariamente o avanço da obra).", "Inventário final (FIFO, sistema permanente) = soma das últimas unidades compradas ainda não vendidas, valorizadas ao respectivo custo unitário de compra", "Ajustamento de inventários (perda por imparidade) = Custo − Valor realizável líquido, quando VRL < Custo"], "erros": ["Não esquecer de incluir gastos de transporte da compra no custo de aquisição do inventário antes de aplicar o FIFO.", "Distinguir 'activo biológico' (a planta/animal vivo) de 'produto agrícola' (o que é colhido) — é uma pergunta clássica de exame.", "A capitalização de juros só cessa definitivamente quando estão concluídas substancialmente todas as actividades necessárias para preparar o activo para o uso pretendido — uma pausa sazonal esperada não interrompe a capitalização."]}, {"n": 4, "titulo": "Réditos, Contratos de Construção e Subsídios", "norma": "IAS 18 / IFRS 15 — Rédito · IAS 11 — Contratos de Construção · IAS 20 — Subsídios do Governo", "objectivo": "Prescrever o tratamento contabilístico do rédito proveniente de vendas de bens, prestação de serviços e uso por terceiros de activos da entidade (juros, royalties, dividendos), bem como o reconhecimento de gastos e réditos em contratos de construção plurianuais e a contabilização de subsídios governamentais.", "pontos": ["Rédito de venda de bens só é reconhecido quando: os riscos e benefícios significativos da propriedade foram transferidos, a entidade deixou de ter envolvimento continuado de gestão, a quantia do rédito pode ser fiavelmente mensurada, é provável que os benefícios económicos fluam para a entidade, e os custos incorridos podem ser fiavelmente mensurados.", "A data relevante para reconhecimento não é necessariamente a data do contrato nem a do pagamento — é a data em que os riscos e benefícios da propriedade são efectivamente transferidos (normalmente entrega/aceitação do bem).", "Contratos de construção: quando o desfecho pode ser estimado com fiabilidade, usa-se o método da percentagem de acabamento — reconhecem-se rédito e gastos proporcionalmente à fase de acabamento da obra.", "Percentagem de acabamento (método do custo) = Gastos incorridos até à data / Gastos totais estimados do contrato.", "Subsídios do Governo só são reconhecidos quando existe segurança razoável de que a entidade cumprirá as condições a eles associadas e de que os subsídios serão recebidos; reconhecem-se em resultados numa base sistemática ao longo dos períodos que confrontam com os custos que pretendem compensar."], "formulas": ["Rédito a reconhecer no período = (% de acabamento do período) × Valor total do contrato − Rédito já reconhecido em períodos anteriores", "% de acabamento = Gastos incorridos acumulados / Gastos totais estimados"], "erros": ["Não reconhecer rédito apenas porque houve facturação ou recebimento — o critério é a transferência de riscos e benefícios.", "Em contratos de construção, se o desfecho não puder ser estimado com fiabilidade, o rédito só é reconhecido até ao limite dos gastos incorridos que sejam prováveis de recuperar."]}, {"n": 5, "titulo": "Demonstração de Fluxos de Caixa e Reconciliação Bancária", "norma": "IAS 7 — Demonstração de Fluxos de Caixa", "objectivo": "Exigir o fornecimento de informação sobre as alterações históricas em caixa e seus equivalentes de uma entidade, através de uma demonstração de fluxos de caixa que classifica os fluxos em actividades operacionais, de investimento e de financiamento.", "pontos": ["Caixa e seus equivalentes: dinheiro em caixa, depósitos à ordem e investimentos de curto prazo, altamente líquidos, facilmente convertíveis e com risco insignificante de alteração de valor (normalmente vencimento ≤ 3 meses).", "Actividades operacionais: principal geradora de rédito da entidade (recebimentos de clientes, pagamentos a fornecedores e empregados).", "Actividades de investimento: aquisição/alienação de activos fixos e outros investimentos não incluídos em equivalentes de caixa.", "Actividades de financiamento: alterações na dimensão/composição do capital próprio e nos empréstimos obtidos.", "Método indirecto (o mais testado): parte do resultado líquido e ajusta por itens não-caixa (depreciações, imparidades), por itens de investimento/financiamento incluídos no resultado, e pelas variações no fundo de maneio (contas a receber, inventários, contas a pagar).", "Reconciliação bancária: explica a diferença entre o saldo contabilístico de Bancos e o saldo do extracto bancário na mesma data, através de movimentos que uma das partes já registou e a outra ainda não (cheques em trânsito, depósitos não compensados, despesas bancárias ainda não registadas pela contabilidade)."], "formulas": ["Fluxo de caixa operacional (método indirecto) = Resultado líquido + Depreciações/Amortizações + Perdas por imparidade − Ganhos de investimento/financiamento − Aumento de inventários − Aumento de dívidas a receber + Aumento de dívidas a pagar", "Saldo do extracto bancário = Saldo contabilístico ± movimentos ainda não reflectidos por um dos lados (cheques emitidos não levantados, depósitos não compensados, encargos bancários não registados)"], "erros": ["Um aumento de inventários ou de contas a receber CONSOME caixa (subtrai-se); um aumento de contas a pagar LIBERTA caixa (soma-se) — é fácil trocar o sinal.", "Cheques recebidos mas ainda não compensados aumentam o saldo contabilístico antes de aparecerem no extracto — atenção ao sentido do ajustamento na reconciliação."]}, {"n": 6, "titulo": "Imparidade de Activos, Propriedades de Investimento e Activos Não Correntes Detidos para Venda", "norma": "IAS 36 — Imparidade de Activos · IAS 40 — Propriedades de Investimento · IFRS 5 — Activos Não Correntes Detidos para Venda", "objectivo": "Assegurar que os activos não sejam escriturados por mais do que a sua quantia recuperável (IAS 36); definir o tratamento das propriedades detidas para obter rendas ou valorização de capital (IAS 40); e especificar a contabilização de activos cuja quantia escriturada será recuperada principalmente através de uma venda (IFRS 5).", "pontos": ["Quantia recuperável = maior de entre o justo valor menos custos de vender e o valor de uso (valor presente dos fluxos de caixa futuros estimados).", "Perda por imparidade = Quantia escriturada − Quantia recuperável, reconhecida imediatamente em resultados (salvo activos revalorizados).", "Se não for possível estimar a quantia recuperável de um activo individual, apura-se a quantia recuperável da unidade geradora de caixa a que pertence.", "A reversão de uma perda por imparidade de períodos anteriores exige a análise de indicadores externos e internos (ex.: aumento significativo do valor de mercado do activo) e está limitada à quantia escriturada que existiria (líquida de depreciação) caso a perda nunca tivesse sido reconhecida.", "Propriedade de investimento = terreno/edifício mantido para obter rendas e/ou valorização de capital, NÃO para uso na produção/administração nem para venda no decurso ordinário do negócio.", "Um activo não corrente é classificado como detido para venda quando a sua quantia escriturada for recuperada principalmente através de uma transacção de venda (e não do uso continuado), estando o activo disponível para venda imediata e a venda for altamente provável — deixa de ser depreciado a partir dessa classificação e passa a ser mensurado ao mais baixo entre a quantia escriturada e o justo valor menos custos de vender."], "formulas": ["Perda por imparidade = Quantia escriturada − max(Justo valor − custos de vender ; Valor de uso)"], "erros": ["Não confundir propriedade de investimento (obtenção de rendas/valorização) com imobilizado corpóreo de uso próprio (fins administrativos/produção) — é um critério clássico de exame.", "Um activo classificado como detido para venda deixa imediatamente de ser depreciado, mesmo que ainda esteja fisicamente na entidade."]}, {"n": 7, "titulo": "Provisões, Passivos e Activos Contingentes, Acontecimentos Após a Data do Balanço, Políticas Contabilísticas e Impostos Diferidos", "norma": "IAS 37 — Provisões, Passivos e Activos Contingentes · IAS 10 — Acontecimentos Após o Período de Relato · IAS 8 — Políticas Contabilísticas, Alterações nas Estimativas e Erros · IAS 12 — Impostos Diferidos", "objectivo": "Prescrever critérios de reconhecimento e bases de mensuração apropriados a provisões, passivos contingentes e activos contingentes; determinar quais os acontecimentos após a data do balanço que exigem ajustamento das demonstrações financeiras; e estabelecer os critérios de reconhecimento e mensuração de activos e passivos por impostos diferidos.", "pontos": ["Provisão = passivo de tempestividade ou quantia incerta, reconhecido quando existe uma obrigação presente (legal ou construtiva) resultante de acontecimento passado, é provável um exfluxo de recursos e a quantia pode ser estimada com fiabilidade.", "Acréscimos (ex.: 375 Encargos/Custos a pagar) distinguem-se de provisões por não haver incerteza significativa quanto à tempestividade ou quantia — são passivos por bens/serviços já recebidos mas ainda não facturados/pagos.", "Passivo contingente: não se reconhece, apenas se divulga (salvo se a saída de recursos for remota, caso em que nem se divulga).", "Activo contingente: nunca se reconhece; divulga-se apenas se o influxo de benefícios for provável.", "Acontecimentos que dão origem a ajustamento: fornecem evidência de condições que já existiam à data do balanço (ex.: resolução de um processo judicial pendente).", "Acontecimentos que NÃO dão origem a ajustamento: são indicativos de condições que surgiram após a data do balanço (ex.: queda do valor de mercado de investimentos) — apenas divulgação, se materiais.", "Impostos diferidos: reconhecem-se sobre diferenças temporárias entre a base fiscal e a base contabilística de activos e passivos (ex.: diferenças de depreciação fiscal vs. contabilística)."], "formulas": ["Imposto diferido = Diferença temporária × Taxa de imposto esperada de reversão"], "erros": ["Não reconhecer uma provisão apenas com base numa intenção futura de gestão sem obrigação presente — falta o requisito de 'obrigação presente resultante de acontecimento passado'.", "Distinguir sempre: acontecimento subsequente ajustável (condição já existia) vs. não ajustável (condição surgiu depois) — tema recorrente de exame."]}, {"n": 8, "titulo": "Instrumentos Financeiros, Método de Equivalência Patrimonial e Efeitos de Alterações de Taxas de Câmbio", "norma": "IAS 32 / IFRS 9 — Instrumentos Financeiros · IAS 28 — Investimentos em Associadas (MEP) · IAS 21 — Efeitos de Alterações em Taxas de Câmbio", "objectivo": "Estabelecer princípios para o reconhecimento e mensuração de activos e passivos financeiros, o tratamento de investimentos em associadas pelo método de equivalência patrimonial (MEP), e a conversão de transacções e saldos em moeda estrangeira.", "pontos": ["Reconhecimento inicial de activos/passivos financeiros: geralmente ao justo valor (que normalmente coincide com o custo da transacção), líquido de custos de transacção quando mensurados subsequentemente ao custo amortizado.", "Instrumentos de capital próprio de outra entidade, subsidiárias, associadas e empreendimentos conjuntos são mensurados ao custo no reconhecimento inicial, líquido de imparidade — regra clássica de exame.", "Mensuração subsequente de activos financeiros: custo amortizado (instrumentos de dívida simples detidos para cobrar fluxos) ou justo valor através de resultados (a generalidade dos restantes, incl. derivados e instrumentos de capital próprio cotados).", "MEP (associadas, 20%-50% de influência significativa): o investimento é inicialmente reconhecido ao custo e ajustado, em cada período, pela parte do investidor nos resultados e no capital próprio da associada.", "Transacções em moeda estrangeira convertem-se, no reconhecimento inicial, à taxa de câmbio à vista na data da transacção; itens monetários em moeda estrangeira reconvertem-se à taxa de fecho em cada data de relato, com diferenças cambiais em resultados."], "formulas": ["Quantia escriturada do investimento (MEP) = Custo de aquisição + parte proporcional nos resultados acumulados da associada desde a aquisição − dividendos recebidos", "Diferença de câmbio = (Taxa de fecho − Taxa de registo inicial) × Quantia em moeda estrangeira do item monetário"], "erros": ["Não aplicar justo valor a investimentos em subsidiárias/associadas/instrumentos de capital próprio não cotados no reconhecimento inicial — a regra é o custo.", "Itens não monetários (ex.: inventários) em moeda estrangeira NÃO se reconvertem à taxa de fecho — mantêm-se à taxa histórica da transacção."]}, {"n": 9, "titulo": "Concentração de Actividades Empresariais e Consolidação de Contas", "norma": "IFRS 3 — Concentrações de Actividades Empresariais · IFRS 10 — Demonstrações Financeiras Consolidadas", "objectivo": "Melhorar a relevância, fiabilidade e comparabilidade da informação financeira relacionada com concentrações de actividades empresariais, estabelecendo o método da aquisição; e definir os princípios para a preparação de demonstrações financeiras consolidadas quando uma entidade controla uma ou mais entidades.", "pontos": ["Método da aquisição: identificar o adquirente, determinar a data de aquisição, reconhecer e mensurar os activos identificáveis adquiridos e os passivos assumidos (normalmente ao justo valor), e reconhecer o goodwill ou o ganho em compra vantajosa.", "Goodwill = Custo de aquisição (contraprestação transferida) − Justo valor líquido dos activos identificáveis adquiridos e passivos assumidos. Se negativo, é um ganho em compra vantajosa reconhecido em resultados.", "Na consolidação, eliminam-se saldos e transacções intragrupo (compras/vendas entre empresas do grupo) e os respectivos resultados não realizados existentes em inventários no fecho do período (margem sobre mercadorias ainda não vendidas a terceiros).", "Resultado bruto consolidado numa venda intragrupo = soma dos resultados brutos individuais das duas empresas, deduzida a margem intragrupo NÃO realizada incluída no inventário final de quem comprou à empresa do grupo (a que ainda não foi vendida a terceiros)."], "formulas": ["Goodwill = Custo de aquisição − Justo valor dos activos líquidos identificáveis adquiridos", "Resultado bruto consolidado = Σ resultados brutos individuais − margem intragrupo não realizada em inventário final"], "erros": ["Não esquecer de eliminar a margem sobre a mercadoria comprada a uma empresa do grupo que ainda está em inventário no fecho — é o erro mais comum nestes exercícios.", "O goodwill nunca é amortizado; está sujeito apenas a testes de imparidade anuais."]}, {"n": 10, "titulo": "Estrutura Conceptual e Demonstrações Financeiras", "norma": "Estrutura Conceptual para o Relato Financeiro · IAS 1 — Apresentação de Demonstrações Financeiras", "objectivo": "Definir os conceitos subjacentes à preparação e apresentação das demonstrações financeiras (características qualitativas, elementos, reconhecimento e mensuração) e definir a base para a apresentação de um conjunto completo de demonstrações financeiras de finalidades gerais.", "pontos": ["Um conjunto completo de demonstrações financeiras inclui: balanço, demonstração de resultados, demonstração de alterações no capital próprio, demonstração de fluxos de caixa e notas (políticas contabilísticas e outras notas explicativas).", "Características qualitativas fundamentais: relevância e representação fidedigna. Características de reforço: comparabilidade, verificabilidade, tempestividade e compreensibilidade.", "Representação fidedigna exige que a informação seja completa, neutra e isenta de erros — a substância económica deve prevalecer sobre a forma jurídica quando estas divergem.", "Prudência: exercício de cautela ao formular julgamentos em condições de incerteza, sem, contudo, permitir a criação de reservas ocultas, subavaliação deliberada de activos/réditos ou sobreavaliação deliberada de passivos/gastos.", "Pressuposto subjacente: regime do acréscimo (accrual basis) — os efeitos das transacções são reconhecidos quando ocorrem, não quando o caixa é recebido/pago."], "formulas": [], "erros": ["'Substância sobre a forma' é frequentemente testada com casos práticos de locação financeira ou vendas com reserva de propriedade — a pergunta pede sempre a essência económica da operação, não o título legal."]}], "intro_temas": "A análise da prova do Exame Nacional de Admissão (Novembro de 2021, Módulo 1) e dos exercícios de sessão do curso de preparação mostra um padrão consistente: o exame testa sistematicamente a aplicação prática das normas a casos concretos (cálculos) e a distinção entre conceitos próximos (definições). Nota: a análise baseia-se numa prova de referência disponível nos seus materiais — mantenha o foco em TODAS as normas do programa, não apenas nestes temas.", "temas": [{"tema": "Activos fixos tangíveis — depreciação, grandes reparações e cálculo do ganho/perda na alienação", "freq": "Muito alta", "pedido": "Casos práticos com quotas constantes, duodécimos e reparações com vida útil própria; pede-se sempre o valor exacto do ganho ou perda apurado na venda."}, {"tema": "Inventários — FIFO/custo médio e valor realizável líquido", "freq": "Muito alta", "pedido": "Cálculo do inventário final/CMV pelo FIFO em sistema de inventário permanente, incluindo gastos de transporte no custo; ajustamentos por VRL."}, {"tema": "Distinção entre activo biológico e produto agrícola / propriedade de investimento vs. imobilizado de uso próprio", "freq": "Alta", "pedido": "Perguntas de definição pura — testam se sabe classificar correctamente o activo consoante a sua finalidade."}, {"tema": "Reconhecimento do rédito — momento correcto de transferência de riscos e benefícios", "freq": "Alta", "pedido": "Casos com várias datas (contacto, contrato, entrega, pagamento) — a resposta certa é sempre a data de transferência efectiva do controlo/risco, não a do pagamento."}, {"tema": "Contratos de construção — método da percentagem de acabamento", "freq": "Alta", "pedido": "Cálculo do rédito/gasto a reconhecer num exercício com base no rácio de gastos incorridos sobre gastos totais estimados."}, {"tema": "Demonstração de Fluxos de Caixa — método indirecto", "freq": "Alta", "pedido": "Ajustamento do resultado líquido pelas variações do fundo de maneio (inventários, dívidas a receber/pagar) e por depreciações — atenção ao sinal de cada ajustamento."}, {"tema": "Reconciliação bancária", "freq": "Média-Alta", "pedido": "Cálculo do saldo do extracto a partir do saldo contabilístico, considerando cheques/depósitos em trânsito e encargos bancários ainda não registados."}, {"tema": "Locação financeira — cálculo de juros e amortização de capital nas rendas", "freq": "Média", "pedido": "Quadro de amortização financeira com renda antecipada, taxa de juro periódica e valor residual garantido."}, {"tema": "IVA — apuramento com pro rata em situações mistas", "freq": "Média", "pedido": "Registo contabilístico de gastos com IVA parcialmente dedutível quando a empresa está em regime misto/pro rata."}, {"tema": "Custos de empréstimos obtidos — capitalização e suspensão", "freq": "Média", "pedido": "Distinguir interrupções normais/sazonais (não suspendem a capitalização) de interrupções prolongadas e anómalas (suspendem)."}, {"tema": "Acréscimos e proveitos/custos a pagar/receber — classificação no balanço (corrente vs. não corrente)", "freq": "Média", "pedido": "Classificação correcta de juros a pagar/receber vencidos e não liquidados."}, {"tema": "Ofertas de inventário a terceiros — registo contabilístico", "freq": "Média", "pedido": "Uso da conta de ofertas e amostras (756) por contrapartida da conta de existências, ao custo do bem oferecido."}, {"tema": "Provisões vs. passivos contingentes vs. acréscimos", "freq": "Alta", "pedido": "Distinguir os três conceitos pela existência (ou não) de incerteza quanto à tempestividade/quantia e pela probabilidade de exfluxo de recursos."}, {"tema": "Acontecimentos após a data do balanço — ajustáveis vs. não ajustáveis", "freq": "Média-Alta", "pedido": "Identificar se o acontecimento fornece evidência de condição já existente à data do balanço (ajustável) ou surgida depois (apenas divulgação)."}, {"tema": "Instrumentos financeiros — mensuração inicial ao custo para participações e investimentos em subsidiárias/associadas", "freq": "Média", "pedido": "Regra frequentemente confundida com justo valor — reter que participações em subsidiárias/associadas se mensuram ao custo no reconhecimento inicial."}, {"tema": "Concentração de actividades empresariais — goodwill e eliminação de resultados intragrupo na consolidação", "freq": "Média", "pedido": "Cálculo do goodwill (custo − justo valor dos activos líquidos) e do resultado bruto consolidado, eliminando margens intragrupo não realizadas."}, {"tema": "Estrutura conceptual — características qualitativas da informação financeira", "freq": "Média", "pedido": "Perguntas teóricas sobre relevância, representação fidedigna, substância sobre a forma e prudência."}], "perguntas": [{"n": 1, "enunciado": "A sociedade Kianda, Lda. adquiriu uma viatura de mercadorias em 1 de Abril do ano N por 8.400.000 Kz, com vida útil estimada de 5 anos e valor residual de 900.000 Kz. Utilizando o método das quotas constantes com depreciação em duodécimos, qual o valor da depreciação a reconhecer no ano N (9 meses de utilização)?", "opcoes": {"A": "1.500.000 Kz", "B": "1.125.000 Kz", "C": "1.260.000 Kz", "D": "1.680.000 Kz"}, "correcta": "B", "explicacao": "Quantia depreciável = 8.400.000 − 900.000 = 7.500.000; depreciação anual = 7.500.000/5 = 1.500.000; para 9 meses (Abr-Dez) = 1.500.000 × 9/12 = 1.125.000 Kz.", "fonte": "Teste prático do resumo do Módulo 1"}, {"n": 2, "enunciado": "A empresa Tumba, Lda. apresentou os seguintes movimentos de mercadoria X em Março: Existência inicial 100 un a 500 Kz; Compra dia 10: 300 un a 520 Kz; Venda dia 20: 250 un. Utilizando o FIFO em sistema de inventário permanente, qual o valor do inventário final?", "opcoes": {"A": "76.000 Kz", "B": "78.000 Kz", "C": "80.400 Kz", "D": "62.400 Kz"}, "correcta": "B", "explicacao": "Saem primeiro as 100 un a 500 e depois 150 un das 300 a 520 (total vendido 250). Ficam em inventário 150 un a 520 = 78.000 Kz.", "fonte": "Teste prático do resumo do Módulo 1"}, {"n": 3, "enunciado": "Em relação à distinção entre activo biológico e produto agrícola segundo a norma aplicável, é correcto afirmar que:", "opcoes": {"A": "Ambos são sempre mensurados ao custo histórico", "B": "O activo biológico é a planta ou animal vivo; o produto agrícola é o resultado colhido desse activo, mensurado ao justo valor menos custos de vender no ponto de colheita", "C": "O produto agrícola nunca é reconhecido como inventário após a colheita", "D": "Só o produto agrícola é mensurado ao justo valor; o activo biológico mensura-se sempre ao custo"}, "correcta": "B", "explicacao": "O activo biológico (ex.: árvore, animal) é a planta/animal vivo, mensurado ao justo valor menos custos de vender; o produto agrícola (ex.: fruto colhido) é mensurado ao justo valor menos custos de vender no momento da colheita, valor que passa a ser o seu 'custo' para efeitos de inventários.", "fonte": "Teste prático do resumo do Módulo 1"}, {"n": 4, "enunciado": "Um imóvel é classificado como propriedade de investimento quando é mantido:", "opcoes": {"A": "Para uso na produção ou fornecimento de bens ou serviços, ou para fins administrativos", "B": "Para venda no decurso ordinário do negócio", "C": "Para obter rendas e/ou valorização de capital", "D": "Como matéria-prima em processo de transformação"}, "correcta": "C", "explicacao": "Propriedade de investimento é o imóvel mantido para obter rendas ou valorização do capital (ou ambas), e não para uso próprio (administrativo/produtivo) nem para venda corrente.", "fonte": "Teste prático do resumo do Módulo 1"}, {"n": 5, "enunciado": "A empresa Zaire, S.A. vendeu equipamento à empresa Bengo, S.A. As datas relevantes foram: 05/01 - proposta aceite; 20/01 - contrato assinado com adiantamento de 30%; 15/02 - entrega do equipamento e emissão da factura definitiva; 28/02 - pagamento do saldo. Em que data deve a Bengo, S.A. reconhecer inicialmente o activo?", "opcoes": {"A": "05/01", "B": "20/01", "C": "15/02", "D": "28/02"}, "correcta": "C", "explicacao": "O reconhecimento ocorre quando os riscos e benefícios da propriedade são transferidos — normalmente na entrega do bem, 15/02, e não na data do contrato, do adiantamento ou do pagamento final.", "fonte": "Teste prático do resumo do Módulo 1"}, {"n": 6, "enunciado": "A empresa Cassinga, Lda. celebrou um contrato de construção de 4.000.000 Kz. No ano N, os gastos incorridos foram 900.000 Kz e os gastos totais estimados do contrato são 3.000.000 Kz. Qual o rédito a reconhecer no ano N pelo método da percentagem de acabamento?", "opcoes": {"A": "900.000 Kz", "B": "1.200.000 Kz", "C": "1.333.333 Kz", "D": "4.000.000 Kz"}, "correcta": "B", "explicacao": "% de acabamento = 900.000/3.000.000 = 30%; rédito do período = 30% × 4.000.000 = 1.200.000 Kz.", "fonte": "Teste prático do resumo do Módulo 1"}, {"n": 7, "enunciado": "No método indirecto da Demonstração de Fluxos de Caixa, um aumento do saldo de Inventários e um aumento do saldo de Fornecedores (contas a pagar) devem ser tratados, respectivamente, como:", "opcoes": {"A": "Ambos aumentam o fluxo de caixa operacional", "B": "Ambos diminuem o fluxo de caixa operacional", "C": "O aumento de inventários diminui o fluxo operacional; o aumento de fornecedores aumenta o fluxo operacional", "D": "O aumento de inventários aumenta o fluxo operacional; o aumento de fornecedores diminui o fluxo operacional"}, "correcta": "C", "explicacao": "Um aumento de inventários representa uma aplicação de caixa (subtrai-se ao resultado); um aumento de contas a pagar representa caixa ainda não desembolsado (soma-se ao resultado).", "fonte": "Teste prático do resumo do Módulo 1"}, {"n": 8, "enunciado": "Em 31/12/N, o saldo contabilístico de Bancos era de 500.000 Kz. Nessa data, existiam cheques emitidos e ainda não levantados pelos beneficiários no valor de 60.000 Kz e um depósito em trânsito de 25.000 Kz. Qual o saldo do extracto bancário nessa data?", "opcoes": {"A": "465.000 Kz", "B": "535.000 Kz", "C": "585.000 Kz", "D": "415.000 Kz"}, "correcta": "B", "explicacao": "Saldo do extracto = Saldo contabilístico + cheques emitidos ainda não levantados (o banco ainda não os debitou) − depósito em trânsito (o banco ainda não o creditou) = 500.000 + 60.000 − 25.000 = 535.000 Kz.", "fonte": "Teste prático do resumo do Módulo 1"}, {"n": 9, "enunciado": "A construção de uma barragem por uma empresa foi interrompida durante 3 meses devido à época chuvosa, um fenómeno sazonal normal e previsível para a região e época do ano. Quanto à capitalização dos custos de empréstimos obtidos directamente atribuíveis à obra:", "opcoes": {"A": "Deve ser suspensa durante todo o período de interrupção", "B": "Não deve ser suspensa, por se tratar de uma interrupção temporária, normal e necessária ao processo de preparação do activo", "C": "Deve ser interrompida definitivamente e retomada apenas com uma nova obra", "D": "Só pode continuar se a gestão decidir capitalizar por opção contabilística"}, "correcta": "B", "explicacao": "A capitalização não se suspende durante um período em que se realizam actividades técnicas e administrativas substanciais, nem quando uma interrupção temporária é parte necessária do processo de preparar o activo (ex.: nível de água elevado esperado sazonalmente).", "fonte": "Teste prático do resumo do Módulo 1"}, {"n": 10, "enunciado": "A empresa Huambo, S.A. está em regime de IVA misto e aplica um pro rata provisório de 60%. Suportou um custo com serviços de consultoria de 2.000.000 Kz, acrescido de IVA à taxa de 14%. Qual o valor de IVA dedutível a registar?", "opcoes": {"A": "280.000 Kz", "B": "168.000 Kz", "C": "112.000 Kz", "D": "0 Kz — não há dedução em regime misto"}, "correcta": "B", "explicacao": "IVA total = 2.000.000 × 14% = 280.000 Kz; em regime de pro rata, deduz-se apenas a percentagem correspondente à actividade tributada: 280.000 × 60% = 168.000 Kz; os restantes 112.000 Kz são um custo (não dedutível).", "fonte": "Teste prático do resumo do Módulo 1"}, {"n": 11, "enunciado": "Sobre a distinção entre provisão e acréscimo (custo a pagar), é correcto afirmar que:", "opcoes": {"A": "Não existe diferença — são sinónimos", "B": "A provisão caracteriza-se pela incerteza quanto à tempestividade ou à quantia; o acréscimo refere-se a obrigações por bens/serviços já recebidos, sem essa incerteza significativa", "C": "O acréscimo é sempre de montante incerto; a provisão é sempre de montante certo", "D": "Provisões só existem para litígios judiciais"}, "correcta": "B", "explicacao": "A IAS 37 distingue provisões (incerteza quanto à tempestividade/quantia) de acréscimos, como contas a pagar por bens/serviços já recebidos mas não facturados, cujo montante é geralmente conhecido com razoável precisão.", "fonte": "Teste prático do resumo do Módulo 1"}, {"n": 12, "enunciado": "Após a data do balanço de 31/12/N mas antes da aprovação das demonstrações financeiras, a empresa recebe uma sentença judicial definitiva que confirma uma obrigação de indemnização relativa a um processo já em curso à data do balanço. Este acontecimento deve ser tratado como:", "opcoes": {"A": "Não ajustável — apenas divulgado em anexo", "B": "Ajustável — deve reflectir-se nas demonstrações financeiras de N, pois confirma uma condição já existente à data do balanço", "C": "Irrelevante para efeitos contabilísticos", "D": "Deve ser registado apenas no ano N+1, quando a sentença foi conhecida"}, "correcta": "B", "explicacao": "Como o processo já existia à data do balanço e a sentença apenas fornece evidência adicional sobre uma condição já existente nessa data, trata-se de um acontecimento subsequente ajustável.", "fonte": "Teste prático do resumo do Módulo 1"}, {"n": 13, "enunciado": "No reconhecimento inicial, um investimento numa participação de capital de uma associada não cotada deve ser mensurado:", "opcoes": {"A": "Ao justo valor através de resultados", "B": "Ao custo, líquido de eventuais perdas por imparidade", "C": "Ao valor nominal das acções", "D": "Pelo método de equivalência patrimonial desde o primeiro dia, ignorando o custo de aquisição"}, "correcta": "B", "explicacao": "Investimentos em associadas (bem como subsidiárias e empreendimentos conjuntos) são mensurados ao custo no reconhecimento inicial, líquido de imparidade — regra frequentemente confundida com o justo valor aplicável a outros instrumentos financeiros.", "fonte": "Teste prático do resumo do Módulo 1"}, {"n": 14, "enunciado": "A sociedade Girassol, S.A. adquiriu 100% do capital da sociedade Lunda, Lda. por 15.000.000 Kz. O justo valor líquido dos activos identificáveis adquiridos e passivos assumidos da Lunda, Lda. era de 12.500.000 Kz. Qual o valor de goodwill a reconhecer?", "opcoes": {"A": "27.500.000 Kz", "B": "2.500.000 Kz", "C": "12.500.000 Kz", "D": "Não há lugar a goodwill nesta operação"}, "correcta": "B", "explicacao": "Goodwill = Custo de aquisição − Justo valor líquido dos activos identificáveis = 15.000.000 − 12.500.000 = 2.500.000 Kz.", "fonte": "Teste prático do resumo do Módulo 1"}, {"n": 15, "enunciado": "A empresa-mãe Cunene, S.A. vendeu mercadorias à sua subsidiária Okavango, Lda. por 300.000 Kz, tendo incorrido num custo de 240.000 Kz nessas mercadorias. No final do exercício, 40% dessas mercadorias ainda estavam em inventário na Okavango, Lda. Qual o ajustamento a efectuar na margem intragrupo não realizada, para efeitos de consolidação?", "opcoes": {"A": "24.000 Kz", "B": "60.000 Kz", "C": "120.000 Kz", "D": "0 Kz — não há eliminação a fazer, pois a venda já ocorreu"}, "correcta": "A", "explicacao": "Margem total da venda = 300.000 − 240.000 = 60.000 Kz; margem não realizada (ainda em inventário) = 60.000 × 40% = 24.000 Kz, valor que deve ser eliminado do resultado consolidado e do inventário consolidado.", "fonte": "Teste prático do resumo do Módulo 1"}, {"n": 16, "enunciado": "Segundo a Estrutura Conceptual, quando a substância económica de uma operação diverge da sua forma jurídica, a informação financeira deve:", "opcoes": {"A": "Reflectir sempre a forma jurídica, por ser a mais objectiva", "B": "Reflectir a substância económica da operação, para representar fidedignamente a realidade", "C": "Reflectir ambas em simultâneo, sem preferência", "D": "Não reconhecer a operação enquanto a divergência não for resolvida"}, "correcta": "B", "explicacao": "Para que a informação represente fidedignamente as transacções, deve ser contabilizada e apresentada de acordo com a sua substância económica e não meramente com a sua forma legal.", "fonte": "Teste prático do resumo do Módulo 1"}, {"n": 100, "enunciado": "Na valorimetria dos elementos das Demonstrações Financeiras, adoptam-se as seguintes bases de mensuração:", "opcoes": {"A": "Custo histórico, valor realizável e valor presente", "B": "Custo histórico, custo corrente, valor realizável e valor presente", "C": "Custo corrente, valor realizável e justo valor", "D": "Custo corrente e valor presente"}, "correcta": "B", "explicacao": "", "fonte": "Sessão 10 — Perguntas para a Sessão 10_ra - resolução.docx"}, {"n": 101, "enunciado": "Qual das seguintes informações está temporariamente suspensa das Notas ao Balanço:", "opcoes": {"A": "Provisões para pensões", "B": "Impostos diferidos", "C": "Para reservas", "D": "Nenhuma das anteriores"}, "correcta": "B", "explicacao": "", "fonte": "Sessão 10 — Perguntas para a Sessão 10_ra - resolução.docx"}, {"n": 102, "enunciado": "A preparação das demonstrações financeiras (DF) submetem-se a determinadas bases e características qualitativas. Identifique as características qualitativas das DF:", "opcoes": {"A": "Acréscimo e Continuidade.", "B": "Fiabilidade e Relevância.", "C": "Continuidade e Prudência.", "D": "Nenhum dos anteriores."}, "correcta": "B", "explicacao": "", "fonte": "Sessão 10 — Perguntas para a Sessão 10_ra - resolução.docx"}, {"n": 103, "enunciado": "A Soares, Lda. tem adoptado a política contabilística de registar todos os bens adquiridos por um valor unitário inferior a 15.000 Kz imediatamente como custos do exercício em que efectua a aquisição, nunca os fazendo passar pelo balanço. O princípio contabilístico que justifica a política adoptada pela empresa é o da:", "opcoes": {"A": "Materialidade", "B": "Acréscimo", "C": "Custo histórico", "D": "Continuidade"}, "correcta": "A", "explicacao": "", "fonte": "Sessão 10 — Perguntas para a Sessão 10_ra - resolução.docx"}, {"n": 104, "enunciado": "Custo histórico, custo corrente, valor presente, são termos utilizados:", "opcoes": {"A": "Na divulgação dos elementos das demonstrações financeiras", "B": "Na mensuração dos elementos das demonstrações financeiras", "C": "No reconhecimento dos elementos das demonstrações financeiras", "D": "Nenhuma das anteriores"}, "correcta": "B", "explicacao": "", "fonte": "Sessão 10 — Perguntas para a Sessão 10_ra - resolução.docx"}, {"n": 105, "enunciado": "Qual das seguintes afirmações não traduz um objectivo da preparação das demonstrações financeiras das entidades sujeitas ao PGC:", "opcoes": {"A": "Fornecer informação que seja útil para as decisões de investimento e de financiamento", "B": "Fornecer informação acerca das fontes de fundos da empresa, do seu grau de exigibilidade e das respectivas alterações", "C": "Fornecer informação acerca do valor de liquidação da empresa", "D": "Fornecer informação útil à medição dos fluxos de caixa esperados."}, "correcta": "C", "explicacao": "", "fonte": "Sessão 10 — Perguntas para a Sessão 10_ra - resolução.docx"}, {"n": 106, "enunciado": "A empresa ALFA, SA tem pago dividendos aos seus accionistas todos os anos. Ao preparar a Demonstração dos Resultados por Funções relativa a 2019, os dividendos atribuídos e pagos aos accionistas deve ser incluído nos:", "opcoes": {"A": "Custos administrativos.", "B": "Custos de distribuição.", "C": "Resultados financeiros.", "D": "Nenhuma das anteriores"}, "correcta": "D", "explicacao": "", "fonte": "Sessão 10 — Perguntas para a Sessão 10_ra - resolução.docx"}, {"n": 110, "enunciado": "A empresa CHOCOLINE mandou fazer um website para diversificar os seus canais de venda. Para além de publicitário, o website possui loja virtual permitindo aos clientes encomendarem, pagarem receberem as encomendas no domicílio. As despesas incorridas foram as seguintes: - Factura do técnico que criou o website: 550.000kz - Alojamento do website no portal vendasonline.com: 150.000kz - Manutenção mensal do website (necessária a partir do 2º mês de funcionamento): 85.000kz Como devem ser registadas as despesas referentes a este website:", "opcoes": {"A": "Imobilizado incorpóreo: 785.000kz", "B": "Imobilizado incorpóreo: 700.000kz; Custos do exercício: 85.000kz (custo mensal)", "C": "Custo do Exercício: 785.000kz", "D": "Imobilizado incorpóreo: 550.000kz; Custos do exercício: 235.000kz (sendo os 85.000kz custo mensal)"}, "correcta": "B", "explicacao": "", "fonte": "Sessão 2 — Perguntas sessão 2 CPE_CF - Resolvido prof Vanda.docx"}, {"n": 113, "enunciado": "Após ter registado a patente do brinquedo T-3000, a empresa Brinquedos&Companhia, realizou uma campanha publicitária enorme para dar a conhecer o T-3000 a potenciais empresas comerciais interessadas. O custo total da campanha publicitária ascendeu a 3.000.000kz. Este dispêndio:", "opcoes": {"A": "Deve ser adicionado ao custo do Imobilizado Incorpóreo Patente", "B": "Deve ser registado como Imobilizado Incorpóreo independente da patente", "C": "Deve ser registado como custo do exercício, mas apenas após a primeira venda.", "D": "Deve ser registado como custo do exercício."}, "correcta": "D", "explicacao": "", "fonte": "Sessão 2 — Perguntas sessão 2 CPE_CF - Resolvido prof Vanda.docx"}, {"n": 114, "enunciado": "A empresa TVG pagou um curso de formação de 4.000.000kz numa tecnologia inovadora, no MIT, a um dos seus engenheiros, esperando com isso aumentar a produtividade da sua área de produção. Para garantir o seu investimento, o engenheiro assinou um contrato de fidelização com a TVG, no qual terá que pagar uma indemnização de 4.000.000kz à TVG, caso se demita da TVG antes de passarem 4 anos completos. Neste caso, o dispêndio com a formação:", "opcoes": {"A": "Pode ser considerado um Imobilizado Incorpóreo", "B": "Não pode ser considerado um Imobilizado Incorpóreo", "C": "Independentemente de clausulas contratuais, o custo de formação é sempre custo do exercício.", "D": "Nenhuma das anteriores."}, "correcta": "A", "explicacao": "Pergunta tecnicamente controversa. O formador assinalou A (pode ser activo intangível, por o contrato de fidelização de 4 anos dar à TVG o controlo dos benefícios). Contudo, a IAS 38, § 69, b) determina expressamente que os dispêndios com FORMAÇÃO são reconhecidos como gasto quando incorridos, e o § 15 nega, em regra, o controlo sobre os benefícios gerados por pessoal — nessa leitura a resposta seria B (e a opção C repete literalmente a regra do § 69). Recomenda-se ou corrigir para B, ou reformular o enunciado deixando claro que se pretende testar a excepção do § 15 in fine (direitos legalmente protegidos).", "fonte": "Sessão 2 — Perguntas sessão 2 CPE_CF - Resolvido prof Vanda.docx · resposta a confirmar"}, {"n": 115, "enunciado": "A empresa GATOVERDE constituiu-se em Novembro de 2018, tendo, para isso incorrido nas seguintes despesas: Emolumentos Guichet Único de Empresa: 25.000kz Pedido de vistoria e Alvará no Ministério do Comércio: 35.000kz Factura do advogado que tratou dos procedimentos de registo: 150.000kz Como devem ser registadas estas despesas, de acordo as normas internacionais de contabilidade?", "opcoes": {"A": "Devem ser registadas como Activo Intangível", "B": "Apenas os emolumentos do Guichet Único e o pedido de Alvará devem ser registados como Activo Intangível e a despesa do advogado deve ser registada como custo do exercício", "C": "Apenas os emolumentos do Guichet Único devem ser registados como Activo Intangível, o pedido de Alvará a despesa do advogado devem ser registados como custo do exercício.", "D": "Todas estas despesas devem ser registadas como Custos do Exercício."}, "correcta": "D", "explicacao": "", "fonte": "Sessão 2 — Perguntas sessão 2 CPE_CF - Resolvido prof Vanda.docx"}, {"n": 116, "enunciado": "A empresa SEMLINE mandou fazer um website para divulgar os seus produtos aos consumidores mais jovens. As despesas incorridas foram as seguintes: Factura da empresa FAÇO WEBSITES, LDA: 450.000kz Alojamento do website no portal pubonline.com: 150.000kz Como devem ser registadas as despesas referentes a este website:", "opcoes": {"A": "Imobilizado Incorpóreo: 600.000kz", "B": "Imobilizado Incorpóreo: 450.000kz; Custo do exercício: 150.000kz", "C": "Custo do Exercício: 600.000kz", "D": "Imobilizado Incorpóreo: 150.000kz; Custo do exercício: 450.000kz"}, "correcta": "C", "explicacao": "", "fonte": "Sessão 2 — Perguntas sessão 2 CPE_CF - Resolvido prof Vanda.docx"}, {"n": 119, "enunciado": "A empresa Emergência, Lda adquiriu em 1/1/2015 uma patente no valor de 150.000kz. A patente encontra-se protegida por um período de 3 anos. No final de 2016 a empresa obteve as seguintes informações. - Valor de uso no valor de 20.000kz; - Justo valor no valor de 50.000kz; - Despesa de venda no valor 10.000kz Qual o valor a registar pela perda por imparidade/amortização extraordinária", "opcoes": {"A": "10.000kz", "B": "30.000kz", "C": "110.000KZ", "D": "Não existe perda por imparidade/amortização extraordinária"}, "correcta": "A", "explicacao": "", "fonte": "Sessão 2 — Perguntas sessão 2 CPE_CF - Resolvido prof Vanda.docx"}, {"n": 121, "enunciado": "A empresa BAIXAJÁ tem no seu armazém, mercadorias compradas por 1.560.000kz e que, segundo a área comercial, actualmente o seu valor de mercado são 1.400.000kz e ainda terá que se suportar custos de embalamento das mercadorias no valor de 120.000kz. Como deve proceder o contabilista da BAIXAJÁ:", "opcoes": {"A": "Débito 78.1 = 280.000kz ; Crédito 29 = 280.000kz", "B": "Débito 78.1 = 160.000kz ; Crédito 29 = 160.000kz", "C": "Débito 78.1 = 40.000kz ; Crédito 29 = 40.000kz", "D": "Não se faz qualquer registo, é meramente informativo."}, "correcta": "A", "explicacao": "", "fonte": "Sessão 3 — Perguntas Sessao 3-RESPOSTAS.docx"}, {"n": 122, "enunciado": "A fábrica CHOCOCHOCO dedica-se à produção de chocolates com vários tipos de recheio. Durante o mês de Fevereiro, a Contabilidade Analítica informou a Financeira que tinham saído da fábrica e entrado em armazém 550 tabletes de chocolate negro recheado de morango, com um custo de produção de 345kz/tablete. Como deve o contabilista registar esta operação?", "opcoes": {"A": "Débito 26 = 189.750kz ; Crédito 24 = 189.750kz", "B": "Débito 24 = 189.750kz ; Crédito 68.4 = 189.750kz", "C": "Débito 24 = 189.750kz ; Crédito 64 = 189.750kz", "D": "Débito 24 = 189.750kz ; Crédito 29 = 189.750kz"}, "correcta": "C", "explicacao": "", "fonte": "Sessão 3 — Perguntas Sessao 3-RESPOSTAS.docx"}, {"n": 123, "enunciado": "A empresa BROWNSUGAR encomendou, de um fornecedor sul-africano, 500 toneladas de uma matéria-prima, essencial no seu processo de fabrico, a um preço de 250kz/toneladas. Para o efeito, o fornecedor exigiu-lhe um adiantamento de 25% do valor total. Qual o registo a efectuar do adiantamento?", "opcoes": {"A": "Débito 32.9 = 31.250kz ; Crédito 43 = 31.250kz", "B": "Débito 28 = 31.250kz ; Crédito 32.9 = 31.250kz", "C": "Débito 21 = 31.250kz ; Crédito 43 = 31.250kz", "D": "Débito 28 = 31.250kz ; Crédito 43 = 31.250kz"}, "correcta": "D", "explicacao": "", "fonte": "Sessão 3 — Perguntas Sessao 3-RESPOSTAS.docx"}, {"n": 125, "enunciado": "A empresa ARANDO produz e vende o produto X. No início do mês, a fábrica informou o contabilista que tinha terminado a produção de 500 unidades de X, a um custo de 450kz/unidade. No dia 10, foram vendidas 180 unidades de X ao cliente COMPROTUDO, por 850kz/unidade. Como deve a ARANDO registar esta operação?", "opcoes": {"A": "Débito 31 = 153.000kz e Débito 64 = 81.000kz ; Crédito 61 = 153.000kz e Crédito 24 = 81.000kz", "B": "Débito 31 = 153.000kz e Débito 71 = 81.000kz ; Crédito 61 = 153.000kz e Crédito 24 = 81.000kz", "C": "Débito 31 = 153.000kz e Débito 71 = 81.000kz ; Crédito 61 = 153.000kz e Crédito 26 = 81.000kz", "D": "Débito 31 = 153.000kz e Débito 71 = 81.000kz ; Crédito 64 = 153.000kz e Crédito 24 = 81.000kz"}, "correcta": "A", "explicacao": "", "fonte": "Sessão 3 — Perguntas Sessao 3-RESPOSTAS.docx"}, {"n": 126, "enunciado": "A empresa DÁCÁJÁ produz e vende empilhadores. Durante o ano passado, iniciou a produção de 200 empilhadores em Fevereiro tendo, para o efeito encomendado 400 unidades do componente X, a um fornecedor americano AILECELL. Como este componente tem um preço de compra muito elevado, a DÁCÁJÁ recorreu a um empréstimo no banco BAI, para financiar a compra, pelo qual pagou juros no valor de 350.000kz entre os meses de Março e Outubro. A produção dos empilhadores terminou em Novembro. Que tratamento contabilístico deve a DÁCÁJÁ dar aos juros, de acordo com o PGC Angolano?", "opcoes": {"A": "Não devem ser incluídos no custo de produção dos empilhadores", "B": "Devem ser incluídos no custo de produção dos empilhadores", "C": "Podem ser incluídos no custo de produção dos empilhadores", "D": "Não podem, em circunstância nenhuma ser incluídos no custo de produção dos empilhadores"}, "correcta": "C", "explicacao": "", "fonte": "Sessão 3 — Perguntas Sessao 3-RESPOSTAS.docx"}, {"n": 127, "enunciado": "A empresa GATICE tem dois lotes de uma mesma mercadoria: Lote Nº1 de 100.000 unidades da mercadoria ZX, valor total 1.000.000kz Lote Nº2 de 50.000 unidades da mercadoria ZX, valor total 450.000kz A GATICE vendeu 65.000 unidades da mercadoria ZX. Qual o custo da mercadoria vendida se a GATICE valorizar as suas existências ao critério do FIFO?", "opcoes": {"A": "600.000kz", "B": "617.500kz", "C": "628.333kz.", "D": "650.000kz"}, "correcta": "D", "explicacao": "", "fonte": "Sessão 3 — Perguntas Sessao 3-RESPOSTAS.docx"}, {"n": 131, "enunciado": "A empresa SEMACAMINHAR produz e vende camiões e reboques. Durante o ano passado, produziu 500 camiões, tendo inicado esta produção em Janeiro e finalizado em Outubro. Devido à morosidade do processo produtivo, contraiu um empréstimo bancário, tendo, para o efeito pago juros mensais de 150.000kz, entre os meses de Março e Dezembro. Que tratamento contabilístico deve a SEMACAMINHAR dar aos juros pagos?", "opcoes": {"A": "Deve incluir todos os juros no custo de produção do activo", "B": "Não deve incluir nenhum juro no custo de produção do activo", "C": "Deve incluir os juros de Março a Outubro no custo de produção do activo. Os juros de Novembro e Dezembro devem ser reconhecidos como custos do período.", "D": "Deve incluir os juros de Novembro Dezembro no custo de produção do activo. Os juros de Março a Outubro devem ser reconhecidos como custos do período."}, "correcta": "C", "explicacao": "", "fonte": "Sessão 3 — Perguntas Sessao 3-RESPOSTAS.docx"}, {"n": 132, "enunciado": "A empresa PARAKUKA DOCE tem no seu armazém, uma matéria-prima específica (açucar castanho), que utiliza na produção da paracuca que vende, em embalagens de 250g. Esta matéria-prima foi adquirida por 1.250.000kz e, segundo a área comercial, actualmente o seu valor de mercado é de 1.150.000kz. Como deve proceder o contabilista da PARAKUKA DOCE?", "opcoes": {"A": "Deve registar uma provisão para depreciação de existências de 100.000kz", "B": "Deve registar uma provisão para depreciação de existências de 1.250.000kz", "C": "Deve primeiro avaliar o impacto desta descida de preço da matéria-prima, no custo de produção do produto final.", "D": "Não se faz qualquer registo, é meramente informativo."}, "correcta": "C", "explicacao": "", "fonte": "Sessão 3 — Perguntas Sessao 3-RESPOSTAS.docx"}, {"n": 133, "enunciado": "A empresa PAUDOBRA produz e vende o produto ABC. Durante o mês passado, efectuou a venda de 500 unidades de ABC, cujo custo de produção era de 250kz/unidade e o preço de venda foi de 450kz/unidade. Sabendo que cada unidade vendida fica sujeita a IPC no valor de 55kz, Como deve o contabilista registar esta operação?", "opcoes": {"A": "Débito 31 = 225.000kz, Débito 34.2 = 27.500kz e Débito 64 = 125.000kz ; Crédito 61 = 252.500kz e Crédito 24 = 125.000kz", "B": "Débito 31 = 225.000kz, Débito 75.3 = 27.500kz e Débito 64 = 125.000kz ; Crédito 61 = 225.000kz, Crédito 34.2 = 27.500kz e Crédito 24 = 125.000kz", "C": "Débito 31 = 252.500kz e Débito 64 = 125.000kz ; Crédito 61 = 225.000kz, Crédito 34.2 = 27.500kz e Crédito 24 = 125.000kz", "D": "Débito 31 = 225.000kz, Débito 75.3 = 27.500kz e Débito 64 = 125.000kz ; Crédito 61 = 252.500kz e Crédito 24 = 125.000kz"}, "correcta": "C", "explicacao": "", "fonte": "Sessão 3 — Perguntas Sessao 3-RESPOSTAS.docx"}, {"n": 138, "enunciado": "A empresa XIZOU efectuou, em Maio de 2018, um pagamento ao fornecedor DAJA, da dívida de 1.500.000kz referente a um fornecimento de mercadorias anterior. Como a empresa XIZOU dedica-se à prestação de serviços de informática e a e empresa DAJA precisava de um novo servidor, o pagamento da dívida foi feito mediante entrega da XIZOU de um servidor no valor de 1.500.000kz. Como deve ser classificada esta operação?", "opcoes": {"A": "Fluxo de Caixa das Actividades Operacionais", "B": "Fluxo de Caixa das Actividades de Investimento", "C": "Fluxo de Caixa das Actividades de Financiamento", "D": "Esta operação não se enquadra no âmbito da Demonstração de Fluxos de Caixa."}, "correcta": "D", "explicacao": "", "fonte": "Sessão 5 — Perguntas Sessao 5 - Distribuição - Chave.docx"}, {"n": 141, "enunciado": "A empresa LIVRE efectou, em Outubro de 2018, o pagamento do Imposto de Selo, referente aos recebimentos de Setembro de 2018, no valor de 285.000kz. Como deve ser classificada esta operação no âmbito da Demonstração de Fluxos de Caixa?", "opcoes": {"A": "Fluxo de Caixa das Actividades Operacionais", "B": "Fluxo de Caixa das Actividades de Investimento", "C": "Fluxo de Caixa das Actividades de Financiamento", "D": "Esta operação não se enquadra no âmbito da Demonstração de Fluxos de Caixa."}, "correcta": "A", "explicacao": "", "fonte": "Sessão 5 — Perguntas Sessao 5 - Distribuição - Chave.docx"}, {"n": 142, "enunciado": "A empresa PPCD apurou, aquando do fecho do exercício de 2018, uma diferença de câmbio favorável, no valor de 350.000kz, respeitante a uma dívida de um cliente sul-africano, ao qual vendeu um conjunto de mercadorias em Novembro de 2018. Como deve ser classificada esta operação no âmbito da Demonstração de Fluxos de Caixa?", "opcoes": {"A": "Fluxo de Caixa das Actividades Operacionais", "B": "Fluxo de Caixa das Actividades de Investimento", "C": "Fluxo de Caixa das Actividades de Financiamento", "D": "Esta operação não se enquadra no âmbito da Demonstração de Fluxos de Caixa."}, "correcta": "D", "explicacao": "", "fonte": "Sessão 5 — Perguntas Sessao 5 - Distribuição - Chave.docx"}, {"n": 143, "enunciado": "A empresa EXTRACTO constatou, aquando da elaboração do relatório de reconciliação bancária que na contabilidade tinha registado um pagamento a um forncedor por cheque, que ainda não foi descontado pelo banco. Como proceder a nível de apuramento do saldo reconciliado?", "opcoes": {"A": "Adicionar este valor ao saldo da contabilidade", "B": "Subtrair este valor ao saldo da contabilidade", "C": "Adicionar este valor ao saldo do extracto bancário", "D": "Subtrair este valor ao saldo do extracto bancário"}, "correcta": "D", "explicacao": "", "fonte": "Sessão 5 — Perguntas Sessao 5 - Distribuição - Chave.docx"}, {"n": 144, "enunciado": "A empresa N’TIMBA recebeu de um cliente estrangeiro uma transferência de 6.850€. Como deve ser feito o relato na Demonstração de Fluxos de Caixa?", "opcoes": {"A": "Fluxo de Caixa Operacional, o valor em euros.", "B": "Fluxo de Caixa Operacional, o valor em kwanzas.", "C": "Fluxo de Caixa de Investimento, o valor em kwanzas.", "D": "Devido ao facto de ser um recebimento em moeda estrangeira, esta operação não se enquadra na Demonstração de Fluxos de Caixa."}, "correcta": "B", "explicacao": "", "fonte": "Sessão 5 — Perguntas Sessao 5 - Distribuição - Chave.docx"}, {"n": 145, "enunciado": "A empresa GALÃO efectuou um levantamento da sua conta de depósitos à ordem, para reforçar o seu caixa, no valor de 150.000kz. Como deve ser classificada esta operação no âmbito da Demonstração de Fluxos de Caixa?", "opcoes": {"A": "Fluxo de Caixa das Actividades Operacionais", "B": "Fluxo de Caixa das Actividades de Investimento", "C": "Fluxo de Caixa das Actividades de Financiamento", "D": "Esta operação não se enquadra no âmbito da Demonstração de Fluxos de Caixa."}, "correcta": "D", "explicacao": "", "fonte": "Sessão 5 — Perguntas Sessao 5 - Distribuição - Chave.docx"}, {"n": 148, "enunciado": "Existências_Valorização As existências devem ser valorizadas:", "opcoes": {"A": "Pelo custo ou valor de reposição", "B": "Pelo custo ou valor realizável", "C": "Pelo custo ou valor realizado líquido, dos dois o mais baixo.", "D": "Pelo custo."}, "correcta": "C", "explicacao": "", "fonte": "Sessão 5 — Prova para resolver em sala.docx"}, {"n": 149, "enunciado": "Agricultura_Produto agrícola Num roseiral, as rosas no momento da colheita de acordo com a IAS 41 (Agricultura) devem ser mensuradas:", "opcoes": {"A": "Pelo custo de produção.", "B": "Pelo justo valor menos os custos de vender.", "C": "Pelo custo de aquisição.", "D": "Pelo método do retalho."}, "correcta": "B", "explicacao": "", "fonte": "Sessão 5 — Prova para resolver em sala.docx"}, {"n": 150, "enunciado": "CEO_reconhecimento No início de 2017, a sociedade PKTR, Lda, iniciou a construção de um edifico que demoraria 2 anos para ficar pronto, o que veio a concretizar (ficou pronto em Dezembro de 2018). Para tal recorreu a um financiamento bancário a pagar em 5 anos. É politica da empresa capitalizar os juros sempre que o PGCA permitir, ou seja, sempre que estiver perante um activo que se qualifica. Durante o ano de 2019, os juros deste empréstimo totalizaram 50.000 Kz. Este valor foi reconhecido como:", "opcoes": {"A": "Fazendo parte do custo do edifício.", "B": "Como custos do exercício.", "C": "Como custos a repartir por períodos futuros.", "D": "Não influencia nem activo e nem custo do exercício."}, "correcta": "B", "explicacao": "", "fonte": "Sessão 5 — Prova para resolver em sala.docx"}, {"n": 153, "enunciado": "PI e Locação e ANCDV_PI_reconhecimento A sociedade Bomolho, Lda comprou um terreno por 3.000.000 Kz em Talatona tendo suportado custos de intermediação para a compra do mesmo de 50.000 Kz. A sociedade ainda não definiu o uso a ser dado ao terreno. Neste contexto, este terreno deve ser reconhecido como:", "opcoes": {"A": "Imobilizado corpóreo por 3.000.000 Kz.", "B": "Imobilizado corpóreo por 3.050.000 Kz.", "C": "Investimento em imóveis por 3.000.000 Kz.", "D": "Investimentos em imóveis por 3.050.000 Kz."}, "correcta": "D", "explicacao": "", "fonte": "Sessão 5 — Prova para resolver em sala.docx"}, {"n": 155, "enunciado": "Um cliente da ALFA Lda. entrou em processo de insolvência/Falência. O saldo em dívida do cliente era de 6.000.000 Kz, sendo que 4.000.000 Kz se encontram cobertos por uma garantia bancária. O valor da provisão para clientes que deve ser reconhecida pela ALFA Lda. é de:", "opcoes": {"A": "2.000.000 Kz.", "B": "4.000.000 Kz.", "C": "6.000.000 Kz.", "D": "Não deve registar a provisão, mas apenas divulgar nas notas às contas"}, "correcta": "A"
