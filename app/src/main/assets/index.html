eguido o parecer de um consultor.", "O princípio que impõe a todos os contabilistas actuar com diligência, de acordo com as normas técnicas e profissionais e a legislação aplicável na prestação de serviços profissionais, é o princípio da Competência e Zelo Profissional — distinto do princípio da Objectividade (imparcialidade de julgamento) e da Integridade (honestidade e rectidão).", "O contabilista deve comunicar à Ordem a cessação das suas funções no prazo máximo de 30 dias após a cessação do contrato — a comunicação deve ser feita por ambas as partes (contabilista e entidade a quem prestava serviços).", "As incompatibilidades gerais e específicas dos contabilistas encontram-se previstas nos Artigos 71.º e 72.º do Estatuto; as dos peritos contabilistas seguem regime próprio no Capítulo 3, Secção 2."], "formulas": [], "erros": ["O sigilo profissional só pode ser levantado pelas entidades a quem se prestam serviços OU por decisão judicial — nunca apenas pela OCPCA ou por vontade unilateral do contabilista.", "Seguir o parecer de um consultor NÃO isenta o contabilista de responsabilidade pelas soluções adoptadas — as opiniões dos consultores nunca se sobrepõem às dos contabilistas."]}, {"n": 4, "titulo": "Regime Disciplinar, Honorários e Regulamento de Estágio", "norma": "Estatuto da OCPCA, Capítulos 5 e 6; Regulamento de Estágio da OCPCA", "objectivo": "Conhecer o regime de fixação de honorários, as penas disciplinares aplicáveis aos contabilistas, e as principais regras do estágio profissional (incluindo o Estágio em Ambiente Controlado — EAC).", "pontos": ["Os honorários dos profissionais são fixados de forma livre, numa base razoável e justa, devendo ser acordados previamente por escrito (Art. 86.º do Estatuto). Para o seu apuramento deve ter-se em conta, entre outros factores, a relevância, o vulto, a complexidade e a dificuldade do serviço a executar — nunca apenas a capacidade económica do cliente ou os seus resultados financeiros do ano anterior.", "As penas disciplinares aplicáveis aos contabilistas incluem advertência, multa, suspensão (até 3 anos) e expulsão. Quando aplicada a pena de suspensão, esta informação deve ser comunicada pela Ordem ao Ministério das Finanças e às entidades a quem o contabilista preste serviços — cumulativamente, não apenas a uma destas entidades. À pena de suspensão pode ainda ser atribuído o efeito acessório de inibição até 5 anos.", "A OCPCA deve cancelar automaticamente a inscrição do contabilista quando o membro estiver em falta com a obrigação de liquidar as suas quotas por um prazo superior a 6 meses (Art. 60.º do Estatuto) — não 12 meses.", "Após expulsão, o interessado só pode requerer nova inscrição decorridos 5 anos da data da expulsão (Art. 62.º do Estatuto).", "O estágio profissional só pode ser dado como concluído com aproveitamento antes de o candidato poder ser admitido a exame; após a conclusão do estágio com aproveitamento, o estagiário tem o prazo de 5 anos para requerer a submissão a exame (Art. 54.º). O estágio, incluindo prorrogações, interrupções e mudanças de patrono, não pode ultrapassar 6 anos no total, findos os quais caduca a possibilidade de aprovação no mesmo estágio.", "O Estágio em Ambiente Controlado (EAC) é realizado pela OCPCA sob orientação geral e fiscalização da Comissão de Estágio, podendo vir a ser realizado por entidades do Ensino Oficial certificadas para o efeito pela OCPCA — tem a duração de um ano, com um mínimo de 800 horas (200 horas de contacto com o Professor/Patrono e 600 horas de trabalho autónomo avaliado).", "Colaborar no ensino da contabilidade a todos os níveis do ensino oficial (contabilidade, gestão, economia), designadamente participando na formulação de planos curriculares, constitui um OBJECTIVO da OCPCA — não uma norma ética nem uma obrigação legal do contabilista individual."], "formulas": ["Suspensão disciplinar (máximo) = até 3 anos, com possível pena acessória de inibição até 5 anos", "Cancelamento automático da inscrição por falta de pagamento de quotas = após mais de 6 meses de incumprimento", "Reinscrição após expulsão = só decorridos 5 anos da expulsão", "Duração máxima do estágio (com prorrogações/interrupções) = 6 anos; EAC = 1 ano, mínimo 800 horas (200h contacto + 600h autónomas)"], "erros": ["Não confundir o prazo de cancelamento automático da inscrição por quotas em atraso (6 meses) com outros prazos do Estatuto (30 dias para cessação de funções, 5 anos para reinscrição após expulsão).", "A comunicação de uma pena de suspensão vai simultaneamente ao Ministério das Finanças E às entidades a quem o contabilista presta serviços — nunca só a uma delas isoladamente."]}, {"n": 5, "titulo": "Regulamento de Exame — Classificação, Aprovação e Repetições", "norma": "Regulamento de Exame da OCPCA", "objectivo": "Conhecer com precisão as regras de classificação e aprovação no exame de admissão à Ordem, incluindo o regime de prova oral, revisão de provas e repetição de módulos — matéria de aplicação directa e imediata ao próprio percurso do candidato.", "pontos": ["A classificação do exame é dada por módulo, numa escala de 0 a 20 valores, com a menção final de 'Aprovado' ou 'Não aprovado' em cada módulo — considera-se aprovado o candidato que obtenha, na prova escrita, pelo menos 50% da cotação atribuída (ou seja, pelo menos 10 valores em 20).", "A classificação obtida é arredondada para o valor inteiro imediatamente superior sempre que a fracção decimal seja igual ou superior a 0,5 (ex.: 9,5 arredonda para 10; 9,4 não arredonda).", "Para a via de Contabilista: os candidatos que não obtenham a classificação mínima de aprovação na prova escrita, mas obtenham nota igual ou superior a 8,5 valores, são admitidos a prova oral — o resultado da prova oral será, por si só, 'Aprovado' ou 'Não aprovado' no módulo em causa.", "Para a via de Perito Contabilista: a prova escrita e a prova oral são AMBAS obrigatórias em cada módulo (não apenas como alternativa a uma nota insuficiente), só se acedendo à prova oral após aprovação na prova escrita — o módulo só é considerado realizado com êxito com aprovação em ambas as provas.", "Os resultados do exame são classificados e transmitidos pela Comissão de Exame ao Conselho Directivo, para comunicação aos candidatos, no prazo de 45 dias a contar da data de realização da prova.", "Em caso de reclamação/revisão de prova, a procedência ou improcedência do pedido deve ser comunicada por escrito ao candidato no prazo de 20 dias — o processo está sujeito ao pagamento de uma taxa, que é devolvida se o pedido for julgado procedente.", "O candidato que não obtenha aprovação num ou mais módulos pode reinscrever-se para nova prova de cada módulo em falta, com uma antecedência mínima de 60 dias de calendário, dentro do limite de 2 anos a contar da data do primeiro exame — terminado esse prazo de 2 anos, o pedido de inscrição caduca, sendo necessário reiniciar o processo."], "formulas": ["Aprovação por módulo = nota ≥ 50% da cotação (≥ 10 valores em escala 0–20)", "Arredondamento: fracção decimal ≥ 0,5 arredonda para o inteiro superior", "Via Contabilista: nota entre 8,5 e < 10 valores na prova escrita → acesso a prova oral de recurso", "Prazo de repetição de módulos em falta: até 2 anos a contar do primeiro exame, com pré-aviso de 60 dias por prova"], "erros": ["Não confundir os dois regimes: na via de Contabilista, a prova oral só existe como 'segunda oportunidade' para quem obtenha entre 8,5 e 10 valores; na via de Perito Contabilista, a prova oral é sempre obrigatória para todos os módulos, mesmo com boa nota na prova escrita.", "O prazo para repetir módulos em falta é de 2 anos a contar do PRIMEIRO exame realizado — não de cada tentativa individual — pelo que sucessivas reprovações não reiniciam a contagem."]}], "intro_temas": "Este módulo combina o Estatuto da OCPCA, o Código de Ética e Deontologia Profissional e os Regulamentos de Estágio e de Exame. O padrão de exame favorece perguntas de identificação exacta de prazos, percentagens e listas fechadas de opções (princípios fundamentais, categorias de ameaças, capítulos do Estatuto) — sendo um módulo mais de memorização exacta do que de raciocínio. A sessão sobre o Regulamento de Exame tem ainda valor prático directo para o desempenho do próprio candidato ao longo de todo o processo de admissão à Ordem.", "temas": [{"tema": "Princípios fundamentais do Código de Ética (5: Integridade, Objectividade, Competência e Zelo, Confidencialidade, Comportamento Profissional)", "freq": "Muito alta", "pedido": "Rejeitar opções com princípios inventados como 'pontualidade' ou 'organização'."}, {"tema": "As 5 categorias de ameaças (interesse pessoal, auto-revisão, representação, familiaridade, intimidação)", "freq": "Muito alta", "pedido": "Saber identificar qual categoria corresponde a um cenário descrito no enunciado — auto-revisão e representação são as mais testadas."}, {"tema": "Prazos e percentagens do Estatuto (convocação AG: 30 dias; cancelamento inscrição: quotas em falta há mais de 6 meses; cessação de funções: 30 dias; reinscrição após expulsão: 5 anos)", "freq": "Muito alta", "pedido": "Cada prazo tem um valor específico e distinto — não confundir uns com os outros."}, {"tema": "Estrutura do Estatuto (7 capítulos) e do Código de Ética (3 partes + 3 anexos)", "freq": "Alta", "pedido": "Saber a que capítulo/parte pertence cada tema (órgãos, membros, honorários, disciplina)."}, {"tema": "Penas disciplinares e sua comunicação (suspensão até 3 anos, comunicada ao Ministério das Finanças e às entidades a quem se prestam serviços)", "freq": "Alta", "pedido": "A comunicação é sempre cumulativa a ambas as entidades."}, {"tema": "Sigilo profissional e sua dispensa (só pelo cliente ou por decisão judicial)", "freq": "Alta", "pedido": "A OCPCA sozinha não pode dispensar o dever de sigilo."}, {"tema": "Deveres do contabilista perante a administração fiscal", "freq": "Média-Alta", "pedido": "Abster-se de actos de ocultação/falsificação de documentos é o dever central testado."}, {"tema": "Honorários — factores de fixação e forma de acordo (livre, razoável e justa, acordada previamente por escrito)", "freq": "Média-Alta", "pedido": "Nunca depende apenas da capacidade económica do cliente."}, {"tema": "Membros efectivos da Ordem (pessoas com pedido de inscrição deferido)", "freq": "Média", "pedido": "A qualidade de membro depende sempre do deferimento formal do pedido."}, {"tema": "Regulamento de Estágio: duração máxima (6 anos), prazo pós-estágio para exame (5 anos), EAC (1 ano, 800 horas)", "freq": "Alta", "pedido": "Distinguir os diferentes prazos relacionados com o estágio."}, {"tema": "Regulamento de Exame: aprovação a 50%, arredondamento, acesso a oral com 8,5+ (via Contabilista), prazo de repetição de módulos (2 anos)", "freq": "Muito alta", "pedido": "Matéria de aplicação prática directa ao percurso do próprio candidato ao exame."}], "perguntas": [{"n": 1, "enunciado": "Para o apuramento e fixação dos honorários dos contabilistas deve ser tido em conta, entre outros, o seguinte factor:", "opcoes": {"A": "A capacidade económica da empresa/cliente", "B": "Os resultados financeiros da empresa/cliente no ano anterior", "C": "A relevância, o vulto, a complexidade e a dificuldade do serviço a executar", "D": "Nenhum dos anteriores, pois os honorários são sempre fixados pela OCPCA"}, "correcta": "C", "explicacao": "Os honorários são fixados livremente numa base razoável e justa, tendo em conta a relevância, o vulto, a complexidade e a dificuldade do serviço a executar — nunca apenas a capacidade económica ou os resultados financeiros do cliente.", "fonte": "Teste prático do resumo do Módulo 7"}, {"n": 2, "enunciado": "Quando é aplicada a um contabilista a pena disciplinar de suspensão, essa informação deve ser comunicada pela Ordem:", "opcoes": {"A": "Apenas ao Ministério Público", "B": "Apenas ao Ministério das Finanças", "C": "Ao Ministério das Finanças e às entidades a quem o contabilista preste serviços", "D": "Apenas às entidades a quem o contabilista preste serviços"}, "correcta": "C", "explicacao": "A comunicação é feita cumulativamente ao Ministério das Finanças e às entidades a quem o contabilista preste serviços.", "fonte": "Teste prático do resumo do Módulo 7"}, {"n": 3, "enunciado": "Uma Assembleia Geral Ordinária da OCPCA deve ser convocada com um mínimo de:", "opcoes": {"A": "8 dias de antecedência", "B": "15 dias de antecedência", "C": "30 dias de antecedência", "D": "60 dias de antecedência"}, "correcta": "C", "explicacao": "A convocação da Assembleia Geral exige um mínimo de 30 dias de antecedência, por comunicação escrita e publicação num jornal de referência.", "fonte": "Teste prático do resumo do Módulo 7"}, {"n": 4, "enunciado": "A OCPCA deve cancelar automaticamente a inscrição de um contabilista quando:", "opcoes": {"A": "O membro estiver em falta com o pagamento das quotas por um prazo superior a 6 meses", "B": "O membro estiver em falta com o pagamento das quotas por um prazo superior a 12 meses", "C": "A OCPCA nunca pode cancelar automaticamente uma inscrição", "D": "O Conselho Fiscal assim o decidir, a qualquer momento"}, "correcta": "A", "explicacao": "O cancelamento automático da inscrição ocorre quando o membro está em falta com o pagamento de quotas há mais de 6 meses (Art. 60.º do Estatuto).", "fonte": "Teste prático do resumo do Módulo 7"}, {"n": 5, "enunciado": "Colaborar no ensino da contabilidade a todos os níveis do ensino oficial, participando na formulação de planos curriculares, constitui:", "opcoes": {"A": "Uma norma ética do contabilista individual", "B": "Uma obrigação legal do contabilista individual", "C": "Um objectivo da própria OCPCA", "D": "Nenhuma das anteriores"}, "correcta": "C", "explicacao": "Trata-se de um objectivo institucional da OCPCA, e não de uma norma ética ou obrigação legal imposta individualmente a cada contabilista.", "fonte": "Teste prático do resumo do Módulo 7"}, {"n": 6, "enunciado": "A cessação de funções de um contabilista deve ser comunicada à Ordem, por ambas as partes, no prazo máximo de:", "opcoes": {"A": "15 dias", "B": "30 dias", "C": "45 dias", "D": "60 dias"}, "correcta": "B", "explicacao": "A comunicação deve ser feita no prazo de 30 dias após a cessação do contrato, por ambas as partes envolvidas.", "fonte": "Teste prático do resumo do Módulo 7"}, {"n": 7, "enunciado": "De acordo com o Código de Ética e Deontologia, a ameaça de que um contabilista não avalie adequadamente os resultados de um julgamento ou serviço anteriormente efectuado por si próprio designa-se:", "opcoes": {"A": "Ameaça de interesse pessoal", "B": "Ameaça de auto-revisão", "C": "Ameaça de representação", "D": "Ameaça de familiaridade"}, "correcta": "B", "explicacao": "Esta situação enquadra-se na ameaça de auto-revisão — uma das cinco categorias de ameaças previstas no Código (juntamente com interesse pessoal, representação, familiaridade e intimidação).", "fonte": "Teste prático do resumo do Módulo 7"}, {"n": 8, "enunciado": "Podem ser membros efectivos da OCPCA:", "opcoes": {"A": "Apenas as pessoas singulares", "B": "Apenas as pessoas colectivas", "C": "Todas as pessoas singulares e colectivas, sem excepção", "D": "As pessoas singulares e colectivas a quem tenha sido deferido o pedido de inscrição"}, "correcta": "D", "explicacao": "A qualidade de membro efectivo depende sempre do deferimento formal do respectivo pedido de inscrição.", "fonte": "Teste prático do resumo do Módulo 7"}, {"n": 9, "enunciado": "O Contabilista só pode ser dispensado do dever de sigilo profissional:", "opcoes": {"A": "Pelas entidades para as quais preste serviço ou por decisão judicial", "B": "Apenas por decisão judicial", "C": "Apenas pela direcção da OCPCA", "D": "Apenas pelas entidades para as quais preste serviço"}, "correcta": "A", "explicacao": "A dispensa do dever de sigilo profissional pode vir das entidades a quem o contabilista presta serviço OU de decisão judicial — nunca apenas da OCPCA.", "fonte": "Teste prático do resumo do Módulo 7"}, {"n": 10, "enunciado": "Segundo o Regulamento de Exame, considera-se aprovado num módulo, na prova escrita, o candidato que obtenha:", "opcoes": {"A": "Pelo menos 40% da cotação atribuída, numa escala de 0 a 20 valores", "B": "Pelo menos 50% da cotação atribuída, numa escala de 0 a 20 valores", "C": "Pelo menos 60% da cotação atribuída, numa escala de 0 a 20 valores", "D": "A nota máxima em pelo menos metade das perguntas"}, "correcta": "B", "explicacao": "A aprovação exige pelo menos 50% da cotação atribuída (ou seja, pelo menos 10 valores em 20), com arredondamento para o inteiro superior quando a fracção decimal for igual ou superior a 0,5.", "fonte": "Teste prático do resumo do Módulo 7"}, {"n": 11, "enunciado": "Na via de admissão como Contabilista, um candidato que obtenha 9 valores (numa escala de 0 a 20) na prova escrita de um módulo:", "opcoes": {"A": "É automaticamente reprovado nesse módulo, sem outra hipótese", "B": "É admitido a prova oral de recurso, pois a nota é igual ou superior a 8,5 valores", "C": "É automaticamente aprovado, por arredondamento para 10 valores", "D": "Deve repetir imediatamente a prova escrita no mesmo dia"}, "correcta": "B", "explicacao": "Os candidatos que não atinjam os 50% de aprovação, mas obtenham nota igual ou superior a 8,5 valores, são admitidos à prova oral, cujo resultado ('Aprovado' ou 'Não aprovado') decide o módulo.", "fonte": "Teste prático do resumo do Módulo 7"}, {"n": 12, "enunciado": "Um candidato que não obtenha aprovação num módulo do exame de admissão pode reinscrever-se para nova prova desse módulo, com uma antecedência mínima de 60 dias, dentro de um prazo limite de:", "opcoes": {"A": "6 meses a contar da data do primeiro exame", "B": "1 ano a contar da data do primeiro exame", "C": "2 anos a contar da data do primeiro exame", "D": "5 anos a contar da data do primeiro exame"}, "correcta": "C", "explicacao": "O prazo-limite para repetir módulos em falta é de 2 anos a contar da data do primeiro exame realizado; ultrapassado esse prazo, o pedido de inscrição caduca.", "fonte": "Teste prático do resumo do Módulo 7"}, {"n": 500, "enunciado": "Ao iniciar um processo formal ou informal de resolução de um conflito, como parte do processo de resolução, o Contabilista ou Perito Contabilista deve, de forma isolada ou em conjunto, considerar os seguintes factores:", "opcoes": {"A": "Aspectos éticos envolvidos, factores relevantes, procedimentos internos estabelecidos, princípios fundamentais relacionados com a matéria em questão, e medidas alternativas", "B": "Factos relevantes e não relevantes, aspectos éticos envolvidos, princípios fundamentais relacionados com a matéria em questão, procedimentos internos estabelecidos e medidas alternativas", "C": "Factos relevantes, aspectos éticos envolvidos, princípios fundamentais relacionados com a matéria em questão e procedimentos internos estabelecidos", "D": "Fatos relevantes, princípios fundamentais relacionados com a matéria em questão, procedimentos internos estabelecidos e medidas alternativas"}, "correcta": "A", "explicacao": "Ponto 2.4.2 do Código de Ética e Deontologia Profissional (CEDP): na resolução de um conflito ético devem ponderar-se, isolada ou conjuntamente, os factos relevantes, os aspectos éticos envolvidos, os princípios fundamentais relacionados com a matéria, os procedimentos internos estabelecidos e as medidas alternativas. Só a opção A contém os cinco factores (a B acrescenta indevidamente os factos «não relevantes», a C omite as medidas alternativas e a D omite os aspectos éticos).", "fonte": "Exame: Versão A_Tarde_Ética.pdf"}, {"n": 502, "enunciado": "As opiniões dos consultores:", "opcoes": {"A": "Sobrepõem-se às opiniões dos contabilistas.", "B": "Sobrepõem-se às opiniões dos contabilistas e, consequentemente, os contabilistas não podem ser responsabilizados pelas soluções adotadas.", "C": "Não se sobrepõem às opiniões dos contabilistas.", "D": "Não se sobrepõem às opiniões dos contabilistas e consequentemente, os contabilistas podem ser responsabilizados pelas soluções adotadas."}, "correcta": "D", "explicacao": "As opiniões dos consultores não se sobrepõem às do contabilista: nos termos do ponto 3.2.10 do CEDP o profissional que se apoie no conselho ou trabalho de um especialista tem de avaliar ele próprio se essa confiança está suficientemente salvaguardada, mantendo a responsabilidade pelas soluções adoptadas.", "fonte": "Exame: Versão A_Tarde_Ética.pdf · resposta a confirmar"}, {"n": 503, "enunciado": "O dever de sigilo não se aplica em caso de:", "opcoes": {"A": "Crime público.", "B": "Autorização do cliente.", "C": "Imposição da lei.", "D": "Todas as afirmações estão certas"}, "correcta": "D", "explicacao": "Ponto 2.8.6 do CEDP: o dever de confidencialidade cede quando a divulgação é autorizada pelo cliente ou entidade empregadora, quando é exigida por lei (produção de prova em acções legais) e quando estão em causa infracções à lei, incluindo crimes públicos. Logo, todas as afirmações estão certas.", "fonte": "Exame: Versão A_Tarde_Ética.pdf"}, {"n": 504, "enunciado": "O Contabilista é obrigado a manter segredo profissional sobre todos os factos e documentos de que tome conhecimento no exercício da sua profissão, dele só podendo ser dispensado:", "opcoes": {"A": "Pelas entidades para as quais preste serviço ou por decisão judicial.", "B": "Apenas por decisão judicial.", "C": "Apenas pela direcção da OCPCA.", "D": "Apenas pelas entidades para as quais preste serviço."}, "correcta": "A", "explicacao": "O segredo profissional só pode ser levantado pelas entidades a quem respeita a informação ou por decisão judicial — ponto 2.8.1, al. a) e 2.8.6, al. a) e b) do CEDP (autorização expressa do titular ou exigência legal). A OCPCA, por si só, não dispensa o dever de sigilo.", "fonte": "Exame: Versão A_Tarde_Ética.pdf"}, {"n": 505, "enunciado": "Durante a sua actividade profissional o contabilista está sujeito a um conjunto de ameaças, nomeadamente a ameaça de que um contabilista defenda a posição de um cliente ou entidade empregadora ao ponto da sua objectividade ficar comprometida. Esta situação enquadra-se na categoria de:", "opcoes": {"A": "Ameaça de interesse pessoal.", "B": "Ameaça de auto-revisão.", "C": "Ameaça de representação.", "D": "Ameaça de familiaridade."}, "correcta": "C", "explicacao": "Ponto 2.3.3, al. c) do CEDP: a ameaça de representação é «a ameaça de que o Contabilista ou Perito Contabilista defenda uma posição de um cliente ou entidade empregadora, ao ponto de a sua objectividade ficar comprometida».", "fonte": "Exame: Versão A_Tarde_Ética.pdf"}, {"n": 506, "enunciado": "O princípio que impõe a todos os contabilistas que devem actuar com diligência de acordo com as normas técnicas e profissionais e legislação aplicadas quando prestarem serviços profissionais é:", "opcoes": {"A": "O princípio da competência e zelo profissional.", "B": "O princípio da objectividade.", "C": "O princípio da integridade.", "D": "O princípio da confidencialidade."}, "correcta": "A", "explicacao": "Ponto 2.7.1, al. b) do CEDP: o princípio da competência e zelo profissional impõe «actuar com diligência de acordo com as normas técnicas e profissionais e legislação aplicáveis quando prestarem serviços profissionais».", "fonte": "Exame: Versão A_Tarde_Ética.pdf"}, {"n": 507, "enunciado": "O código de ética define, para o Contabilista e Perito Contabilista, um conjunto de princípios fundamentais nas quais o profissional deverá reger-se. Indique qual a frase que agrega todos estes princípios:", "opcoes": {"A": "Integridade, Confidencialidade, Comportamento Profissional e Competência e Zelo Profissional", "B": "Integridade, Objetividade, Confidencialidade e Comportamento Profissional", "C": "Integridade, Perspicácia, Confidencialidade, Comportamento Profissional e Competência e Zelo Profissional", "D": "Integridade, Competência e Zelo Profissional, Comportamento Profissional, Objectividade e Confidencialidade"}, "correcta": "D", "explicacao": "Ponto 2.1.3 do CEDP: os princípios fundamentais são cinco — Integridade, Objectividade, Competência e Zelo Profissional, Confidencialidade e Comportamento Profissional. Apenas a opção D os enumera a todos.", "fonte": "Exame: Versão B_Tarde_Ética.pdf"}, {"n": 508, "enunciado": "A integridade é um princípio ético:", "opcoes": {"A": "Explicitamente referido no Código de Ética e Deontologia Profissional (CEDP).", "B": "Implícito no CEDP.", "C": "Que não consta no CEDP.", "D": "Que não consta nos Estatutos da OCPCA (EOCPCA)."}, "correcta": "A", "explicacao": "A integridade está expressamente prevista no CEDP: consta da lista de princípios fundamentais do ponto 2.1.3, al. a) e é desenvolvida na Secção 5 (ponto 2.5.1 e segs.).", "fonte": "Exame: Versão B_Tarde_Ética.pdf"}, {"n": 509, "enunciado": "O princípio da competência é:", "opcoes": {"A": "Incompatível com o recurso a assessoria técnica.", "B": "Compatível com o recurso a assessoria técnica.", "C": "Incompatível com o recurso a assessoria técnica em matéria fiscal.", "D": "Compatível com o recurso a assessoria técnica em matéria fiscal."}, "correcta": "B", "explicacao": "O princípio da competência é compatível com o recurso a assessoria técnica: o ponto 3.2.10 do CEDP admite expressamente que o profissional confie no conselho ou trabalho de um especialista ou perito, desde que avalie e salvaguarde os factores que justificam essa confiança (art.º 2.7.1 e 2.7.6 do CEDP).", "fonte": "Exame: Versão B_Tarde_Ética.pdf"}, {"n": 511, "enunciado": "A Ordem deve cancelar automaticamente a inscrição dos contabilistas, quando relativamente a estes:", "opcoes": {"A": "Se verifique a falta de pagamentos das quotas por período superior a 3 meses.", "B": "Se verifique a falta de pagamentos das quotas por período superior a 6 meses.", "C": "Se verifique a falta de pagamentos das quotas por período superior a 12 meses.", "D": "Não pode cancelar por atraso no pagamento de quotas."}, "correcta": "B", "explicacao": "Art.º 60.º, n.º 1, al. b) do Estatuto da OCPCA (Cancelamento oficioso da inscrição): a Ordem deve cancelar automaticamente a inscrição dos Contabilistas quando «se verificar a falta de pagamentos das quotas, por período superior a seis meses» (no mesmo sentido, o dever de pagamento pontual das quotas do art.º 70.º, al. c)).", "fonte": "Exame: Versão B_Tarde_Ética.pdf"}, {"n": 512, "enunciado": "Um contabilista com um contrato de prestação de serviços de contabilidade com uma empresa, a meio do ano desse contrato, nomeadamente no mês de Maio, por razões pessoais, decidiu abandonar a empresa e consequen- temente os trabalhos que tinha aceite, sem qualquer justificação. Esta atitude é eticamente reprovável e conside- rada infracção conforme o estatuto da OCPCA e está sujeito:", "opcoes": {"A": "A uma pena de advertência.", "B": "A uma pena de multa.", "C": "A uma pena de suspensão.", "D": "A uma pena de expulsão."}, "correcta": "C", "explicacao": "Art.º 91.º, n.º 3, al. b) do Estatuto da OCPCA: «A pena de suspensão é aplicada ao Contabilista ou Perito Contabilista em casos de negligência, grave desinteresse dos seus deveres profissionais, e nomeadamente quando: (...) b) abandonem, sem justificação, os trabalhos aceites».", "fonte": "Exame: Versão B_Tarde_Ética.pdf"}, {"n": 513, "enunciado": "Uma das condições para um candidato à OCPCA poder pedir a inscrição para o exame da Ordem é ter realizado com aproveitamento um estágio em entidades sujeitas ao Plano Geral de Contabilidade (EAR) ou em ambiente de sala (EAC). O EAC é:", "opcoes": {"A": "Realizado pela OCPCA sob a orientação geral e fiscalização da Comissão de Estágios, podendo o EAC vir a ser realizado por entidades do Ensino Oficial que venham a ser para o efeito certificadas pela OCPCA.", "B": "Pode ser realizado por uma qualquer entidade que tenha como objecto social a formação", "C": "Pode ser realizado por uma qualquer entidade de ensino superior", "D": "Nenhuma das anteriores"}, "correcta": "A", "explicacao": "Art.º 5.º, n.º 6, al. d) do Regulamento de Estágio: «O EAC é realizado pela OCPCA sob a orientação geral e fiscalização da Comissão de Estágios, podendo o EAC vir a ser realizado por entidades do Ensino Oficial que venham a ser para o efeito certificadas pela OCPCA».", "fonte": "Exame: Ética e Deontologia Profissional compilação.pdf"}, {"n": 514, "enunciado": "Constituem deveres do Contabilista comunicar à Ordem, qualquer mudança do seu domicílio profissional num prazo de:;", "opcoes": {"A": "15 dias", "B": "30 dias", "C": "60 dias", "D": "Não é necessário comunicar"}, "correcta": "B", "explicacao": "Art.º 70.º, al. d) do Estatuto da OCPCA (Deveres para com a Ordem): constitui dever do Contabilista «comunicar à Ordem, no prazo de 30 dias, qualquer mudança do seu domicílio profissional».", "fonte": "Exame: Ética e Deontologia Profissional compilação.pdf"}, {"n": 515, "enunciado": "O Contabilista poderá efectuar publicidade sobre os seus serviços. Verdadeiro ou falso?", "opcoes": {"A": "Verdadeiro, desde que esta não seja sensacionalista através de qualquer meio de difusão utilizando para este efeito critérios de decoro e ética profissional", "B": "Falso, pois o Contabilista não poderá em qualquer circunstância efectar publicidade sobre os seus serviços", "C": "Verdadeiro, podendo utilizar todos os meios e formas disponíveis desde que não faça comparações directas com outros colegas de profissão.", "D": "Verdadeiro, podendo utilizar apenas os meios visuais disponíveis e desde que faça comparações directas com outros colegas de profissão."}, "correcta": "B", "explicacao": "Segundo o Estatuto da OCPCA, Art.º 65.º, n.º 1 (Publicidade), «é vedada aos Contabilistas toda a espécie de publicidade, nomeadamente através de circulares, anúncios, meios de comunicação social ou qualquer outra forma de publicidade profissional, incluindo através da divulgação do nome dos seus clientes». O n.º 2 esclarece apenas o que NÃO é publicidade profissional (menção de títulos e cargos, tabuletas no escritório, cartões de visita e papel timbrado com nome, morada, horário e contactos, e o envio do curriculum a clientes que o solicitem) — nenhuma destas hipóteses corresponde a «efectuar publicidade». Logo, quanto ao Contabilista, a afirmação é falsa: opção B. ATENÇÃO: a Secção 5 do Capítulo 3 do CEDP (pontos 3.5.1 a 3.5.4), que permite divulgar a actividade de forma objectiva e verdadeira, está inserida na PARTE B do Código, aplicável apenas aos PERITOS CONTABILISTAS em regime de profissão liberal e prática pública — a Parte C (Contabilistas) não tem secção sobre publicidade. A explicação actual invoca por isso normas que não se aplicam ao Contabilista. Confirmar contra a grelha oficial do exame antes de publicar a alteração; se a chave oficial for A, a explicação tem obrigatoriamente de citar o Art.º 65.º, n.º 2 do Estatuto e não o ponto 3.5 do CEDP.", "fonte": "Exame: Ética e Deontologia Profissional compilação.pdf · resposta revista"}, {"n": 516, "enunciado": "A OCPCA deve cancelar, de forma automática, a inscrição do Contabilista quando:", "opcoes": {"A": "O membro estiver em falta com a obrigação de liquidar as suas quotas por um prazo superior a 6 meses", "B": "O membro estiver em falta com a obrigação de liquidar as suas quotas por um prazo superior a 12 meses", "C": "A OCPCA não pode cancelar a inscrição do Contabilista de forma automática", "D": "O presidente do Conselho de Inscrição informar todos os restantes Conselhos da Ordem"}, "correcta": "A", "explicacao": "Art.º 60.º, n.º 1, al. b) do Estatuto da OCPCA: o cancelamento automático da inscrição opera quando se verifique a falta de pagamento das quotas por período superior a seis meses — e não 12 meses.", "fonte": "Exame: Ética e Deontologia Profissional compilação.pdf"}, {"n": 517, "enunciado": "O princípio que impõe a todos os Contabilistas e Peritos Contabilistas que sejam correctos e honestos no seu relacionamento profissional e com as empresas, assumam uma conduta pessoal idónea e responsável, de acordo com os princípios e normas do presente Código e outras normas aplicáveis, abstendo-se de qualquer conduta desprestigiante quer para o profissional quer para a profissão é:", "opcoes": {"A": "O princípio da Integridade", "B": "O princípio da Objectividade", "C": "O princípio da Competência e zelo profissional", "D": "O princípio da Confidencialidade"}, "correcta": "A", "explicacao": "Ponto 2.5.1 do CEDP: «O princípio de integridade impõe a todos os Contabilistas e Peritos Contabilistas que sejam correctos e honestos no seu relacionamento profissional e com as empresas, assumam uma conduta pessoal idónea e responsável (...), abstendo-se de qualquer conduta desprestigiante quer para o profissional quer para a profissão».", "fonte": "Exame: Ética e Deontologia Profissional compilação.pdf"}, {"n": 519, "enunciado": "O dever de sigilo profissional não abrange:", "opcoes": {"A": "A prestação de informações à Ordem no âmbito do exercício do controlo da qualidade que esta efectuar", "B": "A partilha de informação com familiares e amigos", "C": "A partilha de informação com colegas de profissão que possuem qualquer ligação com as entidades envolvidas", "D": "A partilha de informação com objectivo de gerar benefícios próprio, directa ou indirectamente"}, "correcta": "A", "explicacao": "Ponto 2.8.6, al. c), subalínea (i) do CEDP: o dever de confidencialidade não se aplica quando existe dever profissional de divulgar para «dar cumprimento ao controlo de qualidade exercido pela Ordem»; as restantes hipóteses (familiares, amigos, colegas ligados às entidades, benefício próprio) constituem violação do sigilo.", "fonte": "Exame: Ética e Deontologia Profissional compilação.pdf"}]}];
const KEY = "ocpca8.progresso.v1";
let S = {resp:{}, flags:{}, sim:null};
try{ const raw = localStorage.getItem(KEY); if(raw) S = Object.assign(S, JSON.parse(raw)); }catch(e){}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };
const qid = (m,q) => m + "." + q;
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const all = () => MODS.flatMap(m => m.perguntas.map(q => ({...q, mod:m.num, modnome:m.nome})));

function stats(m){
  const t = m.perguntas.length;
  let feitas=0, certas=0;
  m.perguntas.forEach(q => { const r = S.resp[qid(m.num,q.n)]; if(r){ feitas++; if(r===q.correcta) certas++; } });
  return {t, feitas, certas, pct: feitas ? Math.round(certas/feitas*100) : null};
}
function freqClass(f){ const s=(f||"").toLowerCase(); return s.startsWith("muito")?"f3":(s.startsWith("alta")||s.startsWith("média-alta")?"f2":"f1"); }

/* ---------- navegação ---------- */
let view = {name:"home"};
function go(name, arg){ view = {name, arg}; render(); window.scrollTo({top:0}); }
document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));

function drawNav(){
  document.getElementById("navmods").innerHTML = MODS.map(m => {
    const s = stats(m);
    return `<button class="navbtn" data-mod="${m.num}"><span class="num">${m.num}</span>
      <span>${esc(m.nome)}</span><span class="pct">${s.pct===null?"–":s.pct+"%"}</span></button>`;
  }).join("");
  document.querySelectorAll("[data-mod]").forEach(b => b.onclick = () => go("modulo", +b.dataset.mod));
  document.querySelectorAll(".navbtn").forEach(b => {
    const on = (b.dataset.go && b.dataset.go===view.name) || (b.dataset.mod && view.name==="modulo" && +b.dataset.mod===view.arg);
    b.setAttribute("aria-current", on ? "true" : "false");
  });
}

/* ---------- vistas ---------- */

  const totQ = MODS.reduce((a,m)=>a+m.perguntas.length,0);
  const feitas = Object.keys(S.resp).length;
  const certas = MODS.reduce((a,m)=>a+stats(m).certas,0);
  const pct = feitas ? Math.round(certas/feitas*100) : 0;
  return `
  <div class="hero">
    <div class="kicker">8.º Exame Nacional de Admissão</div>
    <h2>Sete módulos, oito horas, uma carteira.</h2>

        <div><span class="eyebrow">O teu progresso</span>
          <div style="font-size:15px;margin-top:4px">${feitas} de ${totQ} perguntas respondidas${feitas?` · <b class="mono">${pct}%</b> de acerto`:""}</div></div>
        <button class="btn" id="btn-continuar">${feitas?"Continuar a treinar":"Começar pelo Módulo 1"}</button>
      </div>
      <div class="progressline" style="margin-top:14px"><i style="width:${Math.round(feitas/totQ*100)}%"></i></div>
    </div>

    ${(function(){
      const plano = gerarPlano(); const hj = iso(hoje0());
      const d = plano.find(x=>iso(x.data)===hj); if(!d) return "";
      const feito = (S.plano||{})[hj];
      return `<div class="card today-card" style="border-color:var(--accent)">
        <div><span class="eyebrow" style="color:var(--accent-ink)">Hoje toca isto</span>
          <ul style="margin:8px 0 0;padding-left:18px;color:var(--ink-2)">${d.itens.map(i=>`<li>${esc(i.txt)}</li>`).join("")}</ul></div>
        <button class="btn ghost ${feito?"on":""}" data-go="plano">${feito?"✓ Feito · ver plano":"Ver plano completo"}</button></div>`;
    })()}

    <div>
      <span class="eyebrow">Módulos do exame para contabilista</span>
      <div class="modlist" style="margin-top:10px">
        ${MODS.map(m=>{const s=stats(m);return `
          <button class="modrow" data-openmod="${m.num}">
            <span class="mn">M${m.num}</span>
            <span><span class="mt">${esc(m.nome)}</span><br><span class="ms">${m.sessoes.length} sessões · ${m.perguntas.length} perguntas de treino</span></span>
            <span class="progressline"><i style="width:${s.t?Math.round(s.feitas/s.t*100):0}%"></i></span>
            <span class="score">${s.pct===null?'<span style="color:var(--muted)">por iniciar</span>':`<b class="${s.pct>=50?'':''}">${s.certas}/${s.feitas}</b>`}</span>
          </button>`}).join("")}
      </div>
    </div>

    <div class="card" style="border-color:var(--accent)">
      <span class="eyebrow" style="color:var(--accent-ink)">O que a Ordem já comunicou</span>
      <div class="grid2" style="margin-top:12px">
        <div><b>21 a 25 de Setembro de 2026</b><div class="footnote" style="margin-top:4px">Datas do 8.º Exame Nacional de Admissão. O local e horário exactos constam das listas de distribuição enviadas por e-mail.</div></div>
        <div><b>Prova online, no Moodle</b><div class="footnote" style="margin-top:4px">moodle.ocpcangola.ao — entra com o teu e-mail da Ordem como utilizador e o número de estagiário como palavra-passe.</div></div>
        <div><b>10 de Setembro: exame teste</b><div class="footnote" style="margin-top:4px">Aberto a todos os candidatos, para confirmar o acesso à plataforma. Quem não o fizer arrisca perder tempo no dia da prova.</div></div>
      </div>
    </div>

/* ---------- motor de quiz ---------- */
let Q = null, timerId = null;
function startQuiz(lista, modo, opts){
  opts = opts || {};
  clearInterval(timerId);
  Q = {lista, i:0, modo, respostas:{}, feedback: opts.feedback !== false,
       deadline: opts.minutos ? Date.now() + opts.minutos*60000 : null,
       titulo: opts.titulo || null};
  if(Q.deadline) startTimer();
}
function fmtT(ms){ const s = Math.max(0, Math.floor(ms/1000));
  return String(Math.floor(s/3600)).padStart(2,"0")+":"+String(Math.floor(s%3600/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    if(!Q || !Q.deadline){ clearInterval(timerId); return; }
    const left = Q.deadline - Date.now();
    const el = document.getElementById("timer");
    if(left <= 0){ clearInterval(timerId); Q.deadline = null; Q.i = Q.lista.length; render(); return; }
    if(el){ el.textContent = fmtT(left); el.classList.toggle("warn", left < 5*60000); }
  }, 1000);
}

function quizHTML(){
  const q = Q.lista[Q.i];
  const key = qid(q.mod, q.n);
  const dada = Q.feedback ? (Q.respostas[key] || S.resp[key]) : Q.respostas[key];
  const revelado = Q.feedback && !!dada;
  const opts = ["A","B","C","D"].filter(l=>q.opcoes[l]).map(l=>{
    let cls = "opt";
    if(revelado){ if(l===q.correcta) cls+=" is-right"; else if(l===dada) cls+=" is-wrong"; }
    else if(!Q.feedback && dada===l) cls+=" is-right";
    return `<button class="${cls}" data-opt="${l}" ${revelado?"disabled":""}>
      <span class="lt">${l}</span><span>${esc(q.opcoes[l])}</span></button>`;
  }).join("");
  const acertos = Object.entries(Q.respostas).filter(([k,v])=>{
    const qq = Q.lista.find(x=>qid(x.mod,x.n)===k); return qq && qq.correcta===v;}).length;
  return `
  <div class="quizhead">
    <span class="qcount">Pergunta ${Q.i+1} / ${Q.lista.length}</span>
    <span class="progressline" style="flex:1;min-width:120px"><i style="width:${Math.round((Q.i)/Q.lista.length*100)}%"></i></span>
    ${Q.deadline?`<span class="pill acc timer" id="timer">${fmtT(Q.deadline-Date.now())}</span>`:""}
    ${Q.feedback?`<span class="qcount">${acertos} certas</span>`:`<span class="pill acc">sem correção imediata</span>`}
  </div>
  <div class="qcard">
    ${!Q.feedback?`<span class="eyebrow">Módulo ${q.mod} · ${esc(q.modnome)}</span>`:""}
    <p class="qtext" style="${!Q.feedback?"margin-top:10px":""}">${esc(q.enunciado)}</p>
    <div class="opts">${opts}</div>
    ${revelado?`<div class="expl"><div class="eh">${dada===q.correcta?"Certo":"Errado — a resposta é "+q.correcta}</div>
      ${q.explicacao?esc(q.explicacao):`<b>${q.correcta})</b> ${esc(q.opcoes[q.correcta])}`}
      ${q.fonte?`<div class="src">${esc(q.fonte)}</div>`:""}</div>`:""}
    <div class="qfoot">
      ${Q.i>0?`<button class="btn ghost" id="q-prev">← Anterior</button>`:""}
      ${(revelado||!Q.feedback)?`<button class="btn" id="q-next">${Q.i+1===Q.lista.length?"Ver resultado":"Seguinte →"}</button>`:""}
      <span style="flex:1"></span>
      <button class="btn ghost ${S.flags[key]?"on":""}" id="q-flag">${S.flags[key]?"★ Marcada":"☆ Marcar para rever"}</button>
    </div>
  </div>`;
}

function quizResult(){
  const total = Q.lista.length;
  const certas = Q.lista.filter(q=>Q.respostas[qid(q.mod,q.n)]===q.correcta).length;
  const nota = Math.round(certas/total*20*10)/10;
  const aprov = nota>=10, oral = !aprov && nota>=8.5;
  const erradas = Q.lista.filter(q=>Q.respostas[qid(q.mod,q.n)]!==q.correcta);
  const porMod = {};
  Q.lista.forEach(q=>{ const k=q.mod; porMod[k]=porMod[k]||{c:0,t:0}; porMod[k].t++; if(Q.respostas[qid(q.mod,q.n)]===q.correcta) porMod[k].c++; });
  return `
  <div class="card result">
    <span class="eyebrow">${Q.titulo || (Q.feedback?"Resultado do teste":"Simulado geral")}</span>
    <div class="grade" style="color:${aprov?"var(--good)":"var(--bad)"};margin-top:10px">${nota.toString().replace(".",",")}</div>
    <div class="of">valores em 20 · ${certas} de ${total} certas</div>
    <div style="margin-top:16px">
      <span class="pill ${aprov?"good":"bad"}">${aprov?"Aprovado":(oral?"Admitido a prova oral":"Não aprovado")}</span>
    </div>
    <p class="footnote" style="margin:14px auto 0">${aprov?"Acima dos 10 valores exigidos pelo Art.º 20.º.":(oral?"Entre 8,5 e 10 — no exame real irias a oral. Falta pouco.":"Abaixo de 8,5. Volta ao resumo do módulo antes de repetir.")}</p>
    ${Object.keys(porMod).length>1?`<div class="chips" style="justify-content:center;margin-top:18px">
      ${Object.entries(porMod).map(([k,v])=>`<span class="chip">M${k} · ${v.c}/${v.t}</span>`).join("")}</div>`:""}
    <div class="qfoot" style="justify-content:center">
      <button class="btn" id="q-again">Repetir</button>
      <button class="btn ghost" id="q-home">Voltar ao início</button>
    </div>
  </div>
  ${erradas.length?`<div><span class="eyebrow">Rever estas (${erradas.length})</span>
    <div class="review">${erradas.map(q=>`<div class="revrow"><span class="rn">M${q.mod}.${q.n}</span>
      <span><span class="rq">${esc(q.enunciado)}</span>
      <span class="ra"><b>Certa: ${q.correcta})</b> ${esc(q.opcoes[q.correcta])}${q.explicacao?" — "+esc(q.explicacao):""}</span></span></div>`).join("")}</div></div>`:""}`;
}

function mountQuiz(el){
  if(!Q) return;
  if(Q.i>=Q.lista.length){ el.innerHTML = quizResult();
    clearInterval(timerId);
    el.querySelector("#q-again").onclick = ()=>{ const o={feedback:Q.feedback, titulo:Q.titulo, minutos:Q.minutosOrig};
      startQuiz(Q.lista.slice().sort(()=>Math.random()-0.5), Q.modo, o); render(); };
    el.querySelector("#q-home").onclick = ()=>go("home");
    return;
  }
  el.innerHTML = quizHTML();
  const q = Q.lista[Q.i], key = qid(q.mod,q.n);
  el.querySelectorAll("[data-opt]").forEach(b => b.onclick = ()=>{
    const l = b.dataset.opt;
    Q.respostas[key] = l;
    if(Q.feedback){ S.resp[key] = l; save(); drawNav(); }
    mountQuiz(el);
  });
  const nx = el.querySelector("#q-next"); if(nx) nx.onclick = ()=>{ Q.i++; mountQuiz(el); window.scrollTo({top:0,behavior:"smooth"}); };
  const pv = el.querySelector("#q-prev"); if(pv) pv.onclick = ()=>{ Q.i--; mountQuiz(el); };
  el.querySelector("#q-flag").onclick = ()=>{ S.flags[key] = !S.flags[key]; if(!S.flags[key]) delete S.flags[key]; save(); mountQuiz(el); };
}

/* ---------- plano de estudo ---------- */
const PERIODOS = [
  {n:1, mods:[1], nome:"Contabilidade Financeira"},
  {n:2, mods:[2], nome:"Fiscalidade"},
  {n:3, mods:[3,4], nome:"Contabilidade de Gestão e Controlo Interno"},
  {n:4, mods:[5,6,7], nome:"Gestão Financeira, Direito e Ética"},
];
const DIA_MS = 86400000;
const EXAME_INI = "2026-09-21", EXAME_FIM = "2026-09-25", TESTE_MOODLE = "2026-09-10";
const hoje0 = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const iso = d => d.toISOString().slice(0,10);
const dLabel = d => d.toLocaleDateString("pt-PT",{weekday:"short", day:"2-digit", month:"short"});

function gerarPlano(){
  const fim = new Date((S.exame || EXAME_INI)+"T00:00:00");
  const ini = hoje0();
  const dias = Math.max(3, Math.round((fim-ini)/DIA_MS)+1);
  const finais = Math.min(4, Math.max(2, Math.floor(dias*0.18)));
  const conteudo = dias - finais;
  const unidades = [];
  MODS.forEach(m => {
    m.sessoes.forEach(se => unidades.push({mod:m.num, txt:`M${m.num} · Sessão ${se.n} — ${se.titulo}`, tipo:"estudo"}));
    unidades.push({mod:m.num, txt:`Teste do Módulo ${m.num} (${m.perguntas.length} perguntas)`, tipo:"teste"});
  });
  const porDia = Math.ceil(unidades.length / conteudo);
  const plano = [];
  let u = 0;
  for(let i=0; i<conteudo; i++){
    const itens = unidades.slice(u, u+porDia); u += porDia;
    if(!itens.length) continue;
    const extra = (i>0 && (i+1)%7===0) ? [{txt:"Simulado geral de 20 perguntas", tipo:"simulado"}] : [];
    plano.push({data:new Date(ini.getTime()+i*DIA_MS), tag:"Estudo", itens:itens.concat(extra)});
  }
  const finaisPlano = [
    {tag:"Revisão", itens:[{txt:"Formulário completo — ler as fórmulas dos 7 módulos",tipo:"estudo"},
                           {txt:"As minhas dúvidas — refazer tudo o que erraste",tipo:"teste"}]},
    {tag:"Simulado", itens:[{txt:"Modo prova: Período 1 e Período 2, cronometrados",tipo:"prova"}]},
    {tag:"Simulado", itens:[{txt:"Modo prova: Período 3 e Período 4, cronometrados",tipo:"prova"},
                            {txt:"Módulo 7 — Estatuto, Código de Ética e regulamentos",tipo:"estudo"}]},
    {tag:"Véspera", itens:[{txt:"Só formulário e temas de frequência muito alta. Dormir cedo.",tipo:"estudo"}]},
  ].slice(-finais);
  finaisPlano.forEach((d,k) => plano.push({data:new Date(ini.getTime()+(conteudo+k)*DIA_MS), tag:d.tag, itens:d.itens}));
  const dTeste = plano.find(d => iso(d.data)===TESTE_MOODLE);
  if(dTeste) dTeste.itens.unshift({txt:"⚑ Exame teste online no Moodle — confirmar que entras na plataforma", tipo:"moodle"});
  return plano;
}

function vPlano(){
  const plano = gerarPlano();
  const hj = iso(hoje0());
  const feitos = S.plano || {};
  const fim = S.exame || EXAME_INI;

  const hojeDia = plano.find(d => iso(d.data)===hj);

            <span class="dtag">${d.tag}</span>
            <ul>${d.itens.map(i=>`<li>${esc(i.txt)}</li>`).join("")}</ul>
            <button class="dchk" data-dia="${k}">${feitos[k]?"✓ feito":"marcar"}</button>

function vProva(){
  return `<div class="hero" style="padding:30px 0 10px">
    <div class="kicker">Como no dia do exame</div><h2 style="font-size:31px">Modo prova</h2>
    <p class="lede">A prova escrita são oito horas em quatro períodos de duas horas, cada um com os seus módulos. Aqui fazes um período de cada vez, com cronómetro a correr e correção só no fim.</p></div>
  <div class="stack">
    ${PERIODOS.map(p=>{
      const n = all().filter(q=>p.mods.includes(q.mod)).length;
      return `<button class="periodcard" data-periodo="${p.n}">
        <span class="pnum">Período ${p.n}</span>
        <span><span class="pt">${esc(p.nome)}</span><br><span class="ps">Módulo${p.mods.length>1?"s":""} ${p.mods.join(", ")} · ${n} perguntas · 2 horas</span></span>
        <span class="pill acc">Começar</span></button>`;}).join("")}
    <p class="footnote">Aprovas o módulo com 10 valores em 20. Entre 8,5 e 10 irias a prova oral — o resultado aqui diz-te em qual dos casos estarias.</p>
  </div>`;
}

/* ---------- render ---------- */
function render(){
  const el = document.getElementById("view");
  const crumb = document.getElementById("crumb");
  if(view.name==="home"){ crumb.textContent="Início"; el.innerHTML = vHome();
    el.querySelectorAll("[data-openmod]").forEach(b=>b.onclick=()=>go("modulo", +b.dataset.openmod));
    el.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
    el.querySelector("#btn-continuar").onclick = ()=>{
      const m = MODS.find(m=>stats(m).feitas < m.perguntas.length) || MODS[0];
      view.tab = "teste"; go("modulo", m.num);
    };
  }
  else if(view.name==="modulo"){
    const m = MODS.find(x=>x.num===view.arg);
    crumb.textContent = `Módulo ${m.num} · ${m.nome}`;
    el.innerHTML = vModulo(view.arg);
    el.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ view.tab=b.dataset.tab; render(); });
    if((view.tab||"resumo")==="teste"){
      const lista = m.perguntas.map(q=>({...q, mod:m.num, modnome:m.nome}));
      if(!Q || Q.modo!=="modulo"+m.num) startQuiz(lista, "modulo"+m.num, {feedback:true, titulo:"Resultado do teste"});
      mountQuiz(el.querySelector("#quizmount"));
    }
  }
  else if(view.name==="simulado"){
    crumb.textContent = "Simulado geral";
    if(Q && Q.modo==="exame"){ el.innerHTML = `<div class="hero" style="padding:26px 0 10px"><div class="kicker">Simulado geral</div><h2 style="font-size:28px">Prova em curso</h2></div><div id="quizmount"></div>
      <div class="qfoot"><button class="btn ghost" id="simquit">Terminar e corrigir</button></div>`;
      mountQuiz(el.querySelector("#quizmount"));
      el.querySelector("#simquit").onclick = ()=>{ Q.i = Q.lista.length; clearInterval(timerId); render(); };
    } else {
      el.innerHTML = vSimulado();
      let n = 20;
      el.querySelectorAll("#simsize .chip").forEach(b=>b.onclick=()=>{
        n = +b.dataset.n; el.querySelectorAll("#simsize .chip").forEach(x=>x.classList.remove("on")); b.classList.add("on");
      });
      el.querySelector("#simstart").onclick = ()=>{
        const pool = all().sort(()=>Math.random()-0.5);
        startQuiz(n ? pool.slice(0,n) : pool, "exame", {feedback:false, titulo:"Simulado geral"}); render();
      };
    }
  }
  else if(view.name==="prova"){
    crumb.textContent = "Modo prova";
    if(Q && Q.modo && Q.modo.startsWith("periodo")){
      el.innerHTML = `<div class="hero" style="padding:26px 0 10px"><div class="kicker">${esc(Q.titulo)}</div>
        <h2 style="font-size:28px">Prova em curso</h2></div><div id="quizmount"></div>
        <div class="qfoot"><button class="btn ghost" id="simquit">Terminar e corrigir</button></div>`;
      mountQuiz(el.querySelector("#quizmount"));
      const b = el.querySelector("#simquit"); if(b) b.onclick = ()=>{ Q.i = Q.lista.length; clearInterval(timerId); render(); };
    } else {
      el.innerHTML = vProva();
      el.querySelectorAll("[data-periodo]").forEach(b=>b.onclick=()=>{
        const p = PERIODOS.find(x=>x.n===+b.dataset.periodo);
        const lista = all().filter(q=>p.mods.includes(q.mod)).sort(()=>Math.random()-0.5);
        startQuiz(lista, "periodo"+p.n, {feedback:false, minutos:120, titulo:`Período ${p.n} · ${p.nome}`});
        Q.minutosOrig = 120; render();
      });
    }
  }
  else if(view.name==="plano"){
    crumb.textContent = "Plano de estudo";
    el.innerHTML = vPlano();
    const di = el.querySelector("#dataexame");
    di.onchange = ()=>{ S.exame = di.value; save(); render(); };
    el.querySelectorAll("[data-dia]").forEach(b=>b.onclick=()=>{
      S.plano = S.plano || {}; const k = b.dataset.dia;
      if(S.plano[k]) delete S.plano[k]; else S.plano[k] = 1;
      save(); render();
    });
    const hb = el.querySelector("#hoje-ok");
    if(hb) hb.onclick = ()=>{ S.plano = S.plano || {}; const k = iso(hoje0());
      if(S.plano[k]) delete S.plano[k]; else S.plano[k] = 1; save(); render(); };
  }
  else if(view.name==="formulario"){ crumb.textContent="Formulário"; el.innerHTML = vFormulario(); }
  else if(view.name==="duvidas"){ crumb.textContent="As minhas dúvidas"; el.innerHTML = vDuvidas(); }
  drawNav();
}

/* ---------- topo ---------- */
document.getElementById("themebtn").onclick = ()=>{
  const r = document.documentElement;
  const dark = r.getAttribute("data-theme")==="dark" ||
    (!r.getAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
  r.setAttribute("data-theme", dark ? "light" : "dark");
  try{ localStorage.setItem("ocpca8.tema", r.getAttribute("data-theme")); }catch(e){}
};
try{ const t = localStorage.getItem("ocpca8.tema"); if(t) document.documentElement.setAttribute("data-theme", t); }catch(e){}
document.getElementById("resetbtn").onclick = ()=>{
  S = {resp:{}, flags:{}, plano:{}, exame:S.exame}; save(); Q = null; clearInterval(timerId); go("home");
};
render();
</script>
</body>
</html>
