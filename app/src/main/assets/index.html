, "explicacao": "", "fonte": "Sessão 6 — questoes tipo sessao 6 imparidades, inv imoveis e ancdv - Ch"}, {"n": 156, "enunciado": "Em 31 de Dezembro de 2018, A empresa Gama, S.A., tem em curso um plano de venda da sua sede por 60.000.000 Kz (preço de mercado) tendo já desenvolvido algumas diligências no sentido de encontrar um comprador. A empresa já adquiriu e já está a utilizar outro edifício como a sua sede. Neste sentido, a data de relato, o edifício deve ser mensurado:", "opcoes": {"A": "Pela quantia pela qual se encontra registado ou pelo valor de realização líquido, dos dois o mais baixo", "B": "Pela quantia pela qual se encontra registado ou pelo valor de realização líquido, dos dois o mais alto", "C": "Pelo valor de realização liquido", "D": "Nenhuma das anteriores."}, "correcta": "A", "explicacao": "", "fonte": "Sessão 6 — questoes tipo sessao 6 imparidades, inv imoveis e ancdv - Ch"}, {"n": 157, "enunciado": "A empresa Kapa adquiriu um apartamento tipologia T3, habitacional, situado nas imediações da sede da empresa, exclusivamente adquirido para arrendamento para os funcionários da empresa. De acordo com a norma internacional nº 40 – Propriedade de investimentos, este imóvel deve ser classificado como:", "opcoes": {"A": "Imobilizado corpóreo", "B": "Propriedade de investimento", "C": "Existências", "D": "d)Nenhuma das anteriores"}, "correcta": "A", "explicacao": "", "fonte": "Sessão 6 — questoes tipo sessao 6 imparidades, inv imoveis e ancdv - Ch"}, {"n": 158, "enunciado": "A empresa Silva, Lda. Possui no seu imobilizado um conjunto de máquinas que em 31 de Dezembro de 2019 deixaram de ser utilizadas e passaram a ser detidas para venda. Os custos estimados de venda destes activos é de 100.000 Kz, e o respectivo justo valor ascende a 900.000 Kz. A quantia escriturada do activo antes da reclassificação para detido para venda era de 1.500.000 Kz. O valor evidenciado no activo destas máquinas em 31 de Dezembro de 2019, deverá ser:", "opcoes": {"A": "800.000 Kz", "B": "900.000 Kz", "C": "1.400.000 Kz", "D": "1.500.000 Kz"}, "correcta": "A", "explicacao": "", "fonte": "Sessão 6 — questoes tipo sessao 6 imparidades, inv imoveis e ancdv - Ch"}, {"n": 159, "enunciado": "A empresa TudoCompra adquiriu um terreno em Janeiro de 2019, não tendo ainda decidido o que fará com este terreno. Na contabilidade, este terreno deve ser reconhecido como:", "opcoes": {"A": "imobilizado corpóreo", "B": "investimentos em imoveis", "C": "custo", "D": "d)nenhuma das anteriores"}, "correcta": "B", "explicacao": "", "fonte": "Sessão 6 — questoes tipo sessao 6 imparidades, inv imoveis e ancdv - Ch"}, {"n": 160, "enunciado": "A empresa Silva, Lda. adquiriu em janeiro de 2015 um equipamento por 2.000.000 Kz com uma vida útil de 10 anos. O equipamento entrou de imediato em funcionamento. Em 31 de Dezembro de 2019, o preço de mercado do equipamento era de 800.000 Kz. Nesta data existe ainda a opção de alugar o equipamento por 20.000 Kz/mês. Neste contexto, em 31 de Dezembro de 2019, deve-se:", "opcoes": {"A": "Reconhecer uma amortização extraordinária porque a quantia recuperável é inferior ao valor contabilístico", "B": "Reconhecer uma amortização extraordinária porque a quantia recuperável é superior ao valor contabilístico", "C": "Não reconhecer nenhuma amortização extraordinária porque a quantia recuperável é superior ao valor contabilístico", "D": "Nenhuma das anteriores"}, "correcta": "C", "explicacao": "", "fonte": "Sessão 6 — questoes tipo sessao 6 imparidades, inv imoveis e ancdv - Ch"}, {"n": 161, "enunciado": "O registo de amortizações extraordinárias surgem quando:", "opcoes": {"A": "O justo valor do activo exceder a sua quantia registada", "B": "A quantia registada do activo exceder a sua quantia recuperável", "C": "A quantia recuperável do activo for superior à sua quantia registada", "D": "A quantia recuperável do activo for maior do que o seu justo valor."}, "correcta": "B", "explicacao": "", "fonte": "Sessão 6 — questoes tipo sessao 6 imparidades, inv imoveis e ancdv - Ch"}, {"n": 166, "enunciado": "Em 2017 a sociedade Carsilva, SA, constituiu uma provisão para clientes de cobrança duvidosa, no montante de 50.000 Kz. Deste, apenas 60 por cento são custos do período aceites fiscalmente. Considerando as taxas de 30% e de 25% de Imposto Industrial para 2017 e 2018, respetivamente, tendo em conta que se trata de uma empresa lucrativa, esta provisão em dívidas a receber pode originar: O reconhecimento de um passivo por imposto diferido de 6 000 Kz.", "opcoes": {"A": "O reconhecimento de um passivo por imposto diferido de 6.000 Kz", "B": "O reconhecimento de um passivo por imposto diferido de 5.000 Kz", "C": "O reconhecimento de um activo por imposto diferido de 5.000 Kz", "D": "Não há lugar ao reconhecimento de imposto diferido"}, "correcta": "C", "explicacao": "a 1.ª alínea ('O reconhecimento de um passivo por imposto diferido de 6.000 Kz') ficou colada ao enunciado, todas as alíneas subiram uma posição e a alínea D passou a conter um comentário do formador. A resposta correcta é 'O reconhecimento de um ACTIVO por imposto diferido de 5.000 Kz' — que, na numeração actual da app, é a opção C e não a D. Cálculo: da provisão de 50.000 Kz só 60% (30.000) é aceite fiscalmente; os 20.000 Kz não aceites são uma diferença temporária DEDUTÍVEL (activo por imposto diferido) e aplica-se a taxa em vigor no exercício da reversão, 25% (2018): 20.000 x 25% = 5.000 Kz.", "fonte": "Sessão 7 — questões sessao 7 - alt. politicias, Impostos dif e outros - · resposta revista"}, {"n": 167, "enunciado": "Qual destas situações não dá lugar a uma diferença temporária de acordo com a norma internacional de contabilidade nº 12 – impostos sobre os lucros.", "opcoes": {"A": "Uma provisão para perdas em investimentos financeiros.", "B": "Uma provisão para cobrança duvidosa.", "C": "A quantia relativa a uma multa por entrega fora de prazo da declaração do IVA.", "D": "Nenhuma das anteriores."}, "correcta": "C", "explicacao": "", "fonte": "Sessão 7 — questões sessao 7 - alt. politicias, Impostos dif e outros -"}, {"n": 169, "enunciado": "A empresa GATICE tem dois lotes de uma mesma mercadoria: Lote Nº1 de 100.000 unidades da mercadoria ZX, valor total 1.000.000kz Lote Nº2 de 50.000 unidades da mercadoria ZX, valor total 450.000kz A GATICE vendeu 65.000 unidades da mercadoria ZX. Qual o custo da mercadoria vendida se A GATICE valorizar as suas existências ao critério do Custo Médio Ponderado?", "opcoes": {"A": "600.000kz", "B": "617.500kz", "C": "628.333kz.", "D": "650.000kz"}, "correcta": "C", "explicacao": "", "fonte": "Sessão 3 — Perguntas Sessao 3-RESPOSTAS.docx"}, {"n": 170, "enunciado": "A empresa GATICE tem dois lotes de uma mesma mercadoria: Lote Nº1 de 100.000 unidades da mercadoria ZX, valor total 1.000.000kz Lote Nº2 de 50.000 unidades da mercadoria ZX, valor total 450.000kz A GATICE vendeu 65.000 unidades da mercadoria ZX. Qual o custo da mercadoria vendida se A GATICE valorizar as suas existências ao critério do LIFO?", "opcoes": {"A": "600.000kz", "B": "617.500kz", "C": "628.333kz.", "D": "650.000kz"}, "correcta": "A", "explicacao": "", "fonte": "Sessão 3 — Perguntas Sessao 3-RESPOSTAS.docx"}]}, {"num": 2, "rotulo": "Módulo 2", "nome": "Fiscalidade / Direito Fiscal", "sessoes": [{"n": 1, "titulo": "Imposto sobre o Rendimento do Trabalho (IRT) e Segurança Social", "norma": "Código do IRT (Lei 28/20) · Regime Jurídico de Vinculação e Contribuição da Protecção Social Obrigatória (Decreto Presidencial 227/18)", "objectivo": "Determinar a incidência, os grupos de tributação e as regras de liquidação do IRT sobre rendimentos do trabalho, e a base de incidência contributiva da Segurança Social angolana.", "pontos": ["O IRT incide sobre 3 grandes grupos: Grupo A — trabalhadores por conta de outrem, com vínculo laboral e subordinação (Lei Geral do Trabalho), incluindo gerentes/administradores e membros de órgãos sociais equiparados; Grupo B — trabalhadores independentes/prestadores de serviços (recibos verdes, profissões liberais); Grupo C — pequenos contribuintes sem contabilidade organizada (comércio a retalho, indústria de pequena escala), tributados com base na Tabela dos Lucros Mínimos.", "Grupo A: a matéria colectável é a remuneração ilíquida mensal, à qual se aplicam as taxas da tabela progressiva do IRT; certos subsídios têm limites de isenção (ex.: subsídios de transporte e de alimentação isentos até 30.000 Akz cada — o excedente é tributado).", "Grupo B: quando o prestador de serviços factura a uma entidade com contabilidade organizada, esta retém o IRT na fonte (taxas típicas de 6,5% ou 10,5% consoante o tipo de serviço); quando presta serviços a particulares/entidades sem contabilidade organizada, a liquidação é feita pelo próprio prestador, através de declaração Modelo 1.", "Grupo C: a matéria colectável é fixada pela Tabela dos Lucros Mínimos aprovada para a actividade em causa (não pelo volume real de vendas), salvo se o contribuinte optar por/for enquadrado em contabilidade organizada.", "A Segurança Social (Protecção Social Obrigatória) incide sobre a generalidade das remunerações pagas ao trabalhador — mas os subsídios de transporte e alimentação, dentro dos limites legais, ficam fora da base contributiva; a taxa contributiva global reparte-se entre entidade empregadora e trabalhador (a maior parte a cargo da entidade empregadora).", "Declarações e prazos: os rendimentos do Grupo B/C liquidados por autoliquidação seguem prazos próprios (declaração Modelo 1); o incumprimento (falta ou atraso de retenção/entrega do IRT retido) é sancionado com multas fixadas no Código do IRT."], "formulas": ["IRT Grupo A = Tabela progressiva aplicada à remuneração ilíquida mensal (após dedução de subsídios isentos dentro dos limites legais)", "IRT Grupo B (retenção na fonte, cliente com contabilidade organizada) = Valor do serviço × taxa de retenção aplicável (6,5% ou 10,5%, conforme a natureza do rendimento)", "IRT Grupo C = Valor da Tabela de Lucros Mínimos aplicável à actividade (não o volume de vendas real)"], "erros": ["Não confundir o critério de classificação: o que determina o grupo não é a profissão em si, mas a existência (ou não) de vínculo laboral/subordinação com a entidade pagadora.", "Os limites de isenção dos subsídios de transporte/alimentação aplicam-se tanto para efeitos de IRT como (com regras próprias) para a base de incidência da Segurança Social — são temas frequentemente cruzados no mesmo exercício."]}, {"n": 2, "titulo": "Imposto sobre o Valor Acrescentado (IVA) e Regime Jurídico das Facturas e Documentos Equivalentes (RJFDE)", "norma": "Código do IVA (Lei 7/19, alterada pela Lei 14/23) · Regime Jurídico das Facturas e Documentos Equivalentes (Lei 292/18)", "objectivo": "Determinar a incidência objectiva e subjectiva do IVA (transmissões de bens, prestações de serviços e importações), a localização das operações, o momento de exigibilidade do imposto, e os requisitos formais de facturação.", "pontos": ["Estão sujeitas a IVA: transmissões de bens, prestações de serviços e importações de bens efectuadas em território nacional por um sujeito passivo agindo nessa qualidade.", "Localização: uma prestação de serviços só é tributada em Angola se, segundo as regras de localização do CIVA, se considerar realizada em território nacional (regra geral: localização do adquirente/sujeito passivo ou do local da prestação, consoante o tipo de serviço).", "Reverse charge: quando um sujeito passivo angolano adquire serviços a um prestador estrangeiro sem estabelecimento estável em Angola, é o ADQUIRENTE angolano que fica responsável por liquidar o IVA devido (autoliquidação), e não o prestador estrangeiro.", "Exigibilidade: em regra, no momento da transmissão do bem/prestação do serviço ou da emissão da factura, se anterior; adiantamentos/sinais estão sujeitos a IVA no momento do recebimento; mercadorias enviadas à consignação consideram-se transmitidas (e o IVA torna-se exigível) se não devolvidas/vendidas dentro do prazo legal (180 dias).", "Valor tributável: preço + encargos acessórios facturados ao cliente (transporte, embalagem) − descontos/bónus concedidos na própria factura.", "Transmissões de imóveis para habitação estão, em regra, isentas de IVA (mas sujeitas a Imposto de Selo sobre o valor da transacção).", "Regime Jurídico das Facturas: define os elementos obrigatórios de uma factura (identificação das partes, NIF, numeração sequencial, descrição, valores, taxa e valor de IVA); documentos como a factura pró-forma, nota de encomenda ou nota de remessa NÃO substituem a factura para efeitos fiscais; a nota de crédito é o documento rectificativo que reduz o valor de uma factura já emitida (devoluções, descontos posteriores)."], "formulas": ["Valor tributável = Preço de venda + encargos acessórios (transporte, embalagem) − descontos comerciais concedidos na factura", "IVA liquidado = Valor tributável × taxa (regra geral 14%)", "IVA a pagar (regime geral) = IVA liquidado nas vendas − IVA dedutível nas compras/aquisições relacionadas com a actividade tributada"], "erros": ["Um desconto CONCEDIDO NA FACTURA reduz o valor tributável; um bónus ou desconto concedido FORA da factura (posteriormente) exige nota de crédito e não reduz o valor tributável original.", "Não esquecer o mecanismo de reverse charge (autoliquidação) sempre que o prestador estrangeiro não tem estabelecimento estável em Angola — é um erro comum atribuir a responsabilidade ao prestador estrangeiro."]}, {"n": 3, "titulo": "Imposto Industrial", "norma": "Código do Imposto Industrial (Lei 19/14, com alterações da Lei 26/20)", "objectivo": "Determinar os sujeitos passivos, os regimes de tributação (geral e simplificado) e as regras de apuramento do lucro tributável do Imposto Industrial, incluindo custos não aceites fiscalmente e reporte de prejuízos.", "pontos": ["São sujeitos passivos as sociedades comerciais, cooperativas, fundações, associações, fundos autónomos, empresas públicas e demais pessoas colectivas com sede ou direcção efectiva em Angola, bem como entidades sem sede em Angola que aqui obtenham rendimentos através de estabelecimento estável.", "O enquadramento no regime geral vs. simplificado depende de limiares de capital social e volume de proveitos/negócios definidos no Código — quanto maior a dimensão da empresa, maior a probabilidade de enquadramento no regime geral (Grupo A).", "Apuramento da matéria colectável = Lucro tributável − Prejuízos fiscais reportáveis − Benefícios fiscais (o lucro tributável parte do resultado contabilístico, ajustado por acréscimos e deduções fiscais).", "Custos não aceites fiscalmente (exigem acréscimo ao resultado contabilístico para apurar o lucro tributável): multas e penalidades fiscais; despesas não devidamente documentadas; encargos com bens de uso e fruição pessoal sem relação com a actividade (ex.: embarcações de recreio); juros de suprimentos de sócios que excedam a taxa de referência do BNA (o excesso sobre a taxa BNA é acrescido).", "Prejuízos fiscais são reportáveis para os exercícios seguintes dentro de um prazo legal limitado (regime geral) — decorrido esse prazo, o prejuízo não utilizado perde-se e não pode compensar lucros de exercícios posteriores.", "Retenções na fonte de Imposto Industrial aplicam-se a determinados serviços prestados por terceiros (taxas específicas consoante a natureza do serviço e se o prestador é pessoa singular ou colectiva, com ou sem contabilidade organizada).", "Pagamentos por conta/provisórios: empresas em início de actividade e demais sujeitos passivos do regime geral efectuam pagamentos provisórios do Imposto Industrial com base no volume de negócios do semestre, com prazo legal de entrega."], "formulas": ["Lucro tributável = Resultado contabilístico + Acréscimos fiscais (custos não aceites) − Deduções fiscais", "Matéria colectável = Lucro tributável − Prejuízos fiscais reportáveis (dentro do prazo legal) − Benefícios fiscais", "Retenção na fonte sobre serviços = Valor do serviço × taxa de retenção aplicável ao tipo de prestação"], "erros": ["Distinguir custo CONTABILÍSTICO (sempre registado, por ser um custo real da empresa) de custo FISCALMENTE ACEITE (só reduz o lucro tributável se cumprir os requisitos legais) — a diferença gera sempre um acréscimo fiscal, nunca uma correcção contabilística.", "Prejuízos fiscais de exercícios já fora do prazo legal de reporte NÃO podem ser usados para reduzir a matéria colectável do exercício corrente, mesmo que a empresa nunca os tenha efectivamente utilizado."]}, {"n": 4, "titulo": "Imposto Predial (IP) e Imposto de Selo", "norma": "Código do Imposto Predial (Lei 20/20) · Código do Imposto de Selo (Decreto Legislativo Presidencial 3/14)", "objectivo": "Determinar a incidência do Imposto Predial sobre a propriedade e o arrendamento de imóveis, e do Imposto de Selo sobre um conjunto amplo de actos, contratos e documentos, incluindo a identificação do sujeito passivo e de quem suporta efectivamente o encargo em cada operação.", "pontos": ["O Imposto Predial incide em duas vertentes principais: (i) sobre a titularidade/posse de imóveis urbanos não arrendados, tomando por base o valor patrimonial (de aquisição ou de avaliação, o que for mais elevado/aplicável nos termos do Código), com uma tabela progressiva que inclui uma parcela isenta inicial; (ii) sobre rendas de imóveis arrendados, incidindo sobre o valor da renda recebida.", "Nas rendas de imóveis com uso comercial/misto, aplica-se um coeficiente de redução (ex.: 60%) à renda antes da aplicação da taxa, o que resulta numa taxa efectiva inferior à taxa nominal — em exercícios práticos, o valor final costuma corresponder a aplicar directamente a taxa efectiva (ex.: 15%) sobre a renda total.", "A aquisição de habitação própria e permanente pode beneficiar de isenções específicas previstas no Código, sujeitas a condições e limites de valor — deve confirmar-se sempre se a operação em concreto cumpre os requisitos da isenção antes de a aplicar.", "O Imposto de Selo incide sobre uma tabela ampla de actos e contratos: contratos de arrendamento, locação financeira, aumento de capital social, trespasses de estabelecimento, actos notariais (como a legalização de livros sociais), entre outros — cada verba da tabela tem a sua própria taxa.", "É essencial distinguir, em cada operação de Imposto de Selo, o SUJEITO PASSIVO (quem tem a obrigação legal de liquidar/entregar o imposto) de quem SUPORTA O ENCARGO económico — nem sempre coincidem, e o Código define expressamente ambos para cada tipo de acto (ex.: no arrendamento, o senhorio/locador é normalmente sujeito passivo e suporta o encargo; na locação financeira, é a instituição financeira locadora).", "Contratos de trabalho estão isentos de Imposto de Selo; a transmissão onerosa de imóveis está sujeita a Imposto de Selo (mesmo quando isenta de IVA), tipicamente a uma taxa específica sobre o valor da transacção."], "formulas": ["IP sobre imóvel não arrendado = (Valor patrimonial − parcela isenta da tabela) × taxa da escala aplicável", "IP sobre rendas = Renda × taxa efectiva aplicável (directa, ou via coeficiente de redução × taxa nominal, consoante o tipo de uso do imóvel)", "Imposto de Selo sobre um contrato = Valor do contrato (ou valor anual da renda) × taxa da verba aplicável da tabela geral do Imposto de Selo"], "erros": ["Não presumir que uma transmissão de imóvel isenta de IVA está também isenta de Imposto de Selo — são impostos distintos e a isenção de um não implica a isenção do outro.", "Identificar sempre separadamente quem é o sujeito passivo (obrigação legal perante o Estado) e quem suporta o custo económico do Imposto de Selo — é um ponto clássico de confusão nos exames."]}, {"n": 5, "titulo": "Imposto sobre a Aplicação de Capitais (IAC)", "norma": "Código do Imposto sobre a Aplicação de Capitais (Decreto Legislativo Presidencial 2/14, alterado pela Lei 8/22)", "objectivo": "Determinar a incidência do IAC sobre rendimentos de capitais — juros, lucros distribuídos, royalties e rendimentos análogos — e as respectivas taxas, responsáveis pela liquidação e prazos de entrega.", "pontos": ["O IAC incide, entre outros, sobre: lucros distribuídos aos sócios de sociedades comerciais; juros de suprimentos e de contas correntes entre sócios e sociedades; juros de capitais mutuados entre particulares; royalties.", "A responsabilidade pela retenção na fonte varia consoante o tipo de rendimento: nos lucros distribuídos e nos juros de suprimentos/contas correntes pagos por uma sociedade, é normalmente a SOCIEDADE PAGADORA que retém e entrega o imposto; em rendimentos entre particulares sem entidade pagadora com contabilidade organizada, a liquidação cabe ao próprio titular do rendimento (autoliquidação).", "Taxas: os lucros distribuídos são tributados a uma taxa de 10% sobre a quota-parte do lucro distribuído correspondente à participação de cada sócio; os juros de suprimentos/contas correntes entre sócios e sociedade estão sujeitos a taxas específicas que podem variar consoante a classificação do rendimento no Código (secções distintas do CIAC, com taxas na ordem dos 10% a 15% consoante o tipo de operação).", "Prazos de entrega: a entrega do imposto retido/autoliquidado ao Estado obedece a prazos mensais (normalmente até ao fim do mês seguinte ao do facto gerador) para retenções na fonte; e a prazos anuais próprios para as declarações de rendimentos das secções do IAC.", "Quando o beneficiário de um rendimento sujeito a IAC não tem entidade pagadora com contabilidade organizada em Angola a efectuar a retenção, é o próprio beneficiário quem assume as obrigações de liquidação e entrega do imposto, podendo ser exigida a nomeação de um representante fiscal quando o beneficiário não é residente."], "formulas": ["IAC sobre lucros distribuídos = Valor total distribuído × percentagem de participação do sócio × 10%", "IAC sobre juros de suprimentos/contas correntes = Valor dos juros pagos/vencidos × taxa aplicável (10% ou 15%, consoante a natureza da operação no CIAC)"], "erros": ["Não aplicar a taxa de IAC directamente sobre o resultado líquido da sociedade — a taxa incide apenas sobre a QUOTA-PARTE efectivamente distribuída ao sócio em causa (resultado × % distribuído × % de participação do sócio).", "Confirmar sempre se a taxa de juro de um suprimento excede a taxa de referência do BNA: isso pode gerar, em simultâneo, um acréscimo fiscal em sede de Imposto Industrial (para a sociedade) e uma base de incidência de IAC (para o sócio) — são efeitos diferentes da mesma operação."]}], "intro_temas": "A análise dos questionários de sessão (com resolução comentada, incluindo os artigos do respectivo Código aplicados em cada caso) revela que o exame de Fiscalidade privilegia problemas de aplicação prática — cálculo de imposto a pagar/reter em casos concretos — muito mais do que perguntas puramente teóricas. Os temas abaixo surgem de forma consistente nos exercícios analisados.", "temas": [{"tema": "IRT — classificação correcta do contribuinte nos Grupos A, B ou C", "freq": "Muito alta", "pedido": "Identificar se existe vínculo laboral/subordinação (Grupo A) ou prestação de serviços independente (Grupo B), e aplicar a taxa/retenção correcta consoante o cliente tenha ou não contabilidade organizada."}, {"tema": "IRT — limites de isenção de subsídios (transporte, alimentação, alojamento, férias)", "freq": "Alta", "pedido": "Cálculo do valor efectivamente tributável de remunerações acessórias, respeitando os limites legais de isenção de cada tipo de subsídio."}, {"tema": "Segurança Social — base de incidência contributiva", "freq": "Média-Alta", "pedido": "Identificar quais prestações pecuniárias integram (ou não) a base de incidência da Protecção Social Obrigatória."}, {"tema": "IVA — incidência objectiva e localização de operações (importações, exportações, serviços transfronteiriços)", "freq": "Muito alta", "pedido": "Qualificar correctamente uma operação (transmissão de bens, prestação de serviços, importação) e determinar se está localizada em Angola."}, {"tema": "IVA — reverse charge em serviços adquiridos a prestadores estrangeiros sem estabelecimento estável", "freq": "Alta", "pedido": "Identificar que é o adquirente angolano quem deve autoliquidar o IVA, não o prestador estrangeiro."}, {"tema": "IVA — momento de exigibilidade (adiantamentos, consignação, facturação)", "freq": "Alta", "pedido": "Determinar a data correcta em que o IVA se torna exigível, incluindo casos especiais como mercadorias à consignação."}, {"tema": "IVA — apuramento do valor tributável (descontos, bónus, encargos acessórios)", "freq": "Média-Alta", "pedido": "Cálculo do valor tributável de uma factura considerando descontos concedidos na própria factura vs. fora dela."}, {"tema": "RJFDE — requisitos e tipos de documentos de facturação", "freq": "Média", "pedido": "Distinguir factura, factura pró-forma, nota de crédito/débito e os elementos obrigatórios de uma factura válida."}, {"tema": "Imposto Industrial — apuramento do lucro tributável e acréscimos fiscais", "freq": "Muito alta", "pedido": "Identificar custos contabilizados que não são fiscalmente aceites (multas, despesas não documentadas, juros excessivos a sócios) e calcular o correspondente acréscimo."}, {"tema": "Imposto Industrial — reporte de prejuízos fiscais", "freq": "Alta", "pedido": "Aplicar correctamente o prazo legal de reporte de prejuízos fiscais no cálculo da matéria colectável de vários exercícios em sequência."}, {"tema": "Imposto Industrial — retenções na fonte sobre serviços de terceiros", "freq": "Média-Alta", "pedido": "Determinar se há lugar a retenção na fonte e a que taxa, consoante o tipo de serviço e a natureza do prestador."}, {"tema": "Imposto Predial — tributação de rendas vs. tributação da propriedade/posse", "freq": "Alta", "pedido": "Distinguir os dois factos geradores do IP e aplicar a taxa/coeficiente correcto a cada um (renda recebida vs. valor patrimonial do imóvel)."}, {"tema": "Imposto de Selo — identificação do sujeito passivo vs. quem suporta o encargo", "freq": "Alta", "pedido": "Em cada tipo de contrato (arrendamento, locação financeira, actos notariais), identificar corretamente as duas figuras, que nem sempre coincidem."}, {"tema": "Imposto de Selo — isenções e sobreposição com o IVA (ex.: transmissão de imóveis)", "freq": "Média", "pedido": "Reconhecer que uma operação isenta de IVA pode, ainda assim, estar sujeita a Imposto de Selo."}, {"tema": "IAC — tributação de lucros distribuídos e cálculo da quota-parte do sócio", "freq": "Alta", "pedido": "Cálculo do IAC a reter sobre lucros distribuídos, considerando a percentagem de participação de cada sócio."}, {"tema": "IAC — juros de suprimentos e contas correntes entre sócios e sociedade", "freq": "Média-Alta", "pedido": "Determinar a taxa de IAC aplicável e o responsável pela retenção em operações de financiamento entre sócios e a sociedade."}], "perguntas": [{"n": 1, "enunciado": "O Sr. Kiala presta serviços de consultoria informática a várias empresas, sem vínculo laboral com nenhuma delas, facturando os seus honorários mensalmente. Em que grupo de tributação do IRT se enquadra o Sr. Kiala?", "opcoes": {"A": "Grupo A", "B": "Grupo B", "C": "Grupo C", "D": "Não está sujeito a IRT, apenas a Imposto Industrial"}, "correcta": "B", "explicacao": "Por prestar serviços de forma independente, sem vínculo laboral nem subordinação, o Sr. Kiala enquadra-se no Grupo B do IRT (trabalhadores independentes).", "fonte": "Teste prático do resumo do Módulo 2"}, {"n": 2, "enunciado": "A empresa Kianda, Lda paga a um dos seus trabalhadores um subsídio de transporte de 45.000 Akz/mês, sendo o limite legal de isenção de 30.000 Akz. Qual o valor do subsídio de transporte sujeito a IRT?", "opcoes": {"A": "0 Akz — o subsídio é sempre isento", "B": "15.000 Akz", "C": "45.000 Akz", "D": "30.000 Akz"}, "correcta": "B", "explicacao": "Apenas o valor até ao limite legal (30.000 Akz) está isento; o excedente (45.000 − 30.000 = 15.000 Akz) é tributado em sede de IRT.", "fonte": "Teste prático do resumo do Módulo 2"}, {"n": 3, "enunciado": "A empresa Boavista, Lda, sedeada em Luanda, adquire um serviço de auditoria a uma empresa portuguesa sem estabelecimento estável em Angola, no valor de 3.000.000 Akz. Quanto à liquidação do IVA devido por esta operação:", "opcoes": {"A": "É a empresa portuguesa quem deve liquidar o IVA em Angola", "B": "A operação não está sujeita a IVA por o prestador ser estrangeiro", "C": "É a empresa Boavista, Lda, na qualidade de adquirente, quem deve autoliquidar o IVA devido (reverse charge)", "D": "O IVA só é devido se a empresa portuguesa nomear um representante fiscal em Angola"}, "correcta": "C", "explicacao": "Quando o prestador de serviços estrangeiro não tem estabelecimento estável em Angola, é o adquirente angolano quem fica responsável por autoliquidar o IVA devido (mecanismo de reverse charge).", "fonte": "Teste prático do resumo do Módulo 2"}, {"n": 4, "enunciado": "Uma factura de venda de mercadorias apresenta: preço 5.000.000 Akz; despesas de transporte facturadas ao cliente 200.000 Akz; desconto comercial concedido na própria factura de 300.000 Akz. Qual o valor tributável para efeitos de IVA?", "opcoes": {"A": "5.000.000 Akz", "B": "4.900.000 Akz", "C": "5.200.000 Akz", "D": "4.700.000 Akz"}, "correcta": "B", "explicacao": "Valor tributável = 5.000.000 + 200.000 (transporte, encargo acessório) − 300.000 (desconto concedido na factura) = 4.900.000 Akz.", "fonte": "Teste prático do resumo do Módulo 2"}, {"n": 5, "enunciado": "A empresa Alfa, Lda enviou mercadorias à consignação à empresa Beta, Lda em 01/02/2024. Até 05/09/2024 (mais de 180 dias depois) as mercadorias não tinham sido devolvidas nem vendidas. Em termos de IVA:", "opcoes": {"A": "A operação nunca estará sujeita a IVA, pois as mercadorias não foram vendidas", "B": "A operação é considerada uma transmissão de bens sujeita a IVA, tornando-se o imposto exigível decorridos os 180 dias", "C": "O IVA só é exigível quando a Beta, Lda efectivamente vender as mercadorias a um terceiro", "D": "A operação está isenta de IVA por se tratar de um envio à consignação"}, "correcta": "B", "explicacao": "Mercadorias enviadas à consignação e não devolvidas/vendidas dentro do prazo legal de 180 dias são consideradas transmitidas para efeitos de IVA, tornando-se o imposto exigível nesse momento.", "fonte": "Teste prático do resumo do Módulo 2"}, {"n": 6, "enunciado": "A empresa Girassol, Lda contabilizou como custo do exercício uma multa fiscal de 500.000 Akz e despesas de representação sem documento de suporte válido de 200.000 Akz. Para efeitos de apuramento do lucro tributável em Imposto Industrial, estes valores devem ser:", "opcoes": {"A": "Aceites integralmente como custo fiscal, por já estarem registados na contabilidade", "B": "Acrescidos ao resultado contabilístico, por não serem fiscalmente aceites como custo", "C": "Deduzidos do lucro tributável, reduzindo o imposto a pagar", "D": "Ignorados, por serem de valor imaterial"}, "correcta": "B", "explicacao": "Multas fiscais e despesas não devidamente documentadas não são fiscalmente aceites como custo, pelo que devem ser acrescidas ao resultado contabilístico para apurar o lucro tributável.", "fonte": "Teste prático do resumo do Módulo 2"}, {"n": 7, "enunciado": "Um sócio efectuou um suprimento à sociedade da qual detém 25% do capital, cobrando uma taxa de juro de 30%/ano, quando a taxa de referência do BNA era de 18%/ano. Para efeitos de Imposto Industrial da sociedade, o tratamento fiscal dos juros pagos é:", "opcoes": {"A": "Todo o juro pago é aceite como custo fiscal, por resultar de um contrato entre as partes", "B": "Nenhum juro é aceite como custo fiscal, por se tratar de uma operação entre partes relacionadas", "C": "É aceite como custo fiscal apenas o juro calculado à taxa de referência do BNA (18%); o excedente deve ser acrescido ao resultado contabilístico", "D": "O juro pago está isento de qualquer ajustamento fiscal, desde que documentado em contrato escrito"}, "correcta": "C", "explicacao": "Nos juros de suprimentos de sócios, apenas é fiscalmente aceite o valor calculado até à taxa de referência do BNA; a parte que excede essa taxa deve ser acrescida ao resultado contabilístico para efeitos de apuramento do lucro tributável.", "fonte": "Teste prático do resumo do Módulo 2"}, {"n": 8, "enunciado": "A empresa Cassoma, Lda é proprietária de um imóvel urbano que arrenda para fins exclusivamente comerciais por 300.000 Akz/mês, com uma taxa efectiva de Imposto Predial de 15% sobre a renda. Qual o valor de IP a pagar mensalmente?", "opcoes": {"A": "45.000 Akz", "B": "75.000 Akz", "C": "30.000 Akz", "D": "18.000 Akz"}, "correcta": "A", "explicacao": "IP = 300.000 × 15% = 45.000 Akz mensais.", "fonte": "Teste prático do resumo do Módulo 2"}, {"n": 9, "enunciado": "Relativamente ao Imposto de Selo devido num contrato de arrendamento comercial, o sujeito passivo do imposto e a pessoa que, em regra, suporta o respectivo encargo são:", "opcoes": {"A": "O arrendatário é sujeito passivo e suporta o encargo", "B": "O senhorio (locador) é sujeito passivo e suporta o encargo", "C": "O senhorio é sujeito passivo, mas o encargo é repercutido no arrendatário", "D": "O Estado assume directamente o encargo, sendo o senhorio apenas um intermediário"}, "correcta": "B", "explicacao": "No arrendamento, o Código do Imposto de Selo atribui ao senhorio (locador) a qualidade de sujeito passivo e, em regra, também a ele cabe suportar o encargo do imposto.", "fonte": "Teste prático do resumo do Módulo 2"}, {"n": 10, "enunciado": "A empresa Malanje Construções, Lda, dedicada exclusivamente à venda de imóveis para habitação, vendeu um apartamento por 60.000.000 Akz. Quanto ao tratamento fiscal desta venda:", "opcoes": {"A": "Está sujeita a IVA à taxa normal de 14%", "B": "Está isenta de IVA, mas sujeita a Imposto de Selo sobre o valor da transacção", "C": "Está isenta simultaneamente de IVA e de Imposto de Selo", "D": "Está sujeita apenas a Imposto Predial, e não a qualquer outro imposto"}, "correcta": "B", "explicacao": "A transmissão de imóveis para habitação está, em regra, isenta de IVA, mas continua sujeita a Imposto de Selo sobre o valor da transacção — os dois impostos não se excluem mutuamente.", "fonte": "Teste prático do resumo do Módulo 2"}, {"n": 11, "enunciado": "A sociedade XPTO, Lda distribuiu lucros de 12.000.000 Akz aos seus sócios. O sócio Manuel detém uma participação de 20% no capital social. Qual o valor de IAC a reter sobre a parte do sócio Manuel, à taxa de 10%?", "opcoes": {"A": "1.200.000 Akz", "B": "240.000 Akz", "C": "2.400.000 Akz", "D": "120.000 Akz"}, "correcta": "B", "explicacao": "IAC = 12.000.000 × 20% (quota do sócio) × 10% (taxa de IAC sobre lucros distribuídos) = 240.000 Akz.", "fonte": "Teste prático do resumo do Módulo 2"}, {"n": 12, "enunciado": "Um sócio realizou um suprimento à sua sociedade, tendo recebido juros de 400.000 Akz relativos a esse suprimento. Sobre esse rendimento, quem tem, em regra, a responsabilidade de reter e entregar o IAC ao Estado?", "opcoes": {"A": "O próprio sócio, através de autoliquidação obrigatória em qualquer circunstância", "B": "A sociedade pagadora dos juros, ao efectuar o respectivo pagamento", "C": "Nenhuma das partes — os juros de suprimentos entre sócio e sociedade estão sempre isentos de IAC", "D": "A Administração Geral Tributária, oficiosamente"}, "correcta": "B", "explicacao": "Quando os juros são pagos por uma sociedade com contabilidade organizada, é a própria sociedade pagadora quem deve reter e entregar o IAC devido ao Estado.", "fonte": "Teste prático do resumo do Módulo 2"}, {"n": 100, "enunciado": "A D. Maria recebeu no mês de junho de 2024 o subsídio de férias no valor de 350.000 AKZ. Qual das seguintes afirmações está correcta?", "opcoes": {"A": "O subsídio de férias está isento IRT e não está sujeito à contribuição para a segurança social.", "B": "O subsídio de férias está isento de IRT, mas está sujeito a contribuição para a segurança social.", "C": "O subsídio de férias está sujeito a IRT, mas não está sujeito a contribuição para a segurança social.", "D": "O subsídio de férias só está sujeito a segurança social se estiver especificado no contrato de trabalho."}, "correcta": "C", "explicacao": "", "fonte": "Sessão 1 — Fiscalidade - Perguntas Novembro 2024 (formador Ferreirinha."}, {"n": 101, "enunciado": "Em que grupo de tributação do IRT são tributados os membros, pessoas singulares, do Conselho Fiscal de uma sociedade?", "opcoes": {"A": "Grupo B.", "B": "Grupo A", "C": "Grupo C", "D": "São tributados em sede de Imposto Industrial."}, "correcta": "B", "explicacao": "", "fonte": "Sessão 1 — Fiscalidade - Perguntas Novembro 2024 (formador Ferreirinha."}, {"n": 102, "enunciado": "Orlando, diretor comercial do Hipermercado “XPTO, S.A.”, com vínculo laboral nos termos da Lei Geral do Trabalho, tem uma remuneração mensal de 1.000.000 AKZ paga pela entidade patronal.", "opcoes": {"A": "Esta remuneração está sujeita a IRT tributada pelas regras do Grupo A do IRT.", "B": "Esta remuneração não está sujeita a IRT, porque o director já tem outro rendimento de outra entidade", "C": "Esta remuneração só estaria sujeita a IRT se descontar segurança social", "D": "Esta remuneração está sujeita a IRT tributada pelas regras do Grupo B."}, "correcta": "A", "explicacao": "", "fonte": "Sessão 1 — Fiscalidade - Perguntas Novembro 2024 (formador Ferreirinha."}, {"n": 103, "enunciado": "Filipe, contabilista é trabalhador por conta própria e tem um contrato de prestação de serviços de contabilidade com a empresa Boas Contas com uma avença mensal de 750.000 AKZ.", "opcoes": {"A": "Este rendimento está sujeito a tributação no grupo A", "B": "Este rendimento está sujeito a tributação no grupo B", "C": "Este rendimento está sujeito a tributação no grupo C", "D": "Este rendimento está sujeito a tributação em imposto industrial."}, "correcta": "B", "explicacao": "", "fonte": "Sessão 1 — Fiscalidade - Perguntas Novembro 2024 (formador Ferreirinha."}, {"n": 104, "enunciado": "Sr. Kafumano celebrou um contrato de trabalho ao abrigo da legislação laboral com a empresa Accounting, Lda, encontrando-se sob a direcção e subordinação com vínculo de dependência com esta empresa. Em 2023, tinha um rendimento base de 800.000AKZ, mensal, a que acrescem as seguintes remunerações: 500.000AKZ de subsídio de alojamento (valor do contrato de arrendamento é de 300.000AKZ em nome do trabalhador e devidamente registado nas finanças), subsídio de transporte de 50.000 AKZ (limite de 30.000) e subsídio de alimentação de 40.000 Akz (limite de 30.000). Quais os valores das remunerações efectivamente tributados em sede de IRT? Indique a opção correcta:", "opcoes": {"A": "Remuneração ilíquida de 800.000 AKZ, o subsídio de alojamento de 500.000AKZ, o subsídio de transporte de 20.000AKZ e o subsídio de alimentação de 10.000 Akz", "B": "Remuneração ilíquida de 800.000AKZ, o subsídio de alojamento de 350.000AKZ, o subsídio de transporte de 20.000AKZ e o subsídio de alimentação de 10.000 Akz", "C": "Remuneração ilíquida de 800.000AKZ, o subsídio de alojamento de 500.000AKZ, o subsídio de alimentação de 30.000AKZ e o subsídio de transporte de 30.000 Akz", "D": "Remuneração ilíquida de 800.000AKZ, o subsídio de alojamento de 500.000AKZ, o subsídio de alimentação e de transporte de 60.000 AKZ"}, "correcta": "A", "explicacao": "", "fonte": "Sessão 1 — Fiscalidade - Perguntas Novembro 2024 (formador Ferreirinha."}, {"n": 106, "enunciado": "O Sr. Mendes exerce a sua actividade de comércio a retalho de bens alimentares, em supermercado, em Luanda, sem contabilidade organizada, tendo realizado no ano de 2024 vendas no valor de 12.000.000AKZ. Sabendo que o valor constante da Tabela dos Lucros Mínimos para a actividade praticada pelo Sr. Mendes é de 200.000AKZ, indique qual das seguintes respostas corresponde ao valor da sua matéria colectável?", "opcoes": {"A": "12.000.000AKZ", "B": "200.000AKZ", "C": "800.000AKZ", "D": "Isenção, pois nos três anos anteriores o Sr. Mendes não teve qualquer incumprimento fiscal"}, "correcta": "A", "explicacao": "", "fonte": "Sessão 1 — Fiscalidade - Perguntas Novembro 2024 (formador Ferreirinha."}, {"n": 108, "enunciado": "Qual das seguintes prestações pecuniárias não integram a base de incidência contributiva da Protecção Social Obrigatória:", "opcoes": {"A": "Subsídio de alimentação", "B": "Valor correspondente ao subsídio de férias", "C": "Valor correspondente ao subsídio de Natal", "D": "Todas as prestações pecuniárias recebidas estão sujeitas à Contribuição da Protecção Social Obrigatória"}, "correcta": "B", "explicacao": "", "fonte": "Sessão 1 — Fiscalidade - Perguntas Novembro 2024 (formador Ferreirinha."}, {"n": 109, "enunciado": "O Sr. José é advogado e exerce a sua actividade por conta própria, sendo todos os seus clientes entidades que possuem contabilidade organizada. Qual é declaração anual de rendimentos a que está obrigado a entregar à AGT e qual é o prazo legal para a respectiva entrega para os rendimentos obtidos no ano de 2023.", "opcoes": {"A": "Modelo 1 entregue até ao último dia do mês de Março de 2024", "B": "Modelo 2 entregue até ao último dia do mês de Fevereiro de 2024", "C": "Modelo 1 entregue até ao último dia do mês de Abril de 2024", "D": "O Sr. José não entrega a declaração anual de rendimentos, porque os seus serviços foram tributados em IRT por retenção na fonte, não havendo necessidade de entrega de declaração anual."}, "correcta": "A", "explicacao": "", "fonte": "Sessão 1 — Fiscalidade - Perguntas Novembro 2024 (formador Ferreirinha."}, {"n": 110, "enunciado": "A empresa ABC, Lda não efectuou a retenção na fonte, por negligência, do IRT no valor de 2.000.000 AKZ sobre as remunerações pagas aos seus trabalhadores há mais de 60 dias. Qual é o valor da multa?", "opcoes": {"A": "250.000 AKZ", "B": "2.000.000 AKZ", "C": "4.000.000 AKZ", "D": "No mínimo o valor de 50.000 AKZ"}, "correcta": "D", "explicacao": "", "fonte": "Sessão 1 — Fiscalidade - Perguntas Novembro 2024 (formador Ferreirinha."}, {"n": 111, "enunciado": "O Sr. Manuel é trabalhador por conta de outrem e obteve as seguintes remunerações em 2023: Rendimento base de 1.500.000AKZ, mensal, a que acresceram as seguintes remunerações: 300.000AKZ de subsídio de alojamento, 50.000 AKZ de subsídio de transporte e 70.000 AKZ de subsídio de alimentação. Qual é o valor do IRT a pagar?", "opcoes": {"A": "292.770 AKZ", "B": "358.776,78 Kz", "C": "380.400 AKZ", "D": "290.000 AKZ"}, "correcta": "B", "explicacao": "", "fonte": "Sessão 2 — Fiscalidade - Perguntas Novembro 2024.docx"}, {"n": 112, "enunciado": "O Sr. António, engenheiro civil, sem contabilidade organizada, prestou serviços no valor de 500.000,00 AKZ à empresa ABC, Lda com contabilidade organizada, em Março de 2024, sem vínculo laboral e também presta serviços de remodelação de habitações a outras pessoas particulares que não têm contabilidade. Como e quando deve ser pago o IRT?", "opcoes": {"A": "O IRT é pago pelas regras do grupo B. Assim o IRT incide sobre serviço prestado à empresa é pago pela empresa ABC até abril de 2024 por retenção na fonte à taxa de 10,5%, sendo a matéria colectável de 500.000 AKZ e a liquidação do IRT sobre o serviço prestado aos particulares é da responsabilidade do Sr. António pago até ao final de março de 2024 em declaração modelo 1.", "B": "A empresa ABC, Lda efectua o pagamento por retenção na fonte pela aquisição do serviço até abril e o serviço prestado a particulares não é pago, porque o Sr. António entende que já paga o IRT pelos serviços prestados às empresas.", "C": "O IRT é pago pelas regras do grupo C", "D": "O IRT é pago pelas regras do grupo B. Assim o IRT incide sobre serviço prestado à empresa é pago pela empresa ABC até ao final de abril de 2024 por retenção na fonte à taxa de 6,5%, sendo a matéria colectável de 500.000 AKZ e a liquidação do IRT sobre o serviço prestado aos particulares é da responsabilidade do Sr. António pago até ao final de março de 2025 em declaração modelo 1."}, "correcta": "D", "explicacao": "", "fonte": "Sessão 2 — Fiscalidade - Perguntas Novembro 2024.docx"}, {"n": 113, "enunciado": "A empresa ABC, Lda reteve e não pagou ao Estado, por negligência, o IRT no valor de 2.000.000 AKZ relativo aos rendimentos pagos aos seus trabalhadores há mais de 40 dias. Qual é o valor da multa?", "opcoes": {"A": "250.000 AKZ", "B": "2.000.000 AKZ", "C": "4.000.000 AKZ", "D": "50.000 AKZ"}, "correcta": "C", "explicacao": "", "fonte": "Sessão 2 — Fiscalidade - Perguntas Novembro 2024.docx"}, {"n": 115, "enunciado": "A sociedade Universal, SA com sede no estrangeiro e sem estabelecimento estável em Angola e sem convenção tributária estabelecida com Angola facturou em Agosto de 2024 serviços de consultoria jurídica no valor de 5.000.000 AKZ à sociedade Angolana Contas Certas, Lda. Indique a opção correcta:", "opcoes": {"A": "A sociedade Universal, SA deve nomear um representante fiscal em Angola, possuir contabilidade para registar o proveito de 5.000.000 AKZ e entregar a declaração modelo 1 até Maio de 2019.", "B": "A sociedade Universal, SA é tributada em Angola em imposto industrial, devendo a sociedade Angolana Contas Certas, Lda aplicar a taxa de 6,5% sobre o serviço adquirido", "C": "A sociedade Universal, SA não é tributada em Angola", "D": "Nenhuma das opções anteriores está correcta"}, "correcta": "B", "explicacao": "Artigos 4.º, n.º 2, 71.º, n.º 1, 72.º e 73.º, n.ºs 1 e 2 do CII", "fonte": "Sessão 3 — Fiscalidade - II - Questionário - Novembro 2024.docx"}, {"n": 116, "enunciado": "Indique a opção de resposta correcta. São sujeitos passivos do Imposto Industrial:", "opcoes": {"A": "As sociedades comerciais, as cooperativas, fundações, associações, fundos autónomos, empresas públicas e as demais pessoas colectivas de direito público ou privado, com sede ou direcção efectiva em território angolano", "B": "O Senhor António, economista, com rendimentos superiores a 500.000.000 AKZ", "C": "Os lucros distribuídos por uma sociedade comercial", "D": "A posse e titularidade de um prédio urbano."}, "correcta": "A", "explicacao": "Artigo 5.º, n.º 1, alínea a) do CII", "fonte": "Sessão 3 — Fiscalidade - II - Questionário - Novembro 2024.docx"}, {"n": 117, "enunciado": "A empresa XPTO, Lda tem um capital social de 1.500.000 AKZ e obteve no ano de 2023 um volume total de proveitos de 20.000.000 AKZ. A empresa optou pelo regime geral do imposto industrial em Abril de 2024. Em que regime de tributação se encontra a empresa com referência ao exercício de 2024. Indique a opção correcta:", "opcoes": {"A": "Regime geral", "B": "Regime simplificado", "C": "Grupo A", "D": "Grupo B."}, "correcta": "B", "explicacao": "Artigo 58.º, n.º 1.º do CII", "fonte": "Sessão 3 — Fiscalidade - II - Questionário - Novembro 2024.docx"}, {"n": 118, "enunciado": "O apuramento da matéria colectável a evidenciar na declaração modelo 1 é determinado tendo em conta uma das seguintes expressões. Indique a que está correcta:", "opcoes": {"A": "Proveitos – Custos + Acréscimos Fiscais", "B": "Proveitos – Custos + Acréscimos Fiscais – Deduções Fiscais – Prejuízos Fiscais", "C": "Lucro tributável – Prejuízos Fiscais – Benefícios Fiscais", "D": "Lucro Tributável – Deduções à colecta"}, "correcta": "C", "explicacao": "Artigo 12.º, n.º 3. 47.º; 48.º e 49.º do CII", "fonte": "Sessão 3 — Fiscalidade - II - Questionário - Novembro 2024.docx"}, {"n": 119, "enunciado": "A empresa Alfa, Lda dedica-se ao comércio por grosso de materiais de construção. No ano de 2023 adquiriu um barco de recreio feito de borracha destinado a passeio e à pesca pelo valor de 75.000.000 AKZ. Nesse ano registou como custo o valor da amortização contabilística no valor de 9.375.000 AKZ (taxa de 12,5% constante da tabela de amortizações do Decreto Presidencial n.º 207/15, de 5 de novembro). Relativamente aos custos contabilizados referentes ao barco de recreio, indique qual a resposta correcta:", "opcoes": {"A": "Não é aceite como custo para efeitos fiscais de determinação do lucro tributável o valor de 7.500.000 AKZ", "B": "Não é aceite como custo para efeitos fiscais de determinação do lucro tributável o valor de 9.375.000 AKZ", "C": "Os custos relacionados com o barco de recreio de borracha são aceites como custo fiscal, incluindo o valor da amortização.", "D": "Os custos relacionados com o barco de recreio de borracha são aceites como custo fiscal, excepto o valor da amortização."}, "correcta": "B", "explicacao": "Artigo 40.º, alínea f) do CII", "fonte": "Sessão 3 — Fiscalidade - II - Questionário - Novembro 2024.docx"}, {"n": 120, "enunciado": "A empresa ABC, Lda tem no seu quadro de pessoal 84 trabalhadores. Estabeleceu um contrato com a seguradora ENSA para um seguro de saúde à equipa operacional da engenharia civil que realiza o serviço externo, sem abranger os trabalhadores da área administrativa e financeira, nem os sócios gerentes. Os prémios de seguro pagos relativos ao ano de 2023 foram de 2.500.000,00 AKZ, tendo sido registado na contabilidade. Diga como é qualificado este prémio de seguro para efeitos fiscais?", "opcoes": {"A": "O valor de 2.500.000 AKZ é considerado um custo contabilístico e fiscal.", "B": "O valor de 2.500.000 AKZ é considerado um custo contabilístico, devendo ser acrescido ao resultado líquido do exercício para a determinação do lucro tributável do exercício de 2023.", "C": "O valor de 2.500.000 AKZ não é custo contabilístico do exercício de 2023.", "D": "Este valor não é registado, porque no ano de 2023 os trabalhadores estiveram em trabalho interno."}, "correcta": "B", "explicacao": "Artigos 15.º, n.º 1 e 18.º, n.º1, alínea h) do CII", "fonte": "Sessão 3 — Fiscalidade - II - Questionário - Novembro 2024.docx"}, {"n": 121, "enunciado": "A empresa ABC, Lda tem no seu arquivo documental um documento interno de aquisição de materiais de construção com suporte de “Nota de despesa”, identificando o fornecedor, sem NIF. Este custo é classificado como:", "opcoes": {"A": "Custo indevidamente documentado", "B": "Custo não documentado", "C": "Despesa confidencial", "D": "Custo devidamente documentado."}, "correcta": "B", "explicacao": "Artigo 17.º n.ºs 3 e 7 do CII", "fonte": "Sessão 3 — Fiscalidade - II - Questionário - Novembro 2024.docx"}, {"n": 122, "enunciado": "Indique a resposta correcta. Os contribuintes do regime geral do imposto industrial apresentam por transmissão electrónica de dados, anualmente, à Administração Geral Tributária a declaração Modelo 1 do imposto industrial:", "opcoes": {"A": "Até ao último dia útil do mês de Maio", "B": "Até ao último dia do mês de Maio", "C": "Até ao último dia útil do mês de Abril", "D": "Até ao último dia do mês de Abril"}, "correcta": "A", "explicacao": "Artigo 51.º, n.º 1 do CII", "fonte": "Sessão 3 — Fiscalidade - II - Questionário - Novembro 2024.docx"}, {"n": 123, "enunciado": "O sócio Manuel efectuou um suprimento à sociedade produz+ da qual tem uma participação de 40% do capital social, no valor de 10.000.000 AKZ no dia 01/01/2024, exigindo uma remuneração à taxa de 40%/ano. Sabendo qua a taxa de juros disponível pelo BNA foi de 20%, qual das seguintes afirmações está correcta:", "opcoes": {"A": "A empresa tem um custo contabilístico de 4.000.000 Akz e um acréscimo fiscal ao resultado contabilístico de 2.000.000 AKZ para efeitos de determinação do lucro tributável", "B": "A empresa tem um custo contabilístico de 4.000.000 Akz e não faz ajustamento fiscal", "C": "A empresa tem um custo contabilístico e fiscal de 2.000.000 Akz", "D": "A empresa tem um custo contabilístico de 4.000.000 Akz e um acréscimo fiscal ao resultado contabilístico de 1.000.000 AKZ para efeitos de determinação do lucro tributável"}, "correcta": "A", "explicacao": "Artigo 16.º, n.º 1 do CII", "fonte": "Sessão 3 — Fiscalidade - II - Questionário - Novembro 2024.docx"}, {"n": 124, "enunciado": "A empresa Tudo Vende, Lda teve a seguinte estrutura de resultados fiscais ao longo dos últimos 6 exercícios económicos: 2018 – Prejuízo fiscal = (-) 20.000.000 AKZ 2019 – Lucro tributável = 7.000.000 AKZ 2020 – Prejuízo fiscal = (-) 2.000.000 AKZ 2021 – Lucro tributável = 6.000.000 AKZ 2022 – Lucro tributável = 2.000.000 AKZ 2023 – Lucro tributável = 2.000.000 AKZ 2024 – Lucro tributável = 6.000.000 AKZ Qual é a matéria tributável em 2024?", "opcoes": {"A": "1.000.000", "B": "4.000.000 Akz", "C": "5.000.000 Akz", "D": "Zero."}, "correcta": "B", "explicacao": "Artigo 48.º, n.º 1 do CII", "fonte": "Sessão 3 — Fiscalidade - II - Questionário - Novembro 2024.docx"}, {"n": 125, "enunciado": "A empresa Melhor qualidade, Lda deu início de actividade 03/02/2024. Nos primeiros 6 meses do ano de 2024 teve um volume de vendas de 150.000.000 AKZ de serviços prestados de 50.000.000 AKZ. Qual é valor do imposto industrial pago provisoriamente e qual é o prazo de pagamento:", "opcoes": {"A": "3.000.000 AKZ que deve ser pago até ao último dia útil do mês de Agosto de 2024", "B": "3.000.000 AKZ, que deve ser pago até ao último dia do mês de Agosto de 2024", "C": "Zero", "D": "4.000.000 AKZ, que deve ser pago até ao último dia útil do mês de Agosto de 2024"}, "correcta": "C", "explicacao": "Artigo 66.º, n.º 8 do CII", "fonte": "Sessão 3 — Fiscalidade - II - Questionário - Novembro 2024.docx"}, {"n": 126, "enunciado": "A empresa rodoviária de passageiros realizou um transporte de turismo pelas terras do Kwanza Sul ao pessoal da empresa Ship+, Lda no valor de 3.000.000 AKZ. Para efeitos de retenção na fonte de imposto industrial qual é o valor do imposto que deve ser retido:", "opcoes": {"A": "(A)-195.000 AKZ", "B": "Zero", "C": "75.000 AKZ", "D": "300.000 AKZ"}, "correcta": "B", "explicacao": "Artigo 67.º, n.º 13, d) do CII", "fonte": "Sessão 3 — Fiscalidade - II - Questionário - Novembro 2024.docx"}, {"n": 127, "enunciado": "A empresa Boas contas, Lda efectuou um serviço a uma pessoa singular com a profissão de advogado no valor de 2.000.000 AKZ. Para efeitos de retenção na fonte de imposto industrial qual é o valor do imposto que deve ser retido e quando deve ser pago:", "opcoes": {"A": "(A)-130.000 AKZ", "B": "Zero", "C": "200.000 AKZ", "D": "150.000 AKZ"}, "correcta": "B", "explicacao": "Artigo 67.º, n.º 2 do CII", "fonte": "Sessão 3 — Fiscalidade - II - Questionário - Novembro 2024.docx"}, {"n": 129, "enunciado": "Qual dos seguintes rendimentos está sujeito a Imposto Predial (IP):", "opcoes": {"A": "Juros de suprimentos.", "B": "Renda de um armazém para armazenagem e conservação das mercadorias", "C": "Aquisição de mercadorias para venda", "D": "Venda de mercadorias."}, "correcta": "B", "explicacao": "", "fonte": "Sessão 4 — Fiscalidade - IP, Selo e IAC - Questionário - Preparação Exa"}, {"n": 130, "enunciado": "Qual é o prazo para a apresentação da Declaração de Rendimentos Colectável do Imposto Predial:", "opcoes": {"A": "Até ao último dia útil do mês de janeiro de cada ano.", "B": "Até ao último dia útil do mês de fevereiro de cada ano.", "C": "Até ao último dia útil do mês de março de cada ano.", "D": "Até ao último dia útil do mês de abril de cada ano."}, "correcta": "A", "explicacao": "", "fonte": "Sessão 4 — Fiscalidade - IP, Selo e IAC - Questionário - Preparação Exa"}, {"n": 148, "enunciado": "A empresa Kwaquie, Lda, com sede em Luanda possui contabilidade organizada e é proprietária de um armazém industrial no parque industrial de Viana que adquiriu por 80.000.000 Akz. A Repartição Fiscal de Viana procedeu à avaliação do imóvel de que resultou o valor de 90.000.000 Akz. Qual é o valor do IP a pagar? (A) - 400.000 Akz. (B) - 425.000 Akz. (C) - 435.000 Akz. (D) - 450.000 Akz", "opcoes": {"A": "400.000 Akz", "B": "425.000 Akz", "C": "435.000 Akz", "D": "450.000 Akz"}, "correcta": "B", "explicacao": "as alíneas foram trocadas pelas linhas de cálculo da resolução; as verdadeiras estão dentro do enunciado — (A) 400.000; (B) 425.000; (C) 435.000; (D) 450.000 Akz. A resposta correcta é (B) 425.000 Akz, e não a actual (C): rendimento colectável = valor da avaliação, 90.000.000 (art. 8.º, n.º 1 do CIP); imposto = (90.000.000 − 5.000.000 isentos) x 0,5% = 425.000 Akz (tabela do art. 16.º). Nota: o ficheiro de 'Soluções' do formador indica C, mas a sua própria resolução detalhada apresenta o cálculo que dá 425.000.", "fonte": "Sessão 5 — Fiscalidade - IP, Selo e IAC - Questionário - Preparação Exa · resposta revista"}, {"n": 149, "enunciado": "A sociedade ABC, Lda com sede em Portugal detém uma participação de 30% no capital da empresa XPTO, Lda com sede em Angola desde 2018. No exercício de 2023, a empresa XPTO, Lda obteve um resultado líquido de 10.000.000 AKZ tendo decidido distribuir lucros aos sócios e empresas associadas na quantia de 7.000.000 AKZ. Face ao exposto, indique qual a opção correcta: (A) - A empresa XPTO, Lda tem que efectuar a retenção na fonte sobre o lucro distribuído à sociedade ABC, Lda na quantia de 210.000 AKZ. Artigo 5.º da Lei n.º 8/22, de 14 Abril e artigos 9.º, n.º 1, alínea a) e 27.º, n.º 2 e 29.º, n.º 1 do CIAC. (B) - Os lucros distribuídos à empresa ABC, Lda estão isentos de imposto sobre a aplicação de capitais. (C) - A empresa ABC, Lda sendo beneficiário do rendimento é o sujeito passivo do imposto devendo nomear um representante fiscal para assumir as obrigações fiscais do imposto. (D) - A empresa XPTO, Lda tem que efectuar a retenção na fonte sobre o lucro distribuído à sociedade ABC, Lda na quantia de 315.000 AKZ.", "opcoes": {"A": "A XPTO retém 210.000 AKZ", "B": "Os lucros estão isentos de IAC", "C": "A ABC é sujeito passivo e nomeia representante fiscal", "D": "A XPTO retém 315.000 AKZ"}, "correcta": "A", "explicacao": "as alíneas foram trocadas pelas linhas de cálculo; as verdadeiras estão no enunciado — (A) a XPTO retém 210.000 AKZ; (B) os lucros estão isentos de IAC; (C) a ABC é sujeito passivo e nomeia representante fiscal; (D) a XPTO retém 315.000 AKZ. A resposta correcta é (A) e não a actual (C): a sociedade angolana que distribui os lucros retém na fonte 7.000.000 x 30% x 10% = 210.000 AKZ (art. 5.º da Lei 8/22 e arts. 9.º, n.º 1, a), 27.º, n.º 2 e 29.º, n.º 1 do CIAC); o facto de a sócia ter sede em Portugal não altera a taxa nem transfere a obrigação de retenção.", "fonte": "Sessão 5 — Fiscalidade - IP, Selo e IAC - Questionário - Preparação Exa · resposta revista"}, {"n": 150, "enunciado": "A empresa Kapa, Lda, com sede em Luanda possui contabilidade organizada e paga mensalmente o valor de 200.000 Akz pelo arrendamento do seu armazém comercial, que incorpora o escritório. Qual é o rendimento colectável para efeitos de aplicação da taxa de IP?", "opcoes": {"A": "Esta operação está isenta de IP, porque a empresa Kapa já paga imposto industrial", "B": "80.000 Akz", "C": "200.000 Akz", "D": "120.000 Akz."}, "correcta": "D", "explicacao": "Artigo 8.º, n.º 4 do CIP", "fonte": "Sessão 5 — Fiscalidade - IP, Selo e IAC - Questionário - Preparação Exa"}, {"n": 151, "enunciado": "A sociedade Costa, Lda é proprietária de um imóvel do tipo armazém comercial, tendo-o arrendado à sociedade SóPinta, Lda para a armazenagem de mercadorias pelo qual recebe o valor de 500.000 Akz por mês. Identifique o sujeito passivo do imposto de selo e a pessoa que suporta o encargo do imposto nesta operação:", "opcoes": {"A": "O sujeito passivo do imposto é a sociedade Costa, Lda e o encargo do imposto é suportado pela sociedade SóPinta, Lda", "B": "A sociedade Costa, Lda é sujeito passivo do imposto e suporta o encargo do imposto.", "C": "O sujeito passivo do imposto é a sociedade SóPinta, Lda e o encargo do imposto é suportado pela sociedade Costa, Lda", "D": "A sociedade SóPinta, Lda é sujeito passivo do imposto e suporta o encargo do imposto."}, "correcta": "B", "explicacao": "Artigos 2.º e 3.º do CIS", "fonte": "Sessão 5 — Fiscalidade - IP, Selo e IAC - Questionário - Preparação Exa"}, {"n": 152, "enunciado": "Indique a opção correcta. As pessoas obrigadas à liquidação do IAC devem entregar uma declaração de todos os rendimentos recebidos, pagos ou colocados à disposição:", "opcoes": {"A": "Até ao final do mês de Fevereiro do ano seguinte ao do recebimento, pagamento ou colocação à disposição", "B": "Até ao final do mês de Janeiro do ano seguinte ao do recebimento, pagamento ou colocação à disposição", "C": "Não está prevista a entrega de qualquer declaração de rendimentos", "D": "A declaração rendimentos apenas deve ser entregue, se a AGT a solicitar."}, "correcta": "B", "explicacao": "Artigos 15.º, n.º 1 e 19.º do CIAC", "fonte": "Sessão 5 — Fiscalidade - IP, Selo e IAC - Questionário - Preparação Exa"}, {"n": 153, "enunciado": "A sociedade Kapa, Lda é associada da sociedade Okay, Lda e estabeleceu com esta sociedade uma conta corrente com uma taxa de juros igual à fixada pelo BNA, cujo saldo de juros apresentava o valor 550.000 Akz no final de Junho de 2023. Qual dos seguintes valores representa o valor do IAC a pagar?", "opcoes": {"A": "110.000 Akz", "B": "55.000 Akz", "C": "27.500 Akz", "D": "82.500 Akz"}, "correcta": "D", "explicacao": "Artigo 27.º, n.º 2 do CIAC", "fonte": "Sessão 5 — Fiscalidade - IP, Selo e IAC - Questionário - Preparação Exa"}, {"n": 500, "enunciado": "A empresa Luanda, LDA vendeu produtos diversos durante o exercício 2021 teve um volume de negócios de 10.000.000 Kz não possui programa informático para submissão do ficheiro SAF-T.", "opcoes": {"A": "Regime geral", "B": "Regime Simplificado", "C": "Regime Exclusão", "D": "Regime Geral como opção"}, "correcta": "C", "explicacao": "Com um volume de negócios de 10.000.000 Kz (igual ao limiar legal de 10.000.000 Kz) e sem meios informáticos para submeter o ficheiro SAF-T, a empresa fica abrangida pelo regime de exclusão do IVA, não podendo sequer optar pelo regime geral por falta de software certificado.", "fonte": "Exame: Questões multiplas escolhas - 1 parte.pdf"}, {"n": 501, "enunciado": "A empresa Benguela, Lda. presta serviço limpeza durante o exercício 2021, teve um volume de negócio de 80.000.000 Kz, possui software de faturação certificada AGT e com capacidade de submissão do SAF-T.", "opcoes": {"A": "Regime Exclusão", "B": "Regime simplificado opção regime geral", "C": "Regime Simplificado sem opção regime geral", "D": "Regime de Caixa"}, "correcta": "B", "explicacao": "Com 80.000.000 Kz de volume de negócios (acima de 10.000.000 Kz e abaixo de 350.000.000 Kz) enquadra-se no regime simplificado, mas, por dispor de software de facturação certificado pela AGT com capacidade de submissão do SAF-T, pode optar pelo regime geral.", "fonte": "Exame: Questões multiplas escolhas - 1 parte.pdf"}, {"n": 502, "enunciado": "A empresa Huambo, LDA dedica-se a venda de livros isenta de IVA, está enquadrada no regime geral do IVA em janeiro 2022 o montante das vendas de livros foi 10.000.000 Kz e recebemos dos clientes 6.000.000 Kz", "opcoes": {"A": "IVA liquidado 14% sobre vendas de livros", "B": "Imposto de selo 7% s/ venda de livros", "C": "Imposto de Selo de 1% s/ venda de livros recebidos", "D": "Imposto de selo de 7% sobre as vendas livros efetivamente recebidos"}, "correcta": "C", "explicacao": "A venda de livros é isenta de IVA, pelo que não há IVA liquidado; a empresa, estando no regime geral e praticando operações exclusivamente isentas, fica sujeita a Imposto de Selo sobre o recibo de quitação à taxa de 1% (verba 23.3 da Tabela do Imposto de Selo, por remissão do art. 74.º do CIVA na redacção da Lei 14/23), incidente apenas sobre o que foi efectivamente recebido: 6.000.000 x 1% = 60.000 Kz. A taxa de 7% das opções B e D não corresponde à lei em vigor.", "fonte": "Exame: Questões multiplas escolhas - 1 parte.pdf · resposta revista"}, {"n": 504, "enunciado": "A empresa ZAIRE, Lda regime de exclusão, vendeu brinquedos a pronto pagamento no valor 600.000 KZ. Qual imposto a pagar?", "opcoes": {"A": "Imposto de selo 7% s/ vendas de brinquedos", "B": "IVA 14% s/ vendas de brinquedos", "C": "Imposto de selo 1% s/ vendas de brinquedos efetivamente recebidos", "D": "Imposto de selo 7% s/ vendas de brinquedos efetivamente recebido"}, "correcta": "C", "explicacao": "No regime de exclusão não se liquida IVA; a empresa fica sujeita a Imposto de Selo sobre o recibo de quitação à taxa de 1% (verba 23.3 da Tabela do Imposto de Selo), incidente sobre o valor efectivamente recebido: 600.000 x 1% = 6.000 Kz. Como a venda foi a pronto pagamento, todo o valor está recebido. A opção D só difere da C na taxa (7%), que não é a legalmente aplicável.", "fonte": "Exame: Questões multiplas escolhas - 1 parte.pdf · resposta revista"}, {"n": 505, "enunciado": "A empresa Uíge, Lda regime geral, vende brinquedos sujeito a IVA e medicamentos isento de IVA.", "opcoes": {"A": "IVA liquidado 14% s/ venda brinquedos e imposto selo 7% s/ venda medicamento", "B": "IVA liquidado 7% s/ venda brinquedos e imposto selo 1% / venda brinquedo", "C": "IVA liquidado 14% s/ venda brinquedos e está dispensado pagamento imposto selo", "D": "IVA liquidado 14%/ venda brinquedos e IAC s/ venda medicamento"}, "correcta": "A", "explicacao": "Pergunta com dois problemas. (1) Taxa errada na alínea A: o Imposto de Selo do recibo de quitação é de 1% (verba 23.3 da Tabela, art. 74.º do CIVA na redacção da Lei 14/23) e não de 7%. (2) O art. 74.º só obriga ao Imposto de Selo os sujeitos passivos do regime geral que pratiquem operações EXCLUSIVAMENTE isentas — a Uíge, Lda pratica operações mistas (brinquedos tributados e medicamentos isentos), o que dá força à alínea C (liquida IVA de 14% nos brinquedos e está dispensada do Imposto de Selo). A resposta actual A é a que o exame pretendia (IVA nas operações tributadas + Imposto de Selo nas isentas), mas só é defensável corrigindo a taxa para 1%. Recomenda-se reescrever a pergunta.", "fonte": "Exame: Questões multiplas escolhas - 1 parte.pdf · resposta a confirmar"}]}, {"num": 3, "rotulo": "Módulo 3", "nome": "Contabilidade de Gestão", "sessoes": [{"n": 1, "titulo": "Conceitos Gerais de Contabilidade de Gestão", "norma": "Fundamentos de Contabilidade Analítica/de Gestão (NCRF 27 — Agricultura, apenas por analogia de inventários; enquadramento conceptual da contabilidade de custos)", "objectivo": "Estabelecer os conceitos base da contabilidade de gestão: distinção entre custo, gasto, despesa e pagamento, classificação dos custos (directos/indirectos, fixos/variáveis, do produto/do período), e as fórmulas fundamentais de apuramento do custo industrial.", "pontos": ["Custo é o valor dos recursos consumidos na produção de um bem ou serviço; gasto é o reconhecimento contabilístico do consumo de um recurso (pode ou não coincidir com custo); despesa é a saída de meios monetários; pagamento é a saída efectiva de caixa — os quatro conceitos nem sempre ocorrem no mesmo momento.", "Custos directos são inequivocamente atribuíveis a um produto/objecto de custo (matéria-prima, mão-de-obra directa); custos indirectos (GGF — Gastos Gerais de Fabrico) exigem um critério de repartição (quota de imputação) para serem atribuídos aos produtos.", "Custos variáveis alteram-se proporcionalmente ao volume de produção/venda; custos fixos mantêm-se constantes dentro de um intervalo relevante de actividade — o custo variável UNITÁRIO mantém-se constante, e é o custo fixo unitário que varia inversamente com o volume.", "Ofertas/amostras de produtos acabados a clientes reduzem os INVENTÁRIOS de produtos acabados (saída de armazém a custo de produção), e não afectam directamente o custo industrial da produção do período.", "As fórmulas fundamentais de apuramento de custo industrial (ver quadro de fórmulas) relacionam existências iniciais e finais de matérias-primas, produção em vias de fabrico e produtos acabados com o CIPA (Custo Industrial da Produção Acabada) e o CIPV (Custo Industrial da Produção Vendida).", "◆ A conta Fabricação (classe 9) é debitada pela totalidade dos custos incorporados no período (MP + MOD + GGF) e creditada pelo custo da produção acabada; o saldo devedor que fica é exactamente a produção em vias de fabrico final. A conta Produtos Acabados é debitada apenas pela diferença.", "◆ Custos de financiamento e gastos da sede nunca integram o custo de produção, seja qual for o sistema de custeio adoptado. Uma opção que inclua encargos financeiros no custo do produto é sempre falsa.", "◆ A mensuração dos produtos em vias de fabrico serve para determinar o saldo final da conta Produção. Não permite calcular directamente o custo das vendas nem imputar custos não fabris à produção.", "◆ Produtos acabados oferecidos a clientes saem do armazém ao custo de produção: reduzem os inventários de produtos acabados e constituem custo comercial do período. O CIPA e o CIPV do período não se alteram.", "◆ Quando a facturação é feita a custo de produção acrescido de uma percentagem, o valor facturado não é o custo da produção vendida. A margem bruta é a diferença entre os dois, e não o valor facturado.", "◆ O custo variável total cresce com o volume enquanto o custo variável unitário se mantém constante; nunca o inverso. As opções que fazem o custo variável unitário tender para infinito ou o total manter-se constante são distractores fixos."], "formulas": ["CIPA (Custo Industrial da Produção Acabada) = Ei PVF + MP consumida + MOD + GGF − Ef PVF", "CIPV (Custo Industrial da Produção Vendida) = Ei PA + CIPA − Ef PA", "MP consumida = Ei MP + Compras de MP − Ef MP", "Custo Primo = MP + MOD", "Margem sobre o preço de venda = Resultado Bruto / Vendas líquidas ; Margem sobre o preço de custo = Resultado Bruto / CIPV", "◆ Saldo final da conta Fabricação (= PVF final, Kz) = Custos incorporados no período − Custo da produção acabada", "◆ Débito da conta Produtos Acabados (Kz) = Custos incorporados no período − PVF final", "◆ Margem bruta (Kz) = Vendas − CIPV", "◆ Com facturação a custo majorado de m%: Vendas (Kz) = CIPV × (1 + m); Margem bruta (Kz) = CIPV × m", "◆ Custo variável total (Kz) = custo variável unitário (Kz/un) × quantidade; o unitário é invariante ao volume"], "erros": ["Não confundir despesa/pagamento com custo — um custo pode ser reconhecido sem que haja ainda desembolso de caixa (ex.: depreciações).", "As fórmulas de CIPA/CIPV são um sistema de 'vasos comunicantes': dada qualquer combinação de 4 variáveis conhecidas, a 5ª pode sempre ser calculada por rearranjo algébrico — é a base de muitas perguntas de exame.", "◆ Tomar o valor facturado como custo da produção vendida ao calcular a margem bruta — numa facturação a custo + 20%, 552.000 Kz é a venda e 460.000 Kz é o custo.", "◆ Debitar Produtos Acabados pelo total dos custos do período, esquecendo deduzir a produção em vias de fabrico final.", "◆ Incluir gastos financeiros ou administrativos no custo industrial do produto.", "◆ Tratar a oferta de produtos acabados como redução do custo industrial da produção, em vez de saída de inventário e custo comercial do período."]}, {"n": 2, "titulo": "Elementos de Custo, Métodos e Sistemas de Custeio", "norma": "Componentes do custo de produção — Matérias-Primas (MP), Mão-de-Obra Directa (MOD) e Gastos Gerais de Fabrico (GGF)", "objectivo": "Determinar o custo de cada elemento de produção (matérias, mão-de-obra, gastos gerais de fabrico) e os critérios de repartição dos custos indirectos pelos produtos.", "pontos": ["O custo de aquisição de matérias-primas inclui o preço de compra e todos os custos de aprovisionamento associados (transporte, seguros, direitos aduaneiros) até à entrada em armazém — estes últimos podem ser repartidos pelas matérias por critérios como a quantidade ou o valor de cada matéria adquirida.", "O custo da mão-de-obra directa (MOD) inclui a remuneração base e todos os encargos sociais da entidade patronal (segurança social, seguro de acidentes de trabalho) e encargos anuais diferidos mensalmente (13º mês/subsídio de Natal, subsídio de férias) — o custo TOTAL anual reparte-se, em regra, por catorze 'meses' de referência quando se incluem os dois subsídios.", "Os GGF (Gastos Gerais de Fabrico) são todos os custos de produção que não são directamente atribuíveis a um produto específico (mão-de-obra indirecta, energia, amortizações industriais, seguros da fábrica, conservação e reparação) e exigem um critério de imputação (quota de imputação, Qi) para serem repartidos pelos produtos.", "A quota de imputação pode ser real (baseada nos custos efectivamente incorridos no período: Qi = ΣGGF/ΣBase de imputação) ou teórica/pré-determinada (baseada em estimativas feitas no início do período, com base numa base de imputação prevista) — quando a quota é teórica, a diferença entre os GGF reais e os GGF imputados dá origem a Custos Industriais Não Imputados (CINI), que podem ser favoráveis ou desfavoráveis.", "As bases de imputação mais comuns são: horas de mão-de-obra directa (Hh), unidades produzidas, e custo primo — a escolha da base deve reflectir a relação de causalidade entre o gasto indirecto e a actividade produtiva.", "◆ Três sistemas de custeio saem repetidamente e distinguem-se apenas pelo tratamento dos custos fixos industriais. No custeio variável ficam todos no período; no custeio total são todos incorporados no CIPA; no custeio racional só é incorporada a fracção correspondente ao grau de actividade, indo o resto a custo de subactividade do período.", "◆ A diferença de resultados entre sistemas é integralmente explicada pelos custos fixos industriais retidos na variação de existências. Com produção superior às vendas, o resultado é máximo no custeio total, intermédio no racional e mínimo no variável.", "◆ Custos de distribuição, comerciais e administrativos nunca entram no CIPA, nem sequer no custeio total. Um enunciado que dê 300 Kz/un de distribuição ao lado de 600 Kz/un de custo industrial variável está a testar exactamente isso.", "◆ Capacidade normal é a capacidade teórica deduzida das paragens inevitáveis, designadamente a manutenção planeada. Não é a média dos últimos anos nem coincide com a capacidade real utilizada.", "◆ A quota teórica de GGF pode vir escrita em formatos diferentes que significam o mesmo: 75 Kz por cada 100 Kz de custo primo é 0,75 × custo primo; 0,4 Kz para 1 Kz de custo primo é 0,4 × custo primo.", "◆ O custo da MOD mede-se pelas remunerações ilíquidas acrescidas dos encargos da entidade patronal e da periodificação de férias e subsídio de Natal. Remunerações líquidas está sempre errado, porque as retenções também são custo da empresa."], "formulas": ["Qi (quota de imputação) = Σ GGF do período / Σ Base de imputação escolhida", "GGF imputados a um produto = Qi × Base de imputação consumida por esse produto", "CINI = GGF reais − GGF imputados pela quota teórica (positivo = sub-imputação; negativo = sobre-imputação)", "Custo total anual da MOD = 13 ou 14 × Remuneração mensal × (1 + taxa de encargos sociais), consoante se incluam os subsídios de férias e/ou de Natal", "◆ Custo primo (Kz) = (quantidade requisitada − devoluções ao armazém) × custo unitário da matéria + horas de MOD × custo horário", "◆ GGF imputados a uma encomenda (Kz) = quota teórica × custo primo da encomenda", "◆ Custo de produção da encomenda (Kz) = Custo primo + GGF imputados pela quota teórica", "◆ CIPA unitário no custeio total (Kz/un) = custo industrial variável unitário + custos fixos industriais / produção do período", "◆ Grau de actividade = Produção real / Capacidade normal instalada", "◆ GGF fixos imputados no custeio racional (Kz) = Grau de actividade × GGF fixos totais", "◆ Custo de subactividade (Kz) = (1 − Grau de actividade) × GGF fixos totais — custo do período, fora do CIPA", "◆ Diferença de resultado (custeio total − custeio variável, Kz) = variação de existências em unidades × custo fixo industrial unitário", "◆ Resultado no custeio racional (Kz) = Vendas − (Qv × custo industrial unitário) − custo de subactividade − custos não fabris"], "erros": ["Ao repartir custos comuns (armazenagem, transporte de compras) por vários materiais, confirmar sempre qual o critério pedido (quantidade vs. valor) — dão resultados diferentes.", "Não esquecer os encargos sociais e os subsídios (férias, Natal) no cálculo do custo total da MOD — um erro clássico é usar apenas o salário base.", "◆ Valorizar uma encomenda com os GGF reais do mês quando existe quota teórica — os GGF reais servem apenas para apurar o CINI.", "◆ Esquecer as devoluções ao armazém antes de apurar o custo primo: 665 metros requisitados menos 15 devolvidos são 650 metros de consumo.", "◆ Somar os custos de distribuição ao CIPA ao comparar custeio total com custeio variável.", "◆ No custeio racional, dividir os custos fixos pela produção real em vez de aplicar o grau de actividade sobre a capacidade normal."]}, {"n": 3, "titulo": "Regimes de Fabrico e Métodos de Acumulação de Custos", "norma": "Sistemas de custeio por encomenda (job order costing) vs. por processo (process costing)", "objectivo": "Distinguir os regimes de fabrico (contínuo/uniforme vs. descontínuo/por encomenda) e os métodos de acumulação de custos mais adequados a cada um.", "pontos": ["Regime de produção contínua/uniforme: fabrico em série, de forma repetitiva e homogénea (ex.: indústria de farinhas, cimento) — o custeio é feito por processo, acumulando custos por período e dividindo pela produção equivalente do período (custo médio).", "Regime de produção descontínua/por encomenda: fabrico não uniforme, por encomendas específicas ou séries limitadas (ex.: construção, mobiliário por medida) — o custeio é feito por ordem de fabrico/encomenda, acumulando os custos directos e indirectos imputados a cada ordem específica.", "A escolha do método de acumulação de custos (por processo vs. por ordem de fabrico) depende da natureza do processo produtivo, não de uma opção arbitrária da gestão — é um tema clássico de identificação/classificação no exame.", "Em produção por processo com produção em vias de fabrico inicial e final, recorre-se ao conceito de produção equivalente para repartir os custos entre unidades acabadas e unidades ainda em curso de fabrico no fim do período.", "◆ A produção equivalente calcula-se em separado para matérias e para custos de conversão, porque os graus de incorporação diferem. O custo unitário da unidade acabada é a soma dos dois custos unitários assim obtidos.", "◆ Os enunciados dizem quase sempre o que FALTA incorporar. Se faltam 20% de matérias, o grau incorporado é 80%; ler 20% directamente inverte o cálculo.", "◆ Em departamentos sequenciais, as unidades em curso no departamento seguinte já incorporam 100% do custo transferido do departamento anterior, mesmo que só tenham parte dos custos de conversão próprios.", "◆ Em FIFO, a produção equivalente conta apenas a fracção que faltava completar no PVF inicial, mais as unidades iniciadas e acabadas no período, mais a fracção incorporada no PVF final.", "◆ No custeio por encomenda o custo industrial de uma obra só fica determinado quando a obra termina, isto é, quando já não há produção em vias de fabrico nessa obra. As ordens de fabrico não terminadas, incluindo os custos transitados de períodos anteriores, formam a PVF final.", "◆ Os dois métodos podem coexistir na mesma empresa: departamentos com serviços padronizados e repetitivos pedem custeio por processo, departamentos de intervenções específicas pedem custeio por obra. Abandonar um deles é a resposta errada."], "formulas": ["Produção equivalente = Unidades acabadas + (Unidades em vias de fabrico no fim × grau de acabamento)", "Custo unitário (produção por processo) = Custos totais do período / Produção equivalente do período", "◆ Produção equivalente em matérias (un) = Unidades acabadas + PVF final × % de matérias já incorporadas", "◆ Produção equivalente em conversão (un) = Unidades acabadas + PVF final × % de custos de conversão já incorporados", "◆ Custo unitário da unidade acabada (Kz/un) = Custo das matérias / PEq matérias + Custo de conversão / PEq conversão", "◆ PVF final (Kz) = un. em curso × custo unitário de matérias × % matérias + un. em curso × custo unitári
