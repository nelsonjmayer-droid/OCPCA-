o de conversão × % conversão", "◆ PEq em FIFO (un) = PVF inicial × (100% − grau já incorporado) + (Produção acabada − PVF inicial) + PVF final × grau incorporado", "◆ Custo unitário do semi-produto recebido (Kz/un) = Custos atribuídos pelo departamento anterior / unidades transferidas", "◆ Crédito da conta Fabricação (Kz) = Unidades acabadas × custo unitário total; o saldo devedor remanescente é a PVF final", "◆ PVF final no custeio por encomenda (Kz) = Σ (custos transitados + custos do período) das ordens de fabrico não terminadas"], "erros": ["Não classificar automaticamente uma empresa industrial como 'produção contínua' — a característica decisiva é a uniformidade/repetitividade do processo, não o sector de actividade.", "◆ Usar a percentagem que falta incorporar como se fosse a percentagem incorporada.", "◆ Aplicar uma única produção equivalente a matérias e a custos de conversão quando os graus de acabamento são diferentes.", "◆ Valorizar as unidades em curso do segundo departamento sem lhes atribuir 100% do custo transferido do primeiro.", "◆ Em FIFO, contar o PVF inicial por inteiro em vez de apenas a parte que faltava completar."]}, {"n": 4, "titulo": "Produção Conjunta e Produção Defeituosa", "norma": "Repartição de custos conjuntos e tratamento de subprodutos, resíduos e produção defeituosa", "objectivo": "Repartir custos conjuntos (incorridos até ao ponto de separação) pelos produtos principais, valorizar subprodutos e resíduos, e apurar o custo unitário da produção boa quando existe produção defeituosa normal e/ou anormal.", "pontos": ["Custos conjuntos são os custos incorridos até ao ponto de separação, momento a partir do qual os produtos se tornam identificáveis individualmente; custos específicos (pós-separação) são directamente atribuíveis a cada produto.", "Critérios de repartição dos custos conjuntos pelos produtos principais: (1) Critério das quantidades produzidas — reparte proporcionalmente às unidades físicas produzidas; (2) Critério do Valor de Venda da Produção (VVP) — reparte proporcionalmente ao valor de venda total de cada produto; (3) Critério do Valor de Venda no Ponto de Separação (VVPS) — reparte proporcionalmente ao valor de venda no ponto de separação, deduzindo primeiro os custos específicos e de distribuição do valor de venda final de cada produto.", "Subprodutos e resíduos com valor de mercado são normalmente valorizados por um dos dois critérios: 'lucro nulo' (o valor de venda do subproduto, deduzido dos seus custos específicos de acabamento/transporte, é subtraído aos custos conjuntos a repartir pelos produtos principais — o subproduto não gera nem lucro nem prejuízo) ou 'custo nulo' (o subproduto entra em armazém a custo zero, e todo o valor de venda realizado é reconhecido directamente como lucro na venda).", "Produção defeituosa NORMAL (inerente ao processo, dentro da percentagem historicamente esperada) é absorvida no custo da produção boa — o seu custo (líquido do valor de sucata, se houver) é diluído pelas unidades boas. Produção defeituosa ANORMAL (acima do normal esperado) é tratada separadamente e vai a resultados como uma perda/resultado acidental do período, não onerando o custo da produção boa.", "Quando há valor de sucata (resíduos vendáveis), o valor da sucata NORMAL reduz o custo total a diluir pela produção boa; o valor da sucata ANORMAL reduz especificamente o custo imputado à produção defeituosa anormal.", "◆ Depois de repartir os custos conjuntos pelo critério VVPS, os custos específicos de cada produto voltam a somar-se à parcela que lhe coube. O custo unitário do produto é essa soma dividida pela quantidade produzida, e não apenas o custo conjunto imputado.", "◆ Resíduos sem valor, cuja destruição é paga, ACRESCEM aos custos conjuntos a repartir. Subprodutos com valor deduzem; resíduos com custo de eliminação somam.", "◆ No critério do lucro nulo deduz-se o valor realizável líquido do subproduto: preço de venda menos gastos específicos, incluindo o transporte quando é de conta do vendedor.", "◆ O denominador do CIPA unitário da produção boa é a produção lançada menos os defeituosos NORMAIS. O numerador de valorização da produção que entra em armazém usa as unidades boas efectivas, que são a produção lançada menos os defeituosos TOTAIS. Os dois números não coincidem quando há defeitos anormais.", "◆ A conta Fabricação é creditada por duas parcelas quando há defeitos anormais: a produção acabada boa e a perda anormal levada a resultados acidentais. As duas somadas reconciliam com os custos incorridos.", "◆ Custos conjuntos são os acumulados até ao ponto de separação e a sua repartição assenta em critérios convencionais, não objectivos. Subprodutos podem suportar custos consoante o critério, pelo que 'os subprodutos nunca suportam custo' é falso."], "formulas": ["CIPA Un. (produção boa, com perdas normais) = (Custos de produção − Valor da sucata normal) / Produção boa obtida", "CIPA da produção defeituosa anormal = (Produção anormal × CIPA Un.) − Valor da sucata anormal", "Custos conjuntos a repartir (critério do lucro nulo) = Custos conjuntos totais − (Valor de venda do subproduto − Custos específicos do subproduto)", "% Imputação (VVPS) de um produto = Valor de venda no ponto de separação desse produto / Σ Valor de venda no ponto de separação de todos os produtos", "◆ Custos conjuntos a repartir (Kz) = Custos até ao ponto de separação − VRL dos subprodutos + custos de destruição de resíduos", "◆ VRL do subproduto (Kz) = Quantidade × preço de venda unitário − gastos específicos (transporte, acabamento)", "◆ Valor de venda no ponto de separação de um produto (Kz) = Quantidade × preço de venda final − custos específicos desse produto", "◆ % de imputação (VVPS) = VVPS do produto / Σ VVPS de todos os produtos principais", "◆ Custo de produção de um produto principal (Kz) = Custos conjuntos imputados + custos específicos do produto; custo unitário = esse total / quantidade produzida", "◆ CIPA unitário da produção boa (Kz/un) = (Custos de produção − valor da sucata) / (Produção lançada − defeituosos normais)", "◆ Defeituosos normais (un) = % normal × produção lançada; defeituosos anormais = defeituosos verificados − normais", "◆ Perda anormal levada a resultados acidentais (Kz) = defeituosos anormais × CIPA unitário − valor da sucata anormal", "◆ Produção acabada em armazém (Kz) = (Produção lançada − defeituosos totais) × CIPA unitário", "◆ Custo das vendas na DR por funções (Kz) = Σ (quantidade vendida de cada produto × custo unitário) + valor de venda dos subprodutos vendidos mensurados a lucro nulo"], "erros": ["No critério VVPS, deduzir SEMPRE os custos específicos (de acabamento e de distribuição) do valor de venda final antes de calcular a proporção de imputação — usar o valor de venda final directamente (critério VVP) dá um resultado diferente e é um erro comum.", "Não imputar o custo da produção defeituosa ANORMAL à produção boa — isso inflaciona artificialmente o custo unitário dos produtos vendidos; a perda anormal deve ir a resultados extraordinários/acidentais do período.", "◆ Dividir os custos de produção pelas unidades boas efectivas em vez de (lançada − defeituosos normais) — o custo unitário sai inflacionado e a reconciliação com os custos incorridos falha.", "◆ Repartir os custos conjuntos e parar aí, esquecendo somar os custos específicos de embalagem ou acabamento antes de calcular o custo unitário do produto.", "◆ Ignorar o custo de destruição de resíduos, que aumenta a massa de custos conjuntos a repartir.", "◆ No custo das vendas, esquecer o subproduto vendido ou incluir a produção que ficou em existência final."]}, {"n": 5, "titulo": "Método das Secções Homogéneas", "norma": "Repartição de custos indirectos por centros de responsabilidade (secções homogéneas)", "objectivo": "Organizar a informação de custos por secções/centros de responsabilidade homogéneos, de modo a repartir os GGF pelos produtos de forma mais rigorosa do que uma única base de imputação global, e a permitir o controlo de gestão por responsável.", "pontos": ["Uma secção homogénea agrupa custos cuja actividade pode ser medida através de uma única unidade de obra (unidade de medida da actividade da secção, ex.: horas-máquina, horas-homem, unidades processadas).", "As secções classificam-se em principais (contribuem directamente para o processo produtivo — ex.: secções de fabrico) e auxiliares (prestam serviços a outras secções — ex.: manutenção, energia); os custos das secções auxiliares são normalmente redistribuídos (em cascata ou por reciprocidade) pelas secções principais antes de se calcular o custo da unidade de obra.", "O custo da unidade de obra de cada secção = custos totais da secção (após redistribuição das secções auxiliares) / número de unidades de obra da secção; este custo é depois imputado aos produtos com base no número de unidades de obra consumidas por cada um.", "Não são considerados 'custos de funcionamento' das secções certos gastos que, por natureza, não decorrem da actividade normal da secção (ex.: gastos financeiros, gastos extraordinários) — apenas os gastos de exploração corrente da secção entram no seu custo.", "O método das secções homogéneas permite o controlo de gestão por centro de responsabilidade — cada responsável de secção pode ser avaliado pelo custo da sua unidade de obra ao longo do tempo.", "◆ As perguntas desta sessão são quase todas de prestações recíprocas, resolvidas por sistema de equações. Cada secção envolvida gera uma equação: custo total = custos directos + custos recebidos das outras secções.", "◆ A reciprocidade também surge entre uma secção principal e uma auxiliar, quando a principal aplica unidades de obra na reparação de equipamento da secção de apoio. A equação escreve-se do mesmo modo.", "◆ Quando uma secção de apoio se reparte em percentagem dos custos directos das restantes, a taxa apura-se dividindo os custos dessa secção pelo somatório dos custos directos de todas as beneficiárias, e aplica-se depois a cada uma.", "◆ O custo da unidade de obra usa o total de unidades de obra TRABALHADAS pela secção, incluindo as cedidas a outras secções, e não apenas as aplicadas em produtos ou encomendas.", "◆ Quando há uma secção de apoio que não recebe de ninguém, reparte-se essa primeiro em cascata e só depois se resolve o sistema recíproco entre as secções que se servem mutuamente."], "formulas": ["Custo da unidade de obra de uma secção = Custos totais da secção / Nº de unidades de obra da secção", "Custo imputado a um produto = Custo da unidade de obra × Nº de unidades de obra consumidas pelo produto nessa secção", "◆ Reciprocidade em unidades de obra: C_A (Kz) = custos directos de A + u.o. de B aplicadas em A × (C_B / total de u.o. de B), e simetricamente para B; resolver o sistema", "◆ Reciprocidade em percentagem: C_A (Kz) = custos directos de A + p × C_B, com p = percentagem dos custos de B atribuída a A", "◆ Taxa de repartição de uma secção de apoio = Custos da secção de apoio / Σ custos directos das secções beneficiárias", "◆ Custo da unidade de obra (Kz/u.o.) = Custo total da secção após reciprocidade / total de unidades de obra trabalhadas", "◆ Custo cedido a outra secção (Kz) = unidades de obra cedidas × custo da unidade de obra da secção prestadora", "◆ Custo imputado a um produto ou encomenda (Kz) = custo da unidade de obra × u.o. consumidas pelo produto nessa secção"], "erros": ["Não esquecer de redistribuir primeiro os custos das secções auxiliares pelas secções principais antes de calcular o custo da unidade de obra de cada secção principal — omitir este passo é o erro mais comum neste tema.", "◆ Repartir apenas em cascata quando existem prestações mútuas: 16.760/600 dá 27,9 Kz/u.o. contra os 32,0 Kz/u.o. correctos com reciprocidade.", "◆ Dividir o custo da secção pelas unidades de obra aplicadas em produtos, excluindo as cedidas a outras secções.", "◆ Aplicar a percentagem da secção de apoio sobre os custos totais das beneficiárias quando o enunciado manda usar os custos directos como base.", "◆ Parar na primeira iteração do sistema recíproco em vez de resolver a equação até ao valor exacto."]}, {"n": 6, "titulo": "Análise Custo-Volume-Resultado (CVR) e Alavancagem Operacional", "norma": "Análise CVP (Cost-Volume-Profit) e grau de alavancagem operacional", "objectivo": "Determinar o ponto de equilíbrio operacional, a margem de segurança e o grau de alavancagem operacional de uma empresa, apoiando decisões de gestão sobre volume, preço e estrutura de custos.", "pontos": ["A margem de contribuição unitária (mc) = preço de venda unitário − custo variável unitário; mede quanto cada unidade vendida contribui para cobrir os custos fixos e gerar resultado.", "O ponto de equilíbrio (Q') é o volume de vendas para o qual o resultado é nulo (proveitos = custos totais); acima desse ponto a empresa obtém lucro, abaixo incorre em prejuízo.", "A margem de segurança (MS) mede a distância entre as vendas actuais/previstas e o ponto de equilíbrio — pode exprimir-se em valor, ou em percentagem das vendas actuais ou do ponto de equilíbrio; quanto maior a MS, menor o risco operacional da empresa.", "Em empresas multiproduto, a % de margem de contribuição global da empresa é a média ponderada das % de margem de contribuição de cada produto, ponderada pelo respectivo peso nas vendas totais — uma alteração no MIX de vendas (mesmo mantendo o total de vendas) altera a % de margem de contribuição global, ainda que as margens unitárias de cada produto não mudem.", "O grau de alavancagem operacional mede a sensibilidade do resultado operacional a variações no volume de vendas — quanto maior o peso dos custos fixos na estrutura de custos, maior a alavancagem (e maior o risco/potencial de ganho com variações de volume).", "◆ O pedido mais frequente não é o ponto de equilíbrio mas a quantidade que mantém o lucro actual depois de uma descida de preço. O lucro a manter calcula-se com o preço antigo e a quantidade a atingir com a margem de contribuição nova.", "◆ Quando o resultado pretendido é uma percentagem das vendas, a incógnita aparece dos dois lados da equação e não se pode usar a fórmula simples do ponto de equilíbrio.", "◆ Nos custos fixos do ponto de equilíbrio entram todos os fixos: fabris, de distribuição, administrativos e de financiamento. Usar apenas os fixos fabris é o erro que separa duas opções da mesma pergunta.", "◆ Custos comerciais variáveis por unidade descontam-se na margem de contribuição, ao lado do custo industrial variável.", "◆ Um custo fixo apresentado por unidade no enunciado é ruído: não entra na margem de contribuição, que só usa custos variáveis.", "◆ Em CVR só interessam as quantidades vendidas. Produção superior às vendas não altera nada, ao contrário do que sucede na comparação entre sistemas de custeio."], "formulas": ["Margem de contribuição unitária (mc) = Preço de venda unitário − Custo variável unitário", "Ponto de equilíbrio em quantidade (Q') = Custos fixos / mc", "Ponto de equilíbrio em valor (V') = Q' × Preço de venda unitário", "Margem de Segurança (% das vendas actuais) = (Vendas actuais − V') / Vendas actuais", "Margem de Segurança (% do ponto de equilíbrio) = (Vendas actuais − V') / V'", "% Margem de contribuição global (multiproduto) = Σ (peso do produto i nas vendas × % mc do produto i)", "Desvio da % de margem de contribuição = Σ [(peso real do produto i − peso orçamentado do produto i) × % mc orçamentada do produto i]", "◆ mc (Kz/un) = Preço de venda − custo industrial variável unitário − custos comerciais variáveis unitários", "◆ Razão de contribuição = mc / Preço de venda", "◆ Ponto crítico das vendas em valor (Kz) = Custos fixos totais / Razão de contribuição", "◆ Quantidade para um lucro L: Q = (Custos fixos totais + L) / mc", "◆ Quantidade para resultado igual a t% das vendas: Q = Custos fixos totais / (mc − t × Preço de venda)", "◆ Quantidade para resultado igual a t% da margem bruta das vendas: Q = Custos fixos totais / [mc × (1 − t)]", "◆ Manter o lucro após variação de preço: lucro actual (Kz) = Q0 × mc antiga − Custos fixos; depois Q = (Custos fixos + lucro actual) / mc nova", "◆ Preço de venda a partir da margem percentual: PV (Kz) = custo variável unitário / (1 − razão de contribuição)"], "erros": ["Há duas fórmulas distintas de margem de segurança (sobre vendas actuais vs. sobre o ponto de equilíbrio) — confirmar sempre qual é pedida, pois dão valores percentuais diferentes.", "Numa alteração de mix de vendas, calcular o desvio da % de margem de contribuição usando os PESOS reais vs. orçamentados de cada produto, mantendo a % mc unitária de cada produto constante — o desvio resulta apenas da mudança de composição, não de mudança nas margens unitárias.", "◆ Calcular o lucro a manter já com o preço reduzido, quando o lucro de referência é o obtido com o preço antigo.", "◆ Somar ao custo variável um custo fixo dado por unidade e destruir assim a margem de contribuição.", "◆ Levar ao ponto crítico apenas os custos fixos fabris, deixando de fora distribuição, administrativos e financeiros.", "◆ Tratar o resultado alvo em percentagem das vendas como se fosse um lucro absoluto, aplicando Q = (CF + L)/mc."]}, {"n": 7, "titulo": "Custos Padrão e Análise de Desvios", "norma": "Sistema de custeio padrão (standard costing) e análise de desvios (variance analysis)", "objectivo": "Estabelecer custos padrão (pré-determinados) para materiais, mão-de-obra e gastos gerais de fabrico, e analisar os desvios entre o custo padrão e o custo real, decompondo-os em desvio de preço/taxa e desvio de quantidade/eficiência.", "pontos": ["O custo padrão é um custo pré-determinado, estabelecido antes da produção com base em normas técnicas (quantidades e preços padrão); serve de referência para avaliar o desempenho real e para valorizar a produção.", "Para cada elemento de custo (materiais, MOD, GGF), o desvio TOTAL decompõe-se em duas componentes: um desvio de PREÇO/TAXA (a diferença entre o preço/taxa padrão e o real, aplicada à quantidade REAL consumida) e um desvio de QUANTIDADE/EFICIÊNCIA (a diferença entre a quantidade padrão e a real, aplicada ao preço/taxa PADRÃO).", "Um desvio é FAVORÁVEL quando o custo real é inferior ao custo padrão (a empresa gastou menos do que o previsto) e DESFAVORÁVEL quando o custo real excede o padrão.", "Para os GGF, o desvio total pode também decompor-se em desvio de despesa (orçamento) e desvio de volume/actividade, quando se compara o orçamento flexível ao nível de actividade real com o custo padrão imputado à produção obtida.", "Os desvios de eficiência de mão-de-obra e de materiais podem estar interligados — por exemplo, materiais de pior qualidade (preço mais baixo, desvio de preço favorável) podem gerar mais desperdício ou mais horas de trabalho (desvio de eficiência desfavorável) — a análise deve sempre procurar a causa raiz e não apenas o número isolado.", "◆ O desvio total pede-se muitas vezes de forma global, sem decomposição: basta comparar a produção real valorizada ao custo padrão unitário com o somatório dos custos reais dos três elementos.", "◆ O custo padrão unitário inclui os GGF variáveis padrão, que tanto podem vir por unidade fabricada como por hora de operário. Se vierem por hora, multiplicam-se pelas horas padrão unitárias.", "◆ O preço padrão costuma vir escondido numa percentagem: se o preço real foi 10% acima do previsto, o padrão obtém-se dividindo o real por 1,10, nunca multiplicando por 0,90.", "◆ A quantidade padrão vem igualmente escondida em frases como 'menos 1 m3 do que fora previsto' ou '200 sacas mais do que o previsto', e é sempre a quantidade real corrigida no sentido inverso.", "◆ A taxa real de MOD nunca vem dada: obtém-se dividindo o custo real total pelas horas efectivamente aplicadas, antes de calcular qualquer desvio.", "◆ Uma poupança de horas face ao padrão é desvio de eficiência e não afecta o desvio de preço, que só usa horas reais. Uma pergunta pode dar as duas informações apenas para induzir a confusão."], "formulas": ["Desvio de preço/taxa (materiais/MOD) = Quantidade REAL × (Preço Padrão − Preço Real)", "Desvio de quantidade/eficiência (materiais/MOD) = Preço Padrão × (Quantidade Padrão − Quantidade Real)", "Desvio total = Desvio de preço/taxa + Desvio de quantidade/eficiência = (Qp × Pp) − (Qr × Pr)", "Desvio total de GGF = GGF padrão/imputado à produção obtida − GGF reais incorridos", "◆ Custo padrão unitário (Kz/un) = Σ (quantidade padrão unitária × preço padrão) de matérias, MOD e GGF variáveis", "◆ Desvio total (Kz) = Produção real × custo padrão unitário − Custo real total; positivo é favorável", "◆ Preço real (Kz/un de matéria) = Custo real total da matéria / quantidade real consumida", "◆ Taxa real de MOD (Kz/hora) = Custo real da mão-de-obra / horas reais aplicadas", "◆ Desvio de preço ou de taxa (Kz) = Quantidade real × (Preço padrão − Preço real)", "◆ Quantidade padrão (Qp) = Produção real × quantidade padrão unitária", "◆ Desvio de quantidade ou de eficiência (Kz) = Preço padrão × (Qp − Qr)", "◆ Preço padrão a partir de um desvio percentual: Pp (Kz) = Preço real / (1 + variação percentual)", "◆ Desvio global de matérias com vários materiais (Kz) = Σ (Qp × Pp) − Σ (Qr × Pp)"], "erros": ["Atenção ao sinal: um desvio de preço calcula-se com a quantidade REAL, e um desvio de quantidade calcula-se com o preço PADRÃO — trocar estas bases é o erro mais frequente neste tema.", "Verificar sempre se o enunciado define 'desvio favorável/desfavorável' pela óptica do custo (real < padrão = favorável) — a terminologia é consistente, mas a leitura do sinal aritmético (positivo/negativo) pode gerar confusão se não for feita com cuidado.", "◆ Comparar o consumo real com a quantidade padrão da ficha técnica sem a multiplicar pela produção real do período.", "◆ Aplicar o desvio de preço com a quantidade padrão, ou o desvio de quantidade com o preço real.", "◆ Misturar unidades entre a ficha padrão e o consumo real, por exemplo 700 kg por tonelada contra consumos expressos em toneladas.", "◆ Deduzir o preço padrão multiplicando o real por (1 − x%) quando o enunciado diz que o real está x% acima do previsto."]}, {"n": 8, "titulo": "Orçamentos", "norma": "Orçamentação como instrumento de planeamento e controlo de gestão a curto prazo", "objectivo": "Compreender o papel do orçamento no planeamento e controlo de gestão, o processo de elaboração orçamental e a relação entre o orçamento e a análise de desvios.", "pontos": ["O orçamento é um instrumento de planeamento de gestão a curto prazo, que traduz em termos quantitativos (financeiros e não financeiros) os objectivos da organização para o período seguinte.", "O processo orçamental é, idealmente, participativo — envolve os responsáveis de diferentes níveis da organização, o que aumenta o compromisso com as metas definidas e facilita a implementação do controlo orçamental.", "O orçamento serve de base de comparação para o controlo orçamental: a comparação entre valores orçamentados e valores reais gera os desvios, que devem ser analisados para identificar as suas causas e accionar medidas correctivas.", "Um orçamento pode ser rígido (elaborado para um único nível de actividade) ou flexível (ajustável a diferentes níveis de actividade real, distinguindo entre custos fixos e variáveis) — o orçamento flexível é a base mais correcta para a análise de desvios de despesa em GGF, pois evita comparar orçamento a um nível de actividade com o real a outro nível diferente.", "A elaboração do orçamento segue tipicamente uma sequência lógica: orçamento de vendas → orçamento de produção → orçamentos de custos (matérias, mão-de-obra, GGF) → orçamento de tesouraria → demonstrações financeiras previsionais.", "◆ A ficha de custo padrão é o orçamento unitário da produção. O orçamento do período obtém-se multiplicando-a pela produção prevista, e o controlo faz-se recalculando o mesmo padrão para a produção real.", "◆ O orçamento flexível de um custo variável é a quantidade padrão unitária multiplicada pela produção REAL e pelo preço padrão. É este o termo de comparação com o custo real, e não o orçamento inicial.", "◆ A quota teórica de GGF é um instrumento orçamental: fixa-se no início do período a partir dos GGF orçamentados e de uma base de imputação prevista, e a diferença face aos GGF reais só se conhece no fecho, sob a forma de CINI.", "◆ No custeio racional o denominador orçamental é a capacidade normal, isto é, a capacidade teórica menos as paragens inevitáveis como a manutenção planeada. Usar a produção prevista no lugar da capacidade normal elimina o custo de subactividade e distorce o resultado.", "◆ O orçamento de produção não é o orçamento de vendas: obtém-se somando às vendas previstas a existência final desejada e subtraindo a existência inicial.", "◆ CINI e custo de subactividade são custos do período. Nunca integram o custo dos produtos nem a valorização das existências finais."], "formulas": ["◆ Orçamento de produção (un) = Vendas previstas + Existência final desejada de produtos acabados − Existência inicial", "◆ Orçamento de compras de matérias (un) = Consumo previsto + Existência final desejada de MP − Existência inicial de MP", "◆ Orçamento de custos de produção (Kz) = Produção prevista × custo padrão unitário", "◆ Orçamento flexível de um custo variável (Kz) = custo padrão unitário × produção real do período", "◆ Quota teórica de imputação = GGF orçamentados do período / base de imputação prevista", "◆ GGF imputados (Kz) = Quota teórica × base de imputação real consumida", "◆ CINI (Kz) = GGF reais − GGF imputados pela quota teórica", "◆ Custo de subactividade (Kz) = GGF fixos × (1 − Produção real / Capacidade normal)"], "erros": ["Comparar um orçamento RÍGIDO (fixado a um nível de actividade previsto) com os custos reais obtidos a um nível de actividade DIFERENTE distorce a análise de desvios — deve usar-se o orçamento flexível ajustado ao nível de actividade real para isolar correctamente o desvio de despesa.", "◆ Comparar o custo real com o orçamento elaborado para a produção prevista, em vez de flexibilizar o orçamento à produção real.", "◆ Tomar o orçamento de vendas como orçamento de produção, esquecendo a variação desejada de existências.", "◆ Incorporar o CINI ou o custo de subactividade no custo do produto e nas existências finais.", "◆ Calcular o grau de actividade sobre a produção prevista em vez da capacidade normal instalada."]}], "intro_temas": "Os exercícios de sessão (com resoluções passo-a-passo) mostram que a Contabilidade de Gestão é o módulo mais quantitativo do exame — praticamente todas as perguntas exigem cálculos numéricos a partir de dados de um enunciado, seguindo fórmulas-padrão. Dominar as fórmulas de CIPA/CIPV, repartição de custos conjuntos e desvios cobre a maior parte dos pontos do exame.", "temas": [{"tema": "Apuramento do CIPA e do CIPV a partir de existências iniciais/finais", "freq": "Muito alta", "pedido": "Uso das fórmulas de 'vasos comunicantes' para calcular qualquer variável em falta (existência inicial, final, CIPA ou CIPV) dado o resto da informação."}, {"tema": "Repartição de Gastos Gerais de Fabrico por quotas de imputação (real ou teórica)", "freq": "Muito alta", "pedido": "Cálculo da quota de imputação e sua aplicação a diferentes produtos/secções, incluindo o apuramento de Custos Industriais Não Imputados (CINI) quando a quota é teórica."}, {"tema": "Repartição de custos conjuntos entre produtos principais (critérios de quantidade, VVP e VVPS)", "freq": "Muito alta", "pedido": "Comparação dos três critérios de repartição e cálculo do CIPA unitário de cada produto conjunto, incluindo casos com subprodutos valorizados pelo critério do lucro nulo."}, {"tema": "Produção defeituosa normal vs. anormal e valorização de sucata", "freq": "Alta", "pedido": "Cálculo do custo unitário da produção boa quando existe produção defeituosa, distinguindo o tratamento de perdas normais (absorvidas) e anormais (resultado do período)."}, {"tema": "Análise CVR — ponto de equilíbrio e margem de segurança", "freq": "Alta", "pedido": "Cálculo do ponto de equilíbrio em quantidade e valor, e da margem de segurança nas duas formas (sobre vendas actuais e sobre o ponto de equilíbrio)."}, {"tema": "Alteração do mix de vendas e desvio da margem de contribuição global", "freq": "Média-Alta", "pedido": "Cálculo da % de margem de contribuição ponderada da empresa e decomposição do desvio por produto quando o mix de vendas se altera."}, {"tema": "Análise de desvios de materiais (preço e quantidade)", "freq": "Muito alta", "pedido": "Cálculo dos desvios de preço e de quantidade de materiais, e do desvio total, a partir de dados de custo padrão e custo real."}, {"tema": "Análise de desvios de mão-de-obra directa (taxa e eficiência)", "freq": "Muito alta", "pedido": "Cálculo dos desvios de taxa e de eficiência de MOD, com a mesma lógica de decomposição dos desvios de materiais."}, {"tema": "Método das secções homogéneas — cálculo do custo da unidade de obra", "freq": "Média-Alta", "pedido": "Redistribuição de custos de secções auxiliares por secções principais e cálculo/aplicação do custo da unidade de obra."}, {"tema": "Distinção entre regime de produção contínua (por processo) e descontínua (por encomenda)", "freq": "Média", "pedido": "Identificar o método de acumulação de custos adequado à natureza do processo produtivo descrito no enunciado."}, {"tema": "Elaboração de demonstração de resultados por funções a partir de dados de custeio", "freq": "Média-Alta", "pedido": "Construção de uma DR por funções (vendas, CIPV, resultado bruto, custos comerciais/administrativos/financeiros, resultado líquido) a partir dos custos apurados."}, {"tema": "Orçamento flexível vs. orçamento rígido na análise de desvios de GGF", "freq": "Média", "pedido": "Reconhecer quando é necessário ajustar o orçamento ao nível de actividade real antes de calcular desvios de despesa."}], "perguntas": [{"n": 1, "enunciado": "Uma empresa apresentou os seguintes dados do período: existência inicial de produtos acabados 50.000 Kz; CIPA do período 480.000 Kz; existência final de produtos acabados 90.000 Kz. Qual o CIPV do período?", "opcoes": {"A": "440.000 Kz", "B": "520.000 Kz", "C": "620.000 Kz", "D": "530.000 Kz"}, "correcta": "A", "explicacao": "CIPV = Ei PA + CIPA − Ef PA = 50.000 + 480.000 − 90.000 = 440.000 Kz.", "fonte": "Teste prático do resumo do Módulo 3"}, {"n": 2, "enunciado": "Uma empresa consumiu no período 40.000 Kz de matéria-prima e 60.000 Kz de mão-de-obra directa. Os GGF são imputados com base numa quota teórica de 50% sobre o custo primo. Qual o valor do CIPA, assumindo inexistência de produção em vias de fabrico?", "opcoes": {"A": "100.000 Kz", "B": "150.000 Kz", "C": "50.000 Kz", "D": "200.000 Kz"}, "correcta": "B", "explicacao": "Custo primo = 40.000 + 60.000 = 100.000; GGF = 50% × 100.000 = 50.000; CIPA = 100.000 + 50.000 = 150.000 Kz.", "fonte": "Teste prático do resumo do Módulo 3"}, {"n": 3, "enunciado": "Uma empresa produz, em regime de produção conjunta, os produtos A e B. Os custos conjuntos do período foram 90.000 Kz. O produto A gerou um valor de venda de 60.000 Kz e o produto B de 40.000 Kz, sem custos específicos. Pelo critério do Valor de Venda da Produção (VVP), qual a parte dos custos conjuntos imputada ao produto A?", "opcoes": {"A": "45.000 Kz", "B": "54.000 Kz", "C": "36.000 Kz", "D": "60.000 Kz"}, "correcta": "B", "explicacao": "% imputação de A = 60.000/(60.000+40.000) = 60%; custos conjuntos imputados a A = 60% × 90.000 = 54.000 Kz.", "fonte": "Teste prático do resumo do Módulo 3"}, {"n": 4, "enunciado": "Numa produção lançada de 5.000 unidades, considerou-se normal uma taxa de defeitos de 2% (100 unidades). Verificaram-se, na realidade, 130 unidades defeituosas (30 acima do normal), sem qualquer valor de sucata. Os custos totais de produção foram de 245.000 Kz. Qual o custo unitário (CIPA Un.) usado para valorizar quer a produção boa quer a produção defeituosa anormal?", "opcoes": {"A": "50 Kz", "B": "49 Kz", "C": "52,55 Kz", "D": "47,06 Kz"}, "correcta": "A", "explicacao": "CIPA Un. = Custos totais / (Produção lançada − perdas normais) = 245.000 / (5.000 − 100) = 245.000/4.900 = 50 Kz. A produção boa (4.870 un.) fica valorizada em 4.870 × 50 = 243.500 Kz e a produção defeituosa anormal (30 un.) em 30 × 50 = 1.500 Kz — o total confere com os 245.000 Kz de custos incorridos.", "fonte": "Teste prático do resumo do Módulo 3"}, {"n": 5, "enunciado": "Uma empresa tem custos fixos de 200.000 Kz, preço de venda unitário de 50 Kz e custo variável unitário de 30 Kz. Qual o ponto de equilíbrio em unidades?", "opcoes": {"A": "4.000 unidades", "B": "6.667 unidades", "C": "10.000 unidades", "D": "5.000 unidades"}, "correcta": "C", "explicacao": "mc = 50 − 30 = 20 Kz; Q' = Custos fixos / mc = 200.000 / 20 = 10.000 unidades.", "fonte": "Teste prático do resumo do Módulo 3"}, {"n": 6, "enunciado": "Uma empresa vende actualmente 12.000 unidades, sendo o ponto de equilíbrio de 8.000 unidades. Qual a margem de segurança, em percentagem das vendas actuais?", "opcoes": {"A": "33,3%", "B": "50%", "C": "66,7%", "D": "25%"}, "correcta": "A", "explicacao": "MS (% vendas actuais) = (Vendas actuais − Q') / Vendas actuais = (12.000 − 8.000)/12.000 = 33,3%.", "fonte": "Teste prático do resumo do Módulo 3"}, {"n": 7, "enunciado": "O custo padrão de matéria-prima de um produto é de 5 Kg a 10 Kz/Kg. Na produção real de 1.000 unidades, consumiram-se 5.300 Kg a um custo real de 9,50 Kz/Kg. Qual o desvio de preço de materiais?", "opcoes": {"A": "2.650 Kz favorável", "B": "2.650 Kz desfavorável", "C": "3.500 Kz favorável", "D": "3.500 Kz desfavorável"}, "correcta": "A", "explicacao": "Desvio de preço = Quantidade real × (Preço padrão − Preço real) = 5.300 × (10 − 9,50) = 2.650 Kz favorável (o preço real foi inferior ao padrão).", "fonte": "Teste prático do resumo do Módulo 3"}, {"n": 8, "enunciado": "Continuando o exemplo anterior, qual o desvio de quantidade de materiais, sabendo que a quantidade padrão para 1.000 unidades é de 5.000 Kg?", "opcoes": {"A": "3.000 Kz desfavorável", "B": "3.000 Kz favorável", "C": "2.850 Kz desfavorável", "D": "2.850 Kz favorável"}, "correcta": "A", "explicacao": "Desvio de quantidade = Preço padrão × (Quantidade padrão − Quantidade real) = 10 × (5.000 − 5.300) = −3.000, ou seja, 3.000 Kz desfavorável (consumiu-se mais do que o padrão).", "fonte": "Teste prático do resumo do Módulo 3"}, {"n": 9, "enunciado": "Numa empresa organizada por secções homogéneas, a secção de Manutenção (auxiliar) tem custos de 40.000 Kz que devem ser redistribuídos pelas secções principais de Corte e Acabamento, antes de se calcular o custo da respectiva unidade de obra. Esta redistribuição é necessária porque:", "opcoes": {"A": "A secção de Manutenção não tem custos reais, apenas custos teóricos", "B": "As secções auxiliares prestam serviços às secções principais, pelo que os seus custos devem ser incorporados no custo da actividade produtiva final", "C": "A lei fiscal angolana exige esta redistribuição para efeitos de Imposto Industrial", "D": "Não é necessária qualquer redistribuição — os custos da Manutenção são sempre um custo do período, não do produto"}, "correcta": "B", "explicacao": "As secções auxiliares (como a Manutenção) não participam directamente na produção, mas prestam serviços às secções principais; por isso, os seus custos devem ser redistribuídos pelas secções principais antes de se apurar o custo da unidade de obra que será finalmente imputado aos produtos.", "fonte": "Teste prático do resumo do Módulo 3"}, {"n": 10, "enunciado": "Uma empresa vende três produtos com os seguintes pesos nas vendas totais e margens de contribuição percentuais: Produto A (30% das vendas, mc 40%), Produto B (50% das vendas, mc 25%), Produto C (20% das vendas, mc 30%). Qual a % de margem de contribuição global da empresa?", "opcoes": {"A": "31,5%", "B": "30,0%", "C": "33,3%", "D": "28,5%"}, "correcta": "A", "explicacao": "% mc global = (0,30×0,40) + (0,50×0,25) + (0,20×0,30) = 0,12 + 0,125 + 0,06 = 0,315 = 31,5%.", "fonte": "Teste prático do resumo do Módulo 3"}, {"n": 501, "enunciado": "No âmbito de uma conversa sobre contabilidade de Gestão, e no que respeita ao cálculo dos custos de manutenção, o Contabilista apresentou o seguinte caso a título de exemplo, de uma empresa estruturada em secções principais e auxiliares: A Empresa Gama dedica-se à manutenção de equipamentos industriais da zona do BIÉ. Para isso, dispõe de uma estrutura produtiva com secções principais para executar diversas trabalhos para os clientes e da secção auxiliar Conservação destinada a apoiar as restantes secções da empresa. Dispõe ainda de uma secção de apoio denominada Serviços Gerais cujos custos são repartidos pelas restantes secções fabris em percentagem dos custos diretos, correspondendo 5% à Conservação. No período N a secção Conservação teve de custos diretos 16 760 euros e trabalhou 600 unidades de obra, das quais 10 foram aplicadas na reparação de um aparelho da secção Serviços Gerais, tendo tido esta última 48 480 Kz de custos diretos. No período N o custo unitário da unidade de obra de Conservação foi de:", "opcoes": {"A": "30,0 Kz.", "B": "35,0 Kz.", "C": "32,0 Kz.", "D": "28,0 Kz"}, "correcta": "C", "explicacao": "Prestações recíprocas: Conservação C = 16.760 + 5% x SG e SG = 48.480 + 10 x (C/600); substituindo, C = 19.184 + C/1.200, logo C = 19.200 Kz e o custo da unidade de obra = 19.200/600 = 32,0 Kz.", "fonte": "Sessão 5  -Questões Sessões homogéneas.pdf"}, {"n": 502, "enunciado": "A empresa KAPA utiliza diversas secções principais para executar as encomendas dos clientes e duas secções/centros de custos auxiliares ou de apoio denominadas Secção UM e Secção DOIS para apoiar as secções da fábrica e as da estrutura não fabril. Os custos de Serviços Gerais da fábrica são repartidos em função dos custos diretos das restantes. Em 2010, a Secção UM teve de custos diretos 47.600 Kz e trabalhou 300 horas das quais 20 foram aplicadas na Secção DOIS. Por sua vez, esta última secção teve de custos diretos 96.100Kz e trabalhou 1.000 horas, das quais 100 foram aplicadas pela Secção UM. Os custos imputados de Serviços Gerais a cada uma das duas secções/centros de custos auxiliares ascenderam a 7.400Kz para a Secção UM e 9.500Kz para a Secção DOIS. Os custos unitários de cada hora Secção-UM e Secção-DOIS foram, respetivamente:", "opcoes": {"A": "220Kz e 105Kz .", "B": "210Kz e 110Kz .", "C": "205Kz e 105Kz .", "D": "220Kz e 110Kz"}, "correcta": "D", "explicacao": "Sistema recíproco: UM = 47.600 + 7.400 + 100 x (DOIS/1.000) e DOIS = 96.100 + 9.500 + 20 x (UM/300); resolvendo, UM = 66.000 Kz e DOIS = 110.000 Kz, donde 66.000/300 = 220 Kz/hora e 110.000/1.000 = 110 Kz/hora.", "fonte": "Sessão 5  -Questões Sessões homogéneas.pdf"}, {"n": 503, "enunciado": "A Sociedade de Reparações, SA, tem contabilisticamente a Oficina organizada em secções principais, entre as quais a secção de Mecânica cuja unidade de imputação é a hora de funcionamento (Hf). Por outro lado, a Oficina tem uma secção de apoio – Serviços Gerais, cujos custos são repartidos pelas secções principais em percentagem, cabendo à Mecânica 12%. Em certo período, a Mecânica teve de custos diretos 20 100Kz e trabalhou 750 horas, das quais 30 foram aplicadas a reparar um equipamento afeto a Serviços Gerais. Esta última teve, no mesmo período, custos diretos de 93 740Kz. Os custos por hora de funcionamento do período de Mecânica são;", "opcoes": {"A": "43Kz .", "B": "42Kz .", "C": "45Kz .", "D": "Nenhuma das anteriores"}, "correcta": "B", "explicacao": "Reembolso recíproco: M = 20.100 + 12% x (93.740 + 30 x M/750); daqui 0,9952 M = 31.348,80, ou seja M = 31.500 Kz, e o custo por hora de funcionamento = 31.500/750 = 42 Kz.", "fonte": "Sessão 5  -Questões Sessões homogéneas.pdf"}, {"n": 504, "enunciado": "Certa empresa dispõe de uma Fábrica que está organizada em secções homogéneas, dispondo das secções principais X e Y e das secções auxiliares ou de apoio A e B. As duas primeiras têm como unidade de obra a hora de funcionamento (Hf) e a secção A, a hora-homem (HH). A secção B reparte os custos pelas restantes secções em função dos custos diretos. No período N as secções X e Y tiveram de custos diretos 146.270Kz e 165.300Kz , respetivamente e as secções A e B tiveram 28.430Kz e 17.000Kz , respetivamente. Sabendo que as secções X e Y trabalharam 2 400 Hf e 3000 Hf, respetivamente, das quais 10 Hf da secção Y foram aplicadas em A e que esta trabalhou 2 400 HH que aplicou 1 200 HH em X e 1 200 em Y, o custo unitário de cada unidade de obra das secções principais é, aproximadamente, de:", "opcoes": {"A": "Secção X – 73,90Kz e secção Y – 62,73Kz .", "B": "Secção X – 62,985Kz e secção Y – 63,90Kz .", "C": "Secção X – 63,90Kz e secção Y – 62,90Kz .", "D": "Secção X – 70,34Kz e secção Y – 62,94Kz"}, "correcta": "D", "explicacao": "A secção B reparte 17.000 sobre 340.000 de custos directos (taxa de 5%): X = 153.583,50; Y = 173.565; A = 29.851,50. Com a reciprocidade A<->Y (A = 29.851,50 + 10 x Y/3.000 e Y = 173.565 + 1.200 x A/2.400) obtém-se A = 30.480,85 (12,70/HH), Y = 188.805,43 (62,94/Hf) e X = 153.583,50 + 1.200 x 12,70 = 168.823,93, isto é 70,34 Kz/Hf.", "fonte": "Sessão 5  -Questões Sessões homogéneas.pdf"}, {"n": 505, "enunciado": "A Empresa DELTA executa encomendas de clientes mediante orçamento previamente aprovado por estes. No cálculo do custo de produção de cada encomenda a empresa imputa os gastos gerais de fabricação com base no custo directo ou primo mediante uma quota teórica de 75Kz por cada 100Kz de custo primo. No caso da encomenda 2021/23 foram requisitados ao armazém para a mencionada encomenda 665 metros de perfil cujo custo unitário foi de 1600Kz/metro e foram utilizadas 220 horas de operários cujo custo médio unitário foi de 2200Kz. Sabendo que foram devolvidos ao armazém 15 metros de perfil daquela encomenda e que os gastos gerais de fabrico do mês somaram 1.243.000Kz, o custo de produção da referida encomenda somou:", "opcoes": {"A": "2.676.000", "B": "2.767.000", "C": "2.791.000", "D": "2.667.000"}, "correcta": "D", "explicacao": "Perfil efectivamente consumido = 665 − 15 devolvidos = 650 m × 1.600 = 1.040.000 Kz; MOD = 220 h × 2.200 = 484.000 Kz; custo primo = 1.524.000 Kz. GGF imputados pela quota teórica (75 Kz por cada 100 Kz de custo primo) = 0,75 × 1.524.000 = 1.143.000 Kz. Custo de produção = 1.524.000 + 1.143.000 = 2.667.000 Kz (os 1.243.000 Kz de GGF reais do mês servem apenas para apurar o CINI, não entram na encomenda).", "fonte": "Sessão 2 CPE - Questões Sistemas de custos.pdf"}, {"n": 506, "enunciado": "O cálculo dos custos da mão de obra direta do quarto trimestre de 2020 da empresa considera apenas:", "opcoes": {"A": "As remunerações ilíquidas mensais e os encargos da entidade patronal correspondentes.", "B": "As remunerações ilíquidas mensais mais os encargos da entidade patronal e dos encargos anuais com férias e o subsídio de natal.", "C": "As remunerações líquidas mensais acrescidas dos encargos da entidade patronal e dos encargos anuais com as férias e o subsídio de natal.", "D": "Nenhuma das anteriores."}, "correcta": "B", "explicacao": "O custo da mão-de-obra directa mede-se pelo custo total suportado pela empresa: remunerações ilíquidas (e não líquidas, pois as retenções já estão incluídas no ilíquido e são custo da empresa), acrescidas dos encargos da entidade patronal e da periodificação dos encargos anuais com férias e subsídio de Natal.", "fonte": "Sessão 2 CPE - Questões Sistemas de custos.pdf"}, {"n": 507, "enunciado": "Para fazer face à quebra de vendas, em 2018 uma empresa iniciou uma campanha comercial válida durante o primeiro semestre. Esta campanha prevê a ‘oferta’ de uma cadeira modelo “EXECUTIVO”, cujo custo de fabrico ascende 200.000Kz, aos clientes que comprarem pelo menos três peças da linha de móveis de escritório “PRESTIGE”. O custo das cadeiras oferecidas pela empresa no âmbito da campanha comercial mencionada:", "opcoes": {"A": "Aumenta o custo industrial dos produtos acabados.", "B": "Reduz o custo industrial dos produtos acabados.", "C": "Reduz os inventários de produtos acabados.", "D": "Reduz o custo industrial dos produtos vendidos."}, "correcta": "C", "explicacao": "As cadeiras oferecidas são produtos acabados que saem do armazém ao custo de produção, pelo que reduzem os inventários de produtos acabados; o custo industrial da produção acabada e da produção vendida do período não é afectado — a oferta é um custo de distribuição/comercial do período.", "fonte": "Sessão 2 CPE - Questões Sistemas de custos.pdf"}, {"n": 508, "enunciado": "A empresa Gama produziu, em certo período, 2 000 unidades do produto X que consumiram matérias-primas no total de 65 500Kz, utilizaram horas de mão-de-obra direta no total de 24 500Kz e os gastos gerais de fabrico somaram 36 000Kz. A empresa tinha em armazém, no início do período, 500 unidades do produto X a 60Kz cada e no final 750 unidades do mesmo produto. Sabendo que a empresa adota uma quota teórica de 0,4Kz para 1Kz de custo primo para repartir os gastos gerais de fabrico e que segue o LIFO na valorização das saídas de armazém, o custo dos produtos vendidos do período e o custo da existência final são, respetivamente, de:", "opcoes": {"A": "102 750Kz e 45 250Kz.", "B": "112 500Kz e 47 250Kz.", "C": "110 250Kz e 45 750Kz.", "D": "Nenhuma das anteriores"}, "correcta": "C", "explicacao": "Custo primo = 65.500 + 24.500 = 90.000 Kz; GGF imputados = 0,4 × 90.000 = 36.000 Kz; custo de produção = 126.000 Kz ÷ 2.000 un = 63 Kz/un. Vendas = 500 + 2.000 − 750 = 1.750 un e, em LIFO, saem das últimas entradas: 1.750 × 63 = 110.250 Kz; existência final = 250 × 63 + 500 × 60 = 15.750 + 30.000 = 45.750 Kz.", "fonte": "Sessão 2 CPE - Questões Sistemas de custos.pdf"}, {"n": 509, "enunciado": "Para calcular o custo de produção de cada trabalho de arquitetura num Gabinete de Arquitetos, que adota o sistema de custeio total deve considerar-se:", "opcoes": {"A": "Apenas os custos de conversão variável.", "B": "O montante dos custos da produção em vias de fabrico.", "C": "Os custos com o financiamento da sede da empresa.", "D": "Nenhuma das anteriores."}, "correcta": "B", "explicacao": "No custeio total o custo de cada trabalho acumula todos os custos industriais (fixos e variáveis) que lhe são afectos, montante que, enquanto o trabalho não está concluído, corresponde precisamente aos custos da produção em vias de fabrico; a alínea A exclui os custos fixos e a C respeita a custos de financiamento, que nunca são custos de produção.", "fonte": "Sessão 2 CPE - Questões Sistemas de custos.pdf · resposta a confirmar"}, {"n": 510, "enunciado": "A empresa Beta segue o custeio variável na mensuração da produção. No período N fabricou 80.000 m2 de X. Não havia stocks iniciais e no final havia 10.000 m2 de X. No período o preço médio de venda foi de 16Kz/m2. No período a empresa teve os custos seguintes: Fixos Variáveis - Fabris 280.000Kz Kz560.000 - Distribuição 120.000Kz 1Kz/m2 - Financeiros 40.000Kz - Administrativos 50.000Kz Se a empresa seguisse o custeio total, o resultado antes de impostos seria:", "opcoes": {"A": "Inferior em 35.000Kz.", "B": "Superior em 280.000Kz.", "C": "Inferior em 280.000Kz.", "D": "Superior em 35.000Kz ."}, "correcta": "D", "explicacao": "No custeio variável a existência final é valorizada a 560.000/80.000 = 7 Kz/m2 e no custeio total a (560.000 + 280.000)/80.000 = 10,5 Kz/m2. Os 10.000 m2 em stock diferem 10.000 × (10,5 − 7) = 35.000 Kz de custos fixos fabris para o período seguinte, pelo que no custeio total o resultado antes de impostos seria superior em 35.000 Kz.", "fonte": "Sessão 2 CPE - Questões Sistemas de custos.pdf"}, {"n": 511, "enunciado": "O nível da capacidade normal dos meios de produção no sistema de custeio racional é o nível que:", "opcoes": {"A": "A empresa utilizou nos últimos 10 anos.", "B": "Deve ter em conta a perda de capacidade decorrente da manutenção planeada.", "C": "Iguala sempre a capacidade real utilizada.", "D": "Todas as anteriores são falsas."}, "correcta": "B", "explicacao": "A capacidade normal é a capacidade praticamente atingível em condições normais de laboração, isto é, a capacidade teórica deduzida das paragens inevitáveis, designadamente a manutenção planeada; não é a média histórica dos últimos 10 anos nem coincide com a capacidade real utilizada (se coincidisse nunca haveria custo de subactividade).", "fonte": "Sessão 2 CPE - Questões Sistemas de custos.pdf"}, {"n": 512, "enunciado": "Uma certa empresa do ramo químico tem uma capacidade instalada de produção de 60.000 unidades/período e adota na mensuração dos produtos acabadoso custeio total. Em certo período produziu 50.000 unidades do produto Alfa e vendeu no mesmo período 45.000 unidades. Os stocks iniciais eram nulos. Sabendo que a empresa tem a contabilidade e gestão organizada para imputar os custos fixos e variáveis à produção de cada período, o resultado antes de I. Industrial do período:", "opcoes": {"A": "Aumenta se a empresa adotar o custeio racional.", "B": "Diminui se a empresa adotar o custeio variável.", "C": "É igual em qualquer um dos sistemas de custeio.", "D": "Nenhuma das anteriores."}, "correcta": "B", "explicacao": "Como a produção (50.000 un) excede as vendas (45.000 un), ficam 5.000 un em stock final que retêm custos fixos industriais: no custeio total retêm o máximo, no racional apenas a parte imputada (grau de actividade = 50.000/60.000 = 83,3%) e no variável não retêm nenhum. Logo o resultado é máximo no custeio total e diminui se a empresa adoptar o custeio variável.", "fonte": "Sessão 2 CPE - Questões Sistemas de custos.pdf"}, {"n": 513, "enunciado": "A Sociedade Industrial Alfa adota o sistema de custeio variável. Em certo período produziu 8.000 unidades do produto X a um custo unitário de 50Kz, tendo vendido no mesmo período 6.000 unidades a 150Kz. Nesse período a empresa teve custos fabris de natureza fixa no montante de 320.000Kz e custos de distribuição, administrativos e de financiamento de 335.000Kz, também de natureza fixa. Os inventários do início do período eram nulos. Se a empresa adotar o sistema de custeio total, o resultado antes de I. Industrial:", "opcoes": {"A": "Melhora em 45.000 Kz.", "B": "Piora em 55.000 Kz.", "C": "Melhora em 80.000 Kz.", "D": "Piora em 75.000Kz."}, "correcta": "C", "explicacao": "Custeio variável: 6.000 × 150 − 6.000 × 50 − 320.000 − 335.000 = −55.000 Kz. Custeio total: custo unitário = 50 + 320.000/8.000 = 90 Kz, logo 900.000 − 6.000 × 90 − 335.000 = +25.000 Kz. A diferença é de 80.000 Kz (= 2.000 un em stock × 40 Kz de custo fixo unitário), ou seja, o resultado melhora em 80.000 Kz.", "fonte": "Sessão 2 CPE - Questões Sistemas de custos.pdf"}, {"n": 514, "enunciado": "A empresa Zeta, dedica-se à produção e comercialização de telemóveis marca SYON, adotando o sistema de custeio racional no cálculo dos custos de produção. No período N a Contabilidade de Gestão recolheu as informações seguintes: - Capacidade instalada 4 800 milhares de unidades - Produção no período 3 600 milhares de unidades -- custos fixos da fábrica 1 800 milhares de Kz -- custos variáveis da fábrica 7 650 milhares de Kz -- custos variáveis não fabris 5 460 milhares de Kz -- custos fixos não fabris 2 610 milhares de Kz Sabendo que a empresa vendeu 3 000 000 unidades a 5,75Kz cada, o resultado antes de impostos é:", "opcoes": {"A": "1 320 milhares de Kuanzas.", "B": "1 210 milhares de Kuanzas.", "C": "1 130 milhares de Kuanzas.", "D": "Nenhuma das anteriores."}, "correcta": "D", "explicacao": "Grau de actividade = 3.600/4.800 = 75%; custos fixos fabris imputados = 0,75 × 1.800 = 1.350 e custo de subactividade = 450 (custo do período). Custo unitário = (7.650 + 1.350)/3.600 = 2,5 Kz; resultado = 3.000 × 5,75 − 3.000 × 2,5 − 5.460 − 2.610 − 450 = 17.250 − 7.500 − 8.070 − 450 = 1.230 milhares de Kz, valor que não consta de nenhuma das alíneas.", "fonte": "Sessão 2 CPE - Questões Sistemas de custos.pdf · resposta a confirmar"}, {"n": 515, "enunciado": "Uma empresa efetua lavagens dos automóveis com um equipamento que acabou de adquirir por 30.000.000Kz há dois anos. Em 2018, o custo de exploração variável anual ascendeu a 12.000.000Kz, e o custo fixo por lavagem atingiu 1.000Kz. A SEMPRE A ANDAR, SA cobrou 6.000Kz por lavagem e efetuou, em média, 500 lavagens por mês. A margem de contribuição percentual sobre o preço de venda obtida pela SEMPRE A ANDAR, SA, em 2018, no serviços de lavagens foi, aproximadamente:", "opcoes": {"A": "67%.", "B": "50%.", "C": "33%.", "D": "20%."}, "correcta": "A", "explicacao": "Lavagens anuais = 500 × 12 = 6.000; proveitos = 6.000 × 6.000 = 36.000.000 Kz; custo variável unitário = 12.000.000/6.000 = 2.000 Kz. Margem de contribuição unitária = 6.000 − 2.000 = 4.000 Kz, ou seja 4.000/6.000 = 66,7% ≈ 67% do preço de venda (o custo fixo de 1.000 Kz por lavagem não entra na margem de contribuição).", "fonte": "Sessão 2 CPE - Questões Sistemas de custos.pdf"}, {"n": 516, "enunciado": "O diretor comercial da INFOTOC sugeriu que o preço de venda dos discos rígidos de 1 TB descesse para 60Kz, apesar de a empresa prever continuar a suportar um custo variável unitário de 30Kz. Se o preço de venda dos discos rígidos de 1 TB descer para 60Kz, mantidas inalteradas todas as outras variáveis a margem sobre o preço de venda passará a ser exata ou aproximadamente de:", "opcoes": {"A": "50,0%.", "B": "57,1%.", "C": "66,7%.", "D": "100,0%"}, "correcta": "A", "explicacao": "Margem sobre o preço de venda = (PV − custo variável unitário)/PV = (60 − 30)/60 = 50,0%.", "fonte": "Sessão 2 CPE - Questões Sistemas de custos.pdf"}, {"n": 517, "enunciado": "Se uma empresa do ramo da reparação naval adotar o método de acumulação dos gastos fabris por encomenda (método direto):", "opcoes": {"A": "Os subprodutos devem ser mensurados pelo método das unidades equivalentes.", "B": "A repartição dos gastos de produção pelos produtos principais (coprodutos) constitui uma particularidade do método.", "C": "O custo industrial de cada encomenda deve ser calculado quando não existir produção em vias de fabrico.", "D": "O método é de aplicação prioritária na produção contínua e padronizada."}, "correcta": "C", "explicacao": "No método directo (por encomenda) os custos acumulam-se na ficha de cada encomenda e o custo industrial só fica determinado quando a encomenda está concluída, ou seja, quando já não há produção em vias de fabrico nessa obra; as unidades equivalentes e a repartição de custos conjuntos são próprias do custeio por processo/produção conjunta, e a produção contínua e padronizada exige o método indirecto.", "fonte": "Sessão 3 CPE - Questões metodos cumulação de custos.pdf"}, {"n": 518, "enunciado": "Certa empresa fabrica o produto Gama. Em certo período entraram em armazém de produtos acabados 65.000 unidades. A empresa suportou de custos de produção no montante de 713.450Kz, sendo 299.700Kz de custo com matérias e outros materiais diretos e 413.750Kz respeitantes a custos de conversão fixos e variáveis. No final do período havia 2.000 unidades de produção em vias de fabrico a que faltavam 20% de matérias e outros materiais incorporados e 40% de custos de conversão. O custo unitário de cada unidade acabada no período foi:", "opcoes": {"A": "10,95Kz.", "B": "10,65Kz.", "C": "10,50Kz.", "D": "10,75Kz."}, "correcta": "D", "explicacao": "Produção equivalente em materiais = 65.000 + 2.000 × 80% = 66.600 un → 299.700/66.600 = 4,50 Kz; produção equivalente em custos de conversão = 65.000 + 2.000 × 60% = 66.200 un → 413.750/66.200 = 6,25 Kz. Custo unitário da unidade acabada = 4,50 + 6,25 = 10,75 Kz.", "fonte": "Sessão 3 CPE - Questões metodos cumulação de custos.pdf"}, {"n": 519, "enunciado": "Quando a Contabilidade de Gestão adota o método do custeio por processos para apuramento dos custos de produção:", "opcoes": {"A": "Os custos com as naturezas diretas são imputados diariamente dada a facilidade de repartição.", "B": "No final de cada mês a contabilidade financeira fornece informação para o cálculo dos custos fabris com base nos quais se calculam os custos de produção.", "C": "As entradas de produtos acabados em armazém são mensuradas diariamente com base nos custos reais.", "D": "Todas as anteriores são falsas."}, "correcta": "B", "explicacao": "No custeio por processos os custos são acumulados por período (tipicamente o mês) e só no fim do mês, com a informação da contabilidade financeira sobre os gastos fabris, se apura o custo de produção e o custo unitário pela produção equivalente; não há imputação nem valorização diária a custos reais, o que invalida as alíneas A e C.", "fonte": "Sessão 3 CPE - Questões metodos cumulação de custos.pdf · resposta a confirmar"}, {"n": 520, "enunciado": "A mensuração dos produtos em vias de fabrico numa empresa industrial permite:", "opcoes": {"A": "Calcular o saldo final da conta de Produção.", "B": "Calcular diretamente o custo das vendas.", "C": "Mensurar a produção defeituosa com carácter acidental.", "D": "Imputar os custosnão fabris à produção acabada."}, "correcta": "A", "explicacao": "A mensuração dos produtos em vias de fabrico determina exactamente o saldo devedor final da conta de Produção/Fabricação (custos incorridos menos custo da produção acabada transferida); não permite calcular directamente o custo das vendas nem imputar custos não fabris à produção.", "fonte": "Sessão 3 CPE - Questões metodos cumulação de custos.pdf"}, {"n": 521, "enunciado": "A empresa Gama dispõe de uma Linha de Montagem onde faz a junção das diversas componentes de produto Y. Em certo período os custos de produção do produto Y envolveram 216.000 Kz de matérias- primas consumidas, 152.500 Kz de mão-de-obra direta e 162.500 Kz de gastos gerais de fabrico e produziram-se 100 unidades do produto Y. Sabendo que no final do período havia ainda na Linha 10 unidades que tinham incorporado 80% de matérias-primas e 50% dos gastos de conversão (transformação) e que não havia produtos em vias de fabrico iniciais:", "opcoes": {"A": "A conta de Produção é creditada por 531.000 Kz.", "B": "A conta de Produção é debitada por 531.000 Kz.", "C": "O saldo da conta Produção é credor de 31.000 Kz.", "D": "A conta de Produtos Acabados é debitada por 531.000 Kz."}, "correcta": "B", "explicacao": "A conta de Produção é debitada pela totalidade dos custos do período: 216.000 + 152.500 + 162.500 = 531.000 Kz. Equivalentes: matérias 100 + 10 × 80% = 108 un (216.000/108 = 2.000 Kz) e conversão 100 + 10 × 50% = 105 un (315.000/105 = 3.000 Kz), pelo que a produção acabada creditada é 100 × 5.000 = 500.000 Kz e o saldo é devedor de 31.000 Kz — o que exclui as alíneas A, C e D.", "fonte": "Sessão 3 CPE - Questões metodos cumulação de custos.pdf"}, {"n": 522, "enunciado": "A empresa Alfa fabrica o produto Gama através da transformação de matérias-primas nos Departamentos fabris X e Y. Para o efeito as matérias são transformadas no Departamento X após o que seguem para o departamento Y onde são concluídas. Em determinado período, o Departamento Y produziu 1.900 unidades de Gama que deram entrada em armazém de produtos acabados. No final do período havia 50 unidades a que faltavam incorporar 40% das operações de acabamento deste departamento. No período o Departamento Y teve de gastos de conversão 25.090Kz e recebeu 1.950 unidades de semi- produto de X a que foram atribuídos gastos de 68.250Kz. No final do período o saldo da conta de Produtos e trabalhos em curso é de:", "opcoes": {"A": "2.140Kz.", "B": "2.480Kz.", "C": "2.24KzKz.", "D": "Nenhuma das anteriores."}, "correcta": "A", "explicacao": "Custo unitário do semi-produto recebido de X = 68.250/1.950 = 35 Kz (as 50 unidades em curso já o incorporam a 100%); produção equivalente em conversão de Y = 1.900 + 50 × 60% = 1.930 un → 25.090/1.930 = 13 Kz. Saldo de Produtos e trabalhos em curso = 50 × 35 + 50 × 60% × 13 = 1.750 + 390 = 2.140 Kz.", "fonte": "Sessão 3 CPE - Questões metodos cumulação de custos.pdf"}, {"n": 523, "enunciado": "Uma empresa está organizada em dois departamentos: Serviços de Manutenção Pré-programada e Serviços de Reparação. Os Serviços de Manutenção Pré-programada encontram-se padronizados e consistem em manutenções recomendadas pelas marcas de automóveis referentes a suspensões, travões, mudanças de óleo e filtros. Os administradores da empresa discutem atualmente a possibilidade de melhorar o sistema de contabilidade de gestão dessa empresa de modo a aumentara sua utilidade no apoio à tomada de decisão. Nesse âmbito, equacionam passar a utilizar exclusivamente o custeio por obras, abandonando o uso de custeio por processo.", "opcoes": {"A": "A empresa terá vantagem em abdicar do “custeio por processo” e passar a usar exclusivamente o “custeio por obras” porque todos os serviços prestados pela empresa obedecem a processos repetitivos.", "B": "A empresa terá vantagem em abdicar do “custeio por processo” e passar a usar exclusivamente o “custeio por obras” porque as quantidades de mão-de-obra direta usadas na prestação de todos os serviços não são, em geral, variáveis.", "C": "A empresa terá vantagem em abdicar do “custeio por processo” e passar a usar exclusivamente o “custeio por obras” porque os serviços prestados obedecem sempre a especificações definidas pelos fabricantes das marcas das viaturas.", "D": "A empresa não deve abdicar do “custeio por processo”, antes deve manter ambos os sistemas de custeio, dado os tipos de intervenção que efetua"}, "correcta": "D", "explicacao": "Os dois departamentos têm naturezas produtivas distintas: as manutenções pré-programadas são serviços padronizados e repetitivos (adequados ao custeio por processo), enquanto as reparações são intervenções específicas e não uniformes (adequadas ao custeio por obra), pelo que a empresa deve manter ambos os sistemas.", "fonte": "Sessão 3 CPE - Questões metodos cumulação de custos.pdf"}, {"n": 524, "enunciado": "O sistema de contabilidade de Gestão da empresa BETA tem-se revelado de grande utilidade no apoio à tomada de decisão. A empresa BETA fabrica as suas linhas de mobiliário em série, pelo que utiliza o custeio por processo. A Gerência está a equacionar a possibilidade de passar a utilizar o custeio por obras. A empresa BETA tem vantagens em manter o “custeio por processos” em vez de passar a usar o “custeio por obras” porque:", "opcoes": {"A": "A produção da empresa obedece a processos não repetitivos.", "B": "As quantidades de mão-de-obra direta usadas na produção são variáveis.", "C": "A produção da empresa obedece a processos repetitivos.", "D": "Os produtos da empresa são desenhados de acordo com especificações definidas por cada um dos clientes."}, "correcta": "C", "explicacao": "O método de acumulação decorre da natureza do processo produtivo: fabricando mobiliário em série, de forma repetitiva e homogénea, a BETA deve manter o custeio por processos; seriam produtos não repetitivos ou desenhados segundo especificações de cada cliente que justificariam o custeio por obras.", "fonte": "Sessão 3 CPE - Questões metodos cumulação de custos.pdf"}, {"n": 525, "enunciado": "No âmbito do apuramento dos custos dos produtos que fabrica e comercializa, a empresa BETA calcula unidades equivalentes de produção. Na empresa BETA , as unidades equivalentes de produção são:", "opcoes": {"A": "Usadas como base do cálculo dos custos unitários.", "B": "Uma medida da atividade produtiva.", "C": "Calculadas em separado para cada um dos inputs consumidos no processo de produção.", "D": "Todas as anteriores são verdadeiras"}, "correcta": "D", "explicacao": "As unidades equivalentes são simultaneamente uma medida da actividade produtiva do período, a base de cálculo dos custos unitários (custos do período ÷ produção equivalente) e são apuradas separadamente para cada input (matérias e custos de conversão), por terem graus de incorporação diferentes — logo todas as anteriores são verdadeiras.", "fonte": "Sessão 3 CPE - Questões metodos cumulação de custos.pdf"}, {"n": 526, "enunciado": "No Departamento Fabril X de uma empresa do ramo industrial produziu-se durante o mês de Julho o produto Gama e, no final desse mês, havia em curso de fabrico 5 unidades que incorporavam todas as matérias- primas e 80% dos custos de transformação aplicados. A produção terminada durante o mês no Departamento X foi de 150 unidades e os custos deste Departamento no mês foram os seguintes: materiais diretos consumidos – 465.000Kz, gastos gerais de fabrico – 184.800Kz e mão-de-obra direta – 115.500Kz. Sabendo que no início do mês de Julho não havia produtos em vias de fabrico no Departamento X, a conta de Fabricação - Departamento Fabril X no mês:", "opcoes": {"A": "É creditada por 742.500Kz, apresentando saldo devedor de 22.800Kz.", "B": "É creditada por 724.500Kz, apresentando saldo devedor de 28.200Kz.", "C": "É creditada por 745.200Kz, apresentando saldo devedor de 22.800Kz.", "D": "É creditada por 737.100Kz, apresentando saldo devedor de 28.200Kz."}, "correcta": "A", "explicacao": "Equivalentes: matérias 150 + 5 = 155 un → 465.000/155 = 3.000 Kz; conversão 150 + 5 × 80% = 154 un → (184.800 + 115.500)/154 = 1.950 Kz. A conta é debitada por 765.300 Kz e creditada pela produção acabada 150 × 4.950 = 742.500 Kz, ficando com saldo devedor (PVF final) de 5 × 3.000 + 4 × 1.950 = 22.800 Kz.", "fonte": "Sessão 3 CPE - Questões metodos cumulação de custos.pdf"}, {"n": 527, "enunciado": "O sistema de contabilidade de gestão da empresa DELTA tem-se revelado de grande utilidade no apoio à tomada de decisão. Dada a natureza da atividade da empresa, usa-se o custeio por obra, mas a Gerência está a equacionar a possibilidade de passar a utilizar o custeio por processo. Relativamente à possibilidade de a empresa DELTA . passar a adotar o “custeio por processo”:", "opcoes": {"A": "O custeio por processo é possível porque nele os custos de produção são apurados prioritariamente por “ordens de produção”.", "B": "O custeio por processo é uma via alternativa para que a cada ordem de produção possa corresponder uma “ficha de custo por obra”.", "C": "Não é possível aplicar o custeio por processo dado que cada obra da empresa é diferente das demais.", "D": "Nenhuma das anteriores."}, "correcta": "C", "explicacao": "O método de acumulação decorre da natureza do processo: sendo cada obra da DELTA distinta das restantes (produção descontínua e não repetitiva), não é aplicável o custeio por processo, que pressupõe produção contínua e homogénea acumulada por período; as alíneas A e B trocam as características dos dois métodos.", "fonte": "Sessão 3 CPE - Questões metodos cumulação de custos.pdf"}, {"n": 528, "enunciado": "A empresa fabril X apresenta em certo período a seguinte informação do produto Gama: CONTA DE PRODUÇÃO – PRODUTO GAMA Ex. Iniciais de PVF – 1 000 un. Produção acabada – 40 000 un MP – 50% 14 500kz CT – 20% 4 500kz Custos do período: Ex. Finais de PVF – 2.000 un MP 332 000kz MP – 100% CT 243 600kz CT – 40% Sabendo que o critério valorimétrico utilizado na movimentação das existências é o FIFO, o valor das existências finais de produtos em vias de fabrico será:", "opcoes": {"A": "19 500kz.", "B": "20 800kz.", "C": "22 500kz.", "D": "18 800kz. 29- 2014"}, "correcta": "B", "explicacao": "Em FIFO, equivalentes em matérias = 1.000 × 50% + 39.000 iniciadas e acabadas + 2.000 × 100% = 41.500 un → 332.000/41.500 = 8 Kz; equivalentes em conversão = 1.000 × 80% + 39.000 + 2.000 × 40% = 40.600 un → 243.600/40.600 = 6 Kz. Existência final de PVF = 2.000 × 8 + 800 × 6 = 16.000 + 4.800 = 20.800 Kz.", "fonte": "Sessão 3 CPE - Questões metodos cumulação de custos.pdf"}, {"n": 529, "enunciado": "A Empresa ALFA produz, em regime de produção conjunta, as rações tipo A e tipo B que comercializa no mercado, após operações de embalagem, ao preço de venda unitário de 3.750kz/kg e 4.800kz/kg, respetivamente. No ponto de separação obtém, para além dos produtos A e B, o subproduto S que vende a um cliente ao preço de 1.250.000/tonelada e o resíduo R que manda destruir pagando 1.500.000kz/tonelada. Em certo período N venderam-se 80 toneladas de A e 96 toneladas de B e 12 toneladas de S. Os stocks iniciais eram nulos e no final do período havia 4 toneladas de B. Obtiveram-se 20 toneladas de R. A contabilidade apurou 495.000.000kz de custos de matérias e materiais diretos e gastos de conversão acumulados no ponto de separação e operações específicas de embalagem na fábrica de A e B no montante de 60.000.000kz e de 80.000.000kz, respetivamente. A empresa reparte os custos conjuntos em função do valor de venda relativo no ponto de separação e mensura o subproduto pelo critério do lucro nulo. O custo das vendas da demonstração de resultados por funções do período N foi de:", "opcoes": {"A": "kz 625.025.000", "B": "kz 649.050.000", "C": "kz 624.025.000", "D": "kz 634.075.000"}, "correcta": "B", "explicacao": "Custo conjunto a repartir = 495.000.000 - 15.000.000 (subproduto S, lucro nulo: 12 t x 1.250.000) + 30.000.000 (destruição de 20 t de R) = 510.000.000; repartido pelo valor de venda no ponto de separação (venda final menos custos específicos de embalagem: A 240.000.000 e B 400.000.000) dá 3.140.625 Kz/t para A e 3.987.500 Kz/t para B. Custo das vendas = 80 x 3.140.625 + 96 x 3.987.500 + 15.000.000 (subproduto vendido) = 649.050.000 Kz.", "fonte": "Sessão 4 CPE - Questões Produção conjunta e defeituosos (2 · resposta a confirmar"}, {"n": 530, "enunciado": "A Empresa de Moagem de Benguela, procede à moagem do trigo e obtém, para além de um subproduto sêmeas que vende às fábricas de rações para animais ao preço de 100Kz/tonelada, a farinha tipo I e a farinha tipo II. A farinha tipo I é vendida às padarias para fabrico de pão ao preço de 1.500Kz/tonelada e a farinha tipo II é embalada no Empacotamento em sacos de papel de 1 kg. os quais são vendidos aos supermercados ao preço de 2Kz/Kg. O transporte das farinhas e das sêmeas é de conta do vendedor tendo um contrato com a Transportadora X pelo montante de 50Kz/tonelada transportada. No período N foram produzidas 200 toneladas de farinha tipo I e 100 toneladas tipo II e obtidas 25 toneladas de sêmeas. Para o efeito foram gastos 361.250Kz de gastos na Moagem referentes a matérias e materiais diretos e gastos de conversão e 21.000Kz de gastos específicos do Empacotamento. Sabendo que a empresa reparte os gastos de produção pelos produtos principais em função do valor de venda relativo no ponto de separação e mensura o subproduto pelo critério do lucro nulo, o custo unitário de cada tonelada de farinha tipo I produzida no período N foi de:", "opcoes": {"A": "1.150Kz.", "B": "1.125Kz.", "C": "1.160Kz.", "D": "1.175Kz."}, "correcta": "B", "explicacao": "Subproduto pelo lucro nulo: 25 t x (100 - 50 de transporte) = 1.250, pelo que o custo conjunto a repartir = 361.250 - 1.250 = 360.000 Kz. Valor de venda no ponto de separação: farinha I = 200 x (1.500 - 50) = 290.000 e farinha II = 100 x (2.000 - 50) - 21.000 = 174.000; assim I fica com 360.000 x 290/464 = 225.000 Kz, ou 1.125 Kz/tonelada.", "fonte": "Sessão 4 CPE - Questões Produção conjunta e defeituosos (2"}, {"n": 531, "enunciado": "A Moagem do Lubango, transforma o trigo e obtém farinha tipo I e farinha tipo II que são embaladas em máquinas apropriadas e que vende às padarias ao preço de 0,8Kz/kg e 0,75Kz/kg, respetivamente. Obtém ainda o subproduto sêmeas que a empresa vende a uma fábrica de rações ao preço de 600Kz/toneladas, sendo o transporte deste de conta do vendedor. Em certo período entraram em armazém de produtos acabados 1.000 toneladas de farinha tipo I e 1.200 toneladas de farinha tipo II e que tiveram 170.000Kz e 130.000Kz de operações de embalagem, respetivamente. Foram obtidas 120 toneladas de sêmeas. A empresa suportou de gastos de trigo e gastos de conversão deste no montante de 620.000Kz e 430.000Kz de gastos de moagem. Pagou a uma empresa 22.000Kz do transporte das sêmeas. A empresa reparte os gastos conjuntos em função do valor de venda relativo no ponto de separação e mensura o subproduto pelo lucro nulo. O custo unitário de produção de cada tonelada de farinha tipo I foi:", "opcoes": {"A": "650Kz.", "B": "625Kz.", "C": "600Kz.", "D": "620Kz."}, "correcta": "D", "explicacao": "Lucro nulo: 120 t x 600 - 22.000 de transporte = 50.000, logo custo conjunto = (620.000 + 430.000) - 50.000 = 1.000.000 Kz. Valor no ponto de separação: I = 800.000 - 170.000 = 630.000 e II = 900.000 - 130.000 = 770.000; I recebe 1.000.000 x 630/1.400 = 450.000, mais 170.000 de embalagem = 620.000 para 1.000 t, ou seja 620 Kz/t.", "fonte": "Sessão 4 CPE - Questões Produção conjunta e defeituosos (2"}, {"n": 532, "enunciado": "A Sociedade de Moagem do Centro, SA, produz, em regime de produção conjunta, a partir da moagem do trigo, a Farinha A e a Farinha B, obtendo o subproduto S que a empresa vende para uma fábrica de rações mediante o pagamento de 150Kz/kg de transporte. Em certo período teve de custos conjuntos (trigo e gastos de conversão) 565.500.000 Kz para uma produção de 300 tons. de A, 600 tons. de B e de 20 tons. de S que vendeu no mercado a 1.000Kz, 750Kz e 300Kz o kg., respetivamente. Sabendo que a empresa reparte os custos conjuntos proporcionalmente ao valor de venda relativo e o subproduto S é mensurado pelo critério do lucro nulo, o custo unitário de produção de cada kg. de produto no período é de:", "opcoes": {"A": "Produto A 700 Kz e produto B 567,5 Kz .", "B": "Produto A 750 Kz e produto B 600 Kz .", "C": "Produto A 700 Kz e produto B,725 Kz .", "D": "Produto A 750 Kz e produto B 562,5 Kz ."}, "correcta": "D", "explicacao": "Subproduto pelo lucro nulo: 20.000 kg x (300 - 150) = 3.000.000, pelo que se repartem 565.500.000 - 3.000.000 = 562.500.000 Kz. Valor de venda: A = 300.000.000 (40%) e B = 450.000.000 (60%), donde A = 225.000.000/300.000 kg = 750 Kz/kg e B = 337.500.000/600.000 kg = 562,5 Kz/kg.", "fonte": "Sessão 4 CPE - Questões Produção conjunta e defeituosos (2"}, {"n": 533, "enunciado": "Os subprodutos obtidos numa produção conjunta podem ser mensurados pelo critério do lucro nulo e do custo nulo. No primeiro critério e no caso de haver gastos específicos de transporte para calcular o custo dos produtos principais:", "opcoes": {"A": "Não se deve entrar em linha de conta com o custo do transporte.", "B": "O custo do transporte só deve ser considerado na demonstração de resultados.", "C": "Deve-se deduzir o custo do transporte ao valor de venda no mercado do subproduto e só depois deduzir ao custo da produção conjunta.", "D": "Todas as anteriores são falsas."}, "correcta": "C", "explicacao": "No critério do lucro nulo o subproduto não gera lucro nem prejuízo, pelo que se apura o seu valor realizável líquido (valor de venda menos os gastos específicos, incluindo o transporte) e só esse líquido é deduzido aos custos conjuntos a repartir pelos produtos principais.", "fonte": "Sessão 4 CPE - Questões Produção conjunta e defeituosos (2"}, {"n": 534, "enunciado": "Uma empresa de confeções começou a comercializar, em 2018, os desperdícios de tecido resultantes da fase de corte. Sabendo que essa empresa adota o critério do lucro nulo, a comercialização dos desperdícios de tecido:", "opcoes": {"A": "Determina a redução do custo dos produtos fabricados.", "B": "Não influencia o custo dos produtos fabricados.", "C": "Determina o aumento das vendas, mas não do custo dos produtos vendidos.", "D": "Nenhuma das anteriores."}, "correcta": "A", "explicacao": "Pelo critério do lucro nulo, o valor de venda líquido dos desperdícios é deduzido aos custos de produção, reduzindo assim o custo dos produtos fabricados (e não sendo reconhecido como proveito autónomo).", "fonte": "Sessão 4 CPE - Questões Produção conjunta e defeituosos (2"}, {"n": 535, "enunciado": "Determinada siderurgia produz peças modelo XYZ para o mercado, de forma padronizada, sendo normal a obtenção de 1% de peças com defeitos de fabrico não recuperáveis e que são utilizados nas fabricações posteriores e mensurados ao preço da sucata adquirida no mercado a 4,0Kz/kg. Em certo período a fábrica lançou em produção 15.000 unidades de XYZ, tendo obtido 270 unidades com defeito que pesaram 378 kgs. Os custos com o consumo de matérias-primas e os custos de conversão foram respetivamente de 134.300Kz e 92.260Kz. O custo unitário de cada peça sem defeito que entrou em armazém no período foi:", "opcoes": {"A": "15,2Kz.", "B": "14,5Kz.", "C": "16,0Kz.", "D": "15,5Kz."}, "correcta": "A", "explicacao": "Defeitos normais = 1% x 15.000 = 150 un. e anormais = 270 - 150 = 120 un.; a sucata normal vale 150 x (378/270) x 4,0 = 840 Kz e reduz o custo a diluir. CIPA unitário = (134.300 + 92.260 - 840)/(15.000 - 150) = 225.720/14.850 = 15,2 Kz por peça boa.", "fonte": "Sessão 4 CPE - Questões Produção conjunta e defeituosos (2"}, {"n": 536, "enunciado": "Determinada empresa do ramo da siderurgia produz peças modelo Alfa 123 para o ramo automóvel, de forma padronizada, sendo normal a obtenção de 2% de defeitos de fabrico que são utilizados nas fabricações posteriores e mensurados ao preço da sucata adquirida no mercado a 1,50Kz/kg. Em certo período a fábrica lançou em produção 40.000 unidades de Alfa 123, tendo obtido 1.250 unidades com defeito que pesaram 1.000 kg. Os gastos totais de produção atingiram no período 285.700Kz. O custo unitário de cada peça boa (sem defeito) que entrou em armazém foi:", "opcoes": {"A": "7,25Kz.", "B": "7,45Kz.", "C": "7,15Kz.", "D": "7,65Kz."}, "correcta": "A", "explicacao": "Defeitos normais = 2% x 40.000 = 800 un. (anormais = 450); a sucata obtida vale 1.000 kg x 1,50 = 1.500 Kz e abate ao custo a diluir. CIPA unitário = (285.700 - 1.500)/(40.000 - 800) = 284.200/39.200 = 7,25 Kz por peça boa.", "fonte": "Sessão 4 CPE - Questões Produção conjunta e defeituosos (2"}, {"n": 537, "enunciado": "A empresa Beta fabrica produtos de série que vende para as indústrias do ramo automóvel. No período N foi lançada em produção a Ordem de fabrico 123/201N – 10.000 peças mod. XYZ – que teve de custos de produção 88.200 Kz. Sabendo que os defeitos considerados normais pela Fábrica atingem 2% da produção lançada em produção e que no período se obtiveram 300 peças com defeito que não foi possível recuperar:", "opcoes": {"A": "O custo da produção acabada entrada em armazém soma 88.500 Kz.", "B": "Os resultados acidentais são movimentados a débito por 900 Kz.", "C": "O custo da produção acabada e entrada em armazém soma 87.200 Kz.", "D": "Todas as anteriores são falsas."}, "correcta": "B", "explicacao": "Defeitos normais = 2% x 10.000 = 200 un., logo CIPA unitário = 88.200/(10.000 - 200) = 9,00 Kz; as 100 unidades defeituosas anormais valem 100 x 9 = 900 Kz, debitados em resultados acidentais, ficando a produção boa (9.700 un.) por 87.300 Kz — valor que não consta das alíneas A e C.", "fonte": "Sessão 4 CPE - Questões Produção conjunta e defeituosos (2"}, {"n": 538, "enunciado": "A Empresa Industrial KAPA produz peças para venda à indústria automóvel. Para o efeito tem a produção organizada por séries de fabrico em que agrega os gastos industriais para efeitos de custeio. Em determinado período lançou em fabrico a série nº 2010/123 – 10.000 peças modelo XYZ, tendo acarretado de gastos em matérias e materiais diretos 47.800Kz e 25.700Kz de gastos de conversão. É normal a obtenção de 2% de peças defeituosas. O Controlo de Qualidade detetou 250 peças com defeito que não é possível reparar. No período a conta de Fabricação – Série 2010/123 – Peça modelo XYZ é creditada por:", "opcoes": {"A": "Custo da produção acabada: 72.125,0Kz; Resultados acidentais: 375,0Kz.", "B": "Custo da produção acabada: 73.150,0Kz; Resultados acidentais: 350,0Kz.", "C": "Custo da produção acabada: 72.125,0Kz; Resultados acidentais: 365,0Kz.", "D": "Custo da produção acabada: 73.125,0Kz; Resultados acidentais: 375,0Kz."}, "correcta": "D", "explicacao": "Custos totais = 47.800 + 25.700 = 73.500 Kz e defeitos normais = 2% x 10.000 = 200 un., pelo que o CIPA unitário = 73.
